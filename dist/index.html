s://www.studierendenwerke.de/themen/finanzierungsmoeglichkeiten/tipps-fuer-beruflich-qualifizierte","site":"studierendenwerke.de"}]},"bafoeg-baf-03-01":{"id":"bafoeg-baf-03-01","area":"bafoeg","topic":"end","pub":"Studentenwerk Magdeburg","src":"BAföG office FAQ","claim":"says funding ends in the month of your last exam.","quote":"Dein Förderanspruch endet in dem Monat der letzten Prüfungsleistung, spätestens mit der Bekanntgabe des Bestehens.","lang":"German","tr":"Your entitlement ends in the month of your last exam, at the latest when you are told you passed.","law":"","sourceUrl":"https://www.studentenwerk-magdeburg.de/bafoeg/bafoeg-antrag/abc/","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15b.html","example":"A student takes the final examination in July and first learns of successful completion in August. With remaining funding duration and all other conditions, funding can continue through August.","context":"Current BAföG application FAQ reached from the BAföG application pages. Not applicable: HTML.","scope":"The notification/two-month rule was introduced by the 25th BAföG amendment, Article 1 No. 10, effective 1 August 2016 under Article 6(5). The current wording, which no longer requires written notification, took effect on 22 July 2022 under the 27th amendment. No currently operative transition was identified that preserves a general last-examination-month cutoff for new university completions. This rule defines the end of university training; it does not extend the maximum funding duration, replace an application, or override means-testing and other conditions. An oral examination may itself notify successful completion, so an additional two months is not guaranteed. If the last examination and first notification fall in the same month, both descriptions can produce the same result. The contradiction matters where notification is later and funding is otherwise still available.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Dein Förderanspruch endet in dem Monat der letzten Prüfungsleistung, spätestens mit der Bekanntgabe des Bestehens.","tr":"Your entitlement ends in the month of your last exam, at the latest when you are told you passed.","url":"https://www.studentenwerk-magdeburg.de/bafoeg/bafoeg-antrag/abc/","site":"studentenwerk-magdeburg.de"}]},"bafoeg-baf-03-02":{"id":"bafoeg-baf-03-02","area":"bafoeg","topic":"end","pub":"Universität Münster","src":"Mathematics and Computer Science","claim":"says the date of your last exam ends your Bachelor’s.","quote":"Dieses Datum zählt als Ende des Bachelorstudiums","lang":"German","tr":"This date counts as the end of your Bachelor’s","law":"","sourceUrl":"https://www.uni-muenster.de/FB10/Studium/studienhinweise/bafoeg.shtml","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15b.html","example":"A student takes the final examination in July and first learns of successful completion in August. With remaining funding duration and all other conditions, funding can continue through August.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML. Current faculty page linking this advice: https://www.uni-muenster.de/FB10/Studium/Fachstudienberatung/bafoegbeauftragte.shtml","scope":"The notification/two-month rule was introduced by the 25th BAföG amendment, Article 1 No. 10, effective 1 August 2016 under Article 6(5). The current wording, which no longer requires written notification, took effect on 22 July 2022 under the 27th amendment. No currently operative transition was identified that preserves a general last-examination-month cutoff for new university completions. This rule defines the end of university training; it does not extend the maximum funding duration, replace an application, or override means-testing and other conditions. An oral examination may itself notify successful completion, so an additional two months is not guaranteed. If the last examination and first notification fall in the same month, both descriptions can produce the same result. The contradiction matters where notification is later and funding is otherwise still available.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Dieses Datum zählt als Ende des Bachelorstudiums","tr":"This date counts as the end of your Bachelor’s","url":"https://www.uni-muenster.de/FB10/Studium/studienhinweise/bafoeg.shtml","site":"uni-muenster.de"}]},"bafoeg-baf-13-01":{"id":"bafoeg-baf-13-01","area":"bafoeg","topic":"family","pub":"Studierendenwerk Kassel","src":"children and BAföG","claim":"says childcare extends funding only for children up to ten.","quote":"der Pflege und Erziehung eines Kindes bis zu zehn Jahren","lang":"German","tr":"care and upbringing of a child up to ten years old","law":"Care of a child within the statutory age band up to 14 can justify an appropriate extension if it caused the study delay; parenthood alone does not suffice.","sourceUrl":"https://www.studierendenwerk-kassel.de/studieren-mit-kind/finanzieren/kinder-und-bafoeg","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15.html","example":"A student’s care for a 12-year-old delays their degree. They can still ask for longer funding.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML.","scope":"The 26th BAföG amendment of 8 July 2019 (BGBl. I p. 1048), Article 1 No. 9(b)(cc), replaced ten with fourteen (printed p. 1050; full-issue PDF sheet 50). General commencement was 16 July 2019 under Article 6(1) (printed p. 1055; sheet 55), but former § 66a(2), inserted by Article 1 No. 28, applied the amended § 15 from 1 August 2019 (printed p. 1053; sheet 53). Former § 66a(4) did not preserve the earlier § 15 for old approval periods; its subsection (5) concerned only the specified academy cases under § 15(2) sentence 1. Thus the new child-age band applied from 1 August 2019, including ongoing approval periods. This does not imply automatic reopening of final awards or payment for earlier months. No current transition restores ten for the 2026 case. Source check: the official archive HTML was accessible, but its PDF request failed. The promulgated issue was independently read and visually checked through the explicitly labelled nonofficial OffeneGesetze mirror. Official Bundestag documents 19/10249 (pp. 7–8) and 19/8749 (pp. 16, 20), read together with the official adoption record, corroborate the adopted amendment and application provisions. No official-host Gazette PDF review is claimed. Parenthood alone does not produce an automatic extension. Care or upbringing within the statutory band must have caused the relevant study delay, and the extension must be for an appropriate period. Other funding routes and conditions still need separate assessment. The comparison concerns the age band in duration extensions. It does not separately verify every statement on child supplements or delayed performance evidence on the same page.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"der Pflege und Erziehung eines Kindes bis zu zehn Jahren","tr":"care and upbringing of a child up to ten years old","url":"https://www.studierendenwerk-kassel.de/studieren-mit-kind/finanzieren/kinder-und-bafoeg","site":"studierendenwerk-kassel.de"}]},"bafoeg-baf-14-01":{"id":"bafoeg-baf-14-01","area":"bafoeg","topic":"family","pub":"Technische Hochschule Mannheim","src":"family finance","claim":"gives the old childcare supplement of €130 for children under ten.","quote":"unter 10-jährigen Kinder","lang":"German","tr":"children under 10","law":"For each own child under 14 in the household, one eligible parent can receive a €160 addition to assessed monthly need. The final award remains means-tested.","sourceUrl":"https://www.hs-mannheim.de/die-hochschule/technische-hochschule-mannheim/familienfreundliche-hochschule/studieren-mit-kind/finanzielles.html","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__14b.html","example":"An otherwise eligible student shares a household with their own 12-year-old and is the eligible parent claiming for that period. The child can support a €160 addition to need; payment depends on the means test.","context":"The current Studieren mit Kind parent explicitly links Finanzielles as information about BAföG and other family finances. The page combines 2023 upper updates with older lower passages. The August 2016 date labels later local contacts, not the BAföG section as a historical-only statement. No paragraph-specific update date or archive label was found. Not applicable: HTML. Current family page linking Finanzielles: https://www.hs-mannheim.de/die-hochschule/technische-hochschule-mannheim/familienfreundliche-hochschule/studieren-mit-kind.html","scope":"The 26th Act of 8 July 2019, Article 1 No. 8(a)(aa),(bb), printed p. 1049, raised the age band to under 14 and rate 130→140. General commencement 16 July 2019 (Article 6(1)); then-§ 66a(2),(4), printed p. 1053, applied the new rules from 1 August 2019 for new periods and 1 October 2019 for approval periods begun earlier. The intermediate 140→150 step was Article 2 No. 3 of the same Act, printed p. 1053. Article 6(2) and then-§ 66a(9), printed p. 1054, applied it from 1 August 2020 for new periods and 1 October 2020 for older periods. The 27th Act of 15 July 2022, Article 1 No. 7, printed p. 1151, changed 150→160. General commencement 22 July 2022; then-§ 66a(2),(3), Article 1 No. 21(a),(b), printed p. 1152, applied 160 from 1 August 2022 for new periods and 1 October 2022 for older periods. No current transition preserves the quoted 130 or under 10 condition for 2026. Independently checked current law, official adopted parliamentary texts and the relevant promulgated Gazette pages through explicitly labelled nonofficial OffeneGesetze mirrors. Official-host Gazette PDF download is not claimed. The 2019 supplement carryover includes § 14b and differs from § 15 duration extensions. The child must be the applicant’s own, be below 14 and share the household. Only one parent receives the supplement for the same period; eligible parents in a shared household choose the recipient. Other entitlement and financial conditions remain. The supplement is a grant under § 17(2) sentence 2 No. 3, but the addition is to assessed need. Do not promise a separate 160-euro cash payment independently of means-testing. Do not merge its dates or household requirements into the separate childcare duration-extension rule.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"unter 10-jährigen Kinder","tr":"children under 10","url":"https://www.hs-mannheim.de/die-hochschule/technische-hochschule-mannheim/familienfreundliche-hochschule/studieren-mit-kind/finanzielles.html","site":"hs-mannheim.de"}]},"bafoeg-baf-04-01":{"id":"bafoeg-baf-04-01","area":"bafoeg","topic":"family","pub":"Deutsches Studierendenwerk","src":"national association FAQ","claim":"says parent-independent funding also ignores your spouse’s income.","quote":"Unabhängig vom Einkommen der Eltern oder des Ehegatten/Lebenspartners","lang":"German","tr":"Independent of the income of parents or spouse/partner","law":"Parental-income independence does not itself remove income of a spouse or registered partner who is not permanently separated. Allowances and the ordinary means test still apply.","sourceUrl":"https://www.studierendenwerke.de/fileadmin/user_upload/FAQ_BAfoeG_01-2026.pdf#page=2","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__11.html","example":"An otherwise eligible student starts a new phase at 32 and qualifies for parental independence, but lives with a spouse whose income exceeds the allowances. Countable spouse income can reduce the award.","context":"Current DSW download; matching institutional HTML is also live. Verified 17 October 2026: DSW BAföG overview → Downloads → FAQ_BAfoeG_01-2026.pdf. Current DSW linking page · Downloads: https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg | Related DSW requirements HTML: https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","scope":"This comparison uses § 11(2)–(3) in the consolidated law accessed 17 October 2026. It is not based on a newly announced reform. No relevant grandfather provision in current § 66a or the examined 2022/2024 application rules converts parental independence into an exemption for spouse income. The original historical commencement of this longstanding distinction was not reconstructed in this bounded audit. Section 11(2) sentence 2 normally treats only a spouse or registered civil partner who is not permanently separated as a partner for this purpose. Statutory income allowances, additional allowances and hardship rules can leave some or all income uncounted. That follows from the applicable means-test rules, not from parental independence itself. The age route starts at 30 at the beginning of the relevant training phase (§ 11(3) No. 2). The employment routes have their own duration and self-support conditions. Eligibility in principle can remain while the means-tested payment is reduced to zero.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Unabhängig vom Einkommen der Eltern oder des Ehegatten/Lebenspartners","tr":"Independent of the income of parents or spouse/partner","url":"https://www.studierendenwerke.de/fileadmin/user_upload/FAQ_BAfoeG_01-2026.pdf#page=2","site":"studierendenwerke.de · PDF"}]},"bafoeg-baf-04-02":{"id":"bafoeg-baf-04-02","area":"bafoeg","topic":"family","pub":"Deutsches Studierendenwerk","src":"matching HTML wording","claim":"repeats on its website that your spouse’s income is ignored.","quote":"Unabhängig vom Einkommen der Eltern oder der Ehegatten/Lebenspartner","lang":"German","tr":"Independent of the income of parents or spouses/partners","law":"Parental-income independence does not itself remove income of a spouse or registered partner who is not permanently separated. Allowances and the ordinary means test still apply.","sourceUrl":"https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__11.html","example":"An otherwise eligible student starts a new phase at 32 and qualifies for parental independence, but lives with a spouse whose income exceeds the allowances. Countable spouse income can reduce the award.","context":"Current page linked from the DSW BAföG overview. HTML appearance. The separately reviewed January 2026 PDF is currently linked from the overview.","scope":"This comparison uses § 11(2)–(3) in the consolidated law accessed 17 October 2026. It is not based on a newly announced reform. No relevant grandfather provision in current § 66a or the examined 2022/2024 application rules converts parental independence into an exemption for spouse income. The original historical commencement of this longstanding distinction was not reconstructed in this bounded audit. Section 11(2) sentence 2 normally treats only a spouse or registered civil partner who is not permanently separated as a partner for this purpose. Statutory income allowances, additional allowances and hardship rules can leave some or all income uncounted. That follows from the applicable means-test rules, not from parental independence itself. The age route starts at 30 at the beginning of the relevant training phase (§ 11(3) No. 2). The employment routes have their own duration and self-support conditions. Eligibility in principle can remain while the means-tested payment is reduced to zero.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Unabhängig vom Einkommen der Eltern oder der Ehegatten/Lebenspartner","tr":"Independent of the income of parents or spouses/partners","url":"https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","site":"studierendenwerke.de"}]},"bafoeg-mv-baf-02":{"id":"bafoeg-mv-baf-02","area":"bafoeg","topic":"rates","pub":"Studierendenwerk Rostock-Wismar","src":"public-law BAföG administrator","claim":"says the maximum is €934 a month.","quote":"bis zu 934,00 Euro monatlich","lang":"German","tr":"up to €934.00 per month","law":"","sourceUrl":"https://www.stw-rw.de/de/studienfinanzierung/faq.html","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__13.html","example":"An otherwise eligible 25-year-old, living away from parents with qualifying student health/care insurance and no countable income or assets, has assessed need of €992. Other categories differ.","context":"Fresh original HTTP 200 on 18 October 2026. Current parent navigation links exact page; source has no historical-only label. Current adjacent rates table is retained as contrary context. Not applicable: guidance source is HTML. Current inbound page link independently verified. See current linking and context field. https://www.stw-rw.de/de/studienfinanzierung.html links the exact current guidance page. The FAQ navigation also links the correct rates table: https://www.stw-rw.de/de/studienfinanzierung/bafoeg/bedarf-fuer-studierende-laut-bafoeg-ab-wintersemester-202425.html. Original source and parent links independently captured on 18 October 2026.","scope":"The relevant need and insurance amounts apply from August 2024, with pre-August award periods also covered from October 2024 under §66a(2)-(3). The new 2026 illustration falls entirely after that transition. €992 is the need for the specified student-insurance case, not a universal maximum or guaranteed award. Different insurance categories and supplements can alter need. Applicant resources and countable parental/spousal income can reduce the award. The source’s current linked table gives correct amounts, so this is conflicting current guidance.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bis zu 934,00 Euro monatlich","tr":"up to €934.00 per month","url":"https://www.stw-rw.de/de/studienfinanzierung/faq.html","site":"stw-rw.de/de"}]},"bafoeg-st-baf-01":{"id":"bafoeg-st-baf-01","area":"bafoeg","topic":"rates","pub":"Studentenwerk Halle","src":"public-law BAföG administrator","claim":"gives up to €189 a month for higher insurance costs.","quote":"Kranken- und Pflegeversicherungskosten bis zu 189,00 Euro je Monat","lang":"German","tr":"health and care insurance costs of up to €189.00 per month","law":"The specified higher statutory health/care insurance category under §13a(2) adds €185 plus €48 to assessed need. Age or paying a higher premium alone does not establish this category.","sourceUrl":"https://studentenwerk-halle.de/bafoeg-studienfinanzierung/bafoeg/faqs","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__13a.html","example":"An otherwise eligible 25-year-old, living away from parents with qualifying student health/care insurance and no countable income or assets, has assessed need of €992. Other categories differ.","context":"Fresh original HTTP 200 on 18 October 2026; exact current parent navigation links this FAQ. No historical-only label. Content-specific update date not established. Not applicable to HTML source. For the official 2026 allowance notice, original PDF visually checked by researcher and independent reviewer. https://studentenwerk-halle.de/bafoeg-studienfinanzierung/bafoeg/allgemeine-infos-zum-bafoeg links the exact FAQ; fresh independent incoming links preserved.","scope":"BAföG §13a(2) provides €185 health plus €48 care insurance for the specified compulsory-contribution categories, excluding §13a(1) sentence 3. The combined supplement is €233. Section 66a(2)–(3) applies the current amounts from August 2024 and to all continuing award periods by October 2024. A qualifying voluntarily insured GKV student and mandatory care-insurance member within §13a(2), outside §13a(1) sentence 3. Age over 30 alone is not sufficient; private insurance and other categories require their own analysis. Means testing still applies. The table correctly gives the ordinary student-insurance supplement of €137 and ordinary away-from-parent total of €992. Those different-category figures do not correct the €189 footnote. The same FAQ uses the 2026 €603 employee threshold, and the current BAföG overview links this exact FAQ. The footnote first discusses actual premiums for privately insured students; this does not cure the ceiling for the specified §13a(2) statutory-insurance case.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Kranken- und Pflegeversicherungskosten bis zu 189,00 Euro je Monat","tr":"health and care insurance costs of up to €189.00 per month","url":"https://studentenwerk-halle.de/bafoeg-studienfinanzierung/bafoeg/faqs","site":"studentenwerk-halle.de"}]},"bafoeg-ni-baf-03":{"id":"bafoeg-ni-baf-03","area":"bafoeg","topic":"abroad","pub":"Studentenwerk Hannover","src":"public-law BAföG administrator","claim":"says you must apply at least six months before going abroad.","quote":"mindestens sechs Monate vor Beginn des Auslandsaufenthalts gestellt werden müssen","lang":"German","tr":"must be submitted at least six months before the start of the stay abroad","law":"","sourceUrl":"https://www.studentenwerk-hannover.de/geld/alles-zum-bafoeg/bafoeg-faq","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15.html","example":"An otherwise eligible student files with the competent office in July for qualifying foreign study starting in October 2026. The three-month lead does not itself prevent October funding; payment need not be immediate.","context":"Fresh original HTTP 200 on 18 October 2026; exact current parent navigation links this FAQ. No historical-only label. Content-specific update date not established. Not applicable to HTML source. For the official 2026 allowance notice, original PDF visually checked by researcher and independent reviewer. https://www.studentenwerk-hannover.de/geld/alles-zum-bafoeg links the exact FAQ; fresh independent incoming links preserved.","scope":"BAföG §15(1) begins funding in the education-start month, no earlier than the application month. Section 46(1)–(2) governs applying to the competent office; §46(5) permits an advance decision for foreign study. Neither provision imposes six months of advance filing. The foreign-study and personal eligibility conditions, including §5, still apply. Otherwise eligible foreign study with an application to the competent office before study starts. Earlier filing may be needed for timely processing or other programmes, but that practical recommendation is distinct from a legal BAföG eligibility cutoff. No guarantee of immediate payment. The sentence ends with sensible advice to act promptly, but its premise expressly says the six-month lead is mandatory. The same page’s general filing answer says there is no fixed deadline and explains application-month effects. The narrow finding concerns this internal conflict; it does not establish that any office rejects later applications.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"mindestens sechs Monate vor Beginn des Auslandsaufenthalts gestellt werden müssen","tr":"must be submitted at least six months before the start of the stay abroad","url":"https://www.studentenwerk-hannover.de/geld/alles-zum-bafoeg/bafoeg-faq","site":"studentenwerk-hannover.de"}]},"jobcenter-tk1":{"id":"jobcenter-tk1","area":"jobcenter","topic":"earnings","pub":"Jobcenter Berlin Treptow-Köpenick","src":"Freibeträge","claim":"gives the old 20% band alongside correct 30% guidance and a correct worked calculation.","quote":"Von Bruttoeinkommen, die zwischen 100 Euro und 1.000 Euro liegen, beläuft sich der Freibetrag auf 20 Prozent.","lang":"German","tr":"The allowance is 20% for gross earnings between €100 and €1,000.","law":"","sourceUrl":"https://www.berlin.de/jobcenter-treptow-koepenick/wegweiser/artikel.1532659.php","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11b.html","example":"An ordinary employee aged 35 earns €900 gross a month, with the standard €100 base deduction and no special or higher deductions. The allowance is €298; the old formula gives €260. This compares deductions, not the final benefit award.","context":"The very same page correctly lists 20% above €100 to €520, 30% above €520 to €1,000, 10% above €1,000 and a correct €338 example for €1,100 earnings. Thus this is also an internal contradiction, not a claim that all numerical guidance on the page is wrong.","scope":"Current statutory text rechecked through the official law site's indexed full text on 17 October 2026. Special §11b(2b) education/volunteer rules excluded from hypothetical example.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Von Bruttoeinkommen, die zwischen 100 Euro und 1.000 Euro liegen, beläuft sich der Freibetrag auf 20 Prozent.","tr":"The allowance is 20% for gross earnings between €100 and €1,000.","url":"https://www.berlin.de/jobcenter-treptow-koepenick/wegweiser/artikel.1532659.php","site":"berlin.de"}]},"jobcenter-rastatt-earnings":{"id":"jobcenter-rastatt-earnings","area":"jobcenter","topic":"earnings","pub":"Jobcenter Rastatt","src":"Wieviel darf ich dazu verdienen?","claim":"says 20% stays free on all earnings from €100 to €1,000.","quote":"Der Verdienst zwischen 100 und 1.000 Euro bleibt um 20 % anrechnungsfrei","lang":"German","tr":"Earnings between €100 and €1,000 are 20% exempt from being counted.","law":"","sourceUrl":"https://www.jobcenter-landkreis-rastatt.de/fragen/wieviel-darf-ich-dazu-verdienen","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11b.html","example":"An ordinary employee aged 35 earns €900 gross a month, with the standard €100 base deduction and no special or higher deductions. The allowance is €298; the old formula gives €260. This compares deductions, not the final benefit award.","context":"The answer begins with the principle that larger earnings generate a larger allowance, gives the €100 base deduction, the obsolete 20% band and the 10% upper band, then an example at €450 and an obligation to report income. Nothing in the complete answer limits it to pre-July-2023 law or provides the current 30% band. The €450 example's €170 allowance is correct for that income and does not test the affected €520–€1,000 slice. The current homepage has a June 2026 reform item, so the overall website is maintained. The FAQ collection still contains older ALG-II terminology, but the answer is currently offered through the main FAQ navigation rather than labelled archived.","scope":"For the ordinary employed claimant, 30% of monthly gross earnings above €520 and through €1,000 is deducted in addition to the applicable base deduction. The €100–€520 slice remains 20%. 2023-07-01; retained in current October 2026 version","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Der Verdienst zwischen 100 und 1.000 Euro bleibt um 20 % anrechnungsfrei","tr":"Earnings between €100 and €1,000 are 20% exempt from being counted.","url":"https://www.jobcenter-landkreis-rastatt.de/fragen/wieviel-darf-ich-dazu-verdienen","site":"jobcenter-landkreis-rastatt.de"}]},"jobcenter-st-jc-01":{"id":"jobcenter-st-jc-01","area":"jobcenter","topic":"earnings","pub":"Jobcenter Anhalt-Bitterfeld","src":"","claim":"says 20% stays free on all earnings from €100 to €1,000.","quote":"bis 1.000 Euro monatlich ist zu 20 Prozent anrechnungsfrei","lang":"German","tr":"up to €1,000 a month is 20 percent exempt","law":"","sourceUrl":"https://jobcenter.anhalt-bitterfeld.de/de/faq-alg-ii.html","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11b.html","example":"An ordinary employee aged 35 earns €900 gross a month, with the standard €100 base deduction and no special or higher deductions. The allowance is €298; the old formula gives €260. This compares deductions, not the final benefit award.","context":"The page explicitly credits the BMAS FAQ dated January 2018. The live Bürgergeld menu nevertheless links the exact FAQ as Was muss ich wissen? outside an archive section. The body retains ALG II language and old examples. The finding concerns current supply of that dated text; no actual administrative practice is inferred.","scope":"The ordinary employed adult aged 25 or older and the €520–€1,000 earnings slice only. The source is January 2018 BMAS-derived FAQ text currently supplied through the live Bürgergeld menu. Special under-25 education and voluntary-service cases and actual administrative practice are outside the finding.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bis 1.000 Euro monatlich ist zu 20 Prozent anrechnungsfrei","tr":"up to €1,000 a month is 20 percent exempt","url":"https://jobcenter.anhalt-bitterfeld.de/de/faq-alg-ii.html","site":"jobcenter.anhalt-bitterfeld.de/de"}]},"jobcenter-ni-jc-01":{"id":"jobcenter-ni-jc-01","area":"jobcenter","topic":"earnings","pub":"Jobcenter Osnabrück","src":"","claim":"states a €520 base deduction for qualifying under-25 pupils and trainees, rather than the 2026 linked €603 amount.","quote":"Grundfreibetrag von 520 €","lang":"German","tr":"basic allowance of €520","law":"For the eligible under-25 groups in §11b(2b), the base deduction is linked to the minijob threshold: €603 in 2026. Further deductions and the school-holiday exclusion are separate.","sourceUrl":"https://www.jobcenter-osnabrueck.de/privatpersonen/leistungen-zum-lebensunterhalt/einkommen-und-vermoegen.html","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11b.html","example":"An otherwise eligible 19-year-old general-school pupil earns €603 monthly outside school holidays. The base deduction is €603, compared with the page's €520; this €83 base difference is not a calculation of the final award.","context":"Current page refers to Grundsicherungsgeld and sits under Geld - NEU. It gives a 2023 earnings change, a €520 under-25 school/training base disregard, first-year assets €40,000 plus €15,000 per additional person, and a general €15,000 asset allowance. Nearby navigation also offers Neue Grundsicherung. No explicit sunset for the stated figures. Generic statement says the Jobcenter decides under law; that is preserved as context. The directly linked Neue Grundsicherung companion explicitly supplies the new asset amounts and removal of the asset Karenzzeit; it does not discuss the under-25 earnings base. Both pages remain supplied.","scope":"An otherwise eligible under-25 general-school pupil working outside school holidays in 2026. No assertion that all students or trainees qualify for ordinary benefits, or that all young workers receive this allowance.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Grundfreibetrag von 520 €","tr":"basic allowance of €520","url":"https://www.jobcenter-osnabrueck.de/privatpersonen/leistungen-zum-lebensunterhalt/einkommen-und-vermoegen.html","site":"jobcenter-osnabrueck.de"}]},"jobcenter-be-c1":{"id":"jobcenter-be-c1","area":"jobcenter","topic":"start","pub":"Jobcenter Berlin Spandau","src":"Informationen zu Geldleistungen","claim":"says benefits start on the day you apply.","quote":"Der Anspruch auf Leistung beginnt mit dem Tag der Antragstellung.","lang":"German","tr":"Entitlement begins on the day the application is made.","law":"","sourceUrl":"https://www.berlin.de/jobcenter-spandau/geldleistungen/artikel.1257147.php","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__37.html","example":"Someone eligible throughout October applies for ordinary living-cost support on 20 October without requesting a later start. The application normally takes effect from 1 October.","context":"The paragraph says the benefit must be applied for, applications may be written or oral, and necessary documents may be submitted later. No first-of-month correction appears in the remaining benefits explanation.","scope":"Current statutory text rechecked 17 October 2026. The general first-of-month rule has applied since 1 January 2011; official Jobcenter Wuppertal legal work aid corroborates the historic start date.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Der Anspruch auf Leistung beginnt mit dem Tag der Antragstellung.","tr":"Entitlement begins on the day the application is made.","url":"https://www.berlin.de/jobcenter-spandau/geldleistungen/artikel.1257147.php","site":"berlin.de"}]},"jobcenter-m-c1":{"id":"jobcenter-m-c1","area":"jobcenter","topic":"savings","pub":"Jobcenter Munich","src":"Information vor Antragstellung","claim":"says you can keep €40,000 in your first year.","quote":"Im ersten Jahr des Grundsicherungsbezug dürfen Sie 40.000 € behalten und Personen in Ihrem Haushalt können 15.000 € behalten.","lang":"German","tr":"You may keep €40,000 in the first year, and others in your household may keep €15,000.","law":"","sourceUrl":"https://jobcenter-muenchen.de/information-vor-antragstellung/","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__12.html","example":"A single 35-year-old starts a new approval period in October 2026 with €20,000 of ordinary accessible bank savings and no separate asset protection. The ordinary allowance is €10,000, rather than the old first-year €40,000 threshold.","context":"Savings need not always be exhausted: protected categories and households still matter. Older approval periods are specifically exempted by transition.","scope":"Current §12 applies to approval periods beginning 1 July 2026 or later. Old first-year treatment can still apply to earlier-starting periods under §65a(1).","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Im ersten Jahr des Grundsicherungsbezug dürfen Sie 40.000 € behalten und Personen in Ihrem Haushalt können 15.000 € behalten.","tr":"You may keep €40,000 in the first year, and others in your household may keep €15,000.","url":"https://jobcenter-muenchen.de/information-vor-antragstellung/","site":"jobcenter-muenchen.de"}]},"jobcenter-mainz-savings":{"id":"jobcenter-mainz-savings","area":"jobcenter","topic":"savings","pub":"Jobcenter Mainz","src":"Einkommen und Vermögen","claim":"says savings only count above €40,000.","quote":"Vermögen ist erheblich, wenn es für die erste in der Bedarfsgemeinschaft (BG) lebende Person 40.000 € […] übersteigt.","lang":"German","tr":"Assets are substantial when they exceed €40,000 for the first person in the benefit household.","law":"","sourceUrl":"https://www.jobcenter-mainz.de/geld-und-leistung/anspruchsvoraussetzungen-und-antragstellungen/einkommen-und-vermoegen/","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__12.html","example":"A single 35-year-old starts a new approval period in October 2026 with €20,000 of ordinary accessible bank savings and no separate asset protection. The ordinary allowance is €10,000, rather than the old first-year €40,000 threshold.","context":"Full page checked. The assets section introduces the January 2023 grace period for the first 12 months, defines substantial assets using €40,000/€15,000, requests the VM asset declaration and mentions owner-occupied housing. No new age-based regime, §65a transition or old-cohort restriction appears in the passage or elsewhere on the page. The homepage announces that rules change from 1 July 2026 and links the BMAS reform FAQ, which correctly describes age-based allowances. That general link is useful but does not qualify or correct the detailed local assets page itself. The old rule remains applicable to certain earlier-starting approval periods under §65a(1); those cases are not treated as errors.","scope":"For a 35-year-old living alone with an approval period beginning on or after 1 July 2026, the ordinary age-based assets allowance is €10,000, without the old one-year cash-assets grace period. Other protected asset categories under §12(1) remain separate. Unused allowances can transfer within a benefit household. 2026-07-01 for the new regime; §65a(1) preserves old §12 for approval periods that began before 1 July 2026 until the period ends.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Vermögen ist erheblich, wenn es für die erste in der Bedarfsgemeinschaft (BG) lebende Person 40.000 € […] übersteigt.","tr":"Assets are substantial when they exceed €40,000 for the first person in the benefit household.","url":"https://www.jobcenter-mainz.de/geld-und-leistung/anspruchsvoraussetzungen-und-antragstellungen/einkommen-und-vermoegen/","site":"jobcenter-mainz.de"}]},"jobcenter-ni-jc-02":{"id":"jobcenter-ni-jc-02","area":"jobcenter","topic":"savings","pub":"Jobcenter Osnabrück","src":"","claim":"retains the old €15,000 flat allowance while its linked reform page gives the current age-based amounts.","quote":"Grundfreibetrag in Höhe von 15.000 €","lang":"German","tr":"basic allowance of €15,000","law":"","sourceUrl":"https://www.jobcenter-osnabrueck.de/privatpersonen/leistungen-zum-lebensunterhalt/einkommen-und-vermoegen.html","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__12.html","example":"A single 35-year-old starts a new approval period in October 2026 with €20,000 of ordinary accessible bank savings and no separate asset protection. The ordinary allowance is €10,000, rather than the old first-year €40,000 threshold.","context":"Current page refers to Grundsicherungsgeld and sits under Geld - NEU. It gives a 2023 earnings change, a €520 under-25 school/training base disregard, first-year assets €40,000 plus €15,000 per additional person, and a general €15,000 asset allowance. Nearby navigation also offers Neue Grundsicherung. No explicit sunset for the stated figures. Generic statement says the Jobcenter decides under law; that is preserved as context. The directly linked Neue Grundsicherung companion explicitly supplies the new asset amounts and removal of the asset Karenzzeit; it does not discuss the under-25 earnings base. Both pages remain supplied.","scope":"Only approval periods beginning on or after 1 July 2026, with the example isolated to ordinary accessible cash. Approval periods beginning before July retain old-law protection. Exempt assets, hardship and transfer of unused household allowances remain relevant. No actual case decision is alleged.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Grundfreibetrag in Höhe von 15.000 €","tr":"basic allowance of €15,000","url":"https://www.jobcenter-osnabrueck.de/privatpersonen/leistungen-zum-lebensunterhalt/einkommen-und-vermoegen.html","site":"jobcenter-osnabrueck.de"}]},"jobcenter-m-c2":{"id":"jobcenter-m-c2","area":"jobcenter","topic":"furniture","pub":"Jobcenter Munich","src":"Leistungen für Schwangere nach dem Sozialgesetzbuch II (SGB II)","claim":"says help is only available for your first own home.","quote":"Eine Hilfe hierfür können Sie nur bekommen, wenn Sie das erste Mal in eine eigene Wohnung ziehen.","lang":"German","tr":"This help is available only when you move into your first-ever own home.","law":"","sourceUrl":"https://jobcenter-muenchen.de/wp-content/uploads/2025/06/JCM_Merkblatt_fuer_Schwangere_06_2025.pdf","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__24.html","example":"A pregnant claimant leaves a furnished shared home after separation without essential household items. A qualifying initial need can be assessed despite her previous home, subject to means and any required move approval.","context":"Full p4 continues with the need to list items and explain urgent need and says Jobcenter examines payment; these do not undo the preceding categorical only-first-home condition. Pages2–3 correctly permit baby/pregnancy one-off help without ordinary monthly benefits. Under25 cases may require housing approval under §24(6)/§22(5); findings do not disregard this.","scope":"Applies under current §24; same substantive initial-equipment rule also applied in June2025. No birth-date or first-home transitional exception identified.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Eine Hilfe hierfür können Sie nur bekommen, wenn Sie das erste Mal in eine eigene Wohnung ziehen.","tr":"This help is available only when you move into your first-ever own home.","url":"https://jobcenter-muenchen.de/wp-content/uploads/2025/06/JCM_Merkblatt_fuer_Schwangere_06_2025.pdf","site":"jobcenter-muenchen.de · PDF"}]},"jobcenter-ni-c1":{"id":"jobcenter-ni-c1","area":"jobcenter","topic":"furniture","pub":"Jobcenter Nienburg","src":"Leistungen für Schwangere","claim":"says help is only available for your first own home.","quote":"Eine Hilfe hierfür können Sie nur bekommen, wenn Sie das erste Mal in eine eigene Wohnung ziehen.","lang":"German","tr":"You can get this help only when moving into your own home for the first time.","law":"","sourceUrl":"https://jobcenter-nienburg.de/wp-content/uploads/2023/10/84_Leistungen_Schwangere.pdf","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__24.html","example":"A pregnant claimant leaves a furnished shared home after separation without essential household items. A qualifying initial need can be assessed despite her previous home, subject to means and any required move approval.","context":"The following sentences ask the claimant to list urgently needed items and explain why they are needed; the Jobcenter then examines the request. Those procedural statements do not remove the prior categorical only restriction. Page2 discusses separate pregnancy/baby help, including possible help without ongoing monthly benefits, but gives no separation exception to the furniture statement. The current general further-benefits page also lists home equipment without stating the restriction.","scope":"The initial-equipment rule in §24(3) sentence 1 no. 1 applies now and also applied when this leaflet was published. Qualifying need and resources matter; §24(6) adds conditions for certain under-25 moves.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Eine Hilfe hierfür können Sie nur bekommen, wenn Sie das erste Mal in eine eigene Wohnung ziehen.","tr":"You can get this help only when moving into your own home for the first time.","url":"https://jobcenter-nienburg.de/wp-content/uploads/2023/10/84_Leistungen_Schwangere.pdf","site":"jobcenter-nienburg.de · PDF"}]},"jobcenter-jcx-03":{"id":"jobcenter-jcx-03","area":"jobcenter","topic":"oneoff","pub":"Johannesberg municipal portal","src":"","claim":"says you must be unable to cover your living costs for the next six months.","quote":"Sie können Ihren Lebensunterhalt momentan und auch in den nächsten 6 Monaten wahrscheinlich nicht finanziell decken.","lang":"German","tr":"You probably cannot cover your living costs now or in the next 6 months.","law":"","sourceUrl":"https://www.johannesberg.de/behoerdenwegweiser/leistungen/detail/131131","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__24.html","example":"A pregnant applicant can cover rent and food but cannot meet a qualifying initial need for baby clothes. Ongoing ordinary living-cost need is not required, though resources and the other statutory conditions must still be assessed.","context":"Possible consideration of future income is different from a requirement for six months of continuing ordinary living-cost need. Opening description says previous receipt is immaterial, which does not expressly resolve present ongoing-need eligibility. This is a shared service-text appearance, not independently authored local advice or proof of local adjudication practice.","scope":"Opening description says previous receipt is immaterial, which does not expressly resolve present ongoing-need eligibility. This is a shared service-text appearance, not independently authored local advice or proof of local adjudication practice.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Sie können Ihren Lebensunterhalt momentan und auch in den nächsten 6 Monaten wahrscheinlich nicht finanziell decken.","tr":"You probably cannot cover your living costs now or in the next 6 months.","url":"https://www.johannesberg.de/behoerdenwegweiser/leistungen/detail/131131","site":"johannesberg.de"}]},"jobcenter-jcx-04":{"id":"jobcenter-jcx-04","area":"jobcenter","topic":"oneoff","pub":"BayernPortal, Munich","src":"","claim":"says you must be unable to cover your living costs for the next six months.","quote":"Sie können Ihren Lebensunterhalt momentan und auch in den nächsten 6 Monaten wahrscheinlich nicht finanziell decken.","lang":"German","tr":"You probably cannot cover your living costs now or in the next 6 months.","law":"","sourceUrl":"https://www.bayernportal.de/dokumente/leistung/1781231264220?behoerde=88887100385&gemeinde=6047106975248&plz=80331","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__24.html","example":"A pregnant applicant can cover rent and food but cannot meet a qualifying initial need for baby clothes. Ongoing ordinary living-cost need is not required, though resources and the other statutory conditions must still be assessed.","context":"A person able to meet normal living costs but unable to afford a qualifying one-off need may wrongly read the condition as excluding them. State portal text, not a newly found independently authored Munich Jobcenter statement. Opening text distinguishes prior receipt but does not repair the six-month eligibility statement. Same template as JCX-03 and existing findings.","scope":"State portal text, not a newly found independently authored Munich Jobcenter statement. Opening text distinguishes prior receipt but does not repair the six-month eligibility statement. Same template as JCX-03 and existing findings.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Sie können Ihren Lebensunterhalt momentan und auch in den nächsten 6 Monaten wahrscheinlich nicht finanziell decken.","tr":"You probably cannot cover your living costs now or in the next 6 months.","url":"https://www.bayernportal.de/dokumente/leistung/1781231264220?behoerde=88887100385&gemeinde=6047106975248&plz=80331","site":"bayernportal.de"}]},"jobcenter-jcx-01":{"id":"jobcenter-jcx-01","area":"jobcenter","topic":"holiday","pub":"Jobcenter Harz","src":"","claim":"caps pupils’ holiday-job earnings at €2,400 a year.","quote":"dazu im Kalenderjahr nochmals 2.400 Euro für den Ferienjob","lang":"German","tr":"plus another €2,400 per calendar year for the holiday job","law":"","sourceUrl":"https://www.chancen-schaffen-im-harz.de/berufliche-integration/informationen-zu-ferienjobs/","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11a.html","example":"An eligible 17-year-old general-school pupil earns €3,000 from a school-holiday job, with no contractual training remuneration. Those earnings are excluded under §11a(7), without the stated €2,400 ceiling.","context":"For a qualifying pupil's EUR3,000 holiday earnings the stated EUR2,400 ceiling wrongly implies part is countable. This is a rule-level contradiction, not evidence of an actual incorrect award. Only pupil holiday earnings under section 11a(7). Do not conflate employment-law time limits with the income exemption. Page's other obsolete claims are not separately adjudicated.","scope":"Only pupil holiday earnings under section 11a(7). Do not conflate employment-law time limits with the income exemption. Page's other obsolete claims are not separately adjudicated.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"dazu im Kalenderjahr nochmals 2.400 Euro für den Ferienjob","tr":"plus another €2,400 per calendar year for the holiday job","url":"https://www.chancen-schaffen-im-harz.de/berufliche-integration/informationen-zu-ferienjobs/","site":"chancen-schaffen-im-harz.de"}]},"jobcenter-jcx-02":{"id":"jobcenter-jcx-02","area":"jobcenter","topic":"age","pub":"Jobcenter Berlin Lichtenberg","src":"","claim":"says support is for people aged 15 to under 65.","quote":"im Alter von 15 bis unter 65 Jahren","lang":"German","tr":"aged 15 to under 65","law":"","sourceUrl":"https://www.berlin.de/jobcenter-lichtenberg/geld/leistungen/","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__7.html","example":"An otherwise eligible 65-year-old born in 1961, receiving no old-age pension and with no other exclusion, remains below the SGB II age boundary. The page's under-65 description could suggest otherwise.","context":"An otherwise eligible 65-year-old born in 1961 has not reached that age boundary. The published age description can prematurely exclude them. All other eligibility requirements remain; receipt of an old-age pension can exclude benefits under section 7(4). This is an explicit scope extension beyond the earlier ten-question panel, not a retroactive change to that panel's results.","scope":"All other eligibility requirements remain; receipt of an old-age pension can exclude benefits under section 7(4). This is an explicit scope extension beyond the earlier ten-question panel, not a retroactive change to that panel's results.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"im Alter von 15 bis unter 65 Jahren","tr":"aged 15 to under 65","url":"https://www.berlin.de/jobcenter-lichtenberg/geld/leistungen/","site":"berlin.de"}]},"jobcenter-mv-jc-01":{"id":"jobcenter-mv-jc-01","area":"jobcenter","topic":"deposit","pub":"City of Schwerin / Jobcenter Schwerin","src":"","claim":"says the loan is repaid at 10% a month.","quote":"mit monatlich 10% des maßgebenden Regelbedarfs zurückzuzahlen","lang":"German","tr":"to be repaid at 10% of the applicable standard need each month","law":"","sourceUrl":"https://www.schwerin.de/mein-schwerin/leben/gesellschaft-soziales/sozialleistungen/jobcenter/arbeitssuchende/","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__42a.html","example":"For an ordinary deposit-loan offset during continuing receipt, with a €563 standard need and no statutory exception, 5% is €28.15 monthly. The stated 10% would be €56.30.","context":"General claimant page with forms and Jobcenter contact. Standard-rate table is labelled 2025; surrounding housing material includes 2020/2023 dates. Deposit-loan sentence has no date or historical limitation. Elsewhere the page preserves 2023 heating guidance and an old rate in prose alongside the newer rate table.","scope":"A current ordinary deposit loan under §22(6), continuing benefit receipt, no statutory exception or other offset; no claim about a real debtor or actual administrative practice.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"mit monatlich 10% des maßgebenden Regelbedarfs zurückzuzahlen","tr":"to be repaid at 10% of the applicable standard need each month","url":"https://www.schwerin.de/mein-schwerin/leben/gesellschaft-soziales/sozialleistungen/jobcenter/arbeitssuchende/","site":"schwerin.de"}]},"jobcenter-st-jc-02":{"id":"jobcenter-st-jc-02","area":"jobcenter","topic":"activities","pub":"Jobcenter Anhalt-Bitterfeld","src":"","claim":"gives up to €10 a month for children’s activities.","quote":"monatlich bis zu 10 Euro","lang":"German","tr":"up to €10 a month","law":"","sourceUrl":"https://jobcenter.anhalt-bitterfeld.de/de/faq-alg-ii.html","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__28.html","example":"An otherwise eligible 12-year-old with qualifying sports-club costs has the statutory €15 monthly participation lump sum, rather than the FAQ's €10 figure.","context":"The page explicitly credits the BMAS FAQ dated January 2018. The live Bürgergeld menu nevertheless links the exact FAQ as Was muss ich wissen? outside an archive section. The body retains ALG II language and old examples. The finding concerns current supply of that dated text; no actual administrative practice is inferred.","scope":"The general benefit list in the January 2018 BMAS-derived FAQ currently supplied through the live Bürgergeld menu. The later historical 2013 discussion is corroborating context, not the sole basis. The comparison assumes qualifying under-18 participation costs and leaves additional actual-cost entitlements separate. No administrative-practice inference is made.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"monatlich bis zu 10 Euro","tr":"up to €10 a month","url":"https://jobcenter.anhalt-bitterfeld.de/de/faq-alg-ii.html","site":"jobcenter.anhalt-bitterfeld.de/de"}]},"elterngeld-be-elt-01":{"id":"elterngeld-be-elt-01","area":"elterngeld","topic":"change","pub":"Regional Council Giessen","src":"","claim":"bars changes to already-paid Basis months without the statutory hardship exception.","quote":"Lebensmonate, für die jedoch bereits Basiselterngeld ausgezahlt wurde, können nicht mehr geändert werden.","lang":"German","tr":"However, months for which basic parental allowance has already been paid can no longer be changed.","law":"","sourceUrl":"https://rp-giessen.hessen.de/versorgung-und-familie/elterngeld/faq-elterngeld","lawUrl":"https://www.gesetze-im-internet.de/beeg/__7.html","example":"A parent with established particular hardship asks to change a recently paid Basis life month within the statutory retrospective and overall periods. That exception can be assessed; approval is not automatic.","context":"The complete answer first allows changes until the end of the reference period, then states the absolute ban and advises early contact. No hardship qualification is supplied there. This is an express exclusion of an assessment route, not a finding based solely on absent detail.","scope":"Current 2026 claim, e.g. child born in 2026 and request within §7(2) retrospective window. No relevant transition removes hardship. This is a targeted follow-up extension, outside the original frozen samples. No individual decision, refusal, or financial loss established.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Lebensmonate, für die jedoch bereits Basiselterngeld ausgezahlt wurde, können nicht mehr geändert werden.","tr":"However, months for which basic parental allowance has already been paid can no longer be changed.","url":"https://rp-giessen.hessen.de/versorgung-und-familie/elterngeld/faq-elterngeld","site":"rp-giessen.hessen.de"}]},"elterngeld-ni-elt-02":{"id":"elterngeld-ni-elt-02","area":"elterngeld","topic":"change","pub":"City of Hannover","src":"","claim":"limits changes to unpaid months or Plus-to-Basis conversion, omitting the hardship exception.","quote":"nur für Monate […] noch nicht ausgezahlt","lang":"German","tr":"only for months […] not yet paid out","law":"","sourceUrl":"https://www.hannover.de/Leben-in-der-Region-Hannover/Verwaltungen-Kommunen/Die-Verwaltung-der-Landeshauptstadt-Hannover/Dezernate-und-Fachbereiche-der-LHH/Jugend,-Familie-Sport/Fachbereich-Jugend-und-Familie/Elterngeldstelle/FAQ-H%C3%A4ufig-gestellte-Fragen-zu-Elterngeld-Elternzeit","lawUrl":"https://www.gesetze-im-internet.de/beeg/__7.html","example":"A parent with established particular hardship asks to change a recently paid Basis life month within the statutory retrospective and overall periods. That exception can be assessed; approval is not automatic.","context":"The one-week processing advice follows. The finding concerns only the closed unpaid-month rule and its missing hardship exception; no actual refusal or universally unlawful processing lead time is established.","scope":"2026 claim within the overall benefit period and three-life-month retrospective limit; established special hardship; previously paid month.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"nur für Monate […] noch nicht ausgezahlt","tr":"only for months […] not yet paid out","url":"https://www.hannover.de/Leben-in-der-Region-Hannover/Verwaltungen-Kommunen/Die-Verwaltung-der-Landeshauptstadt-Hannover/Dezernate-und-Fachbereiche-der-LHH/Jugend,-Familie-Sport/Fachbereich-Jugend-und-Familie/Elterngeldstelle/FAQ-H%C3%A4ufig-gestellte-Fragen-zu-Elterngeld-Elternzeit","site":"hannover.de"}]},"elterngeld-be-elt-02":{"id":"elterngeld-be-elt-02","area":"elterngeld","topic":"premature","pub":"Regional Council Giessen","src":"","claim":"turns the premature-birth thresholds into upper limits.","quote":"bis zu 8 Wochen","lang":"German","tr":"up to 8 weeks","law":"","sourceUrl":"https://rp-giessen.hessen.de/versorgung-und-familie/elterngeld/faq-elterngeld","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4.html","example":"For an otherwise eligible current claim, a child born exactly seven weeks before the certified expected date adds one Basis month. The table's upper-bound wording could suggest the two-month tier, despite its correct opening minimum.","context":"Material countercontext: the opening sentence correctly requires at least six weeks. The allegation is therefore an internally inconsistent tier table, not a claim that the whole FAQ unambiguously allows all premature births. The identical inverted rows repeat in the changes section.","scope":"Births from 1 September 2021; use new 2026 birth to avoid older retained versions. No intervening transition changes these minimum intervals. This is a targeted follow-up extension, outside the original frozen samples. No individual decision, refusal, or financial loss established.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bis zu 8 Wochen","tr":"up to 8 weeks","url":"https://rp-giessen.hessen.de/versorgung-und-familie/elterngeld/faq-elterngeld","site":"rp-giessen.hessen.de"}]},"elterngeld-be-elt-03":{"id":"elterngeld-be-elt-03","area":"elterngeld","topic":"bonus","pub":"Town of Rahden","src":"","claim":"gives the old range of 25 to 30 hours a week.","quote":"gleichzeitig zwischen 25 und 30 Wochenstunden","lang":"German","tr":"at the same time between 25 and 30 hours per week","law":"","sourceUrl":"https://www.rahden.de/wp-content/uploads/Wirtschaftliche-Hilfen-und-Behoerdengaenge-1.pdf","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4b.html","example":"After a 2026 birth, both otherwise qualifying parents average 31 weekly hours in each of four concurrent consecutive life months. They satisfy the current hours condition; the old 25–30 range excludes that scenario.","context":"The full paragraph and surrounding PDF pages were examined, with page 6 visually checked. No older-cohort qualifier appears; the same page uses the 2025 income threshold of €175,000. The four-month sentence describes a valid possible block and does not expressly exclude two- or three-month choices. Only the obsolete hours range is treated as a confirmed discrepancy.","scope":"Restrict finding to births from 1 September 2021, particularly the guide’s present 2025/2026 audience; old range is not alleged wrong for pre-September-2021 births. This is a targeted follow-up extension, outside the original frozen samples. No individual decision, refusal, or financial loss established.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"gleichzeitig zwischen 25 und 30 Wochenstunden","tr":"at the same time between 25 and 30 hours per week","url":"https://www.rahden.de/wp-content/uploads/Wirtschaftliche-Hilfen-und-Behoerdengaenge-1.pdf","site":"rahden.de · PDF"}]},"elterngeld-mv-elt-03":{"id":"elterngeld-mv-elt-03","area":"elterngeld","topic":"bonus","pub":"State Office for Health and Social Affairs MV","src":"","claim":"gives the old 25 to 30 hours and requires four months.","quote":"müssen vier Monate […] mindestens 25 Stunden […] nicht mehr als 30 Stunden","lang":"German","tr":"must […] four months […] at least 25 hours […] no more than 30 hours","law":"For a current paired-parent claim, each parent must average 24–32 weekly hours in each of two to four concurrent consecutive life months, with the other eligibility conditions satisfied.","sourceUrl":"https://www.lagus.mv-regierung.de/Services/Leichte-Sprache/Eltern-Geld","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4b.html","example":"After a 2026 birth, both otherwise qualifying parents average 31 weekly hours in each of four concurrent consecutive life months. They satisfy the current hours condition; the old 25–30 range excludes that scenario.","context":"The paragraph expressly makes four months mandatory. This differs from the prior Rahden sentence describing a valid four-month block. The main page correctly uses 24–32 hours and up to four months; the current PDF correctly says two to four months. This countercontext shows inconsistent accessible-language guidance. The earlier part-time definition remains ambiguous and is not another confirmed ordinary-hours exclusion. The page credits ZBFS assistance, so independent drafting origin is not established.","scope":"New 2026 birth/adoption intake with all other entitlement conditions satisfied; retained older legal versions under BEEG §28 are separate. Published wording only; no administrative calculation, refusal, claimant loss or intent is established.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"müssen vier Monate […] mindestens 25 Stunden […] nicht mehr als 30 Stunden","tr":"must […] four months […] at least 25 hours […] no more than 30 hours","url":"https://www.lagus.mv-regierung.de/Services/Leichte-Sprache/Eltern-Geld","site":"lagus.mv-regierung.de"}]},"elterngeld-st-elt-02":{"id":"elterngeld-st-elt-02","area":"elterngeld","topic":"bonus","pub":"City of Magdeburg","src":"","claim":"promises single parents four extra months for any two to four qualifying months.","quote":"erhalten sie ebenfalls vier zusätzliche ElterngeldPlus-Monate","lang":"German","tr":"they also receive four additional ElterngeldPlus months","law":"A sole parent meeting §4c(2) receives extra Plus for the qualifying consecutive life months, between two and four, while averaging 24–32 weekly hours in each month. Two qualifying months give two extra months, not four.","sourceUrl":"https://www.magdeburg.de/loadDocument.phtml?Ext=PDF&FID=37.6484.1","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4c.html","example":"A sole parent meeting §4c(2) averages 28 weekly hours in exactly two consecutive qualifying life months. Those months generate two extra Plus months, not four.","context":"Earlier paired-parent paragraph correctly says two to four consecutive months. The solo sentence still promises four, rather than matching the chosen qualifying period.","scope":"Supplementary §4c(2) check outside fixed 60 cells.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"erhalten sie ebenfalls vier zusätzliche ElterngeldPlus-Monate","tr":"they also receive four additional ElterngeldPlus months","url":"https://www.magdeburg.de/loadDocument.phtml?Ext=PDF&FID=37.6484.1","site":"magdeburg.de"}]},"elterngeld-be-elt-04":{"id":"elterngeld-be-elt-04","area":"elterngeld","topic":"minimum","pub":"Town of Rahden","src":"","claim":"says you may work at most 30 hours a week.","quote":"höchstens 30 Stunden in der Woche arbeiten","lang":"German","tr":"work at most 30 hours per week","law":"","sourceUrl":"https://www.rahden.de/wp-content/uploads/Wirtschaftliche-Hilfen-und-Behoerdengaenge-1.pdf","lawUrl":"https://www.gesetze-im-internet.de/beeg/__1.html","example":"An otherwise eligible parent averages 31 weekly hours over the relevant life month after a 2026 birth. Exceeding 30 hours alone does not bar minimum Elterngeld.","context":"The same guide correctly uses 32 hours for Elternzeit on page 4, which is a different entitlement. The Elterngeld paragraph on page 6 specifically says 30 and has no historical label. Distinguish the two provisions and disclose this countercontext. This is an outdated stated condition, not an explicit assertion that every 31-hour claimant will be refused and not evidence of administrative practice.","scope":"Births/adoption intake from 1 September 2021; old 30-hour rule can apply to earlier cohorts. This is a targeted follow-up extension, outside the original frozen samples. No individual decision, refusal, or financial loss established.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"höchstens 30 Stunden in der Woche arbeiten","tr":"work at most 30 hours per week","url":"https://www.rahden.de/wp-content/uploads/Wirtschaftliche-Hilfen-und-Behoerdengaenge-1.pdf","site":"rahden.de · PDF"}]},"elterngeld-mv-elt-01":{"id":"elterngeld-mv-elt-01","area":"elterngeld","topic":"plus","pub":"State Office for Health and Social Affairs MV","src":"","claim":"says ElterngeldPlus is always half.","quote":"Die Leistung beträgt die Hälfte vom Eltern-Geld.","lang":"German","tr":"The benefit is half of the parental allowance.","law":"","sourceUrl":"https://www.lagus.mv-regierung.de/Services/Leichte-Sprache/Eltern-Geld","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4a.html","example":"With statutory Elterngeld net income of €2,000 before birth and €1,200 during receipt, and no supplements or offsets, Basis is €520. The Plus ceiling is €650, so actual Plus is also €520 rather than €260.","context":"Read the whole accessible-language page, including the immediately following reference to part-time earnings. The linked ordinary main page correctly states the hypothetical no-income cap; disclose this internal divergence and the simplified-language genre. The amount statement itself is unconditional. The page credits ZBFS assistance, so independent drafting origin is not established.","scope":"New 2026 birth/adoption intake with all other entitlement conditions satisfied; retained older legal versions under BEEG §28 are separate. Published wording only; no administrative calculation, refusal, claimant loss or intent is established.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Die Leistung beträgt die Hälfte vom Eltern-Geld.","tr":"The benefit is half of the parental allowance.","url":"https://www.lagus.mv-regierung.de/Services/Leichte-Sprache/Eltern-Geld","site":"lagus.mv-regierung.de"}]},"elterngeld-ni-elt-01":{"id":"elterngeld-ni-elt-01","area":"elterngeld","topic":"plus","pub":"City of Hannover","src":"","claim":"says ElterngeldPlus is always half the Basis amount.","quote":"jeden Monat nur den halben Betrag vom Basiselterngeld","lang":"German","tr":"each month only half the amount of basic parental allowance","law":"","sourceUrl":"https://www.hannover.de/Leben-in-der-Region-Hannover/Verwaltungen-Kommunen/Die-Verwaltung-der-Landeshauptstadt-Hannover/Dezernate-und-Fachbereiche-der-LHH/Jugend,-Familie-Sport/Fachbereich-Jugend-und-Familie/Elterngeldstelle/FAQ-H%C3%A4ufig-gestellte-Fragen-zu-Elterngeld-Elternzeit","lawUrl":"https://www.gesetze-im-internet.de/beeg/__2.html","example":"With statutory Elterngeld net income of €2,000 before birth and €1,200 during receipt, and no supplements or offsets, Basis is €520. The Plus ceiling is €650, so actual Plus is also €520 rather than €260.","context":"Following paragraph distinguishes earnings effects and refers to calculator, but does not limit the first half-payment equation to a no-income case.","scope":"2026 birth; positive post-birth earnings; no special supplements or offsetting benefits.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"jeden Monat nur den halben Betrag vom Basiselterngeld","tr":"each month only half the amount of basic parental allowance","url":"https://www.hannover.de/Leben-in-der-Region-Hannover/Verwaltungen-Kommunen/Die-Verwaltung-der-Landeshauptstadt-Hannover/Dezernate-und-Fachbereiche-der-LHH/Jugend,-Familie-Sport/Fachbereich-Jugend-und-Familie/Elterngeldstelle/FAQ-H%C3%A4ufig-gestellte-Fragen-zu-Elterngeld-Elternzeit","site":"hannover.de"}]},"elterngeld-mv-elt-02":{"id":"elterngeld-mv-elt-02","area":"elterngeld","topic":"single","pub":"State Office for Health and Social Affairs MV","src":"","claim":"makes you declare that no other adult lives with you.","quote":"ich lebe mit keiner anderen volljährigen Person in meiner Wohnung.","lang":"German","tr":"I do not live with any other adult in my home.","law":"","sourceUrl":"https://www.lagus.mv-regierung.de/serviceassistent/download?id=1682724","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4c.html","example":"An otherwise qualifying parent lives with a newborn and a 19-year-old student child for whom Kindergeld is due, with the other parent elsewhere and reduced income for two life months. The adult child's presence does not itself block the extra-month route.","context":"The page 3 checkbox says the tax-relief conditions apply because the applicant is alone with the child and lives with no other adult. Separate impossible-care and child-welfare alternatives follow. Neither those alternatives nor the general tax citation repairs the factual no-adult declaration for a qualifying adult child. All 10 pages were read; page 3 was visually inspected.","scope":"New 2026 birth/adoption intake with all other entitlement conditions satisfied; retained older legal versions under BEEG §28 are separate. Published wording only; no administrative calculation, refusal, claimant loss or intent is established.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"ich lebe mit keiner anderen volljährigen Person in meiner Wohnung.","tr":"I do not live with any other adult in my home.","url":"https://www.lagus.mv-regierung.de/serviceassistent/download?id=1682724","site":"lagus.mv-regierung.de"}]},"elterngeld-st-elt-01":{"id":"elterngeld-st-elt-01","area":"elterngeld","topic":"overlap","pub":"City of Magdeburg","src":"","claim":"places the shared month within the first 14 months.","quote":"Innerhalb der ersten 14 Lebensmonate […] nur für einen Monat","lang":"German","tr":"Within the first 14 months of life […] only for one month","law":"","sourceUrl":"https://www.magdeburg.de/loadDocument.phtml?Ext=PDF&FID=37.6484.1","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4.html","example":"Otherwise eligible parents after a 2026 birth plan concurrent Basis receipt in life month 13. Without a statutory overlap exception, that month falls outside the permitted first-twelve-month window.","context":"Separate ordinary entitlement can extend through month 14, but that does not extend the concurrent window. Finding concerns ordinary 2026 cases, not exceptional children.","scope":"Original ten-rule check 9; ordinary 2026 birth, no statutory overlap exception.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Innerhalb der ersten 14 Lebensmonate […] nur für einen Monat","tr":"Within the first 14 months of life […] only for one month","url":"https://www.magdeburg.de/loadDocument.phtml?Ext=PDF&FID=37.6484.1","site":"magdeburg.de"}]},"elterngeld-st-elt-03":{"id":"elterngeld-st-elt-03","area":"elterngeld","topic":"maternity","pub":"City of Magdeburg","src":"","claim":"counts maternity benefit in calendar months.","quote":"Kalendermonate, in denen Mutterschaftsgeld bezogen wurde","lang":"German","tr":"calendar months in which maternity benefit was received","law":"","sourceUrl":"https://www.magdeburg.de/loadDocument.phtml?Ext=PDF&FID=37.6484.1","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4.html","example":"For a child born on 20 October, qualifying post-birth maternity benefits ending within the second life month can span October to December. That is three calendar months but two life months; actual bank-payment dates do not decide the count.","context":"The preceding sentence confines maternity-pay offset to the time from birth. Pre-birth months are outside this comparison. Statutory entitlement to the specified benefits, rather than the date cash is actually paid, controls the life-month rule.","scope":"Supplementary §4(4) sentence 3 check outside the fixed 60 cells; only qualifying benefits from birth, excluding pre-birth amounts and §19(2) MuSchG payments.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Kalendermonate, in denen Mutterschaftsgeld bezogen wurde","tr":"calendar months in which maternity benefit was received","url":"https://www.magdeburg.de/loadDocument.phtml?Ext=PDF&FID=37.6484.1","site":"magdeburg.de"}]},"missions-visa-four-week-cutoff":{"id":"missions-visa-four-week-cutoff","area":"missions","topic":"visa-timing","pub":"Embassies in Ulaanbaatar and Cairo","src":"Tourist visa","claim":"say applications close four weeks before travel.","quote":"Die Antragstellung ist 6 Monate bis 4 Wochen vor dem Reisetermin möglich.","lang":"German","tr":"Applications are possible from 6 months to 4 weeks before the travel date.","law":"","sourceUrl":"https://ulan-bator.diplo.de/mn-de/service/visa/01-visa","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a visa-required tourist with the formally required application materials ready 21 days before departure could read the page as saying lodging is already impossible, although the ordinary statutory latest point is fifteen days.","context":"[1] Federal Foreign Office / German mission; German: The page states a possible lodging interval, followed by a disclaimer of any guarantee for the intended travel date. It also contains current fees and an ordinary fifteen-day processing statement.\n[2] Federal Foreign Office / German mission; German: The current page includes a 2026 jurisdiction notice. Its categorical application interval is separate from the later processing estimate.\n[3] Federal Foreign Office / German mission; German; PDF page 1: The August 2025 adult tourism checklist is directly linked from the current application parent. The timing condition is stated as possible lodging, without an urgency qualification.\n[4] Federal Foreign Office / German mission; English; PDF page 1: The current English August 2025 adult tourism PDF states the same lodging interval. Its separate processing estimate is two to four weeks.\n[5] Federal Foreign Office / German mission; German; PDF page 1: The current August 2025 checklist covers minors applying for tourism, visits or medical treatment. The parent’s direct PDF link was followed.\n[6] Federal Foreign Office / German mission; English; PDF page 1: The current English August 2025 minors PDF repeats the categorical four-week lodging boundary.","scope":"Acceptance does not guarantee a decision before the desired trip. Individual extended examination, lawful appointment arrangements and operative nationality-specific Article 25a measures require separate consideration; they do not establish a universal four-week lodging cutoff. Later urgent lodging is assessed under Article 9(1). Visa-free travellers and protected free-movement families have distinct rules.","date":"2026-10-17","langs":["German","English"],"countries":["MN","EG"],"versions":[{"lang":"German","quote":"Die Antragstellung ist 6 Monate bis 4 Wochen vor dem Reisetermin möglich.","tr":"Applications are possible from 6 months to 4 weeks before the travel date.","url":"https://ulan-bator.diplo.de/mn-de/service/visa/01-visa","site":"ulan-bator.diplo.de/mn-de"},{"lang":"German","quote":"Eine Antragstellung ist ab 6 Monate bis 4 Wochen vor der geplante Reise möglich.","tr":"","url":"https://kairo.diplo.de/eg-de/service/05-visaeinreise/schengenvisa","site":"kairo.diplo.de/eg-de"},{"lang":"German","quote":"ab 6 Monate bis 4 Wochen vor der geplanten Reise","tr":"","url":"https://kairo.diplo.de/resource/blob/2516798/544d8d8d058894bf59c04626e58ecb46/240320-merkblatt-tourismus-und-besuch-data.pdf#page=1","site":"kairo.diplo.de · PDF"},{"lang":"English","quote":"from 6 months to 4 weeks before the planned trip.","tr":"","url":"https://kairo.diplo.de/resource/blob/2487220/6e05470b131f14c8a03d6e1a42b8346b/240320-leaflet-for-tourism-and-visits-english-data.pdf#page=1","site":"kairo.diplo.de · PDF"},{"lang":"German","quote":"ab 6 Monate bis 4 Wochen vor der geplanten Reise","tr":"","url":"https://kairo.diplo.de/resource/blob/2518076/4aad2acd288ff3cbe5b22a4113b8aaae/231104-merkblatt-minderjaehrige-data.pdf#page=1","site":"kairo.diplo.de · PDF"},{"lang":"English","quote":"Application can be submitted 6 months to 4 weeks before the planned trip.","tr":"","url":"https://kairo.diplo.de/resource/blob/2540462/22ecd9830eebeaef7e6a950b9470502c/231104-leaflet-minors-data.pdf#page=1","site":"kairo.diplo.de · PDF"}]},"missions-visa-filing-window":{"id":"missions-visa-filing-window","area":"missions","topic":"visa-timing","pub":"Embassies in Kathmandu, Kampala, Nicosia and Kuala Lumpur","src":"Tourist visa","claim":"say you can apply no more than three months ahead.","quote":"three months before the start of your planned trip at the earliest.","lang":"English","tr":"","law":"","sourceUrl":"https://kathmandu.diplo.de/np-en/service/01-visaeinreise/1672492-1672492","lawUrl":"https://eur-lex.europa.eu/eli/reg/2019/1155/oj/eng/pdf","example":"Hypothetical: a visa-required tourist planning a February trip could infer in October that filing is too early, although a date within six months falls inside the ordinary legal window.","context":"[1] German Embassy Kathmandu / Federal Foreign Office; English: The full sentence concerns registration and submission. The linked English FAQ correctly says six months; the German counterpart does not repeat the three-month earliest restriction. The mission also represents Slovenia and Luxembourg in the stated context.\n[2] German Embassy Kampala / Federal Foreign Office; English: The opening section explicitly frames three months as a basic admissibility condition. The tourism section on the same page correctly gives six months; the medical section does too. The page directs application reception to TLScontact and describes residence, representation and family-member exceptions. The finding concerns the stale opening statement, not a uniformly applied three-month policy.\n[3] Federal Foreign Office / German mission; German: The live German index links this page. Its English counterpart correctly says six months. Other sections show updated ninety-euro visa fees.\n[4] Federal Foreign Office / German mission; English: This page remains in the current English visa application path and links the checklist index. It also includes the correctly dated 2024 fee increase, so the old window is not only an isolated archived notice.","scope":"Normally file at least 15 calendar days before travel; justified urgency rules apply. A six-month legal window does not guarantee a chosen appointment slot. Confirm destination competence, lawful residence or justified nonresident lodging, nationality exemptions and qualifying family rules before using an ordinary tourist checklist.","date":"2026-10-17","langs":["English","German"],"countries":["NP","UG","CY","MY"],"versions":[{"lang":"English","quote":"three months before the start of your planned trip at the earliest.","tr":"","url":"https://kathmandu.diplo.de/np-en/service/01-visaeinreise/1672492-1672492","site":"kathmandu.diplo.de/np-en"},{"lang":"English","quote":"the application was submitted at the earliest three months before the start of the planned trip","tr":"","url":"https://kampala.diplo.de/ug-en/service/05-visaeinreise/1617664-1617664","site":"kampala.diplo.de/ug-en"},{"lang":"German","quote":"Sie können Ihren Antrag frühestens drei Monate vor Antritt der geplanten Reise stellen.","tr":"","url":"https://nikosia.diplo.de/cy-de/
