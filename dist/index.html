ded to apply to departures from that third country.","url":"https://img.static-af.com/m/7e6b4a268307774e/original/Passengers-Rights-FR.pdf","site":"img.static-af.com · PDF"},{"lang":"Spanish","quote":"y si no existe ninguna reglamentación local aplicable a los vuelos que salen del país tercero.","tr":"and if there is no local regulation applicable to flights departing from the third country.","url":"https://img.static-af.com/m/618f3f9ca861244c/original/Passengers-Rights-ES.pdf","site":"img.static-af.com · PDF"}]},"airlines-la-compagnie-scope":{"id":"airlines-la-compagnie-scope","area":"airlines","topic":"scope","pub":"La Compagnie","src":"","claim":"says EU rights apply only if no local rules exist.","quote":"and if no local regulation applies to departures from that third country.","lang":"English","tr":"","law":"","sourceUrl":"https://www.lacompagnie.com/en/legal/passenger-rights","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"A La Compagnie-operated New York–Paris cancellation is subject to a local departure rule. Its existence alone, without the relevant equivalent protection, does not determine that EU261 is unavailable.","context":"The full notice was checked, including later local-compensation references and its separate assistance section. An overbroad extraordinary-circumstances sentence inside Compensation was considered separately and withheld because a compensation-only reading is plausible. It is not part of this finding.","scope":"Limited to third-country departures into the EU actually operated by an EU carrier, with the other eligibility conditions met. The statutory third-country benefits/compensation-and-assistance exception and the Court’s equivalence assessment still apply. This does not establish a right to duplicate recovery.","date":"2026-10-17","langs":["English","French","Italian","German"],"countries":[],"versions":[{"lang":"English","quote":"and if no local regulation applies to departures from that third country.","tr":"","url":"https://www.lacompagnie.com/en/legal/passenger-rights","site":"lacompagnie.com/en"},{"lang":"French","quote":"et si aucune réglementation locale n’a vocation à s’appliquer au départ de ce pays tiers.","tr":"and if no local regulation is intended to apply to departures from that third country.","url":"https://www.lacompagnie.com/fr/legal/droits-des-passagers","site":"lacompagnie.com/fr"},{"lang":"Italian","quote":"e se nessuna regolamentazione locale è destinata ad applicarsi in partenza da tale paese terzo.","tr":"and if no local regulation is intended to apply to departures from that third country.","url":"https://www.lacompagnie.com/it/legal/diritti-dei-passeggeri","site":"lacompagnie.com/it"},{"lang":"German","quote":"und wenn keine lokalen Vorschriften für den Abflug aus diesem Drittland gelten.","tr":"and if no local rules apply to departure from that third country.","url":"https://www.lacompagnie.com/de/legal/fluggastrechte","site":"lacompagnie.com/de"}]},"airlines-british-airways-refund":{"id":"airlines-british-airways-refund","area":"airlines","topic":"refund","pub":"British Airways","src":"","claim":"says you must claim used and unused flights at the same time.","quote":"must make the claim at the same time as claiming the refund of the unflown sectors.","lang":"English","tr":"","law":"","sourceUrl":"https://www.britishairways.com/content/en/information/legal/flight-cancellation-compensation","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"A passenger on an EU-departing BA through journey abandons a cancelled connection and qualifies for a refund of an already-flown sector because the journey no longer serves its original purpose. They request the unused-sector refund first, then supplement it within the valid limitation period. Timing alone is not an Article 8 disqualification.","context":"The full used-sector paragraph, proof-of-lost-purpose condition, return-flight provision, nearby 24-hour connection wording, linked help and general carriage terms were checked. Help repeats the simultaneity requirement. A general promise to comply with law does not explain that later supplementary requests remain available.","scope":"Qualifying passengers on BA-operated EU departures who abandon a disrupted journey and meet the statutory used-sector refund conditions. Not every later request must succeed: journey purpose, standing, valid settlements and limitation rules can matter. The separate 24-hour connection condition is unresolved.","date":"2026-10-17","langs":["English","German","French"],"countries":[],"versions":[{"lang":"English","quote":"must make the claim at the same time as claiming the refund of the unflown sectors.","tr":"","url":"https://www.britishairways.com/content/en/information/legal/flight-cancellation-compensation","site":"britishairways.com/en"},{"lang":"German","quote":"muss der Ticketkäufer den entsprechenden Antrag gleichzeitig mit seiner Forderung auf Rückzahlung der nicht geflogenen Strecken stellen.","tr":"the ticket purchaser must submit the corresponding application at the same time as the request for reimbursement of the unflown sectors.","url":"https://www.britishairways.com/content/de/information/legal/flight-cancellation-compensation","site":"britishairways.com/de"},{"lang":"French","quote":"doit faire la réclamation en même temps qu’il demande le remboursement des secteurs non effectués.","tr":"must make the claim at the same time as requesting reimbursement for the unflown sectors.","url":"https://www.britishairways.com/content/fr/information/legal/flight-cancellation-compensation","site":"britishairways.com/fr"}]},"airlines-emirates-hotel":{"id":"airlines-emirates-hotel","area":"airlines","topic":"care","pub":"Emirates","src":"","claim":"offers a hotel only if the new flight leaves on a later date.","quote":"when the reasonably expected time of departure of the new flight is one day or more later than the scheduled departure date","lang":"English","tr":"","law":"","sourceUrl":"https://www.emirates.com/us/english/before-you-fly/travel/rules-and-notices/denied-boarding-notice/","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"A passenger is involuntarily denied boarding on an EU-departing 00:30 flight. The earliest replacement leaves at 08:00 on the same date, and overnight accommodation is necessary. Article 4/9 contains no later-date bar to that necessary care.","context":"Eligibility, all three refund/rerouting options, full assistance bullet, the separate care-causes-delay qualification and neighbouring delay/cancellation notices were compared. Necessity of accommodation remains essential. Choosing a later convenient reroute does not provide open-ended hotel rights.","scope":"Eligible passengers involuntarily denied boarding on Emirates-operated EU departures, awaiting earliest rerouting and needing hotel accommodation although the replacement departs later on the same calendar date. Reasonable health, safety/security or document-based refusal can fall outside statutory denied boarding.","date":"2026-10-17","langs":["English","German","French"],"countries":[],"versions":[{"lang":"English","quote":"when the reasonably expected time of departure of the new flight is one day or more later than the scheduled departure date","tr":"","url":"https://www.emirates.com/us/english/before-you-fly/travel/rules-and-notices/denied-boarding-notice/","site":"emirates.com/us/english"},{"lang":"German","quote":"wenn die vernünftigerweise erwartete Abflugzeit des neuen Flugs einen Tag oder mehr später als das geplante Abflugdatum liegt","tr":"when the reasonably expected departure time of the new flight is one day or more later than the planned departure date","url":"https://www.emirates.com/de/german/before-you-fly/travel/rules-and-notices/denied-boarding-notice/","site":"emirates.com/de/german"},{"lang":"French","quote":"quand le départ du nouveau vol est programmé un jour ou plus après la date de départ planifiée","tr":"when the new flight's departure is scheduled one day or more after the planned departure date","url":"https://www.emirates.com/fr/french/before-you-fly/travel/rules-and-notices/denied-boarding-notice/","site":"emirates.com/fr/french"}]},"airlines-austrian-intra-eu-delay-care":{"id":"airlines-austrian-intra-eu-delay-care","area":"airlines","topic":"longhaul","pub":"Austrian Airlines","src":"","claim":"says care starts after four hours on flights over 3,500 km.","quote":"for four hours or more in the case of all flights of more than 3,500 kilometres","lang":"English","tr":"","law":"On covered intra-EU flights longer than 1,500 km, an expected departure delay of at least three hours triggers reasonable meals/refreshments and two communications.","sourceUrl":"https://www.austrian.com/at/en/legal/passenger-rights","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"An eligible passenger on an Austrian-operated intra-EU route above 3,500 km faces an expected departure delay of 3h30. The notice places that flight in its four-hour band; Article 6(1)(b) already requires meals/refreshments and two communications.","context":"Full EU scope, delay, cancellation, denied-boarding and downgrade text read. The compensation distance bands expressly mention intra-EU flights, but that statement concerns compensation amounts and does not repair the care-trigger list. Canadian material on /ca was excluded. The notice limits itself to Austrian as operating carrier.","scope":"Eligible passengers on Austrian-operated intra-EU flights longer than 3,500 km; a reasonable expected departure delay of at least three but less than four hours. Care is separate from fixed compensation and its extraordinary-circumstances defence.","date":"2026-10-17","langs":["English"],"countries":[],"versions":[{"lang":"English","quote":"for four hours or more in the case of all flights of more than 3,500 kilometres","tr":"","url":"https://www.austrian.com/at/en/legal/passenger-rights","site":"austrian.com/at/en"}]},"airlines-lufthansa-intra-eu-reduction":{"id":"airlines-lufthansa-intra-eu-reduction","area":"airlines","topic":"longhaul","pub":"Lufthansa","src":"","claim":"says compensation may be halved when rerouting on intra-EU flights over 3,500 km arrives up to four hours late.","quote":"no later than four hours after the scheduled arrival time for flights of more than 3,500 km","lang":"English","tr":"","law":"The Article 7(2) rerouting reduction on intra-EU flights longer than 1,500 km requires arrival no more than three hours late.","sourceUrl":"https://www.lufthansa.com/be/en/passenger-rights","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"An eligible passenger is involuntarily denied boarding on an intra-EU Lufthansa-operated flight above 3,500 km. Rerouting arrives 3h30 late. Article 7(2)(b) does not permit a 50% reduction; the notice's distance-only paragraph does.","context":"Full notice reviewed. The preceding compensation amounts and the delay-care paragraph explicitly include the intra-EU category; the separate reduction paragraph omits it. Amounts table overlaps above 3,500 km, so do not assume an actual €200 payment or assert the carrier's applied amount. Narrowly allege an overbroad permission to halve the otherwise applicable Article 7 amount.","scope":"Eligible involuntarily denied-boarding passengers offered rerouting on a Lufthansa-operated intra-EU journey above 3,500 km, arriving more than three but no more than four hours late. Use denied boarding to isolate this from cancellation timing defences.","date":"2026-10-17","langs":["English"],"countries":[],"versions":[{"lang":"English","quote":"no later than four hours after the scheduled arrival time for flights of more than 3,500 km","tr":"","url":"https://www.lufthansa.com/be/en/passenger-rights","site":"lufthansa.com/be/en"}]},"roaming-go-fair-use-or":{"id":"roaming-go-fair-use-or","area":"roaming","topic":"fairuse","pub":"GO","src":"","claim":"lets either time or use abroad trigger fair-use checks.","quote":"in Malta, or","lang":"English","tr":"","law":"","sourceUrl":"https://www.go.com.mt/terms-and-conditions/mobile-terms-and-conditions/","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"An otherwise eligible active user spends 70% of the relevant days in Malta but makes 80% of usage while travelling in another EU state over four months. With no other abuse indicator, the domestic-presence safe harbour prevents usage alone from establishing abusive roaming.","context":"The full clause includes a separate SIM-inactivity indicator and a two-week warning followed by possible surcharging. Those features do not correct the alternative ordinary tests. General terms give specific tariff/offer terms priority; current Smart terms refer back to the Product Terms for this policy. A plan-specific override could change an individual contract.","scope":"GO home customers using default regulated terrestrial roaming, with valid residence/stable links and no separate abuse indicator. Long SIM inactivity with mostly roaming use, sequential SIM use and organised resale have separate rules. No conclusion about every GO plan or actual enforcement.","date":"2026-10-17","langs":["English"],"countries":["MT"],"versions":[{"lang":"English","quote":"in Malta, or","tr":"","url":"https://www.go.com.mt/terms-and-conditions/mobile-terms-and-conditions/","site":"go.com.mt"},{"lang":"English","quote":"in Malta, or","tr":"","url":"https://prodcms.go.com.mt/wp-content/uploads/2025/06/Mobile_Product_General_0_TC-sf.pdf","site":"prodcms.go.com.mt · PDF"}]},"roaming-tmobile-cz-and-or":{"id":"roaming-tmobile-cz-and-or","area":"roaming","topic":"fairuse","pub":"T-Mobile Czech Republic","src":"","claim":"warns you if either time or use abroad is higher.","quote":"consumption predominates within EU Roaming and/or the Subscriber’s presence","lang":"English","tr":"","law":"","sourceUrl":"https://www.t-mobile.cz/dcpublic/OP-EU_roaming.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: an active eligible customer spends 70% of the monitored days in Czechia but makes most calls while travelling in another EU state. Domestic presence prevents the ordinary abuse conclusion; the terms’ consumption alternative can still initiate its process.","context":"The complete clause includes two weeks to remedy, service-specific surcharging and a complaint route. Clauses 19–20 separately address long SIM inactivity, multiple SIMs and organised resale. Clause 6 permits voluntary alternative offers; it does not qualify default clause 18. Current 15 October 2026 prices, physical pp.39–42, preserve domestic EU prices and separate volume limits without correcting this ordinary trigger. A related Czech prevention FAQ also recommends changing both indicators; it is not a separate case.","scope":"Czech-home subscribers governed by these published terms, default regulated terrestrial EU roaming, with valid residence/stable links and no distinct misuse ground. Individual negotiated or deliberately chosen alternative terms require separate assessment.","date":"2026-10-17","langs":["Czech","English"],"countries":["CZ"],"versions":[{"lang":"Czech","quote":"převládá spotřeba v EU Roamingu, a/nebo převládá-li přítomnost","tr":"consumption in EU roaming predominates, and/or presence predominates","url":"https://www.t-mobile.cz/dcpublic/OP-EU_roaming.pdf","site":"t-mobile.cz · PDF"},{"lang":"English","quote":"consumption predominates within EU Roaming and/or the Subscriber’s presence","tr":"","url":"https://www.t-mobile.cz/dcpublic/OP-t-mobile-roaming-and-eu-roaming-terms-and-conditions.pdf","site":"t-mobile.cz · PDF"}]},"roaming-gomobil-cz-and-or-copy":{"id":"roaming-gomobil-cz-and-or-copy","area":"roaming","topic":"fairuse","pub":"GoMobil","src":"","claim":"warns you if either time or use abroad is higher.","quote":"převládá spotřeba v roamingu v Zóně 1 a/nebo převládá-li vaše přítomnost","lang":"Czech","tr":"consumption in roaming in Zone 1 predominates, and/or your presence predominates","law":"","sourceUrl":"https://napoveda.gomobil.cz/tema/roaming-volani-v-zahranici/roaming-tarify-pausalni-sluzby/kolik-stoji-volani-v-roamingu","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: an active eligible customer remains registered in Czechia on most relevant days but makes most calls during EU trips over four months. Domestic presence protects against this ordinary abuse finding; the consumption alternative can still trigger the stated process.","context":"The full help and September tariff preserve two weeks to remedy, a complaint route and service-specific surcharging. The tariff’s surrounding roaming chapter separates domestic included units, volume limits and travel bundles; none converts the ordinary a/nebo outcome to AND. No separate allegation is made about its rates, billing increments, foreign-call unit treatment or every GoMobil product.","scope":"Czech-home postpaid GoMobil customers within this help/current tariff’s default regulated terrestrial EU scope, with valid residence/stable links and no separate misuse ground. The prepaid tariff and business-specific prices were not used to extend this case.","date":"2026-10-17","langs":["Czech"],"countries":["CZ"],"versions":[{"lang":"Czech","quote":"převládá spotřeba v roamingu v Zóně 1 a/nebo převládá-li vaše přítomnost","tr":"consumption in roaming in Zone 1 predominates, and/or your presence predominates","url":"https://napoveda.gomobil.cz/tema/roaming-volani-v-zahranici/roaming-tarify-pausalni-sluzby/kolik-stoji-volani-v-roamingu","site":"napoveda.gomobil.cz"},{"lang":"Czech","quote":"převládá spotřeba v roamingu v Zóně 1 a/nebo převládá-li vaše přítomnost","tr":"consumption in roaming in Zone 1 predominates, and/or your presence predominates","url":"https://napoveda.gomobil.cz/download.php?hash=1899dd857f3a4252dab1558457a8cdd14c733114ae9ba5552db4de59a712f068.pdf&open=1","site":"napoveda.gomobil.cz · PDF"}]},"roaming-lebara-help-presence":{"id":"roaming-lebara-help-presence","area":"roaming","topic":"fairuse","pub":"Lebara Germany","src":"","claim":"presents a longer stay as a surcharge trigger in help; its linked pricebook states the cumulative test correctly.","quote":"If you have spent less than 50% of the time in Germany in the last four months","lang":"English","tr":"","law":"","sourceUrl":"https://www.lebara.de/de/hilfe/roaming.html","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"An active eligible German user spends 60% of relevant days abroad over four months but 70% of relevant consumption in Germany, with no other abuse indicator. Domestic consumption protects that user under the ordinary test. The help item describes the long stay as a charging condition.","context":"This goes beyond merely missing detail: an express charging-condition list supplies a presence-only condition. The two-week warning is present. Item 1 gives current 2026 data figures. Both expanded legal notices concern HELLO!Travel packages and link the price hub. Crucially, the linked September prepaid PDF correctly requires cumulative presence AND consumption. The finding is inconsistent help guidance, not proof of the policy actually enforced.","scope":"Eligible German-home Lebara customers using default regulated terrestrial roaming, with otherwise valid residence/stable links and no separate abuse ground. The statement does not establish how Lebara bills such customers, and commercial UK coverage is separate.","date":"2026-10-17","langs":["German","English"],"countries":["DE"],"versions":[{"lang":"German","quote":"Wenn du in den letzten vier Monaten weniger als 50 % der Zeit in Deutschland warst","tr":"If you have spent less than 50% of the time in Germany in the last four months","url":"https://www.lebara.de/de/hilfe/roaming.html","site":"lebara.de/de"},{"lang":"English","quote":"If you have spent less than 50% of the time in Germany in the last four months","tr":"","url":"https://www.lebara.de/en/hilfe/roaming.html","site":"lebara.de/en"}]},"roaming-elisa-traffic-alone":{"id":"roaming-elisa-traffic-alone","area":"roaming","topic":"fairuse","pub":"Elisa","src":"","claim":"calls high roaming use alone misuse.","quote":"and situations in which more than 50 per cent of subscription traffic takes place in EU/EEA countries","lang":"English","tr":"","law":"","sourceUrl":"https://elisa.fi/attachment/content/Elisan-matkaviestinpalveluiden-erityisehdot.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"A Finnish resident logs into the domestic network on most days across four months but uses most data during several trips. Assuming no separate misuse ground, traffic alone cannot defeat the domestic-presence safe harbour.","context":"Read the full EU/EEA paragraph, four-month wording, 14-day notice, written-reasons alternative, agreement hierarchy and service-specific exceptions. Separate SIM inactivity, organised resale and sequential-SIM grounds must be assessed independently. Current Finnish prepaid terms repeat the pattern; they are retained as related context rather than another published case.","scope":"Elisa Oyj Finnish mobile subscriptions governed by these consumer-portfolio conditions, including business users where those conditions apply, during default regulated terrestrial EU/EEA roaming. Not a finding about permanent-roaming entitlement or a selected alternative tariff.","date":"2026-10-17","langs":["Finnish","Swedish","English"],"countries":["FI"],"versions":[{"lang":"Finnish","quote":"tai tilanteet, joissa yli 50 % liittymän liikenteestä tapahtuu EU/ ETA-maissa","tr":"or situations in which more than 50% of the subscription’s traffic takes place in EU/EEA countries","url":"https://elisa.fi/attachment/content/Elisan-matkaviestinpalveluiden-erityisehdot.pdf","site":"elisa.fi · PDF"},{"lang":"Swedish","quote":"eller situationer där över 50 % av abonnemangets trafik","tr":"or situations in which more than 50% of the subscription’s traffic","url":"https://elisa.fi/attachment/content/Elisan-matkaviestinpalveluiden-erityisehdot-sv.pdf","site":"elisa.fi · PDF"},{"lang":"English","quote":"and situations in which more than 50 per cent of subscription traffic takes place in EU/EEA countries","tr":"","url":"https://elisa.fi/attachment/content/Elisan-matkaviestinpalveluiden-erityisehdot-en.pdf","site":"elisa.fi · PDF"}]},"roaming-tim-business-traffic-alone":{"id":"roaming-tim-business-traffic-alone","area":"roaming","topic":"fairuse","pub":"TIM Business","src":"","claim":"allows a surcharge when roaming use alone exceeds home use.","quote":"superiore al traffico nazionale per quattro mesi consecutivi","lang":"Italian","tr":"greater than domestic traffic for four consecutive months","law":"","sourceUrl":"https://timbusiness.tim.it/mobile/estero/roaming-europa","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: in each of four months a worker spends most days in Italy but generates most mobile traffic during short EU trips. Higher roaming traffic alone does not overcome the domestic-presence safe harbour.","context":"The full page presents domestic-plan use in the EU before separate optional weekly/monthly unlimited-Europe add-ons. The footnote is an express surcharge condition, beyond merely omitting a test. Current June 2026 Multibusiness terms and linked base-service annexes were checked; no correcting presence condition was found. This is one guidance finding, without asserting every individual contract follows it. The consecutive-month formulation and obsolete regulation number alone are not findings.","scope":"Otherwise eligible Italian TIM Business users on default regulated terrestrial roaming in another EU state, with prevailing domestic presence, no separate abuse indicator and domestic benefits remaining. Extra Switzerland/UK coverage is a commercial promise outside this comparison.","date":"2026-10-17","langs":["Italian"],"countries":["IT"],"versions":[{"lang":"Italian","quote":"superiore al traffico nazionale per quattro mesi consecutivi","tr":"greater than domestic traffic for four consecutive months","url":"https://timbusiness.tim.it/mobile/estero/roaming-europa","site":"timbusiness.tim.it"}]},"roaming-vodafone-it-both-domestic":{"id":"roaming-vodafone-it-both-domestic","area":"roaming","topic":"fairuse","pub":"Vodafone Italy","src":"","claim":"requires both mostly home presence and low roaming use.","quote":"Avere una presenza sul territorio nazionale prevalente rispetto a quella in Europa e un traffico roaming effettuato inferiore al 50%","lang":"Italian","tr":"Have prevailing presence in the national territory compared with Europe AND roaming traffic below 50%.","law":"","sourceUrl":"https://www.vodafone.it/privati/area-supporto/pagamenti-controllo-costi/controllo-costi-traffico/chiamare-navigare-estero.html","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: over the monitoring period an eligible user spends most days in Italy but uses most mobile data during short EU trips, within the roaming data allowance. Domestic presence is sufficient for this ordinary control; the page demands low roaming use as well.","context":"The complete FAQ separates a lawful open-data-bundle limit from ordinary monitoring and specifies at least four months. The June 2026 consumer mobile contract, Article 8, was also read and visually checked: it points back to roaming details and does not supply the missing domestic-presence alternative. Business contract wording and old tariffs were not substituted for this consumer guidance.","scope":"Otherwise eligible Italian home consumers on default regulated terrestrial EU roaming, with domestic presence prevailing and no separate abuse indicator. An exhausted data-FUP allowance is a distinct lawful charging ground; it is not the hypothetical here.","date":"2026-10-17","langs":["Italian"],"countries":["IT"],"versions":[{"lang":"Italian","quote":"Avere una presenza sul territorio nazionale prevalente rispetto a quella in Europa e un traffico roaming effettuato inferiore al 50%","tr":"Have prevailing presence in the national territory compared with Europe AND roaming traffic below 50%.","url":"https://www.vodafone.it/privati/area-supporto/pagamenti-controllo-costi/controllo-costi-traffico/chiamare-navigare-estero.html","site":"vodafone.it"}]},"roaming-proximus-alert-and":{"id":"roaming-proximus-alert-and","area":"roaming","topic":"fairuse","pub":"Proximus business contracts","src":"","claim":"demands both domestic presence and use after a warning in the specified business-contract terms.","quote":"provide evidence to Proximus of his actual domestic presence and consumption.","lang":"English","tr":"","law":"","sourceUrl":"https://www.proximus.be/dam/jcr%3A00ae60c3-6259-40a5-91f5-b5f9608f07c1/cdn/sites/iportal/documents/pdfs/common/PDFS-of-Terms-and-conditions/20260407-mobile-connectivity-csd-en~2026-04-02-07-24-08~cache.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"After a justified alert, a covered business user returns to Belgium for the response period, registers on the domestic network each day, and makes no calls, SMS or mobile-data use. This demonstrates actual domestic presence without domestic consumption. The law accepts the presence change; the quoted response instruction asks for both.","context":"The initial four-month test correctly combines roaming presence and consumption; this is not the finding. The clause also says surcharging ends when the risk ceases. Reviewers initially disagreed about whether that surrounding context cured the response instruction; after rereading the explicit AND followed by Otherwise, both agreed on this narrow mismatch. Separate volume rules in 5.6.7 were not conflated.","scope":"The 7 April 2026 Mobile Connectivity CSD for companies with at least ten employees and contracts concluded from that date. Business roaming users are covered by these rules too. This is not a finding about Proximus consumer contracts, actual enforcement, or an extra mandatory four-month wait.","date":"2026-10-17","langs":["English","French","Dutch"],"countries":["BE"],"versions":[{"lang":"English","quote":"provide evidence to Proximus of his actual domestic presence and consumption.","tr":"","url":"https://www.proximus.be/dam/jcr%3A00ae60c3-6259-40a5-91f5-b5f9608f07c1/cdn/sites/iportal/documents/pdfs/common/PDFS-of-Terms-and-conditions/20260407-mobile-connectivity-csd-en~2026-04-02-07-24-08~cache.pdf","site":"proximus.be · PDF"},{"lang":"French","quote":"la preuve de sa présence et de sa consommation nationale réelle.","tr":"proof of their actual domestic presence and consumption.","url":"https://www.proximus.be/dam/jcr%3A55b1ab98-c2eb-42ce-bbdf-c3104d37df8f/cdn/sites/iportal/documents/pdfs/common/PDFS-of-Terms-and-conditions/20260407-mobile-connectivity-csd-fr~2026-04-02-07-24-32~cache.pdf","site":"proximus.be · PDF"},{"lang":"Dutch","quote":"bewijs te leveren van zijn werkelijke aanwezigheid en verbruik thuis.","tr":"provide proof of their actual presence and consumption at home.","url":"https://www.proximus.be/dam/jcr%3A3bc8eb0d-68df-4673-9e3f-6b9f4cbb75e3/cdn/sites/iportal/documents/pdfs/common/PDFS-of-Terms-and-conditions/20260407-mobile-connectivity-csd-nl~2026-04-02-07-24-59~cache.pdf","site":"proximus.be · PDF"}]},"roaming-yoigo-warning-cessation-and":{"id":"roaming-yoigo-warning-cessation-and","area":"roaming","topic":"fairuse","pub":"Yoigo","src":"","claim":"requires both home presence and home use to end a warning.","quote":"deberás haber tenido una presencia y consumo mayor en España que en roaming EEE","lang":"Spanish","tr":"you must have had greater presence and consumption in Spain than in EEA roaming","law":"","sourceUrl":"https://www.yoigo.com/ayuda/limitaciones-del-uso-del-roaming-en-el-espacio-economico-europeo","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: after a justified alert, an eligible user returns to Spain for the response period, registers domestically each day, and makes no calls, SMS or data use. The presence change is sufficient under the law; the help asks for both domestic indicators.","context":"The initial four-month cumulative test is correct. The actual three-page policy linked by this FAQ correctly allows surcharging only while foreign presence AND use remain predominant. Spanish and Catalan general contracts expressly accept presence OR consumption as response evidence. These qualifications limit the finding to the contradictory help instruction, without asserting an invalid tariff or actual enforcement. A possible monthly review delay was withheld as ambiguous.","scope":"Otherwise eligible Spanish Yoigo home customers on default regulated terrestrial EU roaming, responding to an ordinary presence/usage alert, with no separate SIM-misuse indicator. The cessation issue concerns that ordinary risk, not exhaustion of a data volume allowance.","date":"2026-10-17","langs":["Spanish"],"countries":["ES"],"versions":[{"lang":"Spanish","quote":"deberás haber tenido una presencia y consumo mayor en España que en roaming EEE","tr":"you must have had greater presence and consumption in Spain than in EEA roaming","url":"https://www.yoigo.com/ayuda/limitaciones-del-uso-del-roaming-en-el-espacio-economico-europeo","site":"yoigo.com"}]},"roaming-orange-es-warning-and":{"id":"roaming-orange-es-warning-and","area":"roaming","topic":"fairuse","pub":"Orange Spain business help","src":"","claim":"requires both domestic presence and use during a warning in business help.","quote":"Durante este periodo, deberás volver a tener un uso y presencia mayor en España que en Roaming.","lang":"Spanish","tr":"During this period, you must again have greater use and presence in Spain than in roaming.","law":"","sourceUrl":"https://ayuda.orange.es/empresas/movil/roaming-internacional/2521-limitaciones-del-uso-del-roaming-en-la-zona-ue-union-europea","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: a warned eligible business user resumes actual Spanish network presence during the response period without generating domestic traffic. Domestic presence alone can demonstrate a qualifying change; this instruction demands greater use as well.","context":"The initial four-month test correctly combines foreign use and presence. The actual linked complete policy, a 2023 Spanish document, says to change use patterns within 14 days and stop surcharging when abusive use ends; it does not specifically correct the FAQ to OR. Current common terms also refer generally to the European maximum. The finding concerns this warning instruction, not the initial test or proof of actual charges.","scope":"Orange Spanish home business users using default regulated terrestrial roaming in another EU state, responding to the ordinary presence/usage alert and without a separate abuse indicator. A contract-specific lawful qualification may determine an individual account.","date":"2026-10-17","langs":["Spanish"],"countries":["ES"],"versions":[{"lang":"Spanish","quote":"Durante este periodo, deberás volver a tener un uso y presencia mayor en España que en Roaming.","tr":"During this period, you must again have greater use and presence in Spain than in roaming.","url":"https://ayuda.orange.es/empresas/movil/roaming-internacional/2521-limitaciones-del-uso-del-roaming-en-la-zona-ue-union-europea","site":"ayuda.orange.es"}]},"roaming-vodafone-es-warning-and":{"id":"roaming-vodafone-es-warning-and","area":"roaming","topic":"fairuse","pub":"Vodafone Spain","src":"","claim":"requires both home presence and home use during a warning.","quote":"hacer prevalecer su consumo y estancia en España frente a su consumo y estancia en los países citados","lang":"Spanish","tr":"make their consumption and stay in Spain predominate over their consumption and stay in the countries mentioned.","law":"","sourceUrl":"https://www.vodafone.es/c/particulares/es/productos-y-servicios/movil/roaming/","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: a warned user resumes actual Spanish network presence during the response period without generating domestic traffic. The changed presence can satisfy the statutory response; this instruction also requires predominant domestic consumption.","context":"The initial four-month test correctly combines foreign consumption and stay. The actual legal link repeats the response instruction in its current Zone 1 section. It also correctly publishes the 2026 data surcharge and distinguishes commercial extra-country promotions from regulated EU/EEA coverage. General fraud/SIM-misuse provisions do not qualify the ordinary response condition.","scope":"Otherwise eligible Spanish Vodafone home users responding to an ordinary alert on default regulated terrestrial EU roaming, with no separate misuse indicator. Voluntary Switzerland, US and other promotional coverage was not used to define the statutory benchmark.","date":"2026-10-17","langs":["Spanish"],"countries":["ES"],"versions":[{"lang":"Spanish","quote":"hacer prevalecer su consumo y estancia en España frente a su consumo y estancia en los países citados","tr":"make their consumption and stay in Spain predominate over their consumption and stay in the countries mentioned.","url":"https://www.vodafone.es/c/particulares/es/productos-y-servicios/movil/roaming/","site":"vodafone.es"}]},"roaming-go-voice-surcharge":{"id":"roaming-go-voice-surcharge","area":"roaming","topic":"surcharges","pub":"GO","src":"","claim":"publishes a €0.19-per-minute surcharge, ten times the net cap.","quote":"€0.19 as from 01/01/2025","lang":"English","tr":"","law":"","sourceUrl":"https://www.go.com.mt/terms-and-conditions/mobile-terms-and-conditions/","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"If a permitted fair-use surcharge applies to 100 minutes of covered outgoing calls, the maximum surcharge is €1.90 excluding VAT. The printed figure would imply €19. Any lawful domestic charge is separate. This is arithmetic, not an observed bill.","context":"The surrounding warning and abuse clauses were read. SMS and data are separate rows. The HTML and PDF differ on data dates/rates; their call figure matches. Specific tariff terms take precedence, and ordinary tariff call prices are separate from this abuse surcharge. No applicable alternative-tariff selection or sustainability authorisation was identified for the statement.","scope":"Regulated outgoing terrestrial roaming calls by GO home customers where a fair-use surcharge is otherwise permitted. Specific contracts and any valid NRA authorisation must be checked before calculating a real bill. This finding concerns the stated surcharge only.","date":"2026-10-17","langs":["English"],"countries":["MT"],"versions":[{"lang":"English","quote":"€0.19 as from 01/01/2025","tr":"","url":"https://www.go.com.mt/terms-and-conditions/mobile-terms-and-conditions/","site":"go.com.mt"},{"lang":"English","quote":"€0.19 as from 01/01/2025","tr":"","url":"https://prodcms.go.com.mt/wp-content/uploads/2025/06/Mobile_Product_General_0_TC-sf.pdf","site":"prodcms.go.com.mt · PDF"}]},"roaming-vodafone-cu-gr-fup-maxima":{"id":"roaming-vodafone-cu-gr-fup-maxima","area":"roaming","topic":"surcharges","pub":"Vodafone CU Greece","src":"","claim":"lists old, higher maximum surcharges.","quote":"€0,0397/λεπτό για εξερχόμενες κλήσεις, €0,0124/sms για αποστολή sms, €0,0093/ΜΒ για χρήση internet, €0,0134/λεπτό για εισερχόμενες κλήσεις.","lang":"Greek","tr":"€0.0397/minute for outgoing calls, €0.0124/SMS for sending SMS, €0.0093/MB for internet use, €0.0134/minute for incoming calls.","law":"","sourceUrl":"https://www.vodafonecu.gr/eksipiretisi-pelatwn/roaming/","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: an eligible CU customer with remaining domestic included minutes is lawfully subject to a fair-use surcharge while making an ordinary call in another EU state. The page permits €0.0397 extra per minute, above the €0.02356 gross benchmark.","context":"The full surrounding passage distinguishes domestic out-of-bundle prices from these additional maxima and includes an exception where domestic charges already exceed stated combined-price thresholds. That exception does not cure the extra maxima for customers retaining domestic included units. Normal free incoming calls/SMS are correctly described elsewhere. The current June-effective package list does not supply a correcting FUP-rate passage; no actual tariff enforcement is inferred.","scope":"Greek-home CU/prepaid customers to whom this help applies, for regulated terrestrial roaming in an EU state and covered calls/SMS/data. High non-EU, premium, satellite or ordinary domestic out-of-bundle prices are not being compared to these surcharge ceilings.","date":"2026-10-17","langs":["Greek"],"countries":["GR"],"versions":[{"lang":"Greek","quote":"€0,0397/λεπτό για εξερχόμενες κλήσεις, €0,0124/sms για αποστολή sms, €0,0093/ΜΒ για χρήση internet, €0,0134/λεπτό για εισερχόμενες κλήσεις.","tr":"€0.0397/minute for outgoing calls, €0.0124/SMS for sending SMS, €0.0093/MB for internet use, €0.0134/minute for incoming calls.","url":"https://www.vodafonecu.gr/eksipiretisi-pelatwn/roaming/","site":"vodafonecu.gr"}]},"roaming-telia-sweden-surcharges":{"id":"roaming-telia-sweden-surcharges","area":"roaming","topic":"surcharges","pub":"Telia Sweden","src":"","claim":"lists call and data surcharges above the caps.","quote":"Samtal 0,30 kr/min","lang":"Swedish","tr":"Calls: SEK 0.30 per minute","law":"","sourceUrl":"https://www.telia.se/roaming/eu","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"After a lawful FUP warning process, a Swedish customer with remaining domestic allowances is subject to a regulated surcharge. The FAQ should not tell that customer that ordinary EU rules permit SEK 0.30 per outgoing minute.","context":"The complete EU FAQ correctly gives cumulative four-month presence AND consumption before these surcharge figures. The main roaming page links to it; a /roaming/sverige copy repeats the table and is grouped. Current mobile terms and current 6 October 2026 consumer tariff were also checked; they concern bundle volumes and separately ordered data, and do not identify these figures as a chosen alternative tariff or authorised sustainability rate. No relevant authorisation was located in the bounded PTS search. This finding is confined to the explicit ordinary FUP table.","scope":"Telia Sverige AB subscribers reading the standard EU/EEA roaming FAQ, for regulated terrestrial outgoing calls, sent SMS and data after a valid fair-use surcharge trigger, at the applicable Swedish VAT treatment. Excludes MMS, premium content, non-terrestrial networks and independently agreed alternative products.","date":"2026-10-17","langs":["Swedish"],"countries":["SE"],"versions":[{"lang":"Swedish","quote":"Samtal 0,30 kr/min","tr":"Calls: SEK 0.30 per minute","url":"https://www.telia.se/roaming/eu","site":"telia.se"}]},"roaming-sfr-incoming-cap":{"id":"roaming-sfr-incoming-cap","area":"roaming","topic":"surcharges","pub":"SFR","src":"","claim":"publishes a €0.005-per-minute incoming-call surcharge.","quote":"APPELS RECUS : 0,005 € TTC/min","lang":"French","tr":"INCOMING CALLS: €0.005 per minute including tax.","law":"","sourceUrl":"https://static.s-sfr.fr/media/p-se-0000000900_guidevoyage.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: after a justified ordinary fair-use warning, a covered customer receives one minute of calls in Germany. The quoted table indicates €0.005, while the corresponding capped surcharge with 20% VAT is €0.0024.","context":"The complete passage correctly uses the initial four-month presence-and-consumption test, a 15-day warning, and separate reasonable-use qualifications. Other listed outgoing-call, SMS and data rates were checked. The quoted incoming figure is expressly a fair-use surcharge; ordinary non-EU tariffs and international calls from France were kept separate. No correcting current tariff or applicable authorised derogation was located.","scope":"SFR metropolitan French home customers receiving calls while on default regulated terrestrial roaming in another EU state, assuming a valid fair-use ground and applicable French VAT. This does not assess every SFR plan, premium services or non-terrestrial prices.","date":"2026-10-17","langs":["French"],"countries":["FR"],"versions":[{"lang":"French","quote":"APPELS RECUS : 0,005 € TTC/min","tr":"INCOMING CALLS: €0.005 per minute including tax.","url":"https://static.s-sfr.fr/media/p-se-0000000900_guidevoyage.pdf","site":"static.s-sfr.fr · PDF"},{"lang":"French","quote":"APPELS REÇUS 0,005€ TTC/min","tr":"INCOMING CALLS: €0.005 per minute including tax.","url":"https://static.s-sfr.fr/media/tarifs/s22026/sfr-bt-06102026.pdf","site":"static.s-sfr.fr · PDF"}]},"roaming-iliad-incoming-cap":{"id":"roaming-iliad-incoming-cap","area":"roaming","topic":"surcharges","pub":"Iliad Italy","src":"","claim":"publishes a €0.00671-per-minute incoming-call surcharge.","quote":"0,00671€","lang":"Italian","tr":"€0.00671","law":"","sourceUrl":"https://www.iliad.it/docs/prezzi/prezzi-giga250-1199_dal_30_06_2026.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: following a lawful fair-use process, a covered user receives one minute of calls in France. The selected column indicates €0.00671; the net €0.002 cap with 22% VAT is €0.00244.","context":"The full table and preceding qualifications were checked. The ordinary initial presence-and-usage test is cumulative, and other outgoing-call, sent-SMS and data amounts reflect current caps. The Extra Roaming column applies to base-rate SIMs and is distinct. No finding is made about the ambiguous MB/100MB billing column, ordinary domestic rates, or actual charges.","scope":"Italian GIGA 250 home users receiving regulated terrestrial EU roaming calls when a valid fair-use surcharge may lawfully apply. Separate premium/satellite destinations, deliberately selected alternative pricing and unrelated tariffs are excluded.","date":"2026-10-17","langs":["Italian"],"countries":["IT"],"versions":[{"lang":"Italian","quote":"0,00671€","tr":"€0.00671","url":"https://www.iliad.it/docs/prezzi/prezzi-giga250-1199_dal_30_06_2026.pdf","site":"iliad.it · PDF"}]},"roaming-vodafone-pt-net-label":{"id":"roaming-vodafone-pt-net-label","area":"roaming","topic":"surcharges","pub":"Vodafone Portugal","src":"","claim":"labels its published €1.35-per-GB surcharge as excluding VAT.","quote":"(sem IVA)","lang":"Portuguese","tr":"(excluding VAT)","law":"","sourceUrl":"https://www.vodafone.pt/telemoveis/roaming/detalhes.html","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: after valid fair-use surcharging begins, a covered customer sends one ordinary SMS while roaming in another EU state. The page quotes €0.004 before VAT; the applicable net ceiling is €0.003.","context":"The initial four-month test correctly requires both roaming presence and use. The same page distinguishes an optional €9 alternative roaming tariff. A current 2026 help answer correctly explains its displayed 1024MB GB versus the regulated 1000MB denominator, and other pages give amounts without the no-VAT label. Those are material qualifications; binary conversion and small gross rounding are not separate findings. The outgoing-call figure is below its ceiling and excluded.","scope":"Vodafone Portuguese home customers on the default regulated terrestrial EU roaming tariff after a valid ordinary fair-use ground. The finding concerns the express net label and rates; deliberately selected alternative tariffs, non-EU passes and actual invoices are not assessed.","date":"2026-10-17","langs":["Portuguese"],"countries":["PT"],"versions":[{"lang":"Portuguese","quote":"(sem IVA)","tr":"(excluding VAT)","url":"https://www.vodafone.pt/telemoveis/roaming/detalhes.html","site":"vodafone.pt"},{"lang":"Portuguese","quote":"€1,35/GB","tr":"€1.35/GB","url":"https://www.vodafone.pt/telemoveis/roaming/detalhes.html","site":"vodafone.pt"},{"lang":"Portuguese","quote":"€0,004 por SMS enviado.","tr":"€0.004 per SMS sent.","url":"https://www.vodafone.pt/telemoveis/roaming/detalhes.html","site":"vodafone.pt"}]},"roaming-orange-es-current-gross-data":{"id":"roaming-orange-es-current-gross-data","area":"roaming","topic":"surcharges","pub":"Orange Spain","src":"","claim":"gives a price with VAT that is above the cap.","quote":"1,1€ por 1GB (1,57€ IVA incluido)","lang":"Spanish","tr":"€1.10 per 1GB (€1.57 including VAT).","law":"","sourceUrl":"https://www.orange.es/legal/particulares/2025/uso-razonable-del-roaming-es-20251210.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: an eligible mainland Spanish consumer incurs one GB of regulated data surcharge in 2026. The policy gives €1.57 including tax alongside the net ceiling; €1.10 plus 21% VAT equals €1.331.","context":"The full policy says the surcharge cannot exceed the European wholesale maximum and explicitly identifies its figures as applying from 1 January 2026. Its outgoing-call and SMS amounts and initial fair-use test were examined. The correct net amount is material counter-evidence; the finding is the contradictory gross figure, with no evidence that Orange actually invoices it. A separate business policy dated September 2025 was withheld because current tariff priority and cohort were unresolved.","scope":"The current Spanish consumer policy, for otherwise lawful regulated terrestrial EU roaming surcharges. The numerical gross comparison uses mainland/Balearic 21% VAT; other Spanish regional tax treatments require their own calculation and do not explain this pair.","date":"2026-10-17","langs":["Spanish"],"countries":["ES"],"versions":[{"lang":"Spanish","quote":"1,1€ por 1GB (1,57€ IVA incluido)","tr":"€1.10 per 1GB (€1.57 including VAT).","url":"https://www.orange.es/legal/particulares/2025/uso-razonable-del-roaming-es-20251210.pdf","site":"orange.es · PDF"}]},"roaming-tesco-domestic-rate-for-fup":{"id":"roaming-tesco-domestic-rate-for-fup","area":"roaming","topic":"surcharges","pub":"Tesco Mobile Ireland","src":"","claim":"tells customers standard out-of-bundle rates apply after a fair-use breach, despite correct rates elsewhere.","quote":"standard out of bundle rates will apply to usage beyond the FUP","lang":"English","tr":"","law":"","sourceUrl":"https://www.tescomobile.ie/terms-and-conditions/general-terms-conditions/general-terms-conditions-for-customers","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"A prepaid bundle still has domestic minutes after a valid permanent-roaming FUP process. The fact that roaming has breached fair use does not by itself permit replacing included minutes with the standard 45c/min plus 12c set-up instruction.","context":"Read clauses 3.10.1–3.10.6, domestic/off-net definition, residency proof alternatives, four-month cumulative trigger, complaint clause, and the linked prepaid/bill-pay examples. The FAQ expressly separates excess FUP within remaining domestic data from actual domestic exhaustion. That correct distinction is retained. An old generic formula is immediately qualified by dated 2025/2026 examples and is not another finding. “Charged per MB” is retained as a separate unresolved wording lead, not assumed to prove rounding.","scope":"Tesco Mobile Ireland Ltd customers on default regulated roaming who have remaining relevant domestic allowances and a roaming-only FUP restriction. The prepaid figures illustrate the instruction’s consequence for those plans. No criticism of charging the same domestic rate after a real domestic allowance runs out, or a genuine per-unit credit tariff.","date":"2026-10-17","langs":["English"],"countries":["IE"],"versions":[{"lang":"English","quote":"standard out of bundle rates will apply to usage beyond the FUP","tr":"","url":"https://www.tescomobile.ie/terms-and-conditions/general-terms-conditions/general-terms-conditions-for-customers","site":"tescomobile.ie"},{"lang":"English","quote":"at your Plan's standard out of bundle rate","tr":"","url":"https://www.tescomobile.ie/eu-roaming-regulation","site":"tescomobile.ie"},{"lang":"English","quote":"outside of your allowance or in excess of fair usage policy","tr":"","url":"https://www.tescomobile.ie/prepayroam","site":"tescomobile.ie"}]},"roaming-gomo-cy-fup-surcharge-maxima":{"id":"roaming-gomo-cy-fup-surcharge-maxima","area":"roaming","topic":"surcharges","pub":"GoMo Cyprus","src":"","claim":"lists old, higher maximum surcharges.","quote":"€0.02618 per minute; €0.00476 per SMS; €0.0018 per MB of data","lang":"English","tr":"","law":"","sourceUrl":"https://gomo.cy/en/pricing/","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/TXT/?qid=1698297876532&uri=CELEX%3A32022R0612","example":"An eligible GoMo Cyprus customer has lawfully exceeded a fair-use limit while periodically roaming in another EU state. The three published outgoing-call, SMS and data surcharges exceed the applicable maximum even if the displayed rates include Cyprus standard VAT. No actual bill was examined.","context":"The initial four-month trigger correctly uses both presence and consumption. Separate non-EU charges are expressly separated. Prices do not clearly label VAT at these three bullets; comparing with the more generous gross ceiling establishes the mismatch either way. Other 14GB floor and 60-second rounding leads are distinct.","scope":"Regulated outgoing calls, SMS and data in EU/EEA under the default RLAH service after a valid fair-use excess; exclude non-EU rates, premium services and alternative tariffs deliberately selected by a customer.","date":"2026-10-17","langs":["English"],"countries":["CY"],"versions":[{"lang":"English","quote":"€0.02618 per minute; €0.00476 per SMS; €0.0018 per MB of data","tr":"","url":"https://gomo.cy/en/pricing/","site":"gomo.cy/en"}]},"roaming-melita-blanket-allowance-exclusion":{"id":"roaming-melita-blanket-allowance-exclusion","area":"roaming","topic":"allowance","pub":"Melita","src":"","claim":"says your free allowances do not apply abroad.","quote":"your mobile plan’s free allowances won’t apply.","lang":"English","tr":"","law":"","sourceUrl":"https://www.melita.com/help/billing-and-payments/my-bill-is-higher-than-i-expected/have-you-been-abroad/","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: an eligible Endless Data & Voice customer travelling in France calls an ordinary Maltese number within the included benefit. The current plan preserves the allowance, contrary to the billing help’s broad explanation.","context":"The directly linked main roaming page is correct. Current Conditions of Service6.2 expressly deduct monthly allowances for eligible RLAH and explain off-net treatment;6.5–6.6 give correct ordinary FUP conditions. The current non-Legacy Endless Data & Voice plan, starting 29 July 2026, includes EU calls/SMS and a separate roaming data allowance. These material qualifications show a guidance inconsistency, not an invalid current tariff or proven loss.","scope":"Eligible Malta-home residential mobile customers on roaming-enabled default regulated plans in EU terrestrial networks. Domestic-only plans, exhausted allowances, valid FUP limits, premium services, nonregulated destinations and on-net-only benefits have separate treatment.","date":"2026-10-17","langs":["English"],"countries":["MT"],"versions":[{"lang":"English","quote":"your mobile plan’s free allowances won’t apply.","tr":"","url":"https://www.melita.com/help/billing-and-payments/my-bill-is-higher-than-i-expected/have-you-been-abroad/","site":"melita.com"}]},"roaming-telia-sweden-50gb-floor":{"id":"roaming-telia-sweden-50gb-floor","area":"roaming","topic":"allowance","pub":"Telia Sweden","src":"","claim":"lists 50 GB for the standard SEK 499 unlimited plan, below its roughly 67.83 GB floor; current help instead says 100 GB.","quote":"men som mest 50 GB/månad.","lang":"Swedish","tr":"but at most 50 GB per month.","law":"","sourceUrl":"https://www.telia.se/asset/f7751ee0-c6ad-42e6-8028-c41e5cf9fea9/TSP-4667_19_2609-Prislista-Telia-Mobil_B2C.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"A customer pays the standard SEK 499 price for this unlimited mobile-only plan and travels periodically in the EU. Assuming no separate abuse ground, the standard-price data minimum is about 67.83 GB for the billing period; a 50 GB statutory FUP maximum would be too low.","context":"Checked the complete current two-page tariff, its current-versus-historical hub, footnotes 8–10 and 13, and the related mobile terms. The selected standalone unlimited column has an ordinary SEK 499 charge; higher streaming bundles, youth discounts, extra-user prices and campaign prices are excluded from this calculation. Footnote 9 describes separately ordered data after the EU limit. That product’s consent/alternative-tariff treatment is not resolved as a further price finding.","scope":"Telia Sverige AB consumers paying the standard undiscounted SEK 499 Mobil Obegränsad monthly mobile-only price, with default regulated terrestrial roaming and no independently valid abuse restriction. Recalculate for an actual discount, campaign or different product. Excludes higher bundled entertainment plans and negotiated allocations.","date":"2026-10-17","langs":["Swedish"],"countries":["SE"],"versions":[{"lang":"Swedish","quote":"men som mest 50 GB/månad.","tr":"but at most 50 GB per month.","url":"https://www.telia.se/asset/f7751ee0-c6ad-42e6-8028-c41e5cf9fea9/TSP-4667_19_2609-Prislista-Telia-Mobil_B2C.pdf","site":"telia.se · PDF"}]},"roaming-vodafone-ie-data-faq":{"id":"roaming-vodafone-ie-data-faq","area":"roaming","topic":"allowance","pub":"Vodafone Ireland","src":"","claim":"gives 30 GB in a 5G FAQ for an active €30 offer whose 2026 floor is about 44.35 GB; current offer terms are more generous.","quote":"fair usage policy of 30GB, and you will be charged at a rate of €0.002441 per MB thereafter.","lang":"English","tr":"","law":"","sourceUrl":"https://n.vodafone.ie/support/pay-as-you-go-hub/pay-as-you-go/top-up-offer-faqs.html","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"An eligible customer with the active €30 offer travels temporarily in France in 2026 and relies on the FAQ. It describes an earlier surcharge threshold and a higher price than the current right and current offer terms. No actual charge or loss is asserted.","context":"The currently linked Extra Unlimited offer terms and December 2025 price sheet correctly give 45GB and €0.0013211/MB. The data-cap help page agrees with those tariffs. These correct sources are essential counter-context: this case establishes a misleading help answer, not an unlawful operative tariff or actual billing. Old version metadata in the offer PDF was retained rather than hidden.","scope":"Eligible Irish-home customers with the active €30 Extra Unlimited 5G offer making periodic covered terrestrial roaming trips. Other prices, expired bundles, domestic allowance exhaustion, deliberate alternative tariffs, stable-link/abuse controls and any valid sustainability derogation need separate analysis.","date":"2026-10-17","langs":["English"],"countries":["IE"],"versions":[{"lang":"English","quote":"fair usage policy of 30GB, and you will be charged at a rate of €0.002441 per MB thereafter.","tr":"","url":"https://n.vodafone.ie/support/pay-as-you-go-hub/pay-as-you-go/top-up-offer-faqs.html","site":"n.vodafone.ie"}]},"roaming-lebara-current-examples":{"id":"roaming-lebara-current-examples","area":"roaming","topic":"allowance","pub":"Lebara Germany","src":"","claim":"calculates data limits with the old 2023 price.","quote":"(€ 10,00 dividiert durch € 1,80) = 5,56 GB","lang":"German","tr":"(EUR10.00 divided by EUR1.80) = 5.56GB","law":"","sourceUrl":"https://www.lebara.de/content/dam/lebara/markets/de/de/assets/2026/1_legal_files/agb/sept/updated/Lebara-Preisliste_Prepaid_Stand-16092026%201.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Assuming the document’s hypothetical €12 net open bundle has unlimited domestic data or at least 21.82GB, the current formula yields approximately 21.82GB for periodic covered roaming in 2026. The example says 13.3GB. This does not identify a real €12 plan or a real customer who received that limit.","context":"The adjoining general formulas and year schedule are correct, as is the 2026 surcharge table. That counter-context limits the conclusion to explicitly current worked examples. It does not establish the actual allowances applied to any named tariff. The €10 threshold is not free data: domestic retail charges, use of credit for calls/SMS and credit exhaustion still matter.","scope":"Readers of the current German prepaid price list using either its hypothetical true per-unit prepaid calculation or a qualifying open-bundle calculation. Actual service price, discounts, domestic allowance, eligibility, alternative tariffs and permitted abuse controls remain relevant.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"(€ 10,00 dividiert durch € 1,80) = 5,56 GB","tr":"(EUR10.00 divided by EUR1.80) = 5.56GB","url":"https://www.lebara.de/content/dam/lebara/markets/de/de/assets/2026/1_legal_files/agb/sept/updated/Lebara-Preisliste_Prepaid_Stand-16092026%201.pdf","site":"lebara.de · PDF"},{"lang":"German","quote":"(€ 12,00 dividiert durch € 1,80) x 2 = 13,3 GB","tr":"(EUR12.00 divided by EUR1.80) x 2 = 13.3GB","url":"https://www.lebara.de/content/dam/lebara/markets/de/de/assets/2026/1_legal_files/agb/sept/updated/Lebara-Preisliste_Prepaid_Stand-16092026%201.pdf","site":"lebara.de · PDF"}]},"roaming-gomo-cy-14gb-floor":{"id":"roaming-gomo-cy-14gb-floor","area":"roaming","topic":"allowance","pub":"GoMo Cyprus","src":"","claim":"gives only 14 GB abroad with its €9.99 unlimited plan.","quote":"Nominal per month: € 9.99","lang":"English","tr":"","law":"For this €9.99 full-month unlimited bundle, the 2026 open-data minimum is about 15.26 GB using 19% VAT and the €1.10/GB wholesale cap, subject to eligibility and separate fair-use grounds.","sourceUrl":"https://gomo.cy/wp-content/uploads/20261005_Contract-Summary-and-Pre-document-GoMo_En.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/oj","example":"An eligible subscriber pays the advertised 9.99 euro price for one full monthly period and uses 15.1 decimal GB while periodically roaming in the EU. Subject to the stated exclusions, this remains below the approximately 15.26 GB open-bundle floor, but exceeds the published 14 GB allowance under either decimal or binary reading.","context":"Monthly subscription with one-month minimum; unlimited domestic data continues at reduced speed after 100 GB. Separate out-of-bundle credit limit does not make it prepaid. Using 19% VAT is conservative: a net 9.99 euro price yields a higher floor. No corrective allowance found in linked generic terms.","scope":"Full month of the October 5–November 5, 2026 new-subscriber €9.99 subscription, periodically roaming in EU/EEA, no separately established permanent-roaming abuse or lawful sustainability derogation. Excludes pro-rata first/last billing periods, device/service bundles, and separately proven abuse. The binary/decimal unit conversion does not cure the shortfall.","date":"2026-10-17","langs":["English"],"countries":["CY"],"versions":[{"lang":"English","quote":"Nominal per month: € 9.99","tr":"","url":"https://gomo.cy/en/terms/","site":"gomo.cy/en"}]},"roaming-play-four-month-maximum":{"id":"roaming-play-four-month-maximum","area":"roaming","topic":"monitoring","pub":"Play","src":"","claim":"presents four months as the most time you can spend abroad.","quote":"ale nie dłużej niż 4 miesiące.","lang":"Polish","tr":"but no longer than four months.","law":"Four months is the minimum observation period for the ordinary presence-and-use test, not an automatic roaming expiry. Domestic predominance and separate abuse grounds still matter.","sourceUrl":"https://www.play.pl/play-expert/porady/roaming-ue---jak-korzystac-porady-dla-podroznych","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","example":"Hypothetical: an eligible regular traveller continues travelling across successive months but spends most relevant days registered in Poland. Under the ordinary test, continuing beyond four months does not remove the domestic-presence safe harbour.","context":"The full article links current roaming guidance and later repeats the duration message. A January 2026 GRUPA/SOLO tariff, physical p.9, correctly requires predominant foreign presence AND consumption over at least four months, plus a two-week warning. That is material counter-context, not proof that every Play tariff or actual billing follows the article. The article’s dated data-price estimate is not a separate 2026 rate finding.","scope":"Eligible Polish-home Play users on default regulated terrestrial roaming with no separate abuse ground. Neither an unconditional four-month allowance nor permanent roaming is promised.","date":"2026-10-17","langs":["Polish"],"countries":["PL"],"versions":[{"lang":"Polish","quote":"ale nie dłużej niż 4 miesiące.","tr":"but no longer than four months.","url":"https://www.play.pl/play-expert/porady/roaming-ue---jak-korzystac-porady-dla-podroznych","site":"play.pl"}]},"roaming-orange-sk-additional-notice":{"id":"roaming-orange-sk-additional-notice","area":"roaming","topic":"monitoring","pub":"Orange Slovensko","src":"","claim":"places the additional default-system data-spending notice above €102.50 excluding VAT.","quote":"viac ako 102,50 € bez DPH","lang":"Slovak","tr":"more than €102.50 excluding VAT","law":"For customers in the default-limit system, the additional notification is required above €100 excluding VAT in a monthly billing period; absent the required response, data must stop.","sourceUrl":"https://www.orange.sk/pomoc/volania-data-a-spravy/roaming-a-volania-do-zahranicia/datovy-roaming","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","example":"Hypothetical: a standard-system customer has authorised continuation beyond the first limit, then reaches €101 net in monitored data-roaming spend without authorising further continuation. The law’s additional notice/stop process is already relevant; the help’s quoted threshold has not yet been reached.","context":"The current tariff effective 7 October 2026, physical/printed p.50 note 3, correctly states a default €50 net (€61.50 gross) limit and optional chosen €102.50/€205/€512.50 gross limits, plus opt-out procedures. None corrects the help’s distinct €102.50 net additional threshold. No allegation is made that the default €50 protection is missing or that customers were actually charged.","scope":"Orange Slovensko customers who remain subject to the default financial/volume limit system, including after authorising initial continuation, and have not selected a different limit or opted out. This is not an unconditional €100 bill ceiling. Wider non-terrestrial/non-EU application has statutory qualifications.","date":"2026-10-17","langs":["Slovak"],"countries":["SK"],"versions":[{"lang":"Slovak","quote":"viac ako 102,50 € bez DPH","tr":"more than €102.50 excluding VAT","url":"https://www.orange.sk/pomoc/volania-data-a-spravy/roaming-a-volania-do-zahranicia/datovy-roaming","site":"orange.sk"}]},"package-exoticca-transfer":{"id":"package-exoticca-transfer","area":"package","topic":"transfer","pub":"Exoticca","src":"¿Puedo transferir mi viaje a otra persona?","claim":"says a trip can never be transferred once booked.","quote":"No, no puedes transferir tu viaje a otra persona una vez comprado.","lang":"Spanish","tr":"No, you cannot transfer your trip to another person once purchased.","law":"","sourceUrl":"https://help.exoticca.com/es/articles/eine-buchung-vornehmen/can-i-transfer-my-trip-to-someone-else/66c59e120903942305fb7c44","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","example":"An eligible traveller gives durable notice at least seven days before departure to transfer a qualifying package to a friend who meets its conditions, accepting reasonable actual transfer costs. The FAQ categorically says this cannot be done.","context":"Four languages share the same article ID. They are one repeated drafting family, not four independent errors. Non-English wording and translations were independently checked. No separate company copy of this specific sentence was established.","scope":"Effective dates: German and French package rules apply to contracts from 1 July 2018. Spain’s recast Article 157 applies from 28 December 2018. The EU implementation date was 1 July 2018; this does not backdate Spain’s enactment. Exceptions: Under the EU/German rule, seven days is always reasonable notice. Spain requires at least seven calendar days; France normally requires at least seven-day notice unless more favourable terms apply. A substitute failing the trip requirements may be rejected. Airline reissue can be expensive. This does not guarantee free name changes or a change of destination/date.","date":"2026-10-17","langs":["Spanish","German","French","English"],"countries":["ES","DE","FR"],"versions":[{"lang":"Spanish","quote":"No, no puedes transferir tu viaje a otra persona una vez comprado.","tr":"No, you cannot transfer your trip to another person once purchased.","url":"https://help.exoticca.com/es/articles/eine-buchung-vornehmen/can-i-transfer-my-trip-to-someone-else/66c59e120903942305fb7c44","site":"help.exoticca.com/es"},{"lang":"German","quote":"Nein, Sie können Ihre Reise nach der Buchung nicht auf jemand anderen übertragen.","tr":"No, you cannot transfer your trip to someone else after booking.","url":"https://help.exoticca.com/de/articles/eine-buchung-vornehmen/can-i-transfer-my-trip-to-someone-else/66c59e120903942305fb7c44","site":"help.exoticca.com/de"},{"lang":"French","quote":"Non, vous ne pouvez pas transférer votre voyage à quelqu'un d'autre une fois que vous l'avez acheté.","tr":"No, you cannot transfer your trip to someone else once you have bought it.","url":"https://help.exoticca.com/fr/articles/eine-buchung-vornehmen/can-i-transfer-my-trip-to-someone-else/66c59e120903942305fb7c44","site":"help.exoticca.com/fr"},{"lang":"English","quote":"No, you cannot transfer your trip to someone else once it's purchased.","tr":"","url":"https://help.exoticca.com/en/articles/eine-buchung-vornehmen/can-i-transfer-my-trip-to-someone-else/66c59e120903942305fb7c44","site":"help.exoticca.com/en"}]},"package-exoticca-refund":{"id":"package-exoticca-refund","area":"package","topic":"refund","pub":"Exoticca","src":"Bedingungen und Konditionen, §10","claim":"says non-refundable flight costs are deducted from organiser-cancellation refunds.","quote":"Die Kosten für nicht erstattungsfähige Flüge werden als Entschädigung abgezogen.","lang":"German","tr":"The costs of non-refundable flights are deducted as compensation.","law":"","sourceUrl":"https://www.exoticca.com/de/geschaftsbedingungen","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","example":"An organiser cancels a qualifying package for too few participants. The full refund includes the flight component, even if the airline’s ticket was non-refundable.","context":"Spanish §10.2 instead provides full repayment and credit only with express acceptance. This regional difference has no lawful German exception for non-refundable supplier airfares. General statutory safeguards in German §14 were checked.","scope":"Effective dates: BGB §§651h and 651y apply to contracts from 1 July 2018. CJEU C-407/21 (8 June 2023) confirms that the statutory refund is money; it did not decide this company’s clause. Exceptions: Appropriate fees can apply to an ordinary voluntary cancellation by the traveller. This finding concerns organiser cancellation, particularly the low-number/extraordinary-circumstance grounds in the surrounding passage. Damages have distinct exceptions. The terms do offer cash, so a voucher-only allegation would be inaccurate.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Die Kosten für nicht erstattungsfähige Flüge werden als Entschädigung abgezogen.","tr":"The costs of non-refundable flights are deducted as compensation.","url":"https://www.exoticca.com/de/geschaftsbedingungen","site":"exoticca.com/de"}]},"package-exoticca-minimum":{"id":"package-exoticca-minimum","area":"package","topic":"minimum","pub":"Exoticca","src":"Bedingungen und Konditionen, §10","claim":"states seven-day notice for the low-number compensation exemption without distinguishing longer trips.","quote":"mindestens 7 Tage vor dem geplanten Reisebeginn","lang":"German","tr":"at least 7 days before the planned start of the trip","law":"","sourceUrl":"https://www.exoticca.com/de/geschaftsbedingungen","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","example":"A ten-day tour is cancelled ten days before departure for low bookings. The organiser must refund it and cannot rely on the low-number exemption alone to defeat any additional compensation claim; an award still depends on the claim’s requirements.","context":"Found by following transfer guidance into related terms. Spain’s current terms refer to the statutory notice periods. This is a separate substantive mismatch from the refund deduction on the same page.","scope":"Effective dates: BGB §651h(4)(1), applicable to contracts from 1 July 2018; EU Article 12(3)(a). Exceptions: Seven days is appropriate for trips lasting two to six days; below two days the threshold is 48 hours. A separate exception covers unavoidable extraordinary circumstances preventing performance, with prompt notice before start. Low sales alone do not establish that exception. No fixed damages award is inferred.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"mindestens 7 Tage vor dem geplanten Reisebeginn","tr":"at least 7 days before the planned start of the trip","url":"https://www.exoticca.com/de/geschaftsbedingungen","site":"exoticca.com/de"}]},"package-gestravel-minimum":{"id":"package-gestravel-minimum","area":"package","topic":"minimum","pub":"Gestravel","src":"CIRCUITOS — PROGRAMACION 2026, §14","claim":"states 15-day notice for the low-number compensation exemption on trips longer than six days.","quote":"15 días antes del inicio en caso de viajes de más de 6 días de duración.","lang":"Spanish","tr":"15 days before the start for trips lasting more than 6 days.","law":"","sourceUrl":"https://drive.google.com/file/d/1L5Vw3HsTVv9zxGAw0LtwcM3rXlTpjEGR/view?usp=drive_link","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","example":"A ten-day tour is cancelled ten days before departure for low bookings. The organiser must refund it and cannot rely on the low-number exemption alone to defeat any additional compensation claim; an award still depends on the claim’s requirements.","context":"The verifier initially withheld this candidate because of the 2024 date. Independent inspection of the 2026 cover and full PDF pages 12–14 resolved that disagreement. The PDF and HTML are one recycled drafting occurrence. No correcting errata was located in examined navigation. Only Spanish was found.","scope":"Effective dates: Spanish Book IV reform effective 28 December 2018. Article 160(3)’s introductory wording was amended from 2 March 2022; the relevant 20-day threshold remains unchanged. Exceptions: The 7-day/48-hour periods for shorter trips are different. Unavoidable extraordinary circumstances are a separate cancellation ground. A late cancellation does not automatically establish the amount of any additional damages.","date":"2026-10-17","langs":["Spanish"],"countries":["ES"],"versions":[{"lang":"Spanish","quote":"15 días antes del inicio en caso de viajes de más de 6 días de duración.","tr":"15 days before the start for trips lasting more than 6 days.","url":"https://drive.google.com/file/d/1L5Vw3HsTVv9zxGAw0LtwcM3rXlTpjEGR/view?usp=drive_link","site":"drive.google.com · PDF"}]},"package-indigo-insolvency":{"id":"package-indigo-insolvency","area":"package","topic":"insolvency","pub":"Indigourlaub","src":"Allgemeine Reisebedingungen, C.1","claim":"says early or extra payments are not protected.","quote":"Darüberhinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen sind nicht abgesichert.","lang":"German","tr":"Deposits or balance payments exceeding those amounts or paid early are not protected.","law":"","sourceUrl":"https://www.indigourlaub.com/allgemeine-reisebedingungen/","lawUrl":"https://ris.bka.gv.at/eli/bgbl/ii/2018/260/P3/NOR40208189","example":"An Austrian organiser accepts an early payment for its own qualifying package. Required insolvency protection includes that accepted money even if accepting it breached the payment schedule.","context":"Full organiser/intermediary/B2B sections, security page and 31 July 2026 standard information sheet were checked. The general statutory assurances do not specifically withdraw C.1. A 30-day refund clause is scoped to B2B arrangements and is excluded from consumer findings. This is one Austrian wording family shared with the next drawer; copying provenance is unknown.","scope":"Effective dates: PRV §3(4) effective 29 September 2018, unchanged on the audit date. Old RSV transition ended no later than 31 January 2019. Exceptions: Limited to accepted funds within the Austrian PRV scheme. A lawful payment timetable, unreceived money, a standalone room, pure intermediation and B2B venue hire raise different questions. The guarantee instrument was not audited; no insolvency, underinsurance or denied payout is asserted.","date":"2026-10-17","langs":["German","English"],"countries":["AT"],"versions":[{"lang":"German","quote":"Darüberhinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen sind nicht abgesichert.","tr":"Deposits or balance payments exceeding those amounts or paid early are not protected.","url":"https://www.indigourlaub.com/allgemeine-reisebedingungen/","site":"indigourlaub.com"},{"lang":"English","quote":"Any deposits or balance payments made in excess of this or made prematurely are not protected.","tr":"","url":"https://www.indigourlaub.com/en/travel-terms/","site":"indigourlaub.com/en"},{"lang":"German","quote":"Darüberhinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen sind nicht abgesichert.","tr":"Deposits or balance payments exceeding those amounts or paid early are not protected.","url":"https://www.indigourlaub.com/var/site/storage/original/application/f9fdef76cf64e4b61f03a76e9d7b03b4.pdf","site":"indigourlaub.com · PDF"}]},"package-reisewelt-insolvency":{"id":"package-reisewelt-insolvency","area":"package","topic":"insolvency","pub":"Reisewelt","src":"Impressum & Rechtliches, Rechtliches","claim":"says early or extra payments are not protected.","quote":"Darüber hinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen dürfen nicht gefordert werden und sind auch nicht abgesichert.","lang":"German","tr":"Deposits or balance payments exceeding these amounts or paid early may not be demanded and are also not protected.","law":"","sourceUrl":"https://www.reisewelt.at/de/impressum.html","lawUrl":"https://ris.bka.gv.at/eli/bgbl/ii/2018/260/P3/NOR40208189","example":"An Austrian organiser accepts an early payment for its own qualifying package. Required insolvency protection includes that accepted money even if accepting it breached the payment schedule.","context":"Found by tracing similar wording after the Indigourlaub confirmation. These are two company occurrences in one wording family, not evidence of two independently created drafting errors. Who copied whom, if anyone, is unknown.","scope":"Effective dates: PRV §3(4), effective 29 September 2018; same current benchmark as the preceding drawer. Exceptions: Apply to own packages under the Austrian scheme, not every third-party retail sale or standalone service. No insolvency, insufficient guarantee, refused claim or loss is established.","date":"2026-10-17","langs":["German"],"countries":["AT"],"versions":[{"lang":"German","quote":"Darüber hinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen dürfen nicht gefordert werden und sind auch nicht abgesichert.","tr":"Deposits or balance payments exceeding these amounts or paid early may not be demanded and are also not protected.","url":"https://www.reisewelt.at/de/impressum.html","site":"reisewelt.at/de"}]},"package-alpenland-insolvency-payment-exclusion":{"id":"package-alpenland-insolvency-payment-exclusion","area":"package","topic":"insolvency","pub":"Alpenland Erlebnisreisen","src":"Reisebedingungen","claim":"says early or extra payments are not protected.","quote":"Darüber hinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen dürfen nicht gefordert werden und sind auch nicht abgesichert.","lang":"German","tr":"Deposits or balances exceeding those amounts or paid early may not be demanded and are also not protected.","law":"","sourceUrl":"https://www.alpenland-reisen.at/reisebedingungen.html","lawUrl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20010321","example":"An Austrian organiser accepts an early payment for its own qualifying package. Required
