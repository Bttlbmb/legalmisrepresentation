<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Legal Misrepresentation</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: a quiet reference work. Ink on cool paper; colour is reserved for one
   contrast only — green for what the law says, red for what the source says. */
:root {
  --bg: #f4f5f6;
  --surface: #ffffff;
  --ink: #14171b;
  --ink-2: #48505a;
  --ink-3: #5f6872;
  --rule: #dce0e4;
  --rule-2: #eceff1;
  --law: #146249;
  --law-bg: #e5f1ec;
  --claim: #ad3326;
  --claim-bg: #faebe8;
  --focus: #2f5bd0;
  --chrome: #1d2228;
  --chrome-ink: #c9ced4;
  --chrome-on: #ffffff;

  --f-display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-body: "Public Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s-xs: 0.8125rem; --s-sm: 0.875rem; --s-md: 1rem; --s-lg: 1.1875rem;
  --s-xl: 1.5rem; --s-2xl: 2rem; --s-3xl: 2.625rem;

  --proto-h: 0px; /* 44px when the proposal switcher is shown */
  --site-h: 56px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101215; --surface: #171a1e; --ink: #e6e9ec; --ink-2: #b2b9c1; --ink-3: #8f98a2;
    --rule: #2a2f35; --rule-2: #1f2328; --law: #5fc4a0; --law-bg: #14302a; --claim: #f08a7c; --claim-bg: #3a1e1a;
    --focus: #8fb0ff; --chrome: #08090b; --chrome-ink: #a9b0b8; --chrome-on: #ffffff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101215; --surface: #171a1e; --ink: #e6e9ec; --ink-2: #b2b9c1; --ink-3: #8f98a2;
  --rule: #2a2f35; --rule-2: #1f2328; --law: #5fc4a0; --law-bg: #14302a; --claim: #f08a7c; --claim-bg: #3a1e1a;
  --focus: #8fb0ff; --chrome: #08090b; --chrome-ink: #a9b0b8; --chrome-on: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: var(--s-md); line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.eyebrow { font-size: var(--s-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.lede { color: var(--ink-2); font-size: var(--s-lg); max-width: 62ch; }
.stats { color: var(--ink-3); font-size: var(--s-sm); font-variant-numeric: tabular-nums; }
.native { font-family: var(--f-body); font-weight: 400; color: var(--ink-3); font-size: var(--s-md); letter-spacing: 0; white-space: nowrap; }
.prov { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule); }
.prov:hover { color: var(--ink); border-color: var(--ink-3); }

/* Law / source value pair — the one place colour lives */
.k { display: inline-flex; gap: .45em; align-items: baseline; font-size: var(--s-sm); line-height: 1.3; }
.k b { font-size: var(--s-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.k.law { color: var(--law); }
.k.claim { color: var(--claim); }


/* ---------- prototype chrome ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); color: var(--chrome-ink);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.proto-in { max-width: 1120px; margin: 0 auto; height: var(--proto-h); display: flex; align-items: center; gap: 14px; font-size: var(--s-xs); }
.proto-label { letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.proto-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.proto-tabs a { text-decoration: none; padding: 5px 10px; border-radius: 4px; white-space: nowrap; color: var(--chrome-ink); }
.proto-tabs a:hover { color: var(--chrome-on); background: rgba(255,255,255,.07); }
.proto-tabs a[aria-current="true"] { color: var(--chrome-on); background: rgba(255,255,255,.14); }
.proto-tabs a span { opacity: .6; margin-right: 4px; font-family: var(--f-mono); }
.reader-mode .proto-in, .reader-mode .site-in { max-width: none; }

.site { border-bottom: 1px solid var(--rule); background: var(--bg); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.site-in { max-width: 1088px; margin: 0 auto; height: var(--site-h); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wordmark { font-family: var(--f-display); font-size: var(--s-lg); text-decoration: none; letter-spacing: -.005em; white-space: nowrap; }
.wordmark i { font-style: italic; color: var(--claim); }
.site-tools { display: flex; align-items: center; gap: 10px; min-width: 0; }
.theme-btn { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; padding: 0; }
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }

.crumbs { font-size: var(--s-sm); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

/* ---------- shared case view ---------- */
.case { display: grid; gap: 28px; min-width: 0; }
.case-head { display: grid; gap: 10px; }
.case-title { font-family: var(--f-display); font-weight: 400; font-size: var(--s-2xl); line-height: 1.22; letter-spacing: -.01em; max-width: 36ch; }
.case-title .pub { font-weight: 600; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); overflow: hidden; }
.side { padding: 22px 24px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.side + .side { border-left: 1px solid var(--rule); }
.side-label { font-family: var(--f-body); font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.side-claim .side-label { color: var(--claim); }
.side-law .side-label { color: var(--law); }
.side blockquote { margin: 0; font-family: var(--f-display); font-size: var(--s-lg); line-height: 1.45; overflow-wrap: anywhere; }
.side blockquote::before { content: "“"; } .side blockquote::after { content: "”"; }
.tr { color: var(--ink-2); font-size: var(--s-sm); }
.tr::before { content: "Translation  "; font-size: var(--s-xs); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); white-space: pre; }
.law-text { font-family: var(--f-display); font-size: var(--s-lg); line-height: 1.45; }
.side-meta { margin-top: auto; padding-top: 6px; font-size: var(--s-xs); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.side-meta a { color: var(--ink-2); }
.practice { display: grid; gap: 8px; max-width: 68ch; }
.practice h2 { font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.practice p { color: var(--ink); }
.checked { font-size: var(--s-xs); color: var(--ink-3); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); padding-top: 14px; font-size: var(--s-sm); }
.pager a { text-decoration: none; color: var(--ink-2); max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager a:hover { color: var(--ink); }
.pager .pos { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pager .off { visibility: hidden; }

/* case rows used in lists */
.rows { border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 12px 2px; border-bottom: 1px solid var(--rule-2); text-decoration: none; }
.row:hover .row-text { color: var(--ink); }
.row:hover .arrow { color: var(--ink); transform: translateX(2px); }
.row-text { color: var(--ink-2); }
.row-text b { color: var(--ink); font-weight: 600; }
.arrow { color: var(--ink-3); transition: transform .15s; }

/* ================= A · Pages ================= */
.A main { padding-block: 24px 80px; }
.A .hero { display: grid; gap: 14px; padding-bottom: 12px; }
.A .hero .lede { max-width: none; text-wrap: balance; }
.A .hero h1, .C .hero h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-3xl); line-height: 1.1; letter-spacing: -.015em; max-width: 40ch; }
.sector { display: grid; gap: 4px; padding-top: 28px; }
.sector-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.sector-h h2 { font-size: var(--s-sm); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.sector-h span { color: var(--ink-3); font-size: var(--s-sm); font-variant-numeric: tabular-nums; }
.area-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr) 64px; gap: 32px; padding: 24px 0; border-bottom: 1px solid var(--rule); text-decoration: none; align-items: start; }
.area-row:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.area-main { display: grid; gap: 6px; }
.area-main h3 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); line-height: 1.2; }
.area-main p { color: var(--ink-2); font-size: var(--s-sm); max-width: 46ch; }
.area-main .by { color: var(--ink-3); font-size: var(--s-xs); }
.issues-mini { display: grid; gap: 5px; padding-top: 4px; }
.issues-mini li { display: grid; grid-template-columns: minmax(0, 1fr) 96px 22px; gap: 10px; align-items: center; font-size: var(--s-sm); color: var(--ink-2); }
.issues-mini .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; background: var(--rule-2); border-radius: 3px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--claim); opacity: .8; border-radius: 3px; }
.issues-mini .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: var(--s-xs); }
.count { text-align: right; font-family: var(--f-display); font-size: var(--s-2xl); line-height: 1; font-variant-numeric: tabular-nums; }
.count small { display: block; font-family: var(--f-body); font-size: var(--s-xs); color: var(--ink-3); margin-top: 4px; }

.A .area-head { display: grid; gap: 12px; padding: 18px 0 8px; }
.A1 .area-head { padding-bottom: 32px; }
.A .area-head h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-3xl); line-height: 1.1; letter-spacing: -.015em; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 18px 0 8px; }
.toc a { font-size: var(--s-sm); text-decoration: none; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 11px; background: var(--surface); white-space: nowrap; }
.toc a:hover { border-color: var(--ink-3); color: var(--ink); }
.toc a span { color: var(--ink-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.issue { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 12px 40px; padding: 32px 0; border-top: 1px solid var(--rule); scroll-margin-top: calc(var(--proto-h) + 16px); }
.issue-head { display: grid; gap: 10px; align-content: start; }
.issue-head h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); line-height: 1.2; }
.keys { display: grid; gap: 4px; }
.issue-law { color: var(--ink-2); font-size: var(--s-sm); }
.issue-law .prov { display: table; margin-top: 4px; }
.issue .rows { border-top: none; }
.issue .row:first-child, .issue .row-group:first-child { padding-top: 2px; }
.A .case-wrap { display: grid; gap: 28px; padding-top: 18px; }
.more { display: grid; gap: 10px; padding-top: 12px; }
.more h2 { font-size: var(--s-sm); font-weight: 600; color: var(--ink-2); }

/* ================= B · Reader ================= */
.B .reader { display: grid; grid-template-columns: 236px minmax(300px, 400px) minmax(0, 1fr);
  height: calc(100dvh - var(--proto-h) - var(--site-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.pane { overflow-y: auto; min-width: 0; overscroll-behavior: contain; }
.pane + .pane { border-left: 1px solid var(--rule); }
.B .nav { padding: 18px 10px 40px 16px; display: grid; gap: 18px; align-content: start; }
.nav-group { display: grid; gap: 2px; }
.nav-group > p { padding: 0 8px 6px; }
.nav-area { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 4px; text-decoration: none; font-size: var(--s-sm); color: var(--ink-2); }
.nav-area:hover { background: var(--rule-2); color: var(--ink); }
.nav-area[aria-current="true"] { color: var(--ink); font-weight: 600; background: var(--rule-2); }
.nav-area span, .nav-topic span { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.nav-topics { display: grid; gap: 1px; margin: 2px 0 8px 8px; border-left: 1px solid var(--rule); }
.nav-topic { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px 4px 12px; text-decoration: none; font-size: var(--s-xs); color: var(--ink-2); }
.nav-topic:hover { color: var(--ink); }
.B .list { background: var(--surface); }
.list-head { padding: 20px 20px 14px; display: grid; gap: 6px; border-bottom: 1px solid var(--rule); }
.list-head h1 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); line-height: 1.2; }
.list-head p { font-size: var(--s-sm); color: var(--ink-2); }
.l-issue { border-bottom: 1px solid var(--rule); scroll-margin-top: 0; }
.l-issue-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 14px 20px 10px; display: grid; gap: 4px; border-bottom: 1px solid var(--rule-2); }
.l-issue-head h2 { font-size: var(--s-sm); font-weight: 600; }
.l-issue-head .keys { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.l-issue-head .k { font-size: var(--s-xs); }
.l-row { display: block; padding: 10px 20px 10px 17px; border-left: 3px solid transparent; text-decoration: none; font-size: var(--s-sm); color: var(--ink-2); line-height: 1.45; }
.l-row b { color: var(--ink); font-weight: 600; }
.l-row:hover { background: var(--rule-2); }
.l-row[aria-current="true"] { background: var(--claim-bg); border-left-color: var(--claim); color: var(--ink); }
.B .detail { padding: 28px 36px 60px; }
.B .detail .case { max-width: 860px; }
.B .detail .case-title { font-size: var(--s-xl); }
.area-select { display: none; font: inherit; font-size: var(--s-sm); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); min-width: 0; max-width: 55%; }

/* ================= C · Patterns ================= */
.C main { padding-block: 40px 80px; }
.C .hero { display: grid; gap: 14px; padding-bottom: 24px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; position: sticky; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding-top: 10px; }
.filters button { font: inherit; font-size: var(--s-sm); padding: 5px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.filters button:hover { border-color: var(--ink-3); color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button span { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.c-area { padding-top: 36px; display: grid; gap: 14px; scroll-margin-top: calc(var(--proto-h) + 60px); }
.c-area-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.c-area-head h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); }
.c-area-head p { font-size: var(--s-sm); color: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.card { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 16px 16px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; text-decoration: none; min-height: 178px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.card-t { font-size: var(--s-sm); font-weight: 600; line-height: 1.35; }
.pair { margin: 0; display: grid; gap: 8px; align-content: start; }
.pair div { display: grid; gap: 1px; }
.pair dt { font-size: 0.6875rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.pair dd { margin: 0; font-family: var(--f-display); font-size: var(--s-lg); line-height: 1.25; }
.pair .law dt, .pair .law dd { color: var(--law); }
.pair .claim dt { color: var(--claim); }
.pair .claim dd { color: var(--ink); }
.card-n { font-size: var(--s-xs); color: var(--ink-3); display: flex; justify-content: space-between; }
.c-topic-head { display: grid; gap: 18px; padding: 18px 0 32px; }
.c-topic-head h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-3xl); line-height: 1.1; letter-spacing: -.015em; }
.big-pair { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.big-pair > div { padding: 16px 20px 18px 0; display: grid; gap: 4px; }
.big-pair > div + div { padding-left: 20px; border-left: 1px solid var(--rule); }
.big-pair .lab { font-size: var(--s-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.big-pair .big { font-family: var(--f-display); font-size: var(--s-2xl); line-height: 1.15; }
.big-pair .law { color: var(--law); }
.big-pair .claim .lab { color: var(--claim); }
.list-h { font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); padding-bottom: 8px; }
.drawer { position: fixed; inset: 0; z-index: 40; display: grid; grid-template-columns: 1fr minmax(0, 760px); }
.scrim { background: rgba(10, 12, 15, .38); }
.sheet { background: var(--bg); overflow-y: auto; overscroll-behavior: contain; border-left: 1px solid var(--rule);
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-right, 0px)) calc(48px + env(safe-area-inset-bottom, 0px)) 32px;
  display: grid; gap: 24px; align-content: start; animation: slide .2s ease-out; }
.sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.close { font-size: var(--s-sm); text-decoration: none; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 4px; padding: 4px 10px; background: var(--surface); }
.close:hover { color: var(--ink); border-color: var(--ink-3); }
.sheet .case-title { font-size: var(--s-xl); }
@keyframes slide { from { transform: translateX(24px); opacity: .4; } }

/* ================= A1–A3 · where and in which language ================= */
.sector-sub { color: var(--ink-2); font-size: var(--s-sm); padding-top: 10px; max-width: 72ch; }
.scope { display: flex; flex-wrap: wrap; font-size: var(--s-xs); color: var(--ink-2); padding-top: 2px; }
.scope span { white-space: nowrap; }
.scope span:not(:last-child)::after { content: "·"; margin: 0 7px; color: var(--ink-3); }
.scope .law-s { color: var(--law); font-weight: 500; }
.strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 6px 0 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
.strip > div { padding: 12px 16px 13px 0; display: grid; gap: 3px; align-content: start; min-width: 0; }
.strip > div + div { padding-left: 16px; border-left: 1px solid var(--rule); }
.strip dt, .facts dt { font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.strip dd, .facts dd { margin: 0; font-size: var(--s-sm); color: var(--ink); }

imKey":"Under 30, 35 or 44","law":"Starting a qualifying Bachelor’s or Master’s phase before 45 satisfies the ordinary age condition. It does not establish the other BAföG conditions; specified age exceptions can apply from 45.","provision":"BAföG §10(3)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__10.html","cases":["bafoeg-baf-01-02","bafoeg-baf-01-01","bafoeg-baf-01-03","bafoeg-baf-01-04","bafoeg-baf-01-05","bafoeg-baf-01-06","bafoeg-be-baf-01"]},{"id":"subject","title":"Changing subject","lawKey":"Before semester 5 begins","claimKey":"Earlier cut-offs","law":"For a new undergraduate change, an established important reason can suffice before the fifth subject semester begins. Credited semesters, promptness and earlier changes matter; the Master route has a separate restriction.","provision":"BAföG §7(3) · §17(3)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","cases":["bafoeg-baf-02-02","bafoeg-baf-02-05","bafoeg-baf-02-01","bafoeg-baf-02-04","bafoeg-baf-02-03","bafoeg-baf-12-01","bafoeg-baf-16-01","bafoeg-be-baf-03","bafoeg-be-baf-04","bafoeg-mv-baf-01"]},{"id":"earnings","title":"Earning while studying","lawKey":"About €603 a month","claimKey":"€520 or €556","law":"For ordinary employee earnings in a 2026 award period, an average €603 gross monthly is uncounted after standard deductions if no other income uses the allowance. This is not a universal gross-income limit.","provision":"BAföG §23(1)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__23.html","cases":["bafoeg-baf-07-01","bafoeg-baf-07-02","bafoeg-baf-07-03","bafoeg-baf-07-04","bafoeg-baf-07-05","bafoeg-ni-baf-02","bafoeg-mv-baf-03"]},{"id":"assets","title":"Savings and assets","lawKey":"€15,000 of savings","claimKey":"€5,200 or €7,500","law":"The basic allowance for applicant assets is €15,000, or €45,000 from age 30 at application. Parents’ own assets are not an asset input, although income from them can count.","provision":"BAföG §29(1)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__29.html","cases":["bafoeg-baf-11-01","bafoeg-baf-11-02","bafoeg-baf-11-03","bafoeg-baf-11-04","bafoeg-baf-05-01","bafoeg-baf-17-01","bafoeg-baf-06-01","bafoeg-be-baf-02"]},{"id":"eu","title":"EU citizens who work","lawKey":"No fixed minimum","claimKey":"12 hours, 10 weeks","law":"Genuine EU-worker status can satisfy one BAföG residence condition. Twelve weekly hours are a regular indicator, not an absolute minimum; there is no categorical ten-week waiting rule. Other eligibility conditions remain.","provision":"BAföG §8(1) No. 3 · FreizügG/EU §2","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__8.html","cases":["bafoeg-baf-09-01","bafoeg-baf-09-02","bafoeg-baf-15-01","bafoeg-baf-15-02","bafoeg-baf-08-01"]},{"id":"further","title":"Second degrees","lawKey":"Possible in special cases","claimKey":"Never","law":"One further qualification can qualify under narrow statutory exceptions. A medical graduate’s dentistry degree for oral and maxillofacial surgery is an identified special-circumstances example, subject to all requirements.","provision":"BAföG §7(2)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","cases":["bafoeg-baf-10-01","bafoeg-baf-10-02"]},{"id":"end","title":"When funding ends","lawKey":"When you learn you passed","claimKey":"Month of last exam","law":"University training ends in the month successful completion is first notified, at latest the end of the second month after the final examination month. Payment still requires remaining funding duration and all other conditions.","provision":"BAföG §15b(3)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15b.html","cases":["bafoeg-baf-03-01","bafoeg-baf-03-02"]},{"id":"family","title":"Spouses and children","lawKey":"Children up to 14","claimKey":"Children up to 10","law":"Qualifying childcare delays can justify an appropriate extension. A separate €160 addition to assessed need applies for each own child under 14 in the household, for one eligible parent. Parental independence does not itself exclude spouse income.","provision":"BAföG §11 · §14b · §15(3)","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15.html","cases":["bafoeg-baf-13-01","bafoeg-baf-14-01","bafoeg-baf-04-01","bafoeg-baf-04-02"]},{"id":"rates","title":"Monthly rates","lawKey":"Current rates","claimKey":"Older, lower rates","law":"A qualifying student living away from parents in the ordinary student health/care insurance category has assessed need of €992 before means testing. Other insurance categories and supplements can give different totals.","provision":"BAföG §13 · §13a","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__13.html","cases":["bafoeg-mv-baf-02","bafoeg-st-baf-01"]},{"id":"abroad","title":"Studying abroad","lawKey":"No fixed deadline","claimKey":"Six months ahead","law":"BAföG has no general six-month advance-filing cutoff for foreign study. Funding starts no earlier than the application month and course start, subject to eligibility; processing can take longer.","provision":"BAföG §15(1) · §46","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__15.html","cases":["bafoeg-ni-baf-03"]}]},{"id":"jobcenter","sector":"gov","title":"Basic income support","titleNative":"Bürgergeld","intro":"Jobcentre benefits for people who can work but do not earn enough to live on.","publishers":"Local jobcentres and service portals","law":"German federal law","lawShort":"German law","where":"Germany","whereShort":"","topics":[{"id":"earnings","title":"Keeping part of your wages","lawKey":"30% stays free","claimKey":"20% stays free","law":"For ordinary employed claimants aged 25 or over, 30% of the gross monthly earnings slice above €520 through €1,000 is disregarded. Other earnings slices and eligible deductions are separate.","provision":"SGB II §11b(3)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11b.html","cases":["jobcenter-tk1","jobcenter-rastatt-earnings","jobcenter-st-jc-01","jobcenter-ni-jc-01"]},{"id":"start","title":"When benefits start","lawKey":"1st of the month","claimKey":"Day you apply","law":"An ordinary living-cost application normally takes effect from the first of the application month. Payment still depends on eligibility for each day covered.","provision":"SGB II §37(2)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__37.html","cases":["jobcenter-be-c1"]},{"id":"savings","title":"Savings you can keep","lawKey":"€10,000 at age 35","claimKey":"€40,000","law":"For a single 35-year-old whose approval period begins on or after 1 July 2026, the ordinary allowance against countable assets is €10,000. Other ages, separately protected assets, household allowances and earlier approval periods have different rules.","provision":"SGB II §12(2)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__12.html","cases":["jobcenter-m-c1","jobcenter-mainz-savings","jobcenter-ni-jc-02"]},{"id":"furniture","title":"Help with furniture","lawKey":"Also after separation","claimKey":"First home only","law":"A qualifying initial need for essential household equipment can arise after separation even if someone has had a home before. Ordinary replacement purchases are different; need, resources and any required move approval still matter.","provision":"SGB II §24(3)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__24.html","cases":["jobcenter-m-c2","jobcenter-ni-c1"]},{"id":"oneoff","title":"One-off support","lawKey":"No ongoing need required","claimKey":"Six months of need","law":"Specified one-off needs can qualify even when ordinary living costs are covered, if the particular need cannot be met. The Jobcenter may consider income for up to six months after the decision month; an unmet qualifying need and the other conditions remain necessary.","provision":"SGB II §24(3)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__24.html","cases":["jobcenter-jcx-03","jobcenter-jcx-04"]},{"id":"holiday","title":"Holiday jobs for pupils","lawKey":"No limit","claimKey":"€2,400 a year","law":"For pupils under 25 at general or vocational schools, earnings from employment during school holidays are excluded without a euro ceiling. Contractual training remuneration is outside this exemption.","provision":"SGB II §11a(7)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__11a.html","cases":["jobcenter-jcx-01"]},{"id":"age","title":"Upper age limit","lawKey":"Pension age","claimKey":"Under 65","law":"The SGB II upper age boundary depends on birth year. For the 1961 cohort it is the end of the month in which age 66 years and six months is reached. Other eligibility requirements remain; an old-age pension can exclude SGB II earlier.","provision":"SGB II §7 · §7a","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__7.html","cases":["jobcenter-jcx-02"]},{"id":"deposit","title":"Repaying a deposit loan","lawKey":"5% a month","claimKey":"10% a month","law":"During continuing benefit receipt, the ordinary offset for a deposit loan is 5% of the applicable standard need per month, starting the month after payment and declared by written administrative act. Statutory offset exceptions and immediate-maturity situations are separate.","provision":"SGB II §42a(2)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__42a.html","cases":["jobcenter-mv-jc-01"]},{"id":"activities","title":"Children’s activities","lawKey":"€15 a month","claimKey":"€10 a month","law":"Eligible children under 18 with qualifying participation costs receive a €15 monthly lump sum. Appropriate additional actual expenses can also qualify; this is not an unconditional payment to every child.","provision":"SGB II §28(7)","lawUrl":"https://www.gesetze-im-internet.de/sgb_2/__28.html","cases":["jobcenter-st-jc-02"]}]},{"id":"elterngeld","sector":"gov","title":"Parental allowance","titleNative":"Elterngeld","intro":"Federal payments for eligible parents caring for a young child.","publishers":"State and town authorities","law":"German federal law","lawShort":"German law","where":"Germany","whereShort":"","topics":[{"id":"change","title":"Changing your months","lawKey":"Possible in hardship","claimKey":"Never","law":"Particular hardship can permit a change to an already paid life month. The overall benefit period and three-life-month retrospective limit still apply; Plus-to-Basis conversion is a separate exception.","provision":"BEEG §7(2)","lawUrl":"https://www.gesetze-im-internet.de/beeg/__7.html","cases":["elterngeld-be-elt-01","elterngeld-ni-elt-02"]},{"id":"premature","title":"Premature births","lawKey":"At least 6, 8, 12, 16 weeks","claimKey":"Up to 6, 8, 12, 16 weeks","law":"Birth at least six, eight, twelve or sixteen weeks before the medically certified expected date increases the shared Basis allotment by one, two, three or four months respectively. Other eligibility conditions still apply.","provision":"BEEG §4(5)","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4.html","cases":["elterngeld-be-elt-02"]},{"id":"bonus","title":"Partnership bonus","lawKey":"24 to 32 hours","claimKey":"25 to 30 hours","law":"For the ordinary paired-parent bonus after a current birth, each parent must average 24–32 weekly hours in each of two to four concurrent consecutive life months. The other eligibility conditions still apply; qualifying sole parents have a separate route.","provision":"BEEG §4b","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4b.html","cases":["elterngeld-be-elt-03","elterngeld-mv-elt-03","elterngeld-st-elt-02"]},{"id":"minimum","title":"Working while receiving it","lawKey":"Up to 32 hours","claimKey":"Up to 30 hours","law":"Ordinary work averaging no more than 32 weekly hours over the child's life month satisfies the working-time condition. This does not by itself establish entitlement; training and suitable day care have separate exceptions.","provision":"BEEG §1(6)","lawUrl":"https://www.gesetze-im-internet.de/beeg/__1.html","cases":["elterngeld-be-elt-04"]},{"id":"plus","title":"ElterngeldPlus amount","lawKey":"Can equal Basis","claimKey":"Always half","law":"Plus is capped at half the hypothetical Basis entitlement without relevant post-birth income. With post-birth earnings, actual monthly Plus can equal actual monthly Basis; minimums, supplements and offsets have separate rules.","provision":"BEEG §4a","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4a.html","cases":["elterngeld-mv-elt-01","elterngeld-ni-elt-01"]},{"id":"single","title":"Single parents","lawKey":"Adult children allowed","claimKey":"No other adult","law":"The ordinary sole-parent route can include an adult child for whom Kindergeld or a child allowance is due. The other parent must live separately, and the tax-relief, income-reduction and other eligibility conditions remain.","provision":"BEEG §4c · EStG §24b","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4c.html","cases":["elterngeld-mv-elt-02"]},{"id":"overlap","title":"Both parents at once","lawKey":"First 12 months","claimKey":"First 14 months","law":"For ordinary current cases, concurrent Basis receipt is limited to one of the first twelve life months. Statutory exceptions cover specified premature births, multiple births and disability cases.","provision":"BEEG §4(6)","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4.html","cases":["elterngeld-st-elt-01"]},{"id":"maternity","title":"Maternity benefit months","lawKey":"Child’s months of life","claimKey":"Calendar months","law":"Life months with entitlement to the specified maternity or insurance benefits count as Basis months. The child's life months govern, not calendar months or the date of cash payment; pre-birth periods and excluded maternity grants are separate.","provision":"BEEG §4(4)","lawUrl":"https://www.gesetze-im-internet.de/beeg/__4.html","cases":["elterngeld-st-elt-03"]}]},{"id":"missions","sector":"gov","title":"Visas and passports","titleNative":"","intro":"Guidance from German embassies, consulates and town halls on visas, passports and ID cards.","publishers":"German embassies, consulates and town halls","law":"EU visa rules and German passport, ID card and citizenship law","lawShort":"EU and German law","where":"German embassies, consulates and town halls","whereShort":"","topics":[{"id":"visa-timing","title":"Visa deadlines","lawKey":"6 months to 15 days","claimKey":"3 months to 4 weeks","law":"Ordinary short-stay applications may be lodged within six months before travel, normally at least 15 calendar days beforehand; justified urgent cases can be lodged later. An admissible application normally has a 15-calendar-day decision period, subject to lawful extensions.","provision":"Visa Code Art. 9(1) · Art. 23","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","cases":["missions-visa-four-week-cutoff","missions-visa-filing-window","missions-working-days"]},{"id":"visa-docs","title":"Visa documents","lawKey":"Fixed legal list","claimKey":"Extra conditions","law":"For an ordinary short-stay application, the recognised passport needs two blank pages, issue within the previous ten years and normally three months of validity beyond intended final Schengen departure. Insurance normally covers the intended stay. Statutory exceptions and protected free-movement families have separate rules.","provision":"Visa Code Art. 12 · Art. 15","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","cases":["missions-visa-passport-age-at-expiry","missions-visa-insurance-extra-fifteen-days","missions-missing-support-documents","missions-visa-blank-pages","missions-passport-validity-recommendation"]},{"id":"visa-who","title":"Who can apply","lawKey":"Judged case by case","claimKey":"Blanket bars","law":"The competent consulate normally examines applications from legal residents without a fixed six-month waiting period. Past overstay is assessed against current refusal grounds. Qualifying family members accompanying or joining a mobile EU citizen receive free and accelerated visa facilitation.","provision":"Visa Code Art. 6 · Art. 21 · Directive 2004/38","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","cases":["missions-visa-residence-wait","missions-automatic-overstay-next-refusal","missions-eu-family-insurance"]},{"id":"fees","title":"Fees","lawKey":"2026 fee rates","claimKey":"Outdated rates","law":"The ordinary domestic passport base fee is €70 from age 24 and €37.50 below 24; the adult €70 rate dates from 1 January 2024. Since 7 February 2026 the competent-mission supplement is €36. Ordinary ID base fees are €46/€27.60 plus €43 abroad. Extras and fee relief are separate.","provision":"PassV §27 · PAuswGebV §1","lawUrl":"https://www.gesetze-im-internet.de/passv_2007/__27.html","cases":["missions-superseded-fees","missions-age-24-boundary","missions-visa-fee-age-twelve","missions-superseded-passport-fees-tashkent-followup","missions-ni-mun-02","missions-st-mun-01"]},{"id":"documents","title":"Passports and ID cards","lawKey":"Current rules","claimKey":"Abolished rules","law":"New Kinderreisepässe and extensions ended on 1 January 2024; this does not mean children cannot get ordinary passports. New ID cards normally require fingerprints from age six, subject to statutory impossibility exceptions. Legally capable applicants may apply personally from sixteen.","provision":"PassG §1 · PAuswG §5, §9","lawUrl":"https://www.gesetze-im-internet.de/pauswg/BJNR134610009.html","cases":["missions-optional-fingerprints","missions-abolished-child-passport","missions-id-parental-consent","missions-optional-fingerprints-montevideo-followup","missions-abolished-child-passport-rangoon-followup","missions-abolished-child-passport-tashkent-followup"]},{"id":"citizenship","title":"Citizenship","lawKey":"Dual citizenship allowed","claimKey":"Automatic loss","law":"For foreign citizenship acquired on or after 27 June 2024, that acquisition alone no longer causes loss of German citizenship. Earlier acquisitions and other loss grounds require separate analysis.","provision":"StAG, reform of 2024","lawUrl":"https://www.recht.bund.de/bgbl/1/2024/104/VO.html","cases":["missions-citizenship-loss","missions-former-option-duty-validity"]}]},{"id":"airlines","sector":"biz","title":"Air passenger rights","titleNative":"","intro":"EU rules on compensation and care when flights are cancelled, delayed or overbooked.","publishers":"Airlines","law":"EU Regulation 261/2004","lawShort":"EU law","where":"Flights leaving the EU, and EU airlines flying into it","whereShort":"Flights to and from the EU","topics":[{"id":"cancellation","title":"Compensation for late cancellations","lawKey":"Both limits must hold","claimKey":"Either is enough","law":"For cancellations notified 7–14 days ahead, the rerouting exception requires departure no more than two hours early AND arrival less than four hours late. A separate extraordinary-circumstances defence can also exclude compensation.","provision":"Regulation 261/2004, Art. 5(1)(c)","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","cases":["airlines-lufthansa-timing","airlines-thai-airways-timing","airlines-emirates-timing"]},{"id":"scope","title":"Flights into the EU","lawKey":"EU rights apply","claimKey":"Local rules override","law":"For an EU-carrier flight from a non-EU country into the EU, local passenger rules alone do not exclude EU261. The third-country exception requires an assessment of equivalent protection; proof of actual receipt is not always required.","provision":"Regulation 261/2004, Art. 3(1)(b)","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","cases":["airlines-air-france-scope","airlines-la-compagnie-scope"]},{"id":"refund","title":"Refunds","lawKey":"Separate claims","claimKey":"Same time only","law":"When Article 8 reimbursement applies, an already-flown part is refundable if the journey no longer serves its original purpose. The Regulation does not require that request to coincide with the unused-part claim; ordinary procedural limits still apply.","provision":"Regulation 261/2004, Art. 8(1)(a)","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","cases":["airlines-british-airways-refund"]},{"id":"care","title":"Hotel and meals","lawKey":"Necessary hotel care","claimKey":"Next-day flights only","law":"An eligible passenger involuntarily denied boarding and awaiting earliest rerouting is entitled to necessary hotel care. The replacement need not depart on a later calendar date.","provision":"Regulation 261/2004, Art. 4(3), 9","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","cases":["airlines-emirates-hotel"]},{"id":"longhaul","title":"Long flights within the EU","lawKey":"Three-hour limits","claimKey":"Four-hour limits","law":"On intra-EU flights longer than 1,500 km, expected departure delays trigger basic care at three hours. Separately, the Article 7 rerouting reduction needs arrival no more than three hours late, including routes beyond 3,500 km.","provision":"Regulation 261/2004, Art. 6(1)(b) · 7(2)(b)","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","cases":["airlines-austrian-intra-eu-delay-care","airlines-lufthansa-intra-eu-reduction"]}]},{"id":"roaming","sector":"biz","title":"Mobile roaming","titleNative":"","intro":"EU “roam like at home” rules for using your phone in other EU countries.","publishers":"Mobile network operators","law":"EU Roaming Regulation 2022/612","lawShort":"EU law","where":"Mobile customers in their home EU country","whereShort":"","topics":[{"id":"fairuse","title":"Fair-use checks","lawKey":"Both indicators needed","claimKey":"One indicator enough","law":"For the ordinary four-month presence-and-use test, both roaming indicators must predominate; either domestic indicator is a safe harbour. After an alert, changed use demonstrating domestic presence OR consumption can suffice. Separate abuse grounds have their own rules.","provision":"Implementing Regulation 2016/2286, Art. 4–5","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","cases":["roaming-go-fair-use-or","roaming-tmobile-cz-and-or","roaming-gomobil-cz-and-or-copy","roaming-lebara-help-presence","roaming-elisa-traffic-alone","roaming-tim-business-traffic-alone","roaming-vodafone-it-both-domestic","roaming-proximus-alert-and","roaming-yoigo-warning-cessation-and","roaming-orange-es-warning-and","roaming-vodafone-es-warning-and"]},{"id":"surcharges","title":"Surcharges","lawKey":"Capped by EU law","claimKey":"Above the cap","law":"If fair use is exceeded, extra charges are capped. In 2026: €0.019 a minute, €0.003 an SMS, €1.10 a GB and €0.002 an incoming minute, before VAT.","provision":"Regulation 2022/612, Art. 7–8","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","cases":["roaming-go-voice-surcharge","roaming-vodafone-cu-gr-fup-maxima","roaming-telia-sweden-surcharges","roaming-sfr-incoming-cap","roaming-iliad-incoming-cap","roaming-vodafone-pt-net-label","roaming-orange-es-current-gross-data","roaming-tesco-domestic-rate-for-fup","roaming-gomo-cy-fup-surcharge-maxima"]},{"id":"allowance","title":"Your allowance abroad","lawKey":"Legal minimum data","claimKey":"Less data","law":"For eligible default regulated roaming, domestic benefits normally continue, subject to valid fair-use rules and the domestic off-net comparator. Open-data bundles have a price-based data minimum; per-unit prepaid credit has a different calculation.","provision":"Regulation 2022/612, Art. 4 · Impl. Reg. 2016/2286, Art. 4","lawUrl":"https://eur-lex.europa.eu/eli/reg/2022/612/oj/eng","cases":["roaming-melita-blanket-allowance-exclusion","roaming-telia-sweden-50gb-floor","roaming-vodafone-ie-data-faq","roaming-lebara-current-examples","roaming-gomo-cy-14gb-floor"]},{"id":"monitoring","title":"Monitoring and alerts","lawKey":"4-month observation · above €100 net","claimKey":"At most 4 months · €102.50","law":"The ordinary presence-and-use control needs at least four months of observation. Separately, customers subject to the default spending limit need an additional notice above €100 excluding VAT per monthly billing period, with data stopped absent the required response.","provision":"Impl. Reg. 2016/2286, Art. 4 · Regulation 2022/612, Art. 14","lawUrl":"https://eur-lex.europa.eu/eli/reg_impl/2016/2286/2019-03-13/eng","cases":["roaming-play-four-month-maximum","roaming-orange-sk-additional-notice"]}]},{"id":"package","sector":"biz","title":"Package travel","titleNative":"","intro":"EU rules for trips that bundle flights, hotels and other services.","publishers":"Tour operators","law":"EU Package Travel Directive, as adopted in each country","lawShort":"EU law","where":"Packages sold in the EU","whereShort":"","topics":[{"id":"transfer","title":"Passing a trip to someone else","lawKey":"Allowed","claimKey":"Never allowed","law":"A traveller may transfer a qualifying package to a substitute who meets its conditions, using the required durable notice. Seven days is sufficient under the cited national rules. Only reasonable actual transfer costs may be charged.","provision":"Directive 2015/2302, Art. 9","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","cases":["package-exoticca-transfer"]},{"id":"refund","title":"Refund when the organiser cancels","lawKey":"Full refund","claimKey":"Minus flights","law":"For the organiser cancellations covered here—too few participants or unavoidable extraordinary circumstances—all package payments must be returned within 14 days. Non-refundable supplier flights do not reduce that refund.","provision":"Directive 2015/2302, Art. 12(3)–(4)","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","cases":["package-exoticca-refund"]},{"id":"minimum","title":"Too few travellers","lawKey":"20 days’ notice","claimKey":"7 or 15 days","law":"For trips longer than six days, the low-participant-number exemption requires the contractual minimum and deadline plus notice at least 20 days before departure. Later notice loses that particular exemption; it does not automatically prove a damages award.","provision":"Directive 2015/2302, Art. 12(3)(a)","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","cases":["package-exoticca-minimum","package-gestravel-minimum"]},{"id":"insolvency","title":"Insolvency protection","lawKey":"Accepted package funds covered","claimKey":"Early payments excluded","law":"Under the Austrian PRV scheme, required insolvency protection includes accepted package funds even if acceptance broke the statutory payment restrictions. This does not establish any company’s actual guarantee or payout.","provision":"Directive 2015/2302, Art. 17 · Austrian PRV §3(4)","lawUrl":"https://ris.bka.gv.at/eli/bgbl/ii/2018/260/P3/NOR40208189","cases":["package-indigo-insolvency","package-reisewelt-insolvency","package-alpenland-insolvency-payment-exclusion","package-christl-insolvency-payment-exclusion"]},{"id":"changes","title":"Major changes to a trip","lawKey":"Rights depend on timing and severity","claimKey":"No cancellation","law":"A significant predeparture change can give a choice of acceptance or fee-free termination. During travel, termination depends on substantial nonconformity and the statutory remedy and alternative-arrangement conditions. Outside causes do not erase these rights.","provision":"Directive 2015/2302, Art. 11(2) · 13","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","cases":["package-beltrame-itinerary"]}]}],"cases":{"wehrdienst-ba-duration":{"id":"wehrdienst-ba-duration","area":"wehrdienst","topic":"duration","pub":"Federal Employment Agency","src":"HTML careers guide","claim":"says service is six months of training plus one to 17 more months.","quote":"Er besteht immer aus 6 Monaten Grundausbildung zum Soldaten oder zur Soldatin und einer anschließenden Dienstzeit von 1 bis 17 Monaten.","lang":"German","tr":"FWD always consists of six months of basic training followed by another one to seventeen months.","law":"","sourceUrl":"https://web.arbeitsagentur.de/bildung/uebergangszeit/freiwilliger-wehrdienst","lawUrl":"https://www.gesetze-im-internet.de/sg/__58b.html","example":"Someone interested in a six-month commitment may think it is not on offer, or sign up expecting up to 23 months in the same status.","context":"The page’s outgoing Bundeswehr career link now describes the current six-to-eleven-month range. That linked correction does not change the duration statement on the BA page itself. Pay, physical criteria and basic-training content were not adjudicated in this finding.","scope":"Scope: a new commitment in the statutory FWD status from 1 January 2026. SG §58b(1) permits six to eleven months; the first six are probation. The law does not guarantee that every applicant receives a particular offer. The duration change took effect on 1 January 2026 under Article 20(1) WDModG. The former provision applied before that date. No expiry of the new duration rule was identified at the access date. Transition: SG §101(1) preserves former §58b for soldiers already performing FWD on 31 December 2025. A continuing old-law commitment over eleven months is not unlawful for that reason. Section 101(2) provides a conditional application route into SaZ for certain old-law soldiers. Longer voluntary service remains possible under the separate Soldatin/Soldat auf Zeit (SaZ) status. The mismatch concerns the duration described for new FWD applicants, not a cap on every form of voluntary military service.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Er besteht immer aus 6 Monaten Grundausbildung zum Soldaten oder zur Soldatin und einer anschließenden Dienstzeit von 1 bis 17 Monaten.","tr":"FWD always consists of six months of basic training followed by another one to seventeen months.","url":"https://web.arbeitsagentur.de/bildung/uebergangszeit/freiwilliger-wehrdienst","site":"web.arbeitsagentur.de"}]},"wehrdienst-ba-national-overview-duration":{"id":"wehrdienst-ba-national-overview-duration","area":"wehrdienst","topic":"duration","pub":"Federal Employment Agency","src":"HTML careers guide","claim":"says voluntary service lasts 7 to 23 months.","quote":"Der FWD dauert zwischen 7 und 23 Monaten","lang":"German","tr":"FWD lasts between seven and twenty-three months.","law":"","sourceUrl":"https://www.arbeitsagentur.de/bildung/uebergangszeit/uebergangszeit-in-deutschland","lawUrl":"https://www.gesetze-im-internet.de/sg/__58b.html","example":"Someone interested in a six-month commitment may think it is not on offer, or sign up expecting up to 23 months in the same status.","context":"The finding covers this complete FWD accordion and its duration statement, not unrelated gap-year, pay or programme claims. SG §101 preserves former rules for soldiers already serving on 31 December 2025. The current www URL ending uebergangszeit-in-deutschland is distinct from the unresolved web URL ending uebergangszeit-im-inland. The linked detailed FWD page was read as same-publisher context and conservatively not counted again as a new location of the existing detailed-page case.","scope":"Scope: a new commitment in the statutory FWD status from 1 January 2026. SG §58b(1) permits six to eleven months; the first six are probation. The law does not guarantee that every applicant receives a particular offer. The duration change took effect on 1 January 2026 under Article 20(1) WDModG. The former provision applied before that date. No expiry of the new duration rule was identified at the access date. Transition: SG §101(1) preserves former §58b for soldiers already performing FWD on 31 December 2025. A continuing old-law commitment over eleven months is not unlawful for that reason. Section 101(2) provides a conditional application route into SaZ for certain old-law soldiers. Longer voluntary service remains possible under the separate Soldatin/Soldat auf Zeit (SaZ) status. The mismatch concerns the duration described for new FWD applicants, not a cap on every form of voluntary military service.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Der FWD dauert zwischen 7 und 23 Monaten","tr":"FWD lasts between seven and twenty-three months.","url":"https://www.arbeitsagentur.de/bildung/uebergangszeit/uebergangszeit-in-deutschland","site":"arbeitsagentur.de"}]},"wehrdienst-ba-kassel-duration":{"id":"wehrdienst-ba-kassel-duration","area":"wehrdienst","topic":"duration","pub":"Employment Agency Kassel","src":"HTML careers guide","claim":"says you can choose between 7 and 23 months.","quote":"Deine Dienstzeit kannst du selbst zwischen sieben bis 23 Monaten wählen.","lang":"German","tr":"You can choose your service duration yourself between seven and twenty-three months.","law":"","sourceUrl":"https://www.arbeitsagentur.de/vor-ort/kassel/ausbildung-oder-studium/ueberbrueckung","lawUrl":"https://www.gesetze-im-internet.de/sg/__58b.html","example":"Someone interested in a six-month commitment may think it is not on offer, or sign up expecting up to 23 months in the same status.","context":"The finding covers this complete FWD accordion and its duration statement, not unrelated gap-year, pay or programme claims. SG §101 preserves former rules for soldiers already serving on 31 December 2025. A 2024 remuneration parenthesis elsewhere on the page is evidence of stale drafting, not an explicit historical-only restriction on the prospective FWD section.","scope":"Scope: a new commitment in the statutory FWD status from 1 January 2026. SG §58b(1) permits six to eleven months; the first six are probation. The law does not guarantee that every applicant receives a particular offer. The duration change took effect on 1 January 2026 under Article 20(1) WDModG. The former provision applied before that date. No expiry of the new duration rule was identified at the access date. Transition: SG §101(1) preserves former §58b for soldiers already performing FWD on 31 December 2025. A continuing old-law commitment over eleven months is not unlawful for that reason. Section 101(2) provides a conditional application route into SaZ for certain old-law soldiers. Longer voluntary service remains possible under the separate Soldatin/Soldat auf Zeit (SaZ) status. The mismatch concerns the duration described for new FWD applicants, not a cap on every form of voluntary military service.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Deine Dienstzeit kannst du selbst zwischen sieben bis 23 Monaten wählen.","tr":"You can choose your service duration yourself between seven and twenty-three months.","url":"https://www.arbeitsagentur.de/vor-ort/kassel/ausbildung-oder-studium/ueberbrueckung","site":"arbeitsagentur.de"}]},"wehrdienst-drv-duration":{"id":"wehrdienst-drv-duration","area":"wehrdienst","topic":"duration","pub":"German Pension Insurance","src":"HTML guidance","claim":"says voluntary service can last up to 23 months.","quote":"Insgesamt sind also bis zu 23 Monate freiwilliger Wehrdienst möglich.","lang":"German","tr":"Voluntary military service can last up to twenty-three months in total.","law":"","sourceUrl":"https://www.deutsche-rentenversicherung.de/DRV/DE/Rente/Azubis-Studierende-und-Berufseinsteiger/Bundeswehr-und-Freiwilligendienst/bundeswehr-und-freiwilligendienst_node","lawUrl":"https://www.gesetze-im-internet.de/sg/__58b.html","example":"Someone interested in a six-month commitment may think it is not on offer, or sign up expecting up to 23 months in the same status.","context":"A pension article can legitimately discuss earlier service, and SG section 101 preserves the former FWD duration for the specified existing cohort. Military service longer than eleven months also remains possible in the different SaZ status. The general prospective FWD description in this active young-adult careers section lacks the grandfathered-cohort limitation. Publish only the new-entrant mismatch; pension statements are not disproved by this duration check.","scope":"Scope: a new commitment in the statutory FWD status from 1 January 2026. SG §58b(1) permits six to eleven months; the first six are probation. The law does not guarantee that every applicant receives a particular offer. The duration change took effect on 1 January 2026 under Article 20(1) WDModG. The former provision applied before that date. No expiry of the new duration rule was identified at the access date. Transition: SG §101(1) preserves former §58b for soldiers already performing FWD on 31 December 2025. A continuing old-law commitment over eleven months is not unlawful for that reason. Section 101(2) provides a conditional application route into SaZ for certain old-law soldiers. Longer voluntary service remains possible under the separate Soldatin/Soldat auf Zeit (SaZ) status. The mismatch concerns the duration described for new FWD applicants, not a cap on every form of voluntary military service.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Insgesamt sind also bis zu 23 Monate freiwilliger Wehrdienst möglich.","tr":"Voluntary military service can last up to twenty-three months in total.","url":"https://www.deutsche-rentenversicherung.de/DRV/DE/Rente/Azubis-Studierende-und-Berufseinsteiger/Bundeswehr-und-Freiwilligendienst/bundeswehr-und-freiwilligendienst_node","site":"deutsche-rentenversicherung.de"}]},"wehrdienst-ba-recklinghausen-duration-followup":{"id":"wehrdienst-ba-recklinghausen-duration-followup","area":"wehrdienst","topic":"duration","pub":"Employment Agency Recklinghausen","src":"HTML careers guidance","claim":"says voluntary service lasts 7 to 23 months.","quote":"Dauer zwischen 7 und 23 Monate","lang":"German","tr":"Duration between seven and twenty-three months.","law":"","sourceUrl":"https://www.arbeitsagentur.de/vor-ort/recklinghausen/biz-recklinghausen/ausbildung-und-studium/freiwilligendienst/deutschland","lawUrl":"https://www.gesetze-im-internet.de/sg/__58b.html","example":"Someone interested in a six-month commitment may think it is not on offer, or sign up expecting up to 23 months in the same status.","context":"The complete FWD entry gives the former duration as prospective careers guidance and links the Bundeswehr career service. The adjacent Heimatschutz programme is separate and is not adjudicated here. No old-cohort limitation appears in the FWD entry. Prospective new entrants in ordinary FWD under SG §58b from 1 January 2026. SG §101 protects the cohort already serving on 31 December 2025. Longer Soldat-auf-Zeit commitments are a different status. The separate Heimatschutz passage was not adjudicated and no applicant outcome was observed.","scope":"For new statutory FWD commitments from 1 January 2026, SG §58b(1) permits six to eleven months, with the first six as probation under (2). SG §101 preserves former §58b for soldiers already serving on 31 December 2025 and provides a separate conditional transition to SaZ. Longer voluntary military service remains possible under other status, including SaZ; this is not an eleven-month cap on all voluntary service or a guarantee that every applicant receives a particular offer. Prospective new entrants in ordinary FWD under SG §58b from 1 January 2026. SG §101 protects the cohort already serving on 31 December 2025. Longer Soldat-auf-Zeit commitments are a different status. The separate Heimatschutz passage was not adjudicated and no applicant outcome was observed.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Dauer zwischen 7 und 23 Monate","tr":"Duration between seven and twenty-three months.","url":"https://www.arbeitsagentur.de/vor-ort/recklinghausen/biz-recklinghausen/ausbildung-und-studium/freiwilligendienst/deutschland","site":"arbeitsagentur.de"}]},"wehrdienst-bmg-objection-salz":{"id":"wehrdienst-bmg-objection-salz","area":"wehrdienst","topic":"data","pub":"City of Salzgitter","src":"HTML guidance","claim":"says the transfer stops if you object.","quote":"Die Datenübermittlung unterbleibt jedoch, wenn die Betroffenen ihr nach Paragraph 36 Absatz 2 Bundesmeldegesetz (BMG) widersprochen haben.","lang":"German","tr":"This data transfer does not occur if the person objects under BMG §36(2).","law":"","sourceUrl":"https://www.salzgitter.de/rathaus/fachdienste/ordnung/buergercenter/datenuebermittlung-wehrverwaltung.php","lawUrl":"https://www.gesetze-im-internet.de/bmg/__36.html","example":"A German citizen in the SG §58c information-mailing cohort could file the listed military objection expecting it to stop the transfer. The repealed opt-out no longer provides that effect; other protections are separate.","context":"The next sentence explicitly offers the objection to people turning 18 in 2026. The page says the objection can be lodged in writing or through its linked online form. No repeal qualification appears on the dedicated page. The current general Salzgitter service page has removed the military-data bullet from its objection list. That correction does not remove the separate current route through the linked BürgerCenter index to this dedicated guide. The conflict within the publisher’s current guidance is retained rather than hidden. The linked online form timed out and was not inspected or submitted. The www2 alias is not counted as a second publication location.","scope":"WDModG Article 12 number 2(b), physical PDF page 24, deletes BMG §36(2). The corresponding former objection sentence in SG §58c was also removed. The relevant changes took effect on 1 January 2026 under Article 20(1), physical page 28; no expiry was identified at access. This finding is about the former objection to the SG §58c recruitment-information transfer. WPflG §15 compulsory registration/readiness data is a different statutory process. Losing this objection does not make military service compulsory. Other BMG objections, for example for political parties or directories, are unaffected by this particular repeal. BMG §51 protective information blocks require their own
