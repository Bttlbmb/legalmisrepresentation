 insolvency protection includes that accepted money even if accepting it breached the payment schedule.","context":"The preceding general sentence says all customer funds are covered; the next sentence expressly subjects cover to limits and excludes early/excess payments. Section 25 repeats the same contradiction. A lawful payment schedule is not disputed, and the actual guarantee instrument/solvency was not audited.","scope":"PRV section 3(4) effective 29 September 2018; old RSV transition ended no later than 31 January 2019. Limited to accepted funds under the Austrian scheme. The lawful payment timetable is not challenged; no actual guarantee shortfall, insolvency or denied payout is alleged.","date":"2026-10-17","langs":["German"],"countries":["AT"],"versions":[{"lang":"German","quote":"Darüber hinausgehende oder vorzeitig geleistete Anzahlungen bzw. Restzahlungen dürfen nicht gefordert werden und sind auch nicht abgesichert.","tr":"Deposits or balances exceeding those amounts or paid early may not be demanded and are also not protected.","url":"https://www.alpenland-reisen.at/reisebedingungen.html","site":"alpenland-reisen.at"}]},"package-christl-insolvency-payment-exclusion":{"id":"package-christl-insolvency-payment-exclusion","area":"package","topic":"insolvency","pub":"Christl Reisen","src":"Allgemeine Geschäftsbedingungen","claim":"says early or extra payments are not protected.","quote":"Darüber hinausgehende oder vorzeitige geleistete Anzahlungen bzw. Restzahlungen dürfen nicht gefordert werden und sind auch NICHT abgesichert.","lang":"German","tr":"Deposits or balances exceeding those amounts or paid early may not be demanded and are also NOT protected.","law":"","sourceUrl":"https://christl-reisen.at/agb/","lawUrl":"https://www.ris.bka.gv.at/GeltendeFassung.wxe?Abfrage=Bundesnormen&Gesetzesnummer=20010321","example":"An Austrian organiser accepts an early payment for its own qualifying package. Required insolvency protection includes that accepted money even if accepting it breached the payment schedule.","context":"Both payments and insolvency sections repeat the denial in capitalised NICHT. Named guarantee/handler and general PRG reference do not specifically restore accepted early/excess funds. The legacy RSV reference is context, not a separate allegation.","scope":"PRV section 3(4) effective 29 September 2018; old RSV transition ended no later than 31 January 2019. Limited to accepted funds under the Austrian scheme. The lawful payment timetable is not challenged; no actual guarantee shortfall, insolvency or denied payout is alleged.","date":"2026-10-17","langs":["German"],"countries":["AT"],"versions":[{"lang":"German","quote":"Darüber hinausgehende oder vorzeitige geleistete Anzahlungen bzw. Restzahlungen dürfen nicht gefordert werden und sind auch NICHT abgesichert.","tr":"Deposits or balances exceeding those amounts or paid early may not be demanded and are also NOT protected.","url":"https://christl-reisen.at/agb/","site":"christl-reisen.at"}]},"package-beltrame-itinerary":{"id":"package-beltrame-itinerary","area":"package","topic":"changes","pub":"Voyages Beltrame","src":"CGV Voyages, RESPONSABILITÉ","claim":"rules out cancellation when outside events change the route.","quote":"ne constitue pas non plus un motif légitime d’annulation","lang":"French","tr":"does not constitute a legitimate ground for cancellation either","law":"","sourceUrl":"https://voyages-beltrame.com/cgv-voyages/","lawUrl":"https://eur-lex.europa.eu/eli/dir/2015/2302/oj","example":"Before departure, the organiser drops an essential itinerary element because of an external event and cannot perform the agreed package. A qualifying traveller may choose fee-free termination; during-trip rights have additional conditions.","context":"Full surrounding responsibility, maritime, insurance and complaints passages and brochure pages 42–43 were read. Optional medical insurance is separate. The minimum-participant paragraph alone was rejected as a finding: it promises refund but does not expressly deny additional compensation. HTML/PDF are one company wording occurrence.","scope":"Effective dates: L211-13 since 1 July 2018; L211-16 VI protection introduced in the 2018 regime, current article version since 24 May 2019. R211-9 governs the predeparture change refund; R211-10 governs Article L211-14 cancellations. Exceptions: Minor reorderings do not automatically give a cancellation right. During travel, a reasonable chance to remedy normally comes first. Suitable alternatives matter. Extraordinary circumstances may exclude damages; they do not categorically erase cancellation, refund or price-reduction rights.","date":"2026-10-17","langs":["French"],"countries":["FR"],"versions":[{"lang":"French","quote":"ne constitue pas non plus un motif légitime d’annulation","tr":"does not constitute a legitimate ground for cancellation either","url":"https://voyages-beltrame.com/cgv-voyages/","site":"voyages-beltrame.com"},{"lang":"French","quote":"ne constitue pas non plus un motif légitime d’annulation","tr":"does not constitute a legitimate ground for cancellation either","url":"https://voyages-beltrame.com/wp-content/uploads/2026/07/brochure-voyages-compresse.pdf","site":"voyages-beltrame.com · PDF"}]}},"countries":{"AE":"United Arab Emirates","AO":"Angola","AR":"Argentina","AT":"Austria","BE":"Belgium","BJ":"Benin","BW":"Botswana","CA":"Canada","CO":"Colombia","CY":"Cyprus","CZ":"Czechia","DE":"Germany","EG":"Egypt","ES":"Spain","FI":"Finland","FR":"France","GR":"Greece","IE":"Ireland","IN":"India","IT":"Italy","JP":"Japan","KG":"Kyrgyzstan","KR":"South Korea","KZ":"Kazakhstan","MA":"Morocco","ME":"Montenegro","MG":"Madagascar","MN":"Mongolia","MT":"Malta","MW":"Malawi","MY":"Malaysia","NG":"Nigeria","NP":"Nepal","OM":"Oman","PE":"Peru","PH":"Philippines","PK":"Pakistan","PL":"Poland","PT":"Portugal","QA":"Qatar","RU":"Russia","SE":"Sweden","SG":"Singapore","SK":"Slovakia","SN":"Senegal","TT":"Trinidad and Tobago","TW":"Taiwan","UG":"Uganda","UY":"Uruguay","UZ":"Uzbekistan","MM":"Myanmar","VE":"Venezuela","XK":"Kosovo"},"langCodes":{"German":"DE","English":"EN","French":"FR","Spanish":"ES","Italian":"IT","Dutch":"NL","Czech":"CS","Finnish":"FI","Swedish":"SV","Polish":"PL","Portuguese":"PT","Greek":"EL","Slovak":"SK","Japanese":"JA","Turkish":"TR"}};

const AREAS = DATA.areas;
const CASES = DATA.cases;
const AREA = Object.fromEntries(AREAS.map(a => [a.id, a]));
const TOPIC = {};
AREAS.forEach(a => a.topics.forEach(t => { TOPIC[a.id + "~" + t.id] = Object.assign(t, { key: a.id + "~" + t.id, area: a.id }); }));
const SECTORS = [
  { id: "gov", label: "Government", long: "Government guidance" },
  { id: "biz", label: "Companies", long: "Company information" },
];
const LAYOUTS = [
  { id: "A", name: "Before" },
  { id: "A1", name: "Labels" },
  { id: "A2", name: "Columns" },
  { id: "A3", name: "By country" },
  { id: "B", name: "Reader" },
  { id: "C", name: "Patterns" },
];
const LANG = { German: "de", English: "en", French: "fr", Spanish: "es", Italian: "it", Dutch: "nl", Czech: "cs",
  Finnish: "fi", Swedish: "sv", Polish: "pl", Portuguese: "pt", Greek: "el", Slovak: "sk", Japanese: "ja" };

// Citations join provisions with " · "; keep the dot on the line of the provision before it.
const provText = p => esc(p).replace(/ · /g, "&nbsp;· ");
const esc = s => String(s ?? "").replace(/[&<>"]/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const nCases = a => a.topics.reduce((s, t) => s + t.cases.length, 0);
const topicOf = c => TOPIC[c.area + "~" + c.topic];
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const fmtDate = d => new Date(d + "T12:00:00").toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
const listJoin = xs => xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " and " + xs[xs.length - 1];
const TOTAL = { areas: AREAS.length, topics: Object.keys(TOPIC).length, cases: Object.keys(CASES).length };
const MAXT = Math.max(...Object.values(TOPIC).map(t => t.cases.length));
const href = (L, kind, id) => "#" + [L, kind, id].filter(Boolean).join(".");

function state() {
  const [L, kind, id] = decodeURIComponent(location.hash.slice(1)).split(".");
  const s = { L: LAYOUTS.some(x => x.id === L) ? L : "A1", kind: kind || "home", id: id || "" };
  if ((s.kind === "area" && !AREA[s.id]) || (s.kind === "topic" && !TOPIC[s.id]) || (s.kind === "case" && !CASES[s.id])) s.kind = "home";
  return s;
}

/* ---------- shared pieces ---------- */
function protoBar(s) {
  if (!LAYOUTS.some(l => l.tab)) return "";
  const tabs = LAYOUTS.filter(l => l.tab).map(l => `<a href="${href(l.id, s.kind === "home" ? "" : s.kind, s.id)}" aria-current="${l.id === s.L}">${l.id === "A" ? "" : `<span>${l.id.slice(1)}</span>`}${l.name}</a>`).join("");

            <td>${esc(a.langs.length > 3 ? `${a.langs.length} languages` : listJoin(a.langs))}${a.langs.length > 3 ? `<br><span class="mono">${a.langs.map(l => LC[l]).join(" ")}</span>` : ""}</td>
            <td class="num"><span class="count-c">${nCases(a)}</span></td></tr>`).join("")}</tbody></table></div></section>`;
        return `<section class="sector">${head}<ul>${as.map(a => `<li><a class="area-row" href="${href(L, "area", a.id)}">
            <div class="area-main"><h3>${areaTitle(a)}</h3>
              ${L === "A1" && !homeOnly(a) ? `<p class="scope"><span>${esc(whereShort(a))}</span><span class="law-s">${esc(a.lawShort)}</span><span>${esc(langsShort(a))}</span></p>` : ""}
              <p>${esc(a.intro)}</p>
              ${L === "A3" ? (a.countries.length > 1 ? `<div class="cc-chips" title="${esc(countryList(a.countries, 99))}">${a.countries.slice(0, 14).map(cc => `<span class="cc">${cc}</span>`).join("")}${a.countries.length > 14 ? `<span class="cc">+${a.countries.length - 14}</span>` : ""}</div>` : `<p class="by">${esc(a.publishers)}</p>`) : L !== "A1" || homeOnly(a) ? `<p class="by">${esc(a.publishers)}</p>` : ""}
            </div>
            <ol class="issues-mini" aria-label="Issues">${a.topics.map(t => `<li><span class="t">${esc(t.title)}</span><span class="bar"><i style="--w:${(t.cases.length / MAXT * 100).toFixed(1)}%"></i></span><span class="n">${t.cases.length}</span></li>`).join("")}</ol>
            <span class="count">${nCases(a)}<small>cases</small></span>
          </a></li>`).join("")}</ul></section>`;
      }).join("");
  } else if (s.kind === "area" || s.kind === "topic") {
    const a = s.kind === "area" ? AREA[s.id] : AREA[TOPIC[s.id].area];
    const sc = SECTOR_SCOPE[a.sector];
    body = `<nav class="crumbs" aria-label="Breadcrumb"><a href="${href(L)}">← All areas</a></nav>
      <header class="area-head"><p class="eyebrow">${L === "A3" ? sc.jur : sc.title}</p><h1>${areaTitle(a)}</h1><p class="lede">${esc(a.intro)}</p>
      ${L === "A1" ? scopeHead(a) : strip(a)}</header>
      ${L === "A3" && a.countries.length > 1 ? matrix(a, L) : ""}
      ${L === "A1" ? "" : `<nav class="toc" aria-label="Issues">${a.topics.map(t => `<a href="${href(L, "topic", t.key)}">${esc(t.title)}<span>${t.cases.length}</span></a>`).join("")}</nav>`}
      ${a.topics.map(t => `<section class="issue" id="i-${t.key}">
        <div class="issue-head"><h2>${esc(t.title)}</h2>${keys(t)}<p class="issue-law">${esc(t.law)} <a class="prov" href="${esc(t.lawUrl)}" target="_blank" rel="noopener">${provText(t.provision)}</a></p></div>
        ${L === "A2" ? caseTable(t, a, L) : L === "A3" && a.countries.length > 1 ? `<div>${groupedRows(t, L)}</div>` : `<div class="rows">${L === "A1" ? groupedRowsS(t, L) : t.cases.map(id => rowS(CASES[id], L)).join("")}</div>`}
      </section>`).join("")}`;
  } else {
    const c = CASES[s.id], a = AREA[c.area], t = topicOf(c);
    body = `<nav class="crumbs" aria-label="Breadcrumb"><a href="${href(L)}">All areas</a><span>/</span><a href="${href(L, "area", a.id)}">${esc(a.title)}</a><span>/</span><a href="${href(L, "topic", t.key)}">${esc(t.title)}</a></nav>
      <div class="case-wrap">${caseViewS(c)}${issueList(c, L)}</div>`;
  }
  return `<div class="A ${L}">${siteBar(L)}<main class="wrap">${body}</main></div>`;
}

/* ================= B · Reader ================= */
function renderB(s) {
  let c, a;
  if (s.kind === "case") c = CASES[s.id];
  else if (s.kind === "topic") c = CASES[TOPIC[s.id].cases[0]];
  else if (s.kind === "area") c = CASES[AREA[s.id].topics[0].cases[0]];
  else c = CASES[AREAS[0].topics[0].cases[0]];
  a = AREA[c.area];
  const t = topicOf(c);
  const nav = SECTORS.map(sec => `<div class="nav-group"><p class="eyebrow">${sec.label}</p>
    ${AREAS.filter(x => x.sector === sec.id).map(x => `<a class="nav-area" href="${href("B", "area", x.id)}" aria-current="${x.id === a.id}">${esc(x.title)}<span>${nCases(x)}</span></a>
      ${x.id === a.id ? `<div class="nav-topics">${x.topics.map(tt => `<a class="nav-topic" href="${href("B", "topic", tt.key)}">${esc(tt.title)}<span>${tt.cases.length}</span></a>`).join("")}</div>` : ""}`).join("")}
  </div>`).join("");
  const select = `<select class="area-select" id="area-select" aria-label="Area">${SECTORS.map(sec => `<optgroup label="${sec.label}">${AREAS.filter(x => x.sector === sec.id).map(x => `<option value="${x.id}" ${x.id === a.id ? "selected" : ""}>${esc(x.title)} (${nCases(x)})</option>`).join("")}</optgroup>`).join("")}</select>`;
  const list = `<header class="list-head"><p class="eyebrow">${SECTORS.find(x => x.id === a.sector).long}</p><h1>${areaTitle(a)}</h1><p>${esc(a.intro)}</p></header>
    ${a.topics.map(tt => `<section class="l-issue" id="l-${tt.key}"><div class="l-issue-head"><h2>${esc(tt.title)}</h2>${keys(tt)}</div>
      ${tt.cases.map(id => { const x = CASES[id]; return `<a class="l-row" href="${href("B", "case", id)}" aria-current="${id === c.id}"><b>${esc(x.pub)}</b> ${esc(x.claim)}</a>`; }).join("")}</section>`).join("")}`;
  return `<div class="B">${siteBar("B", select)}<div class="reader">
    <nav class="pane nav" aria-label="Areas">${nav}</nav>
    <section class="pane list" id="b-list" aria-label="Cases">${list}</section>
    <section class="pane detail" id="b-detail" aria-label="Case">${caseView(c, "B")}<div style="height:24px"></div>${pager(c, "B")}</section>
  </div></div>`;
}
function afterB(s, prev) {
  const listPane = document.getElementById("b-list");
  const sel = document.querySelector('.l-row[aria-current="true"]');
  const narrow = matchMedia("(max-width: 900px)").matches;
  document.getElementById("area-select").addEventListener("change", e => { location.hash = href("B", "area", e.target.value); });
  if (narrow) {
    if (s.kind === "case") document.getElementById("b-detail").scrollIntoView({ block: "start" });
    else window.scrollTo(0, 0);
    return;
  }
  if (prev && prev.L === "B" && prev.listTop != null) listPane.scrollTop = prev.listTop;
  if (s.kind === "topic") {
    const sec = document.getElementById("l-" + s.id);
    listPane.scrollTop = sec.offsetTop - listPane.offsetTop;
  } else if (sel) {
    const r = sel.getBoundingClientRect(), p = listPane.getBoundingClientRect();
    if (r.top < p.top + 70 || r.bottom > p.bottom) sel.scrollIntoView({ block: "center" });
  }
  document.getElementById("b-detail").scrollTop = 0;
}

/* ================= C · Patterns ================= */
let filterC = "all";
function renderC(s) {
  let body = "", drawer = "";
  if (s.kind === "home" || s.kind === "area") {
    const shown = AREAS.filter(a => filterC === "all" || a.sector === filterC);
    const f = [["all", "All", TOTAL.topics], ...SECTORS.map(x => [x.id, x.label, AREAS.filter(a => a.sector === x.id).reduce((n, a) => n + a.topics.length, 0)])];
    body = `<section class="hero"><h1>What you’re told vs. what the law says</h1><p class="lede">${intro}</p></section>
      <div class="filters" role="group" aria-label="Filter by source">${f.map(([id, label, n]) => `<button type="button" data-f="${id}" aria-pressed="${filterC === id}">${label}<span>${n}</span></button>`).join("")}</div>
      ${shown.map(a => `<section class="c-area" id="c-${a.id}">
        <header class="c-area-head"><h2>${areaTitle(a)}</h2><p>${SECTORS.find(x => x.id === a.sector).label} · ${plural(nCases(a), "case", "cases")}</p></header>
        <div class="grid">${a.topics.map(t => `<a class="card" href="${href("C", "topic", t.key)}">
          <p class="card-t">${esc(t.title)}</p>
          <dl class="pair"><div class="law"><dt>Law</dt><dd>${esc(t.lawKey)}</dd></div><div class="claim"><dt>Sources</dt><dd><span class="mark">${esc(t.claimKey)}</span></dd></div></dl>
          <p class="card-n"><span>${plural(t.cases.length, "source", "sources")}</span><span aria-hidden="true">→</span></p>
        </a>`).join("")}</div></section>`).join("")}`;
  } else {
    const c = s.kind === "case" ? CASES[s.id] : null;
    const t = c ? topicOf(c) : TOPIC[s.id], a = AREA[t.area];
    body = `<nav class="crumbs" aria-label="Breadcrumb"><a href="${href("C")}">All issues</a><span>/</span><a href="${href("C", "area", a.id)}">${esc(a.title)}</a></nav>
      <header class="c-topic-head"><p class="eyebrow">${esc(a.title)} · ${SECTORS.find(x => x.id === a.sector).label}</p><h1>${esc(t.title)}</h1>
        <div class="big-pair"><div class="law"><span class="lab">The law</span><span class="big">${esc(t.lawKey)}</span></div>
        <div class="claim"><span class="lab">What sources say</span><span class="big"><span class="mark">${esc(t.claimKey)}</span></span></div></div>
        <p class="lede">${esc(t.law)} <a class="prov" href="${esc(t.lawUrl)}" target="_blank" rel="noopener">${provText(t.provision)} ↗</a></p></header>
      <h2 class="list-h">${plural(t.cases.length, "source", "sources")}</h2>
      <div class="rows">${t.cases.map(id => caseRow(CASES[id], "C")).join("")}</div>`;
    if (c) drawer = `<div class="drawer" role="dialog" aria-modal="true" aria-label="Case"><a class="scrim" href="${href("C", "topic", t.key)}" aria-label="Close" tabindex="-1"></a>
      <aside class="sheet" id="sheet"><div class="sheet-bar"><span class="eyebrow">Case ${t.cases.indexOf(c.id) + 1} of ${t.cases.length}</span><a class="close" href="${href("C", "topic", t.key)}">Close</a></div>
      ${caseView(c, "C")}${pager(c, "C")}</aside></div>`;
  }
  return `<div class="C">${siteBar("C")}<main class="wrap">${body}</main>${drawer}</div>`;
}
function afterC(s, prev) {
  document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
    filterC = b.dataset.f;
    const y = scrollY; render(); scrollTo(0, Math.min(y, document.querySelector(".filters").offsetTop));
  }));
  const topicKey = x => x.kind === "case" ? topicOf(CASES[x.id]).key : x.kind === "topic" ? x.id : "";
  if (s.kind === "case") {
    document.body.style.overflow = "hidden";
  }
  if (s.kind === "area") document.getElementById("c-" + s.id).scrollIntoView({ block: "start" });
  else if (!(prev && prev.L === "C" && topicKey(prev) && topicKey(prev) === topicKey(s))) window.scrollTo(0, 0);
}

/* ---------- render ---------- */
let last = null;
function render() {
  const s = state();
  const prev = last && Object.assign({}, last, { listTop: document.getElementById("b-list")?.scrollTop });
  document.getElementById("root").innerHTML = protoBar(s) + (s.L === "A" ? renderA(s) : s.L[0] === "A" ? renderAS(s) : s.L === "B" ? renderB(s) : renderC(s));
  document.documentElement.classList.toggle("reader-mode", s.L === "B");
  document.body.style.overflow = "";
  if (s.L[0] === "A") afterA(s);
  if (s.L === "B") afterB(s, prev);
  if (s.L === "C") afterC(s, prev);
  last = s;
}
window.addEventListener("hashchange", render);
document.addEventListener("keydown", e => {
  const s = state();
  if (e.key === "Escape" && s.L === "C" && s.kind === "case") location.hash = href("C", "topic", topicOf(CASES[s.id]).key);
});
render();
</script>

</body>
</html>
