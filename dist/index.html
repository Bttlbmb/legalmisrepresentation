ined. No form was submitted and no actual rejection or harm was established.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"das Bundesamt für das Personalmanagement in der Bundeswehr im Zusammenhang mit der Übersendung von Informationsmaterial.","tr":"The Bundeswehr information-mailing transfer is listed among transfers that can be opposed by an objection.","url":"https://www.samtgemeinde-ilmenau.de/home/buergerservice/bleiben-sie-informiert/zustaendigkeitsfinder.aspx/oeid-9423049/anliegenid-8665897/","site":"samtgemeinde-ilmenau.de"}]},"wehrdienst-bmg-objection-oelde-followup":{"id":"wehrdienst-bmg-objection-oelde-followup","area":"wehrdienst","topic":"data","pub":"City of Oelde","src":"HTML service guidance","claim":"lists the Bundeswehr transfer among those you can object to.","quote":"das Bundesamt für das Personalmanagement in der Bundeswehr im Zusammenhang mit der Übersendung von Informationsmaterial (nicht über 18-Jährige).","lang":"German","tr":"The Federal Office of Bundeswehr Personnel in connection with sending information material (not concerning people over eighteen).","law":"","sourceUrl":"https://serviceportal.oelde.de/detail/-/vr-bis-detail/dienstleistung/656/show","lawUrl":"https://www.gesetze-im-internet.de/bmg/__36.html","example":"A German citizen in the SG §58c information-mailing cohort could file the listed military objection expecting it to stop the transfer. The repealed opt-out no longer provides that effect; other protections are separate.","context":"The complete service description lists the Bundeswehr information-mailing recipient among transfers against which a block can be requested, then offers personal or online objections. Other objection categories remain distinct; no form was submitted. Only the former military information-transfer objection under BMG §36(2), relating to SG §58c. Other BMG §42/§50 objections, §51 protected-address restrictions and WPflG §15 readiness data are separate. No submitted objection or actual data handling was observed.","scope":"WDModG Article 12 number 2(b), physical page 24 of BGBl. 2025 I No. 370, repealed BMG §36(2); the corresponding objection sentence was removed from SG §58c. Article 20(1), physical page 28, makes this effective 1 January 2026. SG §58c still authorizes the specified information-mailing transfer and limits purpose and retention. The former military-specific objection no longer blocks this transfer. Separate BMG §42/§50 objections, §51 protective blocks and WPflG §15 readiness data are distinct. Only the former military information-transfer objection under BMG §36(2), relating to SG §58c. Other BMG §42/§50 objections, §51 protected-address restrictions and WPflG §15 readiness data are separate. No submitted objection or actual data handling was observed.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"das Bundesamt für das Personalmanagement in der Bundeswehr im Zusammenhang mit der Übersendung von Informationsmaterial (nicht über 18-Jährige).","tr":"The Federal Office of Bundeswehr Personnel in connection with sending information material (not concerning people over eighteen).","url":"https://serviceportal.oelde.de/detail/-/vr-bis-detail/dienstleistung/656/show","site":"serviceportal.oelde.de"}]},"wehrdienst-bmg-objection-herzogenrath-followup":{"id":"wehrdienst-bmg-objection-herzogenrath-followup","area":"wehrdienst","topic":"data","pub":"City of Herzogenrath","src":"HTML service guidance","claim":"says the transfer stops if you object.","quote":"Bei einem Widerspruch gemäß § 36 Absatz 2 Satz 1 BMG werden die Daten nicht übermittelt.","lang":"German","tr":"If an objection is made under BMG section 36 paragraph 2 sentence 1, the data will not be transferred.","law":"","sourceUrl":"https://service.herzogenrath.de/detail/-/vr-bis-detail/dienstleistung/78981/show","lawUrl":"https://www.gesetze-im-internet.de/bmg/__36.html","example":"A German citizen in the SG §58c information-mailing cohort could file the listed military objection expecting it to stop the transfer. The repealed opt-out no longer provides that effect; other protections are separate.","context":"The complete military-information subsection promises nontransmission following the former §36(2) objection, without a repeal or historical-cohort qualification. Separate protective and other objection procedures elsewhere on the page do not restore this deleted right. Only the former military information-transfer objection under BMG §36(2), relating to SG §58c. Other BMG §42/§50 objections, §51 protected-address restrictions and WPflG §15 readiness data are separate. No submitted objection or actual data handling was observed.","scope":"WDModG Article 12 number 2(b), physical page 24 of BGBl. 2025 I No. 370, repealed BMG §36(2); the corresponding objection sentence was removed from SG §58c. Article 20(1), physical page 28, makes this effective 1 January 2026. SG §58c still authorizes the specified information-mailing transfer and limits purpose and retention. The former military-specific objection no longer blocks this transfer. Separate BMG §42/§50 objections, §51 protective blocks and WPflG §15 readiness data are distinct. Only the former military information-transfer objection under BMG §36(2), relating to SG §58c. Other BMG §42/§50 objections, §51 protected-address restrictions and WPflG §15 readiness data are separate. No submitted objection or actual data handling was observed.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Bei einem Widerspruch gemäß § 36 Absatz 2 Satz 1 BMG werden die Daten nicht übermittelt.","tr":"If an objection is made under BMG section 36 paragraph 2 sentence 1, the data will not be transferred.","url":"https://service.herzogenrath.de/detail/-/vr-bis-detail/dienstleistung/78981/show","site":"service.herzogenrath.de"}]},"wehrdienst-bmg-objection-juechen-followup":{"id":"wehrdienst-bmg-objection-juechen-followup","area":"wehrdienst","topic":"data","pub":"Town of Jüchen","src":"HTML service guidance","claim":"says the transfer stops if you object.","quote":"Bei einem Widerspruch gemäß § 36 Absatz 2 Satz 1 BMG werden die Daten nicht übermittelt.","lang":"German","tr":"If an objection is made under BMG section 36 paragraph 2 sentence 1, the data will not be transferred.","law":"","sourceUrl":"https://juechen.kommunalportal.nrw/detail/-/vr-bis-detail/dienstleistung/17565/show","lawUrl":"https://www.gesetze-im-internet.de/bmg/__36.html","example":"A German citizen in the SG §58c information-mailing cohort could file the listed military objection expecting it to stop the transfer. The repealed opt-out no longer provides that effect; other protections are separate.","context":"The complete military-information subsection promises nontransmission following the former §36(2) objection, without a repeal or historical-cohort qualification. Separate protective and other objection procedures elsewhere on the page do not restore this deleted right. Only the former military information-transfer objection under BMG §36(2), relating to SG §58c. Other BMG §42/§50 objections, §51 protected-address restrictions and WPflG §15 readiness data are separate. No submitted objection or actual data handling was observed.","scope":"WDModG Article 12 number 2(b), physical page 24 of BGBl. 2025 I No. 370, repealed BMG §36(2); the corresponding objection sentence was removed from SG §58c. Article 20(1), physical page 28, makes this effective 1 January 2026. SG §58c still authorizes the specified information-mailing transfer and limits purpose and retention. The former military-specific objection no longer blocks this transfer. Separate BMG §42/§50 objections, §51 protective blocks and WPflG §15 readiness data are distinct. Only the former military information-transfer objection under BMG §36(2), relating to SG §58c. Other BMG §42/§50 objections, §51 protected-address restrictions and WPflG §15 readiness data are separate. No submitted objection or actual data handling was observed.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Bei einem Widerspruch gemäß § 36 Absatz 2 Satz 1 BMG werden die Daten nicht übermittelt.","tr":"If an objection is made under BMG section 36 paragraph 2 sentence 1, the data will not be transferred.","url":"https://juechen.kommunalportal.nrw/detail/-/vr-bis-detail/dienstleistung/17565/show","site":"juechen.kommunalportal.nrw"}]},"wehrdienst-ni-mun-01":{"id":"wehrdienst-ni-mun-01","area":"wehrdienst","topic":"data","pub":"City of Braunschweig","src":"HTML guidance","claim":"says you can object to the transfer orally or online.","quote":"Sie können dieser Datenübermittlung mündlich oder online widersprechen.","lang":"German","tr":"You can object to this data transfer orally or online.","law":"","sourceUrl":"https://www.braunschweig.de/vv/produkte/II/32/32_4/32_41/wehrerfassung.php","lawUrl":"https://www.gesetze-im-internet.de/bmg/__36.html","example":"A German citizen in the SG §58c information-mailing cohort could file the listed military objection expecting it to stop the transfer. The repealed opt-out no longer provides that effect; other protections are separate.","context":"The page introduces the subject through the 2011 reform, describes annual information-material transfers and then affirmatively offers an oral or online objection. The current citizen-services office links this exact page. Its statutory citation and other registration statements are not separate findings. The linked application was not opened or submitted.","scope":"BMG §36(2) was repealed on 1 January 2026 by WDModG Article 12 no. 2(b), physical p24, effective under Article 20(1), p28; current §36 no longer contains it. SG §58c now prescribes the annual transfer for information material without the former objection condition. This is separate from WPflG compulsory registration and does not establish compulsory military service. Other objections under BMG §§42/50 and protective information blocks have separate legal conditions. SG §58c purpose limitation and deletion after one year remain. Only the affirmative military-information objection offer; other dated registration claims and inaccurate statutory citation are not separately scored. No form submission, refusal, actual transmission or resulting harm was observed.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Sie können dieser Datenübermittlung mündlich oder online widersprechen.","tr":"You can object to this data transfer orally or online.","url":"https://www.braunschweig.de/vv/produkte/II/32/32_4/32_41/wehrerfassung.php","site":"braunschweig.de/vv"}]},"wehrdienst-hessen-travel-permission":{"id":"wehrdienst-hessen-travel-permission","area":"wehrdienst","topic":"abroad","pub":"Hesse service portal","src":"HTML administrative service","claim":"says you must apply for permission in good time before you leave.","quote":"Der Antrag muss rechtzeitig vor der Ausreise aus Deutschland gestellt werden","lang":"German","tr":"The application must be made in good time before departure from Germany.","law":"","sourceUrl":"https://verwaltungsportal.hessen.de/leistung?leistung_id=B100019_590841","lawUrl":"https://www.bundesanzeiger.de/pub/publication/s3E2bAQkIs1H4MXAdlu/content/s3E2bAQkIs1H4MXAdlu/BAnz%20AT%2016.04.2026%20B3.pdf?inline=","example":"A German man planning a year abroad in a situation covered by WPflG §3(2) could prepare an individual application that the current general exemption removes.","context":"The 4 February 2011 professional approval is visible. The 1 December 2025 technical modification predates the exemption and does not prove a legal update. Publication currentness rests on its continued catalogue offer, not a claim that the text was freshly written. The general exemption was checked in the original one-page Bundesanzeiger publication, not inferred from a simplified FAQ. The correct Foreign Office FAQ is retained as countercontext.","scope":"WPflG §3(2) contains a permission rule for covered men after their seventeenth birthday leaving Germany for more than three months, extending a permitted stay, or extending a previously permission-free stay beyond three months. The residence conditions and the statutory scope must be checked; this is separate from the readiness-questionnaire cohort. Using §3(2) sentence 5, the BMVg general order exempts all male persons otherwise subject to that permission requirement. Part I expressly removes any prior individual application or individual permission. The order was published on 16 April 2026 and became effective the next day, 17 April 2026, under part III. No fixed expiry appears in the checked order; it states the current position and may be changed in future. This is a general exception under the still-existing statute, not repeal of §3(2), a blanket exemption from every military duty or a promise about future emergencies. Ordinary registration and other independently applicable duties remain. No actual application, travel delay or official decision was observed. The current Foreign Office FAQ dated 20 April 2026 correctly describes the general exception. The Hessen entry’s 2011 professional approval and 2025 technical modification are disclosed; technical modification alone is not evidence of legal revision.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Der Antrag muss rechtzeitig vor der Ausreise aus Deutschland gestellt werden","tr":"The application must be made in good time before departure from Germany.","url":"https://verwaltungsportal.hessen.de/leistung?leistung_id=B100019_590841","site":"verwaltungsportal.hessen.de"}]},"wehrdienst-unit122-probation":{"id":"wehrdienst-unit122-probation","area":"wehrdienst","topic":"probation","pub":"Bundeswehr, Armoured Infantry Battalion 122","src":"HTML guidance","claim":"says you must always give four weeks’ notice.","quote":"ist hier eine Kündigungsfrist von vier Wochen einzuhalten","lang":"German","tr":"a notice period of four weeks must be observed here","law":"","sourceUrl":"https://www.bundeswehr.de/de/organisation/heer/struktur/10-panzerdivision/panzerbrigade-45/panzergrenadierbataillon-122/panzergrenadierbataillon-122-basisausbildung","lawUrl":"https://www.gesetze-im-internet.de/sg/__58h.html","example":"An FWD soldier requesting discharge during month six could think another four weeks are mandatory. That advance-request period does not apply, although discharge dates remain restricted.","context":"The entire withdrawal answer and surrounding six-month timetable were read. The follow-on sentence says service may continue for up to six weeks; it contains no separate month-six qualification. This finding does not rely on an old three-month basic-training model. The guide itself uses six months of training. Its SaZ withdrawal paragraph is outside this finding.","scope":"SG §58h(2) permits a written personal request during FWD probation for discharge on the fifteenth or last day of a month. The one-calendar-month advance-request requirement is expressly limited to the first five months. In month six that personal period does not apply. The current first-five-month distinction took effect on 23 December 2023 under the Act of 20 December 2023 (BGBl. 2023 I No. 392), Article 1 number 10 and Article 7. It predates the guide’s 8 December 2025 publication. No expiry was identified at access. The authority’s discharge order has a separate two-week notification provision. That is not a four-week personal request requirement. Written procedure, permitted dates and the actual service status remain relevant; this is not a promise of immediate departure on any day. Four weeks also differs from a calendar month. The confirmed proposition here is narrower: extending a fixed personal advance-request period into month six. It does not adjudicate the guide’s separate SaZ paragraph or other discharge grounds. Current central Bundeswehr call-up guidance and the January 2026 FWD flyer’s physical page 2 footnote correctly distinguish the first five months from month six. They are retained as same-publisher countercontext.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"ist hier eine Kündigungsfrist von vier Wochen einzuhalten","tr":"a notice period of four weeks must be observed here","url":"https://www.bundeswehr.de/de/organisation/heer/struktur/10-panzerdivision/panzerbrigade-45/panzergrenadierbataillon-122/panzergrenadierbataillon-122-basisausbildung","site":"bundeswehr.de/de"}]},"wehrdienst-bw-hub-truck-licence":{"id":"wehrdienst-bw-hub-truck-licence","area":"wehrdienst","topic":"licence","pub":"Bundeswehr","src":"HTML guidance","claim":"says the licence must be issued within one year of leaving.","quote":"Das Ausstellungsdatum auf dem Führerschein darf nicht mehr als ein Jahr nach dem Dienstzeitende liegen.","lang":"German","tr":"The licence issue date must be no more than one year after the end of service.","law":"","sourceUrl":"https://www.bundeswehr.de/de/menschen-karrieren/neuer-wehrdienst","lawUrl":"https://www.gesetze-im-internet.de/sg/__31c.html","example":"A future otherwise eligible first-time entrant who completes twelve continuous months and acquires a first C/C1 licence 18 months after service remains within the acquisition window. Timely application and the other conditions still matter.","context":"The complete shared paragraph was read, not just a search snippet. Its general deadline is not limited to class B. A separate possible ambiguity about partial funding by another body is retained in the research log. It is not counted as another confirmed contradiction.","scope":"SG §31c requires a first voluntary service commitment with actual entry on or after 1 January 2026 and at least twelve continuous completed months of service. Signing a twelve-month commitment alone is insufficient. The first C/C1 acquisition must fall within twelve months before entry through thirty-six months after the end of service. Class B uses twelve months after service. The application deadline is separate: twelve months after both the qualifying service and acquisition conditions are met. Payment covers evidenced eligible actual costs, subject to the statutory rules against double funding and caps of €5,000 for C/C1 or €3,500 for B. The benefits are alternatives. This is not an advance or an unconditional payment promise. WDModG Article 3 number 6 introduced SG §§31b/31c; effective 1 January 2026 under Article 20(1), physical PDF pages 8–9 and 28. No expiry was identified. At 17 October 2026 the earliest qualifying twelve-month completions are still future; no existing recipient’s lost payment is inferred. The main hub directly links a detailed Bundeswehr guide dated 6 February 2026 which correctly distinguishes the 12- and 36-month acquisition windows. That countercontext does not change the hub’s unrestricted sentence.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Das Ausstellungsdatum auf dem Führerschein darf nicht mehr als ein Jahr nach dem Dienstzeitende liegen.","tr":"The licence issue date must be no more than one year after the end of service.","url":"https://www.bundeswehr.de/de/menschen-karrieren/neuer-wehrdienst","site":"bundeswehr.de/de"}]},"wehrdienst-fwd-flyer-discharge-money":{"id":"wehrdienst-fwd-flyer-discharge-money","area":"wehrdienst","topic":"discharge","pub":"Bundeswehr careers","src":"PDF flyer","claim":"advertises discharge money from six months of service.","quote":"100 Euro Entlassungsgeld pro Monat (ab 6 Monaten Dienstzeit, steuerpflichtig)","lang":"German","tr":"€100 discharge money per month from six months of service.","law":"","sourceUrl":"https://www.bundeswehrkarriere.de/downloads/freiwilliger-wehrdienst/2394","lawUrl":"https://www.gesetze-im-internet.de/wsg_2020/__8.html","example":"A person whose qualifying FWD lasts exactly six months could expect discharge money from the flyer. That duration fails the statutory more-than-six-month threshold; actual service dates matter.","context":"The retained quote follows visible PDF spacing. The narrow error is the inclusion of exactly six months, not the monthly €100 rate or taxation. The initial audit checked duration and withdrawal in this same flyer. The expanded pass separately adjudicated its discharge-money bullet; the earlier selected review was not a full legal certificate.","scope":"WSG §8(1) requires more than six months of service. Section 8(2) sets €100 per month of qualifying voluntary service with a Wehrsold entitlement. Exactly six months is insufficient; the finding does not require seven completed months. The more-than-six-month threshold was already in the WSG when it entered into force on 1 January 2020. It remains in the current law after the 2026 amendments. The new SG §58b minimum of six months took effect on 1 January 2026, making the distinction relevant within the flyer’s advertised programme. No expiry was identified. For calculation of the amount, WSG §8(3) excludes specified extension periods for inpatient treatment. Section 8(4) separately excludes specified discharge or removal cases from entitlement. Actual service entry and end dates, including SG §2(3) adjustments, can matter. No individual benefit calculation or assumed €600 loss is made. The finding concerns FWD with Wehrsold under WSG §1, not separate SaZ transition benefits. The flyer’s tax wording and other financial figures are outside this adjudication. Same-publisher March 2026 pay examples, physical page 2, correctly specify six months plus one day. The January flyer also correctly states the sixth-month withdrawal rule; checking that separate rule in the initial pass did not certify every benefit statement.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"100 Euro Entlassungsgeld pro Monat (ab 6 Monaten Dienstzeit, steuerpflichtig)","tr":"€100 discharge money per month from six months of service.","url":"https://www.bundeswehrkarriere.de/downloads/freiwilliger-wehrdienst/2394","site":"bundeswehrkarriere.de"}]},"bafoeg-baf-01-02":{"id":"bafoeg-baf-01-02","area":"bafoeg","topic":"age","pub":"Deutsches Studierendenwerk","src":"national association FAQ","claim":"says you must start before your 44th birthday.","quote":"das 44. Lebensjahr noch nicht vollendet sein.","lang":"German","tr":"[you] must not yet have turned 44.","law":"","sourceUrl":"https://www.studierendenwerke.de/fileadmin/user_upload/FAQ_BAfoeG_01-2026.pdf#page=1","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__10.html","example":"A 40-year-old starting a Bachelor’s in 2026 meets the age condition. These pages suggest they are too old.","context":"Current download offered on the DSW BAföG overview. Verified 17 October 2026: the DSW BAföG overview, Downloads, links FAQ_BAfoeG_01-2026.pdf. Link source is in the source register. Current DSW linking page · Downloads: https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg | Related DSW requirements HTML: https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","scope":"The 45-year limit applies from 1 August 2022 under the 27th BAföG amendment’s then-§ 66a(2). The Act was promulgated 21 July 2022; its general commencement was 22 July 2022. The age rule has its own application date. The former carryover for older approval periods in then-§ 66a(3) did not preserve the old § 10 age limit. No relevant current transition supports 30/35 or 44 as the ordinary limit for a new phase in 2026. At or after 45, § 10(3) sentence 2 Nos. 1, 1a, 1b, 2, 3 and 4 provides specified exceptions: entrance qualifications through certain later education routes, vocational admission, certain further training, an immediate qualifying Master, personal or family impediments, or qualifying new need after a major personal change. Prompt-start requirements apply to specified routes. Age is assessed at the start of the training phase; a birthday during that phase is not automatically disqualifying. Age 30 for parental-income independence under § 11(3) No. 2 is a separate rule. All other personal, course and means-test conditions still apply.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"das 44. Lebensjahr noch nicht vollendet sein.","tr":"[you] must not yet have turned 44.","url":"https://www.studierendenwerke.de/fileadmin/user_upload/FAQ_BAfoeG_01-2026.pdf#page=1","site":"studierendenwerke.de · PDF"}]},"bafoeg-baf-01-01":{"id":"bafoeg-baf-01-01","area":"bafoeg","topic":"age","pub":"Leibniz Universität Hannover","src":"family service","claim":"says the age limit is 30, or 35 for a Master’s.","quote":"Die BAföG-Altersgrenze liegt bei 30, bei Masterstudiengängen bei 35 Jahren.","lang":"German","tr":"The BAföG age limit is 30, or 35 for Master’s programmes.","law":"","sourceUrl":"https://www.chancenvielfalt.uni-hannover.de/familienservice/studieren-mit-kind","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__10.html","example":"A 40-year-old starting a Bachelor’s in 2026 meets the age condition. These pages suggest they are too old.","context":"Current HTML advice, linked in the family-service navigation; no historical label. Not applicable to this HTML finding. The matching April 2020 brochure is excluded as historical; no current link was found on the two checked pages.","scope":"The 45-year limit applies from 1 August 2022 under the 27th BAföG amendment’s then-§ 66a(2). The Act was promulgated 21 July 2022; its general commencement was 22 July 2022. The age rule has its own application date. The former carryover for older approval periods in then-§ 66a(3) did not preserve the old § 10 age limit. No relevant current transition supports 30/35 or 44 as ed routes. Age is assessed at the start of the training phase; a birthday during that phase is not automatically disqualifying. Age 30 for parental-income independence under § 11(3) No. 2 is a separate rule. All other personal, course and means-test conditions still apply.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"gilt die Altersgrenze von 35 Jahren.","tr":"the age limit of 35 applies.","url":"https://www.uni-goettingen.de/de/document/download/009e39d094403c0f154fb2bbd7673659.pdf/Broschuere_PhilFak_2023_web.pdf#page=21","site":"uni-goettingen.de/de · PDF"}]},"bafoeg-be-baf-01":{"id":"bafoeg-be-baf-01","area":"bafoeg","topic":"age","pub":"City of Rietberg","src":"","claim":"says the age limit is 30, or 35 for a Master’s.","quote":"Altersgrenze: 30 Jahre; im Master 35 Jahre","lang":"German","tr":"Age limit: 30 years; 35 for a Master’s","law":"","sourceUrl":"https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__10.html","example":"A 40-year-old starting a Bachelor’s in 2026 meets the age condition. These pages suggest they are too old.","context":"Official live Stadt Rietberg service record, independently fetched with HTTP 200 on 17 October 2026, with online application and responsible-office contact facilities and no historical-only label. A separate current inbound parent/catalog link was not established; the independently fetched responsible-office page did not contain the exact target link. No content-specific update date established. Not applicable: HTML source. See currentness and linking/context fields for the actual current-supply evidence. Official active service record: https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show | A separate parent/catalog inbound link was not established; the independently fetched responsible-office page did not contain the exact target link.","scope":"Current new 2026 phase; 45 rule applies from 1 August 2022. Current §66a does not retain 30/35 for a new 2026 phase. Specified exceptions can permit a start at or after 45 under §10(3), with prompt-start requirements for certain routes. The age at commencement of the relevant training phase controls. The distinct age-30 parental-income-independence rule is not this limit. All other conditions remain.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Altersgrenze: 30 Jahre; im Master 35 Jahre","tr":"Age limit: 30 years; 35 for a Master’s","url":"https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show","site":"serviceportal.rietberg.de"}]},"bafoeg-baf-02-02":{"id":"bafoeg-baf-02-02","area":"bafoeg","topic":"subject","pub":"Deutsches Studierendenwerk","src":"national association FAQ","claim":"says you must switch before your fourth semester.","quote":"spätestens bis zum Beginn des vierten Fachsemesters","lang":"German","tr":"at the latest by the start of the fourth semester","law":"","sourceUrl":"https://www.studierendenwerke.de/fileadmin/user_upload/FAQ_BAfoeG_01-2026.pdf#page=1","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible undergraduate changes during the fourth subject semester in 2026, promptly for an established important reason and with no credited semesters. The important-reason route can remain open.","context":"Current download on the DSW BAföG overview. Verified 17 October 2026: DSW BAföG overview → Downloads → FAQ_BAfoeG_01-2026.pdf. Current DSW linking page · Downloads: https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg | Related DSW requirements HTML: https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","scope":"The 29th BAföG amendment changed the important-reason cutoff from the beginning of the fourth to the beginning of the fifth subject semester, and the first-change presumption f d semesters are deducted when determining the relevant subject semester (§ 7(3) sentence 5). A first change before the fourth semester normally benefits from a presumption; later or repeated changes do not inherit that presumption. An important reason must actually exist, and changing promptly after recognising it matters. An unavoidable reason is a separate route. The important-reason route is excluded for a qualifying Master under § 7(1a) sentence 2. The change does not waive other funding requirements or guarantee a positive means-tested award.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"nach Beginn des vierten Fachsemester","tr":"after the start of the fourth semester","url":"https://tu-dresden.de/studium/vor-dem-studium/studienangebot/sins/sins_studiengang_faq_general","site":"tu-dresden.de"}]},"bafoeg-baf-02-03":{"id":"bafoeg-baf-02-03","area":"bafoeg","topic":"subject","pub":"Universität Münster","src":"Mathematics and Computer Science","claim":"says you can switch out of interest only until the end of your second semester.","quote":"Fachrichtungswechsel aus Neigungsgründen sind nur bis zum Ende des zweiten Semesters möglich.","lang":"German","tr":"Changes of subject for reasons of interest are only possible until the end of the second semester.","law":"","sourceUrl":"https://www.uni-muenster.de/FB10/Studium/studienhinweise/bafoeg.shtml","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible undergraduate changes during the third subject semester in 2026, promptly for an established important reason. The quoted second-semester cutoff closes this route too early.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML. Current faculty page linking this advice: https://www.uni-muenster.de/FB10/Studium/Fachstudienberatung/bafoegbeauftragte.shtml","scope":"The 29th BAföG amendment changed the important-reason cutoff from the beginning of the fourth to the beginning of the fifth subject semester, and the first-change presumption from the third to the fourth. The changes took effect on 25 July 2024. BAföG § 66a(8) preserves former § 7(3) for changes or abandonments completed, or legally deemed completed, by the relevant semester start preceding 25 July 2024. Old cutoffs can therefore be correct for a specifically historical case. The examples here concern a new change in 2026. The new institution’s credited semesters are deducted when determining the relevant subject semester (§ 7(3) sentence 5). A first change before the fourth semester normally benefits from a presumption; later or repeated changes do not inherit that presumption. An important reason must actually exist, and changing promptly after recognising it matters. An unavoidable reason is a separate route. The important-reason route is excluded for a qualifying Master under § 7(1a) sentence 2. The change does not waive other funding requirements or guarantee a positive means-tested award.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Fachrichtungswechsel aus Neigungsgründen sind nur bis zum Ende des zweiten Semesters möglich.","tr":"Changes of subject for reasons of interest are only possible until the end of the second semester.","url":"https://www.uni-muenster.de/FB10/Studium/studienhinweise/bafoeg.shtml","site":"uni-muenster.de"}]},"bafoeg-baf-12-01":{"id":"bafoeg-baf-12-01","area":"bafoeg","topic":"subject","pub":"Universität des Saarlandes","src":"linked DSW flyer","claim":"says a further subject change requires an unavoidable reason.","quote":"Nach einem weiteren Fachrichtungswechsel","lang":"German","tr":"After a further change of subject","law":"A further undergraduate change can qualify for an important reason before the applicable semester cutoff. Each change must meet the conditions; later semesters may be funded as full loans.","sourceUrl":"https://www.uni-saarland.de/fileadmin/upload/studieren/finanzieren/flyer/dsw_bafoeg.pdf#page=1","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible undergraduate makes a second prompt change before the applicable cutoff for a proven important reason. The route can remain open, though the funding form may differ.","context":"Live institutional guidance; no historical-only label in the examined section. Verified independently on 17 October 2026: the current university links/downloads page links this exact hosted DSW flyer. Both original PDF sheets were rendered and checked. Edition January 2024 is disclosed. Current university page linking the flyer: https://www.uni-saarland.de/studieren/finanzierung/links.html","scope":"The current important-reason cutoff and first-change presumption changed on 25 July 2024; § 66a(8) preserves older rules for specified historical changes. Neither the current rule nor the preserved rule makes every further change require an unavoidable reason. The January 2024 edition date therefore does not make this separate repeated-change restriction correct. The current comparison was checked on 17 October 2026. Every actual change must satisfy the relevant reason, timing and promptness conditions. A later change has no automatic first-change presumption. Credited semesters and the Master exclusion from the important-reason route remain relevant. Under § 17(3), previous study can affect the funding form for some later semesters. This finding does not guarantee that the entire new course is funded half as a grant. Other entitlement and means-test conditions remain.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Nach einem weiteren Fachrichtungswechsel","tr":"After a further change of subject","url":"https://www.uni-saarland.de/fileadmin/upload/studieren/finanzieren/flyer/dsw_bafoeg.pdf#page=1","site":"uni-saarland.de · PDF"}]},"bafoeg-baf-16-01":{"id":"bafoeg-baf-16-01","area":"bafoeg","topic":"subject","pub":"kfsn","src":"Studieren in Niedersachsen joint university portal","claim":"says semesters already studied are deducted from your new course.","quote":"werden die bisher studierten Semester auf die Förderungshöchstdauer des neuen Studiengangs angerechnet.","lang":"German","tr":"the semesters already studied count towards the maximum funding period of the new course.","law":"On a first accepted important-reason change, prior semesters do not automatically shorten ordinary grant/loan funding. Recognised credits and previous time in the new course remain relevant.","sourceUrl":"https://www.studieren-in-niedersachsen.de/rund-ums-studium/studium-in-allen-lebenslagen/fach-orts-und-hochschulwechsel/wechsel-mit-bafoeg.html","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__17.html","example":"A first accepted important-reason change after two semesters into semester one of a six-semester course, with no recognised credits, does not automatically reduce ordinary grant/loan support to four semesters.","context":"The current subject-change parent directly links this page; kfsn university-sector publisher status independently checked. No historical-only label in the body. Not applicable: HTML. Current subject-change parent: https://www.studieren-in-niedersachsen.de/rund-ums-studium/studium-in-allen-lebenslagen/fach-orts-und-hochschulwechsel.html","scope":"Compared with operative law as of 17 October 2026. No relevant current transition removes the first-important-change exception. Its original historical commencement was not reconstructed in this bounded pass. The 2024 subject-change cutoff and § 66a(8) govern the reason/timing route separately; the hypothetical assumes a new 2026 change under current law. The change must be the first relevant change/abandonment and satisfy § 7(3), including genuine important reason, promptness and applicable timing. The Master important-reason exclusion remains. Other eligibility conditions, progress evidence and means-testing still apply. Credited prior education or earlier time in the new funded course can be counted under § 15a(2). A later change can have a loan-only portion under § 17(3). The finding does not promise a wholly new standard period regardless of actual credits or every previous change. The outdated bank-loan label is retained as context, not counted here as a separate routed proposition.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"werden die bisher studierten Semester auf die Förderungshöchstdauer des neuen Studiengangs angerechnet.","tr":"the semesters already studied count towards the maximum funding period of the new course.","url":"https://www.studieren-in-niedersachsen.de/rund-ums-studium/studium-in-allen-lebenslagen/fach-orts-und-hochschulwechsel/wechsel-mit-bafoeg.html","site":"studieren-in-niedersachsen.de"}]},"bafoeg-be-baf-03":{"id":"bafoeg-be-baf-03","area":"bafoeg","topic":"subject","pub":"City of Rietberg","src":"","claim":"says a change from the fourth subject semester requires an unavoidable reason.","quote":"der Wechsel ab dem 4. Fachsemester […] unabweisbaren Grund","lang":"German","tr":"switching from the 4th subject semester […] compelling reason","law":"","sourceUrl":"https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible undergraduate changes during the fourth subject semester in 2026, promptly for an established important reason and with no credited semesters. The important-reason route can remain open.","context":"Official live Stadt Rietberg service record, independently fetched with HTTP 200 on 17 October 2026, with online application and responsible-office contact facilities and no historical-only label. A separate current inbound parent/catalog link was not established; the independently fetched responsible-office page did not contain the exact target link. No content-specific update date established. Not applicable: HTML source. See currentness and linking/context fields for the actual current-supply evidence. Official active service record: https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show | A separate parent/catalog inbound link was not established; the independently fetched responsible-office page did not contain the exact target link.","scope":"BAföG §66a(8) retains the version of §7(3) in force on 24 July 2024 for a change/abandonment made by the applicable semester beginning that lies before 25 July 2024, including a change treated as completed at that semester beginning. A new 2026 change is outside that transition. The example assumes no recognized credits; other statutory conditions remain. An important reason must actually exist once the first-change presumption no longer applies. An unavoidable reason is a separate route. Recognized prior semesters are deducted when assessing the relevant semester thresholds. §66a(8) preserves older covered changes; the illustration is a new 2026 change outside that transition.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"der Wechsel ab dem 4. Fachsemester […] unabweisbaren Grund","tr":"switching from the 4th subject semester […] compelling reason","url":"https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show","site":"serviceportal.rietberg.de"}]},"bafoeg-be-baf-04":{"id":"bafoeg-be-baf-04","area":"bafoeg","topic":"subject","pub":"Studierendenwerk Mannheim","src":"","claim":"says the stricter rule only applies after the fifth semester.","quote":"nach dem vierten Semester […] erst nach dem fünften Fachsemester","lang":"German","tr":"after the fourth semester […] only after the fifth subject semester","law":"Once the fifth semester has begun, a switch needs a compelling reason. An important reason is no longer enough.","sourceUrl":"https://www.stw-ma.de/bafoegco/bafoeg-a-z/","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"A new undergraduate change during semester five in 2026, with no credited semesters, cannot use an important reason alone. The page appears to allow that route until semester five has ended.","context":"Current BAföG+Co hub https://www.stw-ma.de/bafoegco/ links exact BAföG A–Z path (trailing slash variant), and service center directs applicants there. Raw hub and full FAQ captured. No content-specific update date displayed. Edition/update evidence: No content-specific update date established. Not applicable: HTML source. See currentness and linking/context fields for the actual current-supply evidence. Current BAföG+Co hub https://www.stw-ma.de/bafoegco/ links the exact A–Z path /bafoegco/bafoeg-a-z (trailing-slash variant). Full hub and FAQ captured independently.","scope":"BAföG §66a(8) retains the version of §7(3) in force on 24 July 2024 for a change/abandonment made by the applicable semester beginning that lies before 25 July 2024, including a change treated as completed at that semester beginning. A new 2026 change is outside that transition. The example assumes no recognized credits; other statutory conditions remain. Recognized semesters must be deducted when assessing the threshold. An unavoidable reason can remain relevant after the important-reason route closes. Old covered changes retain prior law under §66a(8); neither that transition nor a first-change presumption extends the ordinary important-reason route through the fifth semester. No separate third-semester or cumulative-reasons finding is asserted.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"nach dem vierten Semester […] erst nach dem fünften Fachsemester","tr":"after the fourth semester […] only after the fifth subject semester","url":"https://www.stw-ma.de/bafoegco/bafoeg-a-z/","site":"stw-ma.de"}]},"bafoeg-mv-baf-01":{"id":"bafoeg-mv-baf-01","area":"bafoeg","topic":"subject","pub":"Studierendenwerk Rostock-Wismar","src":"public-law BAföG administrator","claim":"says you must switch before your fourth semester.","quote":"bis zum Beginn des 4. Fachsemesters","lang":"German","tr":"by the start of the 4th subject semester","law":"","sourceUrl":"https://www.stw-rw.de/de/studienfinanzierung/faq.html","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible undergraduate changes during the fourth subject semester in 2026, promptly for an established important reason and with no credited semesters. The important-reason route can remain open.","context":"Fresh original HTTP 200 on 18 October 2026. Current parent navigation links exact page; source has no historical-only label. Not applicable: guidance source is HTML. Current inbound page link independently verified. See current linking and context field. https://www.stw-rw.de/de/studienfinanzierung.html links the exact current guidance page. Original source and parent links independently captured on 18 October 2026.","scope":"For a new 2026 undergraduate switch, current §7(3) applies. §66a(8) retains the version in force on 24 July 2024 for covered changes made by, or treated as completed at, the applicable semester beginning before 25 July 2024. Such historical changes are excluded from the illustration. The first-change important-reason presumption is rebuttable. After the presumption boundary, an important reason must actually exist before the fifth semester begins. An unavoidable reason is a separate route. Recognized semesters must be deducted. The special Master restriction in §7(1a), all other conditions, and the old-change transition remain.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bis zum Beginn des 4. Fachsemesters","tr":"by the start of the 4th subject semester","url":"https://www.stw-rw.de/de/studienfinanzierung/faq.html","site":"stw-rw.de/de"}]},"bafoeg-baf-07-0 n annual adjustment need the applicable treatment for their different months; the new amount is not simply backdated to all of 2025. No relevant transition preserves the older €520/€556 figures for the ordinary 2026 case used here. Applicant income is averaged over the approval period, not tested as a standalone monthly earnings ban. Training remuneration, compulsory-internship pay, scholarships and other special categories need their own statutory treatment; €603 is not a universal allowance for them. Other income can use the same allowance. Family and hardship allowances may increase the disregard. Exceeding a relevant allowance reduces the payment after calculation; it does not automatically remove eligibility in principle.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Ihr eigenes Einkommen, soweit es mehr als 556 EUR pro Monat beträgt.","tr":"Your own income, insofar as it exceeds €556 a month.","url":"https://web1.karlsruhe.de/service/Buergerdienste/leistung.php?id=577","site":"web1.karlsruhe.de"}]},"bafoeg-ni-baf-02":{"id":"bafoeg-ni-baf-02","area":"bafoeg","topic":"earnings","pub":"Studierendenwerk Osnabrück","src":"public-law BAföG administrator","claim":"says earnings above €6,672 a year are counted.","quote":"bis zu 6.672,00 € brutto","lang":"German","tr":"up to €6,672.00 gross","law":"","sourceUrl":"https://www.studentenwerk-osnabrueck.de/de/finanzen/bafoeg/bafoeg-faq.html","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__21.html","example":"An otherwise eligible student averages €580 gross monthly from ordinary employment over a 2026 award period and has no other countable income. Standard deductions leave those wages uncounted.","context":"Fresh original HTTP 200 on 18 October 2026; exact current parent navigation links this FAQ. No historical-only label. Content-specific update date not established. Not applicable to HTML source. For the official 2026 allowance notice, original PDF visually checked by researcher and independent reviewer. https://www.studentenwerk-osnabrueck.de/de/finanzen/bafoeg.html links the exact FAQ; fresh independent incoming links preserved.","scope":"BAföG §§21–23 determine the income calculation; EStG §9a provides the €1,230 employee allowance. The official notice of 18 November 2025 (BGBl. 2025 I 279) sets the personal allowance at €389 from 1 January 2026. For €7,200 employment income over January–December 2026: (7,200−1,230)/12 × 0.777 = €386.5575, below €389, leaving no countable income in the specified case. Unmarried childless student with only ordinary employee earnings, no training remuneration or other countable income, over a twelve-month award period entirely within 2026. No spouse/child/hardship allowance or exceptional deduction is needed. The threshold is labelled as applying from autumn 2024, rather than as a historical-only example. The next sentence counts higher income. Family and hardship allowances are mentioned; correct current standard need and asset amounts elsewhere do not update this calculation.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bis zu 6.672,00 € brutto","tr":"up to €6,672.00 gross","url":"https://www.studentenwerk-osnabrueck.de/de/finanzen/bafoeg/bafoeg-faq.html","site":"studentenwerk-osnabrueck.de/de"}]},"bafoeg-mv-baf-03":{"id":"bafoeg-mv-baf-03","area":"bafoeg","topic":"earnings","pub":"Studierendenwerk Greifswald","src":"public-law BAföG administrator","claim":"applies the employee earnings limit to self-employed students.","quote":"7.236 € brutto als Einkommen hinzuverdienen, ohne dass eine Anrechnung","lang":"German","tr":"earn €7,236 gross as income without it being counted","law":"Self-employed income is profit after expenses; it does not receive the employee expense allowance. The employee gross threshold therefore cannot be applied universally to self-employed students.","sourceUrl":"https://www.stw-greifswald.de/finanzierung/informationen-zum-bafoeg","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__21.html","example":"An unmarried, childless student has €7,236 self-employment profit over January–December 2026, no taxes or other deductions and no extra allowances. About €79.53 monthly remains countable before award rounding.","context":"Fresh original HTTP 200 on 18 October 2026. Current parent navigation links exact page; source has no historical-only label. Not applicable: guidance source is HTML. Current inbound page link independently verified. The controlling allowance notice is a separate legal PDF, freshly downloaded and visually inspected. https://www.stw-greifswald.de/ links the exact current guidance page. Original source and parent links independently captured on 18 October 2026.","scope":"The official notice of 18 November 2025, published 26 November 2025 as BGBl2025 I Nr279, sets the personal allowance to €389 from 1 January 2026. The illustration uses January–December 2026 only. Do not use the unadjusted €353 in §23 main text or extend this arithmetic to mixed-year award periods. Self-employment income is profit; actual business expenses reduce it. Taxes, other deductions, dependants and hardship allowances can affect the outcome. The student’s 22.3% social allowance under §21(2) no.1 takes priority over the 38.8% nonemployee category. The €1,230 expense lump sum is employee-specific. The €7,236 employee example itself is supported. €79.531 is countable income before final benefit rounding, not a promised exact payment reduction.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"7.236 € brutto als Einkommen hinzuverdienen, ohne dass eine Anrechnung","tr":"earn €7,236 gross as income without it being counted","url":"https://www.stw-greifswald.de/finanzierung/informationen-zum-bafoeg","site":"stw-greifswald.de"}]},"bafoeg-baf-11-01":{"id":"bafoeg-baf-11-01","area":"bafoeg","topic":"assets","pub":"TH Köln","src":"Deutschlandstipendium FAQ","claim":"still gives the old savings limit of €5,200.","quote":"die anrechnungsfreie Grenze von 5.200 Euro","lang":"German","tr":"the exempt limit of €5,200","law":"","sourceUrl":"https://www.th-koeln.de/studium/faq_6426.php","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__29.html","example":"A 22-year-old has €8,000 total countable applicant assets at application. The ordinary €15,000 allowance covers that amount, subject to other eligibility and means-test conditions.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML. Current TH Köln scholarship page linking the FAQ: https://www.th-koeln.de/studium/deutschlandstipendium_225.php","scope":"The family asset allowance increased 2100→2300 under the 26th Act, Article 2 No. 7(b), printed p. 1054; Article 6(2) and then-§ 66a(9) applied it from 1 August 2020 for new approval periods and from 1 October 2020 for older periods. The same provision increased the basic 7500 to 8200 in 2020. The current age-dependent basic amounts apply from 1 August 2022 under the 27th BAföG amendment’s then-§ 66a(2). The carryover for already-running approval periods ended when the new § 29 became applicable from 1 October 2022. No current grandfather rule preserves €5,200 as the ordinary asset allowance for a new application in 2026. The current FAQ does not label the figure as a historical example. No current transition preserves €5,200, €7,500 or the former €2,100 family addition as the applicable ordinary amounts for a new 2026 case. The €300 income treatment and later asset treatment are distinct questions. Additional €2,300 allowances can apply for a spouse/registered civil partner and each child; hardship relief and asset exclusions can also matter. Countable excess assets reduce payment across approval-period months; they do not create an automatic ownership-based exclusion from eligibility in principle.","date":"2026-10-17","langs":["German"],"countries":["DE"],"ver ment across approval-period months; they do not create an automatic ownership-based exclusion from eligibility in principle.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"von 7.500€ (eigener Freibetrag) um weitere 2.100€","tr":"from €7,500 (own allowance) by a further €2,100","url":"https://www.hs-mannheim.de/die-hochschule/technische-hochschule-mannheim/familienfreundliche-hochschule/studieren-mit-kind/finanzielles.html","site":"hs-mannheim.de"}]},"bafoeg-baf-05-01":{"id":"bafoeg-baf-05-01","area":"bafoeg","topic":"assets","pub":"Johannes Gutenberg-Universität Mainz","src":"BAföG office flyer","claim":"says the higher limit depends on your age when you started studying.","quote":"bei Studienbeginn bis zum 30. Lebensjahr","lang":"German","tr":"up to age 30 at the start of studies","law":"Your age on the day you apply decides whether the €15,000 or the €45,000 limit applies.","sourceUrl":"https://www.bafoeg.uni-mainz.de/files/2024/08/Flyer-BAfoeG-.pdf#page=7","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__29.html","example":"A student who started at 29 reapplies at 31 with €20,000 total countable assets. The €45,000 basic allowance at this application covers the balance; other conditions remain.","context":"Still offered as an image-link download in the current BAföG office sidebar; home last updated 31 August 2026. Verified in raw current HTML on 17 October 2026: both the Mainz BAföG office home and FAQ link this exact PDF through the flyer image widget. The text-only reader omitted the image link. Current Mainz linking page · sidebar flyer: https://www.bafoeg.uni-mainz.de/ | Mainz FAQ · correct application-date context: https://www.bafoeg.uni-mainz.de/faq-haeufig-gestellte-fragen/","scope":"The age-dependent €15,000/€45,000 amounts apply from 1 August 2022 under the 27th amendment’s then-§ 66a(2). For approval periods begun earlier, former § 66a(3) allowed old asset rules to continue only until 30 September 2022. That historical transition does not make study-start age decisive for a new application in 2026. Turning 30 after an application does not itself change the circumstances used for that already-pending approval period; a later application is assessed afresh. Additional €2,300 allowances apply for a spouse/registered civil partner and for each child (§ 29(1) Nos. 2–3). A further disregard can prevent undue hardship (§ 29(3)); asset exclusions and qualifying debts also matter. An allowance is not an ownership ceiling. Countable excess assets are divided across the approval-period months under § 30 and reduce payment. They do not automatically eliminate eligibility in principle. The illustration assumes no separate asset issue or other reduction.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bei Studienbeginn bis zum 30. Lebensjahr","tr":"up to age 30 at the start of studies","url":"https://www.bafoeg.uni-mainz.de/files/2024/08/Flyer-BAfoeG-.pdf#page=7","site":"bafoeg.uni-mainz.de · PDF"}]},"bafoeg-baf-17-01":{"id":"bafoeg-baf-17-01","area":"bafoeg","topic":"assets","pub":"Georg-August-Universität Göttingen","src":"Philosophische Fakultät brochure","claim":"says your parents’ savings are counted.","quote":"der Höhe des Einkommens und Vermögens der Eltern.","lang":"German","tr":"the amount of the parents’ income and assets.","law":"Parents’ own assets are not counted as applicant assets. Their countable income, including income produced by assets, can affect the award.","sourceUrl":"https://www.uni-goettingen.de/de/document/download/009e39d094403c0f154fb2bbd7673659.pdf/Broschuere_PhilFak_2023_web.pdf#page=21","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__11.html","example":"Two applicants have identical own finances and countable parental income. One parent owns additional savings producing no additional countable income. The savings alone do not increase the applicant’s asset deduction.","context":"The current Weltliteratur orientation page advertises 19–23 October 2026 events and directly links this exact 2023 brochure as study-start guidance, outside an archive section. The PDF imprint says 12thupdated edition, September 2023, with information as ofSeptember 2023. This edition date and continuing current link must both be disclosed. Exact live 2023 PDF href independently verified on current 2026 orientation page; own fresh PDF download, relevant sheet 21 rendered and visually inspected, imprint sheet 2 text-read. No 2025-edition appearance approved. Current orientation page linking exactPDF: https://www.uni-goettingen.de/de/647661.html","scope":"Compared with current law accessed 17 October 2026. No relevant current transition makes parents’ own assets a direct asset input in the normal BAföG means test. The original historical commencement of this longstanding distinction was not reconstructed. The brochure’s September 2023 edition is disclosed; no historical exception making this broad statement correct was identified. Applicant-owned assets remain relevant; the finding does not protect assets merely labelled as belonging to relatives when the applicant actually owns a right or beneficial claim. Parental income, including income arising from assets where legally countable, remains relevant unless an independence rule applies. A parental transfer can create an applicant-owned asset and needs separate assessment. This is an amount-calculation mismatch, not a guarantee of entitlement or a positive payment whenever parents have low income. The other personal, study and means-test conditions remain.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"der Höhe des Einkommens und Vermögens der Eltern.","tr":"the amount of the parents’ income and assets.","url":"https://www.uni-goettingen.de/de/document/download/009e39d094403c0f154fb2bbd7673659.pdf/Broschuere_PhilFak_2023_web.pdf#page=21","site":"uni-goettingen.de/de · PDF"}]},"bafoeg-baf-06-01":{"id":"bafoeg-baf-06-01","area":"bafoeg","topic":"assets","pub":"Universität des Saarlandes","src":"study financing","claim":"says all income and savings are taken from two years before.","quote":"Grundlage sind dabei jeweils die Einkommens- und Vermögensverhältnisse vom vorletzten Kalenderjahr.","lang":"German","tr":"The basis is the income and assets from the calendar year before last.","law":"Applicant income normally comes from the award period and assets from the application date. Parent/spouse income normally comes from the second preceding calendar year, with an updating procedure for lower current income.","sourceUrl":"https://www.uni-saarland.de/studieren/finanzierung/bafoeg.html","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__22.html","example":"An applicant had €25,000 two years ago and €5,000 at application after ordinary living expenses. The application-date balance is the relevant asset starting point; abusive transfers are not assumed.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML.","scope":"Compared with the operative statutory text accessed 17 October 2026. No applicable transition was identified that makes every financial input use the second preceding calendar year. The historical commencement of each longstanding reference-period rule was not reconstructed in this bounded extension. A timely updating application under § 24(3) can substitute materially lower current parent/spouse income. Asset exclusions, deductible debts and hardship provisions still matter. A lower balance caused by a potentially abusive transfer is not automatically accepted; that separate issue is not assumed in the illustration.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Grundlage sind dabei jeweils die Einkommens- und Vermögensverhältnisse vom vorletzten Kalenderjahr.","tr":"The basis is the income and assets from the calendar year before last.","url":"https://www.uni-saarland.de/studieren/finanzierung/bafoeg.html","site":"uni-saarland.de"}]},"bafoeg-be-baf-02":{"id":"bafoeg-be-baf-02","area":"bafoeg","topic":"assets","pub":"City of Rietberg","src":"","claim":"still gives the old savings limit of €8,200.","quote":"Freibetrag von 8.200 EUR","lang":"German","tr":"allowance of EUR 8,200","law":"","sourceUrl":"https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__29.html","example":"A 22-year-old has €8,000 total countable applicant assets at application. The ordinary €15,000 allowance covers that amount, subject to other eligibility and means-test conditions.","context":"Official live Stadt Rietberg service record, independently fetched with HTTP 200 on 17 October 2026, with online application and responsible-office contact facilities and no historical-only label. A separate current inbound parent/catalog link was not established; the independently fetched responsible-office page did not contain the exact target link. No content-specific update date established. Not applicable: HTML source. See currentness and linking/context fields for the actual current-supply evidence. Official active service record: https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show | A separate parent/catalog inbound link was not established; the independently fetched responsible-office page did not contain the exact target link.","scope":"New application in 2026, long after the 2022 transition; no grandfather rule identified preserving €8,200 for this case. Age is assessed at application. Additional spouse/partner and child allowances and a hardship disregard can apply under §29. Assets must first be legally countable under the asset rules; exceeding the basic allowance does not by itself establish total ineligibility. Other eligibility and means-test conditions remain.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"Freibetrag von 8.200 EUR","tr":"allowance of EUR 8,200","url":"https://serviceportal.rietberg.de/details/-/vr-bis-detail/dienstleistung/564105/show","site":"serviceportal.rietberg.de"}]},"bafoeg-baf-09-01":{"id":"bafoeg-baf-09-01","area":"bafoeg","topic":"eu","pub":"Studierendenwerk Hamburg","src":"nationality leaflet","claim":"says you must work at least 12 hours a week.","quote":"einer Mindestwochenarbeitszeit von 12 Stunden im Monatsdurchschnitt","lang":"German","tr":"a minimum of 12 hours a week, averaged over the month","law":"","sourceUrl":"https://www.stwhh.de/fileadmin//user_upload/Finanzen/__Downloads/BAfoeG/Infoblaetter/Infoblatt_Staatsangehoerigkeit_8_61_BAfoeG.pdf#page=1","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__8.html","example":"An EU student works ten hours a week in a real job with paid leave. They can still qualify as a worker.","context":"Live institutional guidance; no historical-only label in the examined section. Verified independently on 17 October 2026: the current Hamburg BAföG page links this exact nationality leaflet; the June 2026 original was rendered and page 1 inspected. Current Hamburg BAföG page linking the leaflet: https://www.stwhh.de/studienfinanzierung/bafoeg","scope":"The linked leaflet is dated June 2026. The comparison uses the current statute and BAföGVwV as accessed 17 October 2026; the VwV header identifies the latest amendment as 5 March 2026, GMBl. 2026 Nos. 10/11, p. 194. No relevant current transition creates an absolute twelve-hour statutory minimum. The original commencement of each underlying EU-worker rule was not reconstructed. The finding is the conflict with the current individual-assessment rule, not an assertion that every lower-hour job qualifies. The individual assessment still needs genuine, effective work rather than merely marginal activity. Official guidance names factors such as paid leave, continued pay during illness and an applicable collective agreement. A lower-hour contract alone is not proof of entitlement. Residence, training, age, previous-study and means-test requirements remain. This case is distinct from the separate question of retaining worker status after a job ends.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"einer Mindestwochenarbeitszeit von 12 Stunden im Monatsdurchschnitt","tr":"a minimum of 12 hours a week, averaged over the month","url":"https://www.stwhh.de/fileadmin//user_upload/Finanzen/__Downloads/BAfoeG/Infoblaetter/Infoblatt_Staatsangehoerigkeit_8_61_BAfoeG.pdf#page=1","site":"stwhh.de · PDF"}]},"bafoeg-baf-09-02":{"id":"bafoeg-baf-09-02","area":"bafoeg","topic":"eu","pub":"Studentenwerk Leipzig","src":"international-student guidance","claim":"says you must work at least 12 hours a week.","quote":"mindestens zwölf Wochenstunden im Durchschnitt eines Monats","lang":"German","tr":"at least twelve hours a week, averaged over a month","law":"","sourceUrl":"https://www.studentenwerk-leipzig.de/bafoeg-finanzierung/bafoeg-fuer-internationale-studierende/","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__8.html","example":"An EU student works ten hours a week in a real job with paid leave. They can still qualify as a worker.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML.","scope":"The linked leaflet is dated June 2026. The comparison uses the current statute and BAföGVwV as accessed 17 October 2026; the VwV header identifies the latest amendment as 5 March 2026, GMBl. 2026 Nos. 10/11, p. 194. No relevant current transition creates an absolute twelve-hour statutory minimum. The original commencement of each underlying EU-worker rule was not reconstructed. The finding is the conflict with the current individual-assessment rule, not an assertion that every lower-hour job qualifies. The individual assessment still needs genuine, effective work rather than merely marginal activity. Official guidance names factors such as paid leave, continued pay during illness and an applicable collective agreement. A lower-hour contract alone is not proof of entitlement. Residence, training, age, previous-study and means-test requirements remain. This case is distinct from the separate question of retaining worker status after a job ends.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"mindestens zwölf Wochenstunden im Durchschnitt eines Monats","tr":"at least twelve hours a week, averaged over a month","url":"https://www.studentenwerk-leipzig.de/bafoeg-finanzierung/bafoeg-fuer-internationale-studierende/","site":"studentenwerk-leipzig.de"}]},"bafoeg-baf-15-01":{"id":"bafoeg-baf-15-01","area":"bafoeg","topic":"eu","pub":"Studentenwerk Leipzig","src":"international guidance","claim":"says you must have worked for ten weeks before you apply.","quote":"bereits mindestens zehn Wochen","lang":"German","tr":"already at least ten weeks","law":"","sourceUrl":"https://www.studentenwerk-leipzig.de/bafoeg-finanzierung/bafoeg-fuer-internationale-studierende/","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__8.html","example":"An EU student starts a real job and applies in their first month. They can already qualify.","context":"Live institutional international-student BAföG page, with no historical-only label. Not applicable: HTML.","scope":"Compared with current law and VwV as accessed 17 October 2026. The 20 February 2019 judgment construed the law; it did not create a new statutory exemption. No current transition imposing a general ten-week first-application bar was identified. The original commencement of every underlying EU-worker provision was not reconstructed. Actual genuine and effective employment must establish EU-worker status; a proposed contract or merely marginal activity alone does not automatically qualify. Job duration can be evidence in that individual assessment without becoming an absolute ten-week minimum. Other personal, study and financial conditions remain. The cited OVG judgment concerned a Romanian Master student’s 2015/16 award and assessed her actual work, including later payslips; it is a published regional appellate decision, not a statute or a nationwide binding rule for every factual case. Current primary law and VwV were checked independently. Do not claim automatic funding from every first day of any job.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"bereits mindestens zehn Wochen","tr":"already at least ten weeks","url":"https://www.studentenwerk-leipzig.de/bafoeg-finanzierung/bafoeg-fuer-internationale-studierende/","site":"studentenwerk-leipzig.de"}]},"bafoeg-baf-15-02":{"id":"bafoeg-baf-15-02","area":"bafoeg","topic":"eu","pub":"Studierendenwerk Hamburg","src":"nationality leaflet","claim":"says you must have worked for ten weeks before you apply.","quote":"seit mindestens 10 Wochen","lang":"German","tr":"for at least 10 weeks","law":"","sourceUrl":"https://www.stwhh.de/fileadmin//user_upload/Finanzen/__Downloads/BAfoeG/Infoblaetter/Infoblatt_Staatsangehoerigkeit_8_61_BAfoeG.pdf#page=1","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__8.html","example":"An EU student starts a real job and applies in their first month. They can already qualify.","context":"The current Hamburg BAföG page directly links this exact 06/26 leaflet. Exact live href independently read in current parent HTML; own fresh PDF download, page 1 render and visual check; full original 3-sheet text checked. Current Hamburg linking page: https://www.stwhh.de/studienfinanzierung/bafoeg","scope":"Compared with current law and VwV as accessed 17 October 2026. The 20 February 2019 judgment construed the law; it did not create a new statutory exemption. No current transition imposing a general ten-week first-application bar was identified. The original commencement of every underlying EU-worker provision was not reconstructed. Actual genuine and effective employment must establish EU-worker status; a proposed contract or merely marginal activity alone does not automatically qualify. Job duration can be evidence in that individual assessment without becoming an absolute ten-week minimum. Other personal, study and financial conditions remain. The cited OVG judgment concerned a Romanian Master student’s 2015/16 award and assessed her actual work, including later payslips; it is a published regional appellate decision, not a statute or a nationwide binding rule for every factual case. Current primary law and VwV were checked independently. Do not claim automatic funding from every first day of any job.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"seit mindestens 10 Wochen","tr":"for at least 10 weeks","url":"https://www.stwhh.de/fileadmin//user_upload/Finanzen/__Downloads/BAfoeG/Infoblaetter/Infoblatt_Staatsangehoerigkeit_8_61_BAfoeG.pdf#page=1","site":"stwhh.de · PDF"}]},"bafoeg-baf-08-01":{"id":"bafoeg-baf-08-01","area":"bafoeg","topic":"eu","pub":"Studentenwerk Leipzig","src":"international-student guidance","claim":"says you must keep working at that level throughout your studies.","quote":"während des gesamten Studiums weiterhin in diesem Umfang gearbeitet werden.","lang":"German","tr":"work must continue at this level throughout your studies.","law":"After less than a year of genuine employment, involuntary unemployment confirmed by the employment agency can preserve worker status for six months. Continued funding still requires the other conditions.","sourceUrl":"https://www.studentenwerk-leipzig.de/bafoeg-finanzierung/bafoeg-fuer-internationale-studierende/","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__8.html","example":"An otherwise eligible EU student loses a genuine job involuntarily after eight months and obtains the employment agency’s confirmation. The conditional six-month worker-status retention can protect continued funding.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML.","scope":"Compared with the legislation and administrative guidance operative on 17 October 2026. The official BAföGVwV header records its latest amendment as 5 March 2026, GMBl. 2026 Nos. 10/11, p. 194. No relevant current transition creates the asserted uninterrupted-work condition. This audit does not reconstruct the original commencement of every EU-worker retention provision. The current statutory retention rules, rather than a supposed new exemption, control the hypothetical case. Retention is conditional. After less than one year’s employment, qualifying involuntary unemployment confirmed by the employment agency preserves status for six months. Longer employment and other statutory retention grounds have different conditions. Every job loss does not produce indefinite funding. The work must qualify as genuine EU-worker activity in the first place. Other BAföG conditions and the means test remain. The initial ten-week condition was assessed separately in the follow-up; see the distinct waiting-period finding.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"während des gesamten Studiums weiterhin in diesem Umfang gearbeitet werden.","tr":"work must continue at this level throughout your studies.","url":"https://www.studentenwerk-leipzig.de/bafoeg-finanzierung/bafoeg-fuer-internationale-studierende/","site":"studentenwerk-leipzig.de"}]},"bafoeg-baf-10-01":{"id":"bafoeg-baf-10-01","area":"bafoeg","topic":"further","pub":"Deutsches Studierendenwerk","src":"requirements","claim":"says no further BAföG is possible after a completed degree.","quote":"ist keine weitere BAföG-Förderung mehr möglich!","lang":"German","tr":"no further BAföG funding is possible!","law":"","sourceUrl":"https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible medical graduate pursuing dentistry for oral and maxillofacial surgery may qualify under the strict special-circumstances route. The example does not establish entitlement to any desired second degree.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML.","scope":"Compared with current § 7(2) and the current BAföGVwV retrieved on 17 October 2026. The VwV header records the latest amendment as 5 March 2026. No applicable transition was identified that makes the unqualified ban true for a new qualifying further-training case. The original historical commencement of the longstanding special-circumstances route was not reconstructed in this bounded extension. The finding rests on the operative statutory exception, not on treating a new policy proposal as law. This is a narrow route for one further training course, subject to all its conditions. VwV 7.2.20 excludes cases where a qualifying further course under sentence 1 has already been completed. VwV 7.2.21 limits a self-contained further degree where a sufficient complementary course would enable adequate professional activity. An autonomous second degree must not simply be described as legally required complementary training under § 7(2) sentence 1 No. 2. The relevant special-circumstances route here is sentence 2. Other personal and financial conditions still apply.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"ist keine weitere BAföG-Förderung mehr möglich!","tr":"no further BAföG funding is possible!","url":"https://www.studierendenwerke.de/themen/studienfinanzierung/bafoeg/voraussetzungen-fuer-bafoeg","site":"studierendenwerke.de"}]},"bafoeg-baf-10-02":{"id":"bafoeg-baf-10-02","area":"bafoeg","topic":"further","pub":"Deutsches Studierendenwerk","src":"advice for vocationally qualified applicants","claim":"tells vocationally qualified applicants they lose BAföG after a degree.","quote":"besteht kein Anspruch auf BAföG mehr!","lang":"German","tr":"there is no longer any entitlement to BAföG!","law":"","sourceUrl":"https://www.studierendenwerke.de/themen/finanzierungsmoeglichkeiten/tipps-fuer-beruflich-qualifizierte","lawUrl":"https://www.gesetze-im-internet.de/baf_g/__7.html","example":"An otherwise eligible medical graduate pursuing dentistry for oral and maxillofacial surgery may qualify under the strict special-circumstances route. The example does not establish entitlement to any desired second degree.","context":"Live institutional guidance; no historical-only label in the examined section. Not applicable: HTML.","scope":"Compared with current § 7(2) and the current BAföGVwV retrieved on 17 October 2026. The VwV header records the latest amendment as 5 March 2026. No applicable transition was identified that makes the unqualified ban true for a new qualifying further-training case. The original historical commencement of the longstanding special-circumstances route was not reconstructed in this bounded extension. The finding rests on the operative statutory exception, not on treating a new policy proposal as law. This is a narrow route for one further training course, subject to all its conditions. VwV 7.2.20 excludes cases where a qualifying further course under sentence 1 has already been completed. VwV 7.2.21 limits a self-contained further degree where a sufficient complementary course would enable adequate professional activity. An autonomous second degree must not simply be described as legally required complementary training under § 7(2) sentence 1 No. 2. The relevant special-circumstances route here is sentence 2. Other personal and financial conditions still apply.","date":"2026-10-17","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"besteht kein Anspruch auf BAföG mehr!","tr":"there is no longer any entitlement to BAföG!","url":"http
