<style>
/* Layout: a quiet reference work. Ink on cool paper; colour is reserved for one
   contrast only — green for what the law says, red for what the source says. */
:root {
  --bg: #f4f5f6;
  --surface: #ffffff;
  --ink: #14171b;
  --ink-2: #48505a;
  --ink-3: #5f6872;
  --rule: #dce0e4;
  --rule-2: #eceff1;
  --law: #146249;
  --law-bg: #e5f1ec;
  --claim: #ad3326;
  --claim-bg: #faebe8;
  --res-bad: #c0604f; --res-amb: #efd2cb; --res-ok: #cdd3d9; --res-unp: #9a8680;
  --focus: #2f5bd0;
  --chrome: #1d2228;
  --chrome-ink: #c9ced4;
  --chrome-on: #ffffff;

  --f-display: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --f-body: "Public Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --s-xs: 0.8125rem; --s-sm: 0.875rem; --s-md: 1rem; --s-lg: 1.1875rem;
  --s-xl: 1.5rem; --s-2xl: 2rem; --s-3xl: 2.625rem;

  --proto-h: 0px; /* 44px when the proposal switcher is shown */
  --site-h: 56px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
}
:root[data-theme="dark"] {
  --bg: #101215; --surface: #171a1e; --ink: #e6e9ec; --ink-2: #b2b9c1; --ink-3: #8f98a2;
  --rule: #2a2f35; --rule-2: #1f2328; --law: #5fc4a0; --law-bg: #14302a; --claim: #f08a7c; --claim-bg: #3a1e1a;
  --res-bad: #d4705f; --res-amb: #70403a; --res-ok: #3a4047; --res-unp: #9a8f8b;
  --focus: #8fb0ff; --chrome: #08090b; --chrome-ink: #a9b0b8; --chrome-on: #ffffff; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font-family: var(--f-body); font-size: var(--s-md); line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.eyebrow { font-size: var(--s-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.lede { color: var(--ink-2); font-size: var(--s-lg); max-width: 62ch; }
.stats { color: var(--ink-3); font-size: var(--s-sm); font-variant-numeric: tabular-nums; }
.stats-note { display: block; margin-top: 2px; font-size: var(--s-xs); font-variant-numeric: normal; }
.native { font-family: var(--f-body); font-weight: 400; color: var(--ink-3); font-size: var(--s-md); letter-spacing: 0; white-space: nowrap; }
.prov { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--ink-2); text-decoration: none; border-bottom: 1px solid var(--rule); }
.prov:hover { color: var(--ink); border-color: var(--ink-3); }

/* Law / source value pair — the one place colour lives */
.k { display: inline-flex; gap: .45em; align-items: baseline; font-size: var(--s-sm); line-height: 1.3; }
.k b { font-size: var(--s-xs); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.k.law { color: var(--law); }
.k.claim { color: var(--claim); }


/* ---------- prototype chrome ---------- */
.proto { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--chrome); color: var(--chrome-ink);
  padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.proto-in { max-width: 1120px; margin: 0 auto; height: var(--proto-h); display: flex; align-items: center; gap: 14px; font-size: var(--s-xs); }
.proto-label { letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.proto-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.proto-tabs a { text-decoration: none; padding: 5px 10px; border-radius: 4px; white-space: nowrap; color: var(--chrome-ink); }
.proto-tabs a:hover { color: var(--chrome-on); background: rgba(255,255,255,.07); }
.proto-tabs a[aria-current="true"] { color: var(--chrome-on); background: rgba(255,255,255,.14); }
.proto-tabs a span { opacity: .6; margin-right: 4px; font-family: var(--f-mono); }
.reader-mode .proto-in, .reader-mode .site-in { max-width: none; }

.site { border-bottom: 1px solid var(--rule); background: var(--bg); padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.site-in { max-width: 1088px; margin: 0 auto; height: var(--site-h); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: var(--s-lg); text-decoration: none; letter-spacing: -.005em; white-space: nowrap; }
.wordmark i { font-style: italic; }
.wordmark svg { flex: none; width: 1.1em; height: 1.1em; }
.site-tools { display: flex; align-items: center; gap: 10px; min-width: 0; }
.theme-btn { flex: none; display: inline-grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; padding: 0; }
.theme-btn:hover { color: var(--ink); border-color: var(--ink-3); }

.crumbs { font-size: var(--s-sm); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { color: var(--ink-2); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }

/* ---------- shared case view ---------- */
.case { display: grid; gap: 28px; min-width: 0; }
.case-head { display: grid; gap: 10px; }
.case-title { font-family: var(--f-display); font-weight: 400; font-size: var(--s-2xl); line-height: 1.22; letter-spacing: -.01em; text-wrap: wrap; }
.nb { white-space: nowrap; }
mark.mk-src, mark.mk-law { color: inherit; border-radius: 2px; padding: 0 1px; }
mark.mk-src { background: var(--claim-bg); box-shadow: inset 0 -2px 0 var(--claim); }
mark.mk-law { background: var(--law-bg); box-shadow: inset 0 -2px 0 var(--law); }
.mk-key { font-size: var(--s-xs); color: var(--ink-3); }
.case-title .pub { font-weight: 600; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--surface); overflow: hidden; overflow: clip; }
.compare.long { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.pin { display: grid; gap: 12px; align-content: start; }
.compare.long .pin { position: sticky; top: 16px; }
.side { padding: 22px 24px 20px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.side + .side { border-left: 1px solid var(--rule); }
.side-label { font-family: var(--f-body); font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.side-claim .side-label { color: var(--claim); }
.side-law .side-label { color: var(--law); }
.side blockquote, .q-main { margin: 0; font-family: var(--f-display); font-size: var(--s-lg); line-height: 1.45; overflow-wrap: anywhere; }
.q-label { font-size: var(--s-xs); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.q-orig { border-top: 1px solid var(--rule-2); padding-top: 12px; }
.q-orig blockquote { font-size: var(--s-md); color: var(--ink-2); }
.q-orig summary { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; cursor: pointer; list-style: none; }
.q-orig summary::-webkit-details-marker { display: none; }
.q-orig summary .q-label { margin-bottom: 0; }
.q-toggle { font-size: var(--s-xs); color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.q-toggle::before { content: "Show"; } .q-orig[open] .q-toggle::before { content: "Hide"; }
.q-orig[open] summary { margin-bottom: 4px; }
.q-p { margin: 0 0 8px; } .q-p:last-child { margin-bottom: 0; }
.q-list { margin: 2px 0 8px; padding-left: 1.3em; list-style: disc; } .q-list:last-child { margin-bottom: 0; } .q-list li { margin: 0 0 6px; } .q-list li:last-child { margin-bottom: 0; }
.compare.long .side-claim blockquote, .compare.long .side-claim .q-main { font-size: 1.0625rem; line-height: 1.55; }
.cut-note { font-size: var(--s-xs); color: var(--ink-2); background: var(--rule-2); border-radius: 4px; padding: 6px 10px; }
.law-text { font-family: var(--f-display); font-size: var(--s-lg); line-height: 1.45; }
.side-meta { margin-top: auto; padding-top: 6px; font-size: var(--s-xs); color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.side-meta a { color: var(--ink-2); }
.practice { display: grid; gap: 8px; max-width: 68ch; }
.practice h2 { font-size: var(--s-xs); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
.practice p { color: var(--ink); }
.checked { font-size: var(--s-xs); color: var(--ink-3); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid var(--rule); padding-top: 14px; font-size: var(--s-sm); }
.pager a { text-decoration: none; color: var(--ink-2); max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager a:hover { color: var(--ink); }
.pager .pos { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pager .off { visibility: hidden; }

/* case rows used in lists */
.rows { border-top: 1px solid var(--rule); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: baseline; padding: 12px 2px; border-bottom: 1px solid var(--rule-2); text-decoration: none; }
.row:hover .row-text { color: var(--ink); }
.row:hover .arrow { color: var(--ink); transform: translateX(2px); }
.row-text { color: var(--ink-2); }
.row-text b { color: var(--ink); font-weight: 600; }
.arrow { color: var(--ink-3); transition: transform .15s; }

/* ================= A · Pages ================= */
.A main { padding-block: 24px 80px; }
.A .hero { display: grid; gap: 14px; padding-bottom: 12px; }
.A .hero .lede { max-width: none; text-wrap: wrap; }
.A .hero h1, .C .hero h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-3xl); line-height: 1.1; letter-spacing: -.015em; max-width: 40ch; }
.sector { display: grid; gap: 4px; padding-top: 28px; }
.sector-h { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; }
.sector-h h2 { font-size: var(--s-sm); letter-spacing: .07em; text-transform: uppercase; font-weight: 600; }
.sector-h span { color: var(--ink-3); font-size: var(--s-sm); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 400px) { .sector-h { flex-wrap: wrap; row-gap: 2px; } }
.area-row { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr) 64px; gap: 32px; padding: 24px 0; border-bottom: 1px solid var(--rule); text-decoration: none; align-items: start; }
.area-row:hover h3 { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.area-main { display: grid; gap: 6px; }
.area-main h3 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); line-height: 1.2; }
.area-main p { color: var(--ink-2); font-size: var(--s-sm); max-width: 46ch; }
.area-main .by { color: var(--ink-3); font-size: var(--s-xs); }
.issues-mini { display: grid; gap: 5px; padding-top: 4px; }
.issues-mini li { display: grid; grid-template-columns: minmax(0, 1fr) 96px 22px; gap: 10px; align-items: center; font-size: var(--s-sm); color: var(--ink-2); }
.issues-mini .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; background: var(--rule-2); border-radius: 3px; position: relative; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: var(--w); background: var(--claim); opacity: .8; border-radius: 3px; }
.issues-mini .n { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: var(--s-xs); }
.count { text-align: right; font-family: var(--f-display); font-size: var(--s-2xl); line-height: 1; font-variant-numeric: tabular-nums; }
.count small { display: block; font-family: var(--f-body); font-size: var(--s-xs); color: var(--ink-3); margin-top: 4px; }

.A .area-head { display: grid; gap: 12px; padding: 18px 0 8px; }
.A1 .area-head { padding-bottom: 32px; }
.A1 .area-head.res-head { padding-bottom: 8px; }
.A .area-head .lede { max-width: none; text-wrap: wrap; }
.A .area-head h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-3xl); line-height: 1.1; letter-spacing: -.015em; }
.toc { display: flex; flex-wrap: wrap; gap: 6px 8px; padding: 18px 0 8px; }
.toc a { font-size: var(--s-sm); text-decoration: none; color: var(--ink-2); border: 1px solid var(--rule); border-radius: 999px; padding: 3px 11px; background: var(--surface); white-space: nowrap; }
.toc a:hover { border-color: var(--ink-3); color: var(--ink); }
.toc a span { color: var(--ink-3); margin-left: 4px; font-variant-numeric: tabular-nums; }
.issue { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: 12px 40px; padding: 32px 0; border-top: 1px solid var(--rule); scroll-margin-top: calc(var(--proto-h) + 16px); }
.issue-head { display: grid; gap: 10px; align-content: start; }
.issue-head h1, .issue-head h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); line-height: 1.2; }
.keys { display: grid; gap: 4px; }
.issue-law { color: var(--ink-2); font-size: var(--s-sm); }
.issue-law .prov { display: table; margin-top: 4px; }
.issue .rows { border-top: none; }
.issue .row:first-child, .issue .row-group:first-child { padding-top: 2px; }
.A .case-wrap { display: grid; gap: 28px; padding-top: 18px; }
.more { display: grid; gap: 10px; padding-top: 12px; }
.more h2 { font-size: var(--s-sm); font-weight: 600; color: var(--ink-2); }

/* ================= B · Reader ================= */
.B .reader { display: grid; grid-template-columns: 236px minmax(300px, 400px) minmax(0, 1fr);
  height: calc(100dvh - var(--proto-h) - var(--site-h) - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.pane { overflow-y: auto; min-width: 0; overscroll-behavior: contain; }
.pane + .pane { border-left: 1px solid var(--rule); }
.B .nav { padding: 18px 10px 40px 16px; display: grid; gap: 18px; align-content: start; }
.nav-group { display: grid; gap: 2px; }
.nav-group > p { padding: 0 8px 6px; }
.nav-area { display: flex; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 4px; text-decoration: none; font-size: var(--s-sm); color: var(--ink-2); }
.nav-area:hover { background: var(--rule-2); color: var(--ink); }
.nav-area[aria-current="true"] { color: var(--ink); font-weight: 600; background: var(--rule-2); }
.nav-area span, .nav-topic span { color: var(--ink-3); font-weight: 400; font-variant-numeric: tabular-nums; }
.nav-topics { display: grid; gap: 1px; margin: 2px 0 8px 8px; border-left: 1px solid var(--rule); }
.nav-topic { display: flex; justify-content: space-between; gap: 8px; padding: 4px 8px 4px 12px; text-decoration: none; font-size: var(--s-xs); color: var(--ink-2); }
.nav-topic:hover { color: var(--ink); }
.B .list { background: var(--surface); }
.list-head { padding: 20px 20px 14px; display: grid; gap: 6px; border-bottom: 1px solid var(--rule); }
.list-head h1 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); line-height: 1.2; }
.list-head p { font-size: var(--s-sm); color: var(--ink-2); }
.l-issue { border-bottom: 1px solid var(--rule); scroll-margin-top: 0; }
.l-issue-head { position: sticky; top: 0; z-index: 1; background: var(--surface); padding: 14px 20px 10px; display: grid; gap: 4px; border-bottom: 1px solid var(--rule-2); }
.l-issue-head h2 { font-size: var(--s-sm); font-weight: 600; }
.l-issue-head .keys { display: flex; flex-wrap: wrap; gap: 2px 14px; }
.l-issue-head .k { font-size: var(--s-xs); }
.l-row { display: block; padding: 10px 20px 10px 17px; border-left: 3px solid transparent; text-decoration: none; font-size: var(--s-sm); color: var(--ink-2); line-height: 1.45; }
.l-row b { color: var(--ink); font-weight: 600; }
.l-row:hover { background: var(--rule-2); }
.l-row[aria-current="true"] { background: var(--claim-bg); border-left-color: var(--claim); color: var(--ink); }
.B .detail { padding: 28px 36px 60px; }
.B .detail .case { max-width: 860px; }
.B .detail .case-title { font-size: var(--s-xl); }
.area-select { display: none; font: inherit; font-size: var(--s-sm); padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; background: var(--surface); color: var(--ink); min-width: 0; max-width: 55%; }

/* ================= C · Patterns ================= */
.C main { padding-block: 40px 80px; }
.C .hero { display: grid; gap: 14px; padding-bottom: 24px; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 8px; position: sticky; top: calc(var(--proto-h) + env(safe-area-inset-top, 0px)); z-index: 5; background: var(--bg); padding-top: 10px; }
.filters button { font: inherit; font-size: var(--s-sm); padding: 5px 13px; border-radius: 999px; border: 1px solid var(--rule); background: var(--surface); color: var(--ink-2); cursor: pointer; }
.filters button:hover { border-color: var(--ink-3); color: var(--ink); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.filters button span { opacity: .6; margin-left: 4px; font-variant-numeric: tabular-nums; }
.c-area { padding-top: 36px; display: grid; gap: 14px; scroll-margin-top: calc(var(--proto-h) + 60px); }
.c-area-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; border-bottom: 1px solid var(--rule); padding-bottom: 8px; }
.c-area-head h2 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-xl); }
.c-area-head p { font-size: var(--s-sm); color: var(--ink-3); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 12px; }
.card { display: grid; grid-template-rows: auto 1fr auto; gap: 14px; padding: 16px 16px 14px; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; text-decoration: none; min-height: 178px; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--ink-3); transform: translateY(-1px); }
.card-t { font-size: var(--s-sm); font-weight: 600; line-height: 1.35; }
.pair { margin: 0; display: grid; gap: 8px; align-content: start; }
.pair div { display: grid; gap: 1px; }
.pair dt { font-size: 0.6875rem; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.pair dd { margin: 0; font-family: var(--f-display); font-size: var(--s-lg); line-height: 1.25; }
.pair .law dt, .pair .law dd { color: var(--law); }
.pair .claim dt { color: var(--claim); }
.pair .claim dd { color: var(--ink); }
.card-n { font-size: var(--s-xs); color: var(--ink-3); display: flex; justify-content: space-between; }
.c-topic-head { display: grid; gap: 18px; padding: 18px 0 32px; }
.c-topic-head h1 { font-family: var(--f-display); font-weight: 400; font-size: var(--s-3xl); line-height: 1.1; letter-spacing: -.015em; }
.big-pair { display: grid; grid-template-columns: 1fr 1fr; border-top: 2px solid var(--ink); border-bottom: 1px solid var(--rule); }
.big-pair > div { padding: 16px 20px 18px 0; display: grid; gap: 4px; }
.big-pair > div + div { padding-left: 20px; border-left: 1px solid var(--rule); }
.big-pair .lab { font-size: var(--s-xs); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }

.lens-row { padding: 6px 0; }

.lens a span { opacity: .65; font-variant-numeric: tabular-nums; }
.A .hero { padding-top: 24px; }
.res-bar { display: flex; height: 8px; min-width: 0; border-radius: 2px; overflow: hidden; background: var(--rule); }
.area-line > .res-bar { grid-column: 1 / -1; margin-top: 6px; }
.res-bar i, .res-dots i, .res-legend i, .res-card .sq { display: block; }

.res-dots { display: inline-flex; gap: 4px; }
.res-dots i, .res-card .sq { flex: none; width: 14px; height: 14px; border-radius: 3px; }
.res-legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding-top: 8px; color: var(--ink-2); font-size: var(--s-xs); }
.res-legend span { display: inline-flex; align-items: center; gap: 6px; }
.res-legend i { width: 10px; height: 10px; border-radius: 2px; }
.red { color: var(--claim); }
.res-sum { display: grid; gap: 4px; padding: 16px 0 4px; }
.res-stat { color: var(--ink-2); font-size: var(--s-sm); font-variant-numeric: tabular-nums; }

.res-h { display: flex; justify-content: space-between; gap: 16px; padding-top: 28px; padding-bottom: 8px; border-bottom: 2px solid var(--ink); font-size: var(--s-sm); font-weight: 600; letter-spacing: .07em; text-transform: uppercase; }
.res-h span { color: var(--ink-3); font-weight: 400; letter-spacing: 0; text-transform: none; }
.res-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 16px; padding-top: 16px; }

.res-card h3 a { text-decoration: none; }

.res-card .qs { color: var(--ink-2); font-size: var(--s-sm); line-height: 1.5; }
.res-card .ql { color: var(--ink-3); font-size: var(--s-xs); }
.res-card .ql b { margin-right: 8px; color: var(--law); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; }
.res-card .cr { display: grid; gap: 4px; margin-top: auto; padding: 12px 18px 14px; border-top: 1px solid var(--rule); background: var(--bg); }
.res-card .cr.res-bad { border-top-color: transparent; background: var(--claim-bg); }
.res-card .lab { display: flex; align-items: center; gap: 8px; font-size: var(--s-sm); }
.res-card .lab b { font-weight: 600; }
.res-card .txt { font-size: var(--s-sm); }
.res-card .src { color: var(--ink-3); font-size: var(--s-xs); overflow-wrap: anywhere; }
.res-card .src a { color: var(--ink-2); }
.res-card .res-bar { margin-top: 4px; }
.res-ctl { display: grid; gap: 10px; padding: 14px 0 6px; }
.res-search, .res-chips select { font: inherit; min-height: 44px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); color: var(--ink); }
.res-search { display: block; width: 100%; padding: 10px 14px; font-size: var(--s-md); }
.res-search::placeholder { color: var(--ink-3); }
.res-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.res-btn { font: inherit; font-size: var(--s-sm); min-height: 44px; padding: 0 14px; border: 1px solid var(--rule); border-radius: 999px; background: var(--surface); color: var(--ink-2); cursor: pointer; }
.res-btn:hover, .res-chips select:hover { border-color: var(--ink-3); color: var(--ink); }
.res-chips select { padding: 0 10px; font-size: var(--s-sm); color: var(--ink-2); }
.res-btn { margin-top: 12px; border-radius: 8px; }
.res-row, .res-th { display: grid; grid-template-columns: minmax(0, 1fr) auto 3.4em; gap: 2px 12px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--rule-2); text-decoration: none; }

.res-empty { padding: 18px 0; color: var(--ink-3); font-size: var(--s-sm); }
.res-empty .res-btn { margin: 8px 0 0; display: block; }
.res-note { padding-top: 24px; color: var(--ink-2); font-size: var(--s-sm); }
.res-note b { color: var(--ink); font-weight: 600; }
.meta-line a { color: var(--ink-2); }
.res-row small .red { font-weight: 500; }
.res-q .issue-law { color: var(--ink-2); font-size: var(--s-sm); }
.res-q .issue-head { gap: 8px; }
.res-q-sum { display: grid; gap: 6px; max-width: 280px; padding-top: 4px; }

.res-q-lawbtn:hover { color: var(--ink); }
.res-q-lawbtn i { color: var(--ink-3); font-style: normal; transition: transform .15s; }
.res-q-lawbtn[aria-expanded="true"] i { transform: rotate(180deg); }
.res-q-law { color: var(--ink-2); font-size: var(--s-sm); padding-bottom: 6px; }
.res-q-law .prov { white-space: nowrap; }
.res-q-note { display: block; margin-bottom: 4px; color: var(--ink-3); font-size: var(--s-xs); }
.res-q-none { padding: 2px 2px 0; color: var(--ink-3); font-size: var(--s-sm); }
.res-q .rows .res-btn { margin-top: 12px; }

.res-q-first { border-top: 0; padding-top: 24px; }
.res-q-also { color: var(--ink-2); font-size: var(--s-sm); padding-top: 6px; }
.res-q-also a { color: var(--ink); text-underline-offset: 3px; }
.issue-page { border-top: 0; padding-top: 24px; }

@media (max-width: 640px) {
  .lens a { min-height: 44px; }
  .res-q:not(.open) .row.x2 { display: none; }

  .issue.res-q { grid-template-columns: minmax(0, 1fr); padding: 24px 0; }
}

/* institution page: one card per row, question left and result right, so no card stretches into an empty band */
@media (min-width: 801px) {
  .res-cards.res-rows { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .res-rows .res-card { flex-direction: row; }
  .res-rows .res-card .cq { flex: 0 0 46%; align-content: center; }
  .res-rows .res-card .cr { flex: 1; margin-top: 0; border-top: 0; border-left: 1px solid var(--rule); align-content: center; }
  .res-rows .res-card .cr.res-bad { border-left-color: transparent; }
}

/* single-column grids must not grow past their container */
.case, .case-head, .case-wrap, .q, .versions, .side, .practice, .more, .sheet, .A .hero, .C .hero, .A .area-head, .c-topic-head, .issue-head, .area-main { grid-template-columns: minmax(0, 1fr); }

/* ---------- responsive ---------- */
@media (max-width: 900px) {
  .home-cols { grid-template-columns: minmax(0, 1fr); }
  .area-row { grid-template-columns: minmax(0, 1fr) 52px; gap: 16px; }
  .area-row .issues-mini { grid-column: 1 / -1; grid-row: 2; }
  .issue { grid-template-columns: minmax(0, 1fr); }
  .B .reader { grid-template-columns: minmax(0, 1fr); height: auto; }
  .B .nav { display: none; }
  .pane { overflow: visible; }
  .pane + .pane { border-left: none; border-top: 1px solid var(--rule); }
  .B .list { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
  .list-head, .l-issue-head { padding-left: 0; padding-right: 0; }
  .l-issue-head { position: static; }
  .l-row { padding-left: 10px; padding-right: 10px; }
  .B .detail { padding: 28px var(--gutter-r) 60px var(--gutter-l); scroll-margin-top: var(--proto-h); }
  .area-select { display: block; }
  .drawer { grid-template-columns: 0 minmax(0, 1fr); }
  .sheet { padding-left: var(--gutter-l); padding-right: var(--gutter-r); border-left: none; }
}
@media (max-width: 640px) {
  :root { --s-3xl: 2rem; --s-2xl: 1.6rem; }
  .compare { grid-template-columns: minmax(0, 1fr); }
  .side + .side { border-left: none; border-top: 1px solid var(--rule); }
  .compare.long { grid-template-columns: minmax(0, 1fr); }
  .compare.long .side-law { order: -1; border-top: none; }
  .compare.long .side-claim { border-top: 1px solid var(--rule); }
  .compare.long .pin { position: static; }
  .side { padding: 18px 18px 16px; }

/* ================= Institutions: groups checked question by question ================= */
/* Each group is a fixed cohort (for example Jobcenters) with the same few questions for every member.
   A result reads "Misrepresentation" only when a published case backs it; the data carries nothing else. */
const RESULT = { bad: "Misrepresentation", amb: "Unclear", na: "Not addressed or not found", ok: "No misrepresentation found", unp: "Not yet published" };
const fmtN = n => n.toLocaleString("en-GB");
GROUPS.forEach(g => {
  g.cnt = { bad: 0, amb: 0, na: 0, ok: 0, unp: 0 };
  g.perQ = g.qs.map(() => ({ bad: 0, amb: 0, na: 0, ok: 0, unp: 0 }));
  g.withBad = 0;
  g.ents.forEach(e => {
    e.bad = e.rows.filter(r => r[0] === "bad").length;
    e.amb = e.rows.filter(r => r[0] === "amb").length;
    e.unp = e.rows.filter(r => r[0] === "unp").length;
    if (e.bad) g.withBad++;
    e.rows.forEach((r, i) => { g.cnt[r[0]]++; g.perQ[i][r[0]]++; });
  });
  // Each institution counts once, by its worst result: a misrepresentation, else a finding not yet published, else unclear, else no misrepresentation found.
  g.inst = { bad: 0, amb: 0, na: 0, ok: 0, unp: 0 };
  g.ents.forEach(e => { g.inst[e.bad ? "bad" : e.unp ? "unp" : e.amb ? "amb" : "ok"]++; });
  // Of the institutions with no misrepresentation found, those with at least one question not addressed or not found: their grey is not a clean result.
  g.gapOk = g.ents.filter(e => !e.bad && !e.unp && !e.amb && e.rows.some(r => r[0] === "na")).length;
  g.ents.sort((a, b) => b.bad - a.bad || b.amb - a.amb || a.name.localeCompare(b.name, "de"));
  g.checks = g.ents.length * g.qs.length;
  g.states = [...new Set(g.ents.map(e => e.state).filter(Boolean))].sort((a, b) => a.localeCompare(b, "de"));
  g.ents.forEach(e => { ENTITY[g.id + "~" + e.id] = [g, e]; });
});
const GROUP_TOTAL = { n: GROUPS.reduce((n, g) => n + g.ents.length, 0), checks: GROUPS.reduce((n, g) => n + g.checks, 0),
  ok: GROUPS.reduce((n, g) => n + g.cnt.ok, 0), bad: GROUPS.reduce((n, g) => n + g.cnt.bad, 0) };

const resBar = c => `<span class="res-bar" role="img" aria-label="${c.bad} with misrepresentation, ${c.amb} unclear, ${c.na} not addressed or not found, ${c.ok} no misrepresentation found${c.unp ? `, ${c.unp} not yet published` : ""}">${["bad", "amb", "na", "ok", "unp"].map(k => `<i class="${k}" style="flex:${c[k]}"></i>`).join("")}</span>`;
const gapLine = g => !g.gapOk ? "" : `${g.gapOk === g.inst.ok ? (g.inst.ok === 1 ? "The one" : `All ${g.inst.ok}`) : `${g.gapOk} of the ${g.inst.ok}`} with none found lacked guidance on at least one question`;
const instBar = g => `<span class="res-bar" role="img" aria-label="${g.inst.bad} of ${g.ents.length} with a misrepresentation${g.inst.unp ? `, ${g.inst.unp} with a finding not yet published` : ""}, ${g.inst.amb} with unclear results only, ${g.inst.ok} with no misrepresentation found">${["bad", "unp", "amb", "ok"].map(k => `<i class="${k}" style="flex:${g.inst[k]}"></i>`).join("")}</span>`;
const resLegend = g => `<p class="res-legend">${["bad", "amb", "na", "ok", ...(g.cnt.unp ? ["unp"] : [])].map(k => `<span><i class="${k}"></i>${RESULT[k]}</span>`).join("")}</p>`;
const entityDots = (g, e) => `<span class="res-dots" role="img" aria-label="${esc(g.qs.map((q, i) => `${q.title}: ${RESULT[e.rows[i][0]].toLowerCase()}`).join("; "))}">${e.rows.map((r, i) => `<i class="${r[0]}" title="${esc(g.qs[i].title)}: ${RESULT[r[0]].toLowerCase()}"></i>`).join("")}</span>`;
const entitySub = (g, e) => e.state || e.op ? esc(e.state || e.op) : "";
const entityHref = (L, g, e) => href(L, "entity", g.id + "~" + e.id);
// Host and the last path segment, never cut mid-word without "…" ("bahn.de/…/rechtliche-regelungen").
const pageLabel = url => { try { const u = new URL(url), segs = u.pathname.split("/").filter(Boolean); let last = segs.pop() || ""; if (last.length > 40) last = last.slice(0, 40) + "…"; return u.hostname.replace(/^www\./, "") + (last ? "/" + (segs.length ? "…/" : "") + last : ""); } catch (e) { return url; } };

function lensRow(L, current) {
  const tab = (kind, label) => `<a href="${href(L, kind)}"${current === (kind || "issue") ? ' aria-current="page"' : ""}>${label}</a>`;
  // With systemic sweeps the three tabs share a short form: below 380px the word "sweeps" drops so they fit one line.
  const sfx = SYS ? '<span class="x"> sweeps</span>' : " sweeps";
  lensNav = `<nav class="lens" aria-label="Browse by">${tab("", "Issue" + sfx)}${GROUPS.length ? tab("inst", "Institution" + sfx) : ""}${SYS ? tab("sys", "Systemic" + sfx) : ""}</nav>`;
  // On the institution view the legend that explains the bars sits under the statistics.
  return current === "inst" ? `<div class="lens-row"><p class="res-legend">${["bad", "amb", "ok", ...(GROUPS.some(g => g.inst.unp) ? ["unp"] : [])].map(k => `<span><i class="${k}"></i>${RESULT[k]}</span>`).join("")}</p></div>` : "";
}

function instHome(L) {
  const lines = ["gov", "biz"].map(sec => {
    const gs = GROUPS.filter(g => g.sector === sec);
    if (!gs.length) return "";
    return `<section class="home-sec"><div class="sector-h"><h2>${SECTOR_SCOPE[sec].title}</h2><span>${plural(gs.reduce((n, g) => n + g.ents.length, 0), "institution", "institutions")}</span></div>
      <div>${gs.map(g => `<a class="area-line" href="${href(L, "group", g.id)}"><h3>${esc(g.title)}</h3><span class="n">${g.ents.length}<small>checked</small></span>
        <p class="scope"><span class="law-s">${esc(g.lawShort)}</span><span>${plural(g.ents.length, "institution", "institutions")}${g.region === "country" ? ` in ${g.states.length} countries` : ""}</span></p>
        ${instBar(g)}
        <p class="issues"><b>${g.withBad} of ${g.ents.length}</b> had a misrepresentation</p>${g.gapOk ? `<p class="issues gap">${esc(gapLine(g))}</p>` : ""}</a>`).join("")}</div></section>`;
  }).join("");
  return `<section class="hero"><h1>What you’re told vs. what the law says</h1>
    <p class="lede">${esc(widow(`Authorities and companies checked one by one, on the same few questions each.`))}</p>
    <p class="stats">${fmtN(GROUP_TOTAL.n)} institutions · ${fmtN(GROUP_TOTAL.checks)} checks · ${fmtN(GROUP_TOTAL.bad)} checks found a misrepresentation<span class="stats-note">A check is one institution on one question. Several checks can rest on the same published case.</span></p></section>
    ${lensRow(L, "inst")}<div class="home-cols">${lines}</div>`;
}

const DIR = { q: "", st: "", shown: 20, group: "" };
function dirMatches(g) {
  const q = DIR.q.trim().toLowerCase();
  return g.ents.filter(e => (!q || e.name.toLowerCase().includes(q) || (e.state || "").toLowerCase().includes(q))
    && (!DIR.st || e.state === DIR.st));
}
function dirHtml(L, g) {
  const list = dirMatches(g), cut = list.slice(0, DIR.shown);
  if (!list.length) return `<p class="res-empty">Nothing found. Only institutions we checked are listed.</p>`;
  const more = list.length > cut.length ? `<button type="button" class="res-btn" data-more>Show ${Math.min(30, list.length - cut.length)} more</button>` : "";
  const sub = e => entitySub(g, e) ? `<small>${entitySub(g, e)}</small>` : "";
  return cut.map(e => `<a class="res-row" href="${entityHref(L, g, e)}"><b>${esc(e.name)}</b>${sub(e)}${entityDots(g, e)}<span class="res-n${e.bad ? " red" : ""}"${e.bad ? ` aria-label="${e.bad} of ${g.qs.length} questions with a misrepresentation"` : ""}>${e.bad ? `${e.bad} of ${g.qs.length}` : ""}</span></a>`).join("") + more;
}
// Search and, for groups spread over several states or countries, a select; the table below is always the whole group, worst results first.
function dirControls(g) {
  const sel = g.states.length > 1 && g.states.length <= 40 ? `<div class="res-chips"><select aria-label="${esc(g.region || "state")}"><option value="">All ${g.region ? esc(g.region) + "s" : "states"}</option>${g.states.map(s => `<option${DIR.st === s ? " selected" : ""}>${esc(s)}</option>`).join("")}</select></div>` : "";
  return `<div class="res-ctl"><input class="res-search" type="search" value="${esc(DIR.q)}" placeholder="Search ${esc(g.title)}${g.states.length > 1 ? ` or ${g.region || "state"}` : ""}" aria-label="Search ${esc(g.title)}" autocomplete="off">${sel}</div>`;
}
// The squares carry no words, so the questions are listed once, one per line, above the table; the column numbers match.
function dirKey(g) {
  const kinds = ["bad", "amb", "ok", "na", ...(g.cnt.unp ? ["unp"] : [])];
  return `<div class="res-keys"><ol class="res-key" aria-label="Questions, in column order">${g.qs.map((q, i) => `<li><b>${i + 1}</b>${esc(q.title)}</li>`).join("")}</ol>
    <p class="res-legend dotkey">${kinds.map(k => `<span><i class="${k}"></i>${RESULT[k]}</span>`).join("")}</p></div>
    <div class="res-th" aria-hidden="true"><span></span><span class="res-nums">${g.qs.map((q, i) => `<b>${i + 1}</b>`).join("")}</span><span></span></div>`;
}
function questionBlock(q) {
  return `<p class="qs">${keep(q.q)}</p><p class="ql"><b>The law</b>${keep(q.law)}</p>`;
}
const questionTitle = (L, q) => q.topic && TOPIC[q.topic] ? `<a href="${href(L, "topic", q.topic)}">${esc(q.title)}</a>` : esc(q.title);

// One block per question, built like an issue on the area page: question and law on the left, the group's institutions with a misrepresentation on the right.
// The lists come from the group's own results, so each adds up to the count beside it; the issue page holds every source.
// A claim is written to follow its publisher ("says …"); a capitalised verb is lowered, and a claim that opens with a noun ("Its conditions …") follows a dash.
const VERB_S = /^[A-Z][a-z]*s$/, NOT_VERB = /^(Its|Tickets|This|Dues)$/;
// A case shared by several publishers is worded in the plural ("say …", "still offer …"); one institution's row needs the singular.
const singularClaim = t => t.replace(/^((?:still |\w+ly )*)([a-z]+)/, (m, adv, v) => /s$|^(?:can|may|must|will|would|should|could|might|cannot)$/.test(v) ? m
  : adv + (v === "have" ? "has" : v === "are" ? "is" : /[^aeiou]y$/.test(v) ? v.slice(0, -1) + "ies" : /(x|z|ch|sh)$/.test(v) ? v + "es" : v + "s"));
function claimAfterName(c) {
  const t = singularClaim(c.claim.replace(/\.$/, "")), w = t.split(/\s/)[0];
  if (/^[a-z]/.test(t)) return keep(t) + ".";
  if (VERB_S.test(w) && !NOT_VERB.test(w)) return keep(t.replace(/^./, m => m.toLowerCase())) + ".";
  return "– " + keep(t) + ".";
}
function questionBlocks(L, g) {
  return g.qs.map((q, i) => {
    const bad = g.ents.filter(e => e.rows[i][0] === "bad" && CASES[e.rows[i][1]]), n = g.perQ[i].bad, T = q.topic && TOPIC[q.topic];
    // The question's own legal text wins; the linked issue's explanation is shown as it is only when someone confirmed it answers this question.
    const P = q.lawText ? { law: q.lawText, prov: q.prov, url: q.lawUrl } : T && { law: T.law, prov: T.provision, url: T.lawUrl, general: q.basis !== "issue" };
    const rows = bad.map((e, k) => `<a class="row${bad.length > 4 && k >= 3 ? " x3" : ""}${bad.length > 4 && k === 2 ? " x2" : ""}" href="${href(L, "case", e.rows[i][1], g.id + "~" + e.id)}"><span class="row-text"><b>${esc(e.name)}</b> ${claimAfterName(CASES[e.rows[i][1]])}</span><span class="arrow" aria-hidden="true">→</span></a>`).join("");
    const more = bad.length > 4 ? `<button type="button" class="res-btn" data-q-more>Show all ${bad.length}</button>` : "";
    return `<section class="issue res-q${i === 0 ? " res-q-first" : ""}" id="q-${i}"><div class="issue-head"><h2>${esc(q.title)}</h2><p class="issue-law">${keep(q.q)}</p>
      <div class="keys"><span class="k law"><b>Law</b>${keep(q.law)}</span></div>
      <div class="res-q-sum"><p><b${n ? ' class="red"' : ""}>${n} of ${g.ents.length}</b> had a misrepresentation</p>${resBar(g.perQ[i])}</div>
      ${P ? `<div class="res-q-actions"><button type="button" class="res-q-lawbtn" data-q-law aria-expanded="false" aria-controls="q-law-${i}">What the law says <i aria-hidden="true">⌄</i></button></div>
      <p class="res-q-law" id="q-law-${i}" hidden>${P.general ? `<span class="res-q-note">This explains the whole issue and has not yet been checked against this question.</span>` : ""}${keep(P.law)} <a class="prov" href="${esc(P.url)}" target="_blank" rel="noopener">${provText(P.prov).replace(/ (?=§)/g, "&nbsp;")} ↗</a></p>` : ""}</div>
      <div class="rows">${rows || `<p class="res-q-none">No misrepresentation found on this question.</p>`}${more}</div></section>`;
  }).join("");
}
function groupPage(L, g) {
  if (DIR.group !== g.id) Object.assign(DIR, { q: "", st: "", shown: 20, group: g.id });
  return `<nav class="crumbs" aria-label="Breadcrumb"><a href="${href(L, "inst")}">← All institutions</a></nav>
    <header class="area-head res-head"><p class="eyebrow">${SECTOR_SCOPE[g.sector].title}</p><h1>${esc(g.title)}</h1><p class="lede">${esc(widow(`${g.who}. ${g.ents.length} checked on ${g.qs.length} questions each, against ${g.lawShort}.`))}</p></header>
    <div class="res-sum"><p class="res-stat"><b>${g.withBad}</b> of ${g.ents.length} had a misrepresentation</p>${g.gapOk ? `<p class="res-stat gap">${esc(gapLine(g))}</p>` : ""}${instBar(g)}${resLegend(g)}</div>
    <h2 class="res-h">By question</h2>
    ${questionBlocks(L, g)}
    <h2 class="res-h">Institutions <span>${g.ents.length} checked</span></h2>
    ${dirControls(g)}${dirKey(g)}<div id="res-dir">${dirHtml(L, g)}</div>`;
}
function afterGroup(s) {
  const g = GROUP[s.id], dir = document.getElementById("res-dir");
  if (!dir) return;
  const redraw = () => { dir.innerHTML = dirHtml(s.L, g); };
  document.querySelectorAll(".res-q").forEach(q => q.addEventListener("click", e => {
    const law = e.target.closest("[data-q-law]");
    if (law) {
      const open = law.getAttribute("aria-expanded") === "true";
      law.setAttribute("aria-expanded", String(!open));
      document.getElementById(law.getAttribute("aria-controls")).hidden = open;
      return;
    }
    if (!e.target.closest("[data-q-more]")) return;
    // The list grows below the button; the button goes and focus moves to the first row that appeared.
    const first = q.querySelector(matchMedia("(max-width: 640px)").matches ? ".row.x2" : ".row.x3");
    q.classList.add("open");
    e.target.closest("[data-q-more]").remove();
    first?.focus();
  }));
  document.querySelector(".res-search")?.addEventListener("input", e => { DIR.q = e.target.value; DIR.shown = 20; redraw(); });
  document.querySelector(".res-chips select")?.addEventListener("change", e => { DIR.st = e.target.value; DIR.shown = 20; redraw(); });
  dir.addEventListener("click", e => {
    if (e.target.closest("[data-more]")) {
      const had = dir.querySelectorAll(".res-row").length;
      DIR.shown += 30; redraw();
      dir.querySelectorAll(".res-row")[had]?.focus();
    }
  });
}

function entityPage(L, g, e) {
  const dates = e.rows.map(r => r[3]).sort(), done = dates[dates.length - 1];
  const tally = [["bad", "with misrepresentation"], ["amb", "unclear"], ["ok", "with no misrepresentation found"], ["na", "not addressed or not found"], ["unp", "not yet published"]]
    .map(([k, w]) => [e.rows.filter(r => r[0] === k).length, w]).filter(([n]) => n).map(([n, w]) => `${n} ${w}`).join(", ");
  // When every question was read on the same page, the page is named once in the header instead of on every card.
  const urls = [...new Set(e.rows.map(r => r[2]).filter(Boolean))], once = urls.length === 1 && e.rows.every(r => r[2]);
  const pageLink = url => `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(pageLabel(url))} ↗</a>`;
  const cards = g.qs.map((q, i) => {
    const [k, caseId, url, , note] = e.rows[i], c = CASES[caseId];
    const what = k === "bad" && c ? `${esc(singularClaim(c.claim).replace(/^./, m => m.toUpperCase()).replace(/\.$/, ""))}. <a href="${href(L, "case", caseId, g.id + "~" + e.id)}">Read the case →</a>`
      : k === "bad" ? "A published case backs this result."
      : note ? esc(note)
      : k === "amb" ? "The evidence was insufficient or conflicting; no misrepresentation was confirmed."
      : k === "na" ? "The specific issue was not addressed, or relevant guidance was not located."
      : k === "unp" ? "We have a finding on this question that is not yet published."
      : "";   // a clean result needs no sentence beyond its label and the note below
    return `<article class="res-card"><div class="cq"><h3>${questionTitle(L, q)}</h3>${questionBlock(q)}</div>
      <div class="cr res-${k}"><p class="lab"><i class="sq ${k}"></i><b${k === "bad" ? ' class="red"' : ""}>${RESULT[k]}</b></p>${what ? `<p class="txt">${what}</p>` : ""}${url && !once ? `<p class="src">Page checked: ${pageLink(url)}</p>` : ""}</div></article>`;
  }).join("");
  return `<nav class="crumbs" aria-label="Breadcrumb"><a href="${href(L, "group", g.id)}">← ${esc(g.title)}</a></nav>
    <header class="area-head">${e.state ? `<p class="eyebrow">${esc(g.one)} · ${esc(e.state)}</p>` : ""}<h1>${esc(e.name)}</h1>
    <p class="lede">${esc(widow(`${plural(g.qs.length, "question", "questions")} checked on ${fmtDate(done)}: ${tally}.`))}</p>
    ${e.op || e.web || once ? `<p class="meta-line">${e.op ? `<span>Run by ${esc(e.op)}</span>` : ""}${e.web ? `<span><a href="${esc(e.web)}" target="_blank" rel="noopener">Official website ↗</a></span>` : ""}${once ? `<span>Page checked: ${pageLink(urls[0])}</span>` : ""}</p>` : ""}</header>
    <div class="res-cards res-rows">${cards}</div>
    <p class="res-note"><b>What this shows.</b> The result for each question describes the pages we read on the date above. It does not show whether anyone was refused or misled in practice, and the pages may have changed since.</p>`;
}

function instBody(s) {
  if (s.kind === "inst") return instHome(s.L);
  if (s.kind === "group") return groupPage(s.L, GROUP[s.id]);
  const [g, e] = ENTITY[s.id];
  return entityPage(s.L, g, e);
}

/* ================= Systemic sweeps: cities ================= */
// Optional like the institution groups: DATA.systemic exists only when subjects/systemic/ holds a file, and without it nothing below is used.
const SYS = (DATA.systemic || [])[0] || null;
const SYSCITY = {}, SYSDIST = {};
const SYS_STATES = { "01": "Schleswig-Holstein", "02": "Hamburg", "03": "Lower Saxony", "04": "Bremen", "05": "North Rhine-Westphalia", "06": "Hesse", "07": "Rhineland-Palatinate", "08": "Baden-Württemberg", "09": "Bavaria", "10": "Saarland", "11": "Berlin", "12": "Brandenburg", "13": "Mecklenburg-Vorpommern", "14": "Saxony", "15": "Saxony-Anhalt", "16": "Thuringia" };
const SYS_CITY_STATES = ["02", "04", "11"];
const SYS_LABEL = { bad: "Misrepresentation", amb: "Unclear", ok: "No misrepresentation found", na: "Not yet inspected" };
const SYS_PAGE = { bad: "Misrepresentation", amb: "Unclear", ok: "No misrepresentation found", na: "Not addressed in the guidance found", x: "Guidance not accessible" };
const SYS_KEYS = ["bad", "amb", "ok", "na"];
// A headline is German only when it holds German function words. Umlauts alone do not count: plain English headlines name BAföG, Führungszeugnis or Bürgergeld.
const SYS_DE_WORDS = /\b(der|die|das|und|nicht|wird|werden|für|mit|eine|ein|den|dem|von|bei|Die|Der|Das|Sie|ist|sind)\b/g;
const isGermanClaim = t => (String(t).match(SYS_DE_WORDS) || []).length >= 2;
if (SYS) {
  SYS.list = SYS.cities.map(([id, rank, name, pop, cov, pages, F, web]) => {
    const c = { id, rank, name, pop, cov, pages, F, web, st: id.slice(0, 2), bad: F.filter(f => f.s === "bad").length, amb: F.filter(f => f.s === "amb").length };
    c.k = c.bad ? "bad" : c.amb ? "amb" : cov === "s" ? "ok" : "na";
    c.read = pages.filter(p => p[0] === "bad" || p[0] === "amb" || p[0] === "ok").length;
    SYSCITY[id] = c;
    return c;
  });
  SYS.cnt = { bad: 0, amb: 0, ok: 0, na: 0 };
  SYS.list.forEach(c => SYS.cnt[c.k]++);
  SYS.confirmed = SYS.list.reduce((n, c) => n + c.bad, 0);
  SYS.inspected = SYS.cnt.bad + SYS.cnt.amb + SYS.cnt.ok;
  // Districts (Landkreise) are optional too: a hand-picked set with no rank or population, shown beside the cities and never added to their totals.
  SYS.dlist = (SYS.districts || []).map(([id, name, st, cov, pages, F, web, auth]) => {
    const c = { id, name, st, cov, pages, F, web, auth, dist: true, bad: F.filter(f => f.s === "bad").length, amb: F.filter(f => f.s === "amb").length };
    c.k = c.bad ? "bad" : c.amb ? "amb" : cov === "s" ? "ok" : "na";
    c.read = pages.filter(p => p[0] === "bad" || p[0] === "amb" || p[0] === "ok").length;
    SYSDIST[id] = c;
    return c;
  });
  SYS.dbad = SYS.dlist.filter(c => c.k === "bad").length;
  SYS.dread = SYS.dlist.filter(c => c.k !== "na").length;
  SYS.dbad_all = SYS.dlist.reduce((n, c) => n + c.bad, 0);
}
const sysNoun = n => n === 1 ? "misrepresentation" : "misrepresentations";
const sysSearchKey = t => t.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const SYS_HINT = SYS && SYS.dlist.length ? "Hover or tap a dot or square to see the city or district." : "Hover or tap a square to see the city.";
const sysKind = c => c.dist ? "district" : "city";
const sysReadLine = (c, open) => `<b>${esc(c.name)}</b> · ${esc(SYS_STATES[c.st])} · ${c.dist ? "district" : `${fmtN(c.pop)} inhabitants`} · ${c.bad ? `<span class="red">${c.bad} ${sysNoun(c.bad)}</span>` : SYS_LABEL[c.k].toLowerCase()}${open ? ` · <a href="${href("A1", sysKind(c), c.id)}">Open page →</a>` : ""}`;
const sysSquare = c => `<a class="${c.k}${c.dist ? " d" : ""}" href="${href("A1", sysKind(c), c.id)}" data-id="${c.id}" tabindex="-1" aria-label="${esc(c.name)}: ${esc(SYS_LABEL[c.k].toLowerCase())}"></a>`;

// One line per kind: how many were inspected, how many of them have at least one misrepresentation, and that share of the inspected.
const sysSumLine = (shape, inspected, [one, many], bad) => `<p class="sy-sum-line"><i class="sy-g ${shape}"></i><span><b>${fmtN(inspected)}</b> ${inspected === 1 ? one : many} inspected · <b>${fmtN(bad)}</b>${inspected ? ` (${Math.round(100 * bad / inspected)}%)` : ""} with a misrepresentation</span></p>`;

function sysHome(L) {
  const stateBlock = id => {
    const l = SYS.list.filter(c => c.st === id);
    const d = (SYS.dlist || []).filter(c => c.st === id);
    return `<section class="sy-state"><h3>${esc(SYS_STATES[id])}</h3>${d.length ? `<div class="sy-grp"><p class="sy-sub">${plural(d.length, "district", "districts")}</p><div class="sy-sq dist">${d.map(sysSquare).join("")}</div></div>` : ""}<div class="sy-grp"><p class="sy-sub">${plural(l.length, "city", "cities")}</p><div class="sy-sq">${l.map(sysSquare).join("")}</div></div></section>`;
  };
  const ids = Object.keys(SYS_STATES).filter(id => !SYS_CITY_STATES.includes(id)).sort((a, b) => SYS.list.filter(c => c.st === b).length - SYS.list.filter(c => c.st === a).length);
  // Berlin, Hamburg and Bremen (with Bremerhaven) have one or two cities each: one block with named squares.
  const cs = SYS.list.filter(c => SYS_CITY_STATES.includes(c.st));
  const cityStates = `<section class="sy-state"><h3>City-states</h3><div class="sy-grp"><p class="sy-sub">${plural(cs.length, "city", "cities")}</p><div class="sy-named">${cs.map(c => `<a class="sy-nm" href="${href("A1", "city", c.id)}"><i class="${c.k}"></i>${esc(c.name)}</a>`).join("")}</div></div></section>`;
  return `<section class="hero"><h1>What you’re told vs. what the law says</h1><p class="lede">${esc(widow(`Websites of the ${fmtN(SYS.list.length)} largest German cities${SYS.dlist.length ? " and all German districts" : ""}, checked against federal and EU law.`))}</p>
    <div class="sy-sum">${SYS.dlist.length ? sysSumLine("sq", SYS.dread, ["district", "districts"], SYS.dbad) : ""}${sysSumLine(SYS.dlist.length ? "ci" : "sq", SYS.inspected, ["city", "cities"], SYS.cnt.bad)}
      <p class="sy-sum-note">Misrepresentations in all: ${SYS.dlist.length ? `${fmtN(SYS.dbad_all)} on district websites, ` : ""}${fmtN(SYS.confirmed)} on city websites.</p></div></section>
    ${lensRow(L, "sys")}
    <div class="sy-ctl"><input class="res-search" id="sy-q" type="search" placeholder="${SYS.dlist.length ? "Find a city or district" : "Find a city"}" aria-label="${SYS.dlist.length ? "Find a city or district" : "Find a city"}" autocomplete="off"><p class="sy-read" id="sy-read" aria-live="polite">${SYS_HINT}</p></div>
    <ul class="sy-hits" id="sy-hits"></ul>
    <div class="sy-keys" role="group" aria-label="Show only">${SYS_KEYS.map(k => `<button type="button" data-k="${k}" aria-pressed="false"><i class="${k}"></i>${SYS_LABEL[k]} · ${fmtN(SYS.cnt[k])}</button>`).join("")}</div>
    <div class="sy-bands${SYS.dlist.length ? " mixed" : ""}" id="sy-bands"><div class="sy-cols">${ids.map(stateBlock).join("")}${cityStates}</div></div>
    <p class="stats" style="padding-top:12px">${SYS.dlist.length ? "One dot per city, largest first within each state. Squares are districts (Landkreise); an empty one has not been inspected yet." : "One square per city, largest first within each state."}</p>
    <details class="sy-note"><summary>How to read this</summary><p>A misrepresentation is one confirmed statement on one ${SYS.dlist.length ? "city’s or district’s" : "city’s"} website. A city counts as inspected when at least one service page was read in detail. The percentage is the share of the places inspected so far. Places were not inspected to the same depth${SYS.dlist.length ? " and the districts were chosen by hand" : ""}, so it is not a rate for German cities or districts, and places should not be ranked by it. “No misrepresentation found” applies only to the pages read. A ${SYS.dlist.length ? "city or district" : "city"} that is not yet inspected is listed, not cleared. The ${fmtN(SYS.list.length)} cities are the largest in Germany by population on ${fmtDate(SYS.popDate)}.${SYS.dlist.length ? ` All ${fmtN(SYS.dlist.length)} German districts (Landkreise) are listed; the ${fmtN(SYS.dread)} inspected so far were chosen by hand to test access and coverage, so they are not a sample.` : ""}</p></details>`;
}

function afterSys() {
  const root = document.getElementById("sy-bands");
  if (!root) return;
  const read = document.getElementById("sy-read"), q = document.getElementById("sy-q"), hits = document.getElementById("sy-hits");
  const touch = matchMedia("(hover: none)"), squares = () => [...root.querySelectorAll("a[data-id]")];
  const at = e => { const a = e.target.closest("a[data-id]"); return a && (SYSCITY[a.dataset.id] || SYSDIST[a.dataset.id]); };
  root.addEventListener("pointerover", e => { const c = at(e); if (c && e.pointerType !== "touch") read.innerHTML = sysReadLine(c); });
  // With a finger the first tap selects a square and names the city; tapping the selected square opens its page.
  root.addEventListener("click", e => {
    const c = at(e); if (!c) return;
    const a = e.target.closest("a[data-id]");
    if (touch.matches && !a.classList.contains("sel")) {
      e.preventDefault();
      squares().forEach(x => x.classList.toggle("sel", x === a));
      read.innerHTML = sysReadLine(c, true);
    }
  });
  q.addEventListener("input", () => {
    const v = sysSearchKey(q.value.trim());
    root.classList.toggle("q", !!v);
    const found = v ? SYS.list.concat(SYS.dlist).filter(c => sysSearchKey(c.name).includes(v)) : [];
    const ids = new Set(found.map(c => c.id));
    squares().forEach(a => a.classList.toggle("hit", ids.has(a.dataset.id)));
    hits.innerHTML = found.slice(0, 8).map(c => `<li><a href="${href("A1", sysKind(c), c.id)}">${esc(c.name)}</a> <small>${esc(SYS_STATES[c.st])}${c.dist ? " · district" : ""}</small></li>`).join("") + (found.length > 8 ? `<li><small>${found.length - 8} more</small></li>` : "");
    read.innerHTML = !v ? SYS_HINT : found.length === 1 ? sysReadLine(found[0], true) : found.length ? `${found.length} ${SYS.dlist.length ? "places" : "cities"} match.` : `No ${SYS.dlist.length ? "city or district" : "city"} matches.`;
  });
  document.querySelectorAll(".sy-keys button").forEach(b => b.addEventListener("click", () => {
    const on = b.getAttribute("aria-pressed") !== "true";
    document.querySelectorAll(".sy-keys button").forEach(x => x.setAttribute("aria-pressed", "false"));
    b.setAttribute("aria-pressed", String(on));
    if (on) root.dataset.f = b.dataset.k; else delete root.dataset.f;
  }));
}

/* ---------- a city ---------- */
function cityFacts(c) {
  const dates = c.pages.map(p => p[2]).concat(c.F.map(f => f.date)).filter(Boolean).sort();
  return { done: dates[dates.length - 1] };
}
function cityLede(c, f) {
  if (!c.pages.length && !c.F.length && c.dist) return `Nobody has read ${c.name}’s website yet.`;
  if (!c.pages.length && !c.F.length) return `${c.name} is on the list of the ${fmtN(SYS.list.length)} largest cities, but nobody has read its website yet.`;
  if (c.k === "na") return `We found ${plural(c.pages.length, "page", "pages")} on ${c.name}’s website but did not read any of them in enough detail to judge.`;
  const found = [c.bad && plural(c.bad, "misrepresentation", "misrepresentations"), c.amb && `${c.amb} unclear`].filter(Boolean).join(" and ");
  return `We read ${plural(c.read, "service page", "service pages")} on ${fmtDate(f.done)} and found ${found || "no misrepresentation"}.`;
}
// A passage keeps every word of the research text; only its layout changes. Lines the source merely wrapped are joined, "•" and lettered or
// numbered items become a list, a short title line becomes a heading and "a | b" lines a table. The research's own line breaks otherwise stay.
function cityQuoteBlocks(raw) {
  const BULLET = /^(?:[•▪◦‣*–-]|\(?[a-z0-9]{1,2}[).])\s+/, BULLET_MARK = /^[•▪◦‣*–-]\s*/, SOFT = /[A-Za-zäöüß]-$/;
  const lines = String(raw).split("\n").map(s => s.replace(/[ \t ]+/g, " ").trim());
  const blocks = [];
  let cur = null;
  const push = b => { blocks.push(b); cur = b; };
  lines.forEach((ln, i) => {
    if (!ln) { cur = null; return; }
    const next = lines.slice(i + 1).find(Boolean) || "", prev = i > 0 ? lines[i - 1] : "";
    if (ln.includes(" | ")) {
      const cells = ln.split(" | ").map(s => s.trim());
      if (cur && cur.t === "table") cur.rows.push(cells); else push({ t: "table", rows: [cells] });
      return;
    }
    if (BULLET.test(ln)) {
      const item = ln.replace(BULLET_MARK, "");
      if (cur && cur.t === "list") cur.items.push(item); else push({ t: "list", items: [item] });
      return;
    }
    const isFirst = !blocks.length && !cur;
    const shortLine = ln.length <= 72 && /^[A-ZÄÖÜ0-9]/.test(ln) && !/[.,;]$/.test(ln) && !/[.!?]\s/.test(ln);
    const leadsList = /:$/.test(ln) && BULLET.test(next);
    // A heading is short, starts a block and is followed by a capital or an item; a line that ends on "?" is always one.
    if (shortLine && /^[A-ZÄÖÜ•0-9(–-]/.test(next) && !leadsList && next &&
        ((((!cur || prev === "") && (isFirst || /[:?]$/.test(ln) || prev === ""))) || /\?$/.test(ln))) { push({ t: "head", text: ln }); cur = null; return; }
    // A line that continues the one before: it starts in lower case, or the line before ended on a comma or a hyphenated word.
    const cont = cur && (cur.t === "para" || cur.t === "list") && (/^[a-zäöüß(„“]/.test(ln) || /(?:,|[A-Za-zäöüß]-)$/.test(prev));
    if (cont && cur.t === "list") { const k = cur.items.length - 1; cur.items[k] += (SOFT.test(cur.items[k]) ? "" : " ") + ln; return; }
    if (cont && cur.t === "para") { cur.text += (SOFT.test(cur.text) ? "" : " ") + ln; return; }
    if (cur && cur.t === "para" && !/[.:;?!)”"“]$/.test(prev) && /^[A-ZÄÖÜ]/.test(ln) && prev.length > 60) { cur.text += " " + ln; return; }
    push({ t: "para", text: ln });
  });
  return blocks;
}
// Addresses wrap anywhere but are never hyphenated.
const cityInline = t => esc(t).replace(/(https?:\/\/[^\s<]+|www\.[^\s<]+)/g, '<span class="cp-url">$1</span>');
function cityQuote(raw, lang) {
  const html = cityQuoteBlocks(raw).map(b => b.t === "head" ? `<p class="cp-qh">${cityInline(b.text)}</p>`
    : b.t === "list" ? `<ul class="q-list">${b.items.map(i => `<li>${cityInline(i)}</li>`).join("")}</ul>`
    : b.t === "table" ? `<table class="cp-qt">${b.rows.map(r => `<tr>${r.map(c => `<td>${cityInline(c)}</td>`).join("")}</tr>`).join("")}</table>`
    : `<p class="q-p">${cityInline(b.text)}</p>`).join("");
  return `<blockquote class="cp-q"${lang ? ` lang="${lang}"` : ""}>${html}</blockquote>`;
}
function cityPassage(x) {
  const de = x.lang === "German", shown = de && x.tr ? cityQuote(x.tr, "en") : cityQuote(x.q, LANG[x.lang] || "");
  return `<div class="side side-claim"><p class="side-label">What the page says</p>${shown}
    ${de && x.tr ? `<details class="cp-orig"><summary><span>German original</span><span class="t"></span></summary>${cityQuote(x.q, "de")}</details>` : de ? `<p class="cp-law-p">German original, not translated.</p>` : ""}</div>`;
}
function cityLaw(x) {
  const link = x.lawUrl ? `<a href="${esc(x.lawUrl)}" target="_blank" rel="noopener">${esc(x.prov || "Law text")} ↗</a>` : esc(x.prov);
  return `<div class="side side-law"><p class="side-label">What the law says</p><p class="law-text">${esc(x.why)}</p>${link ? `<p class="cp-law-p">${link}</p>` : ""}</div>`;
}
// The service is the page title the research recorded. Notes after a dash, bar or colon are cut, so are an authority before a colon ("Landratsamt München: Wohngeld") and the authority after a dash, and a bare record id ("wartburg-basic") is no title.
function cityService(x) {
  let t = (x.page || "").trim();
  if (/^[a-z0-9]+(-[a-z0-9]+)+$/.test(t)) return "";
  t = t.replace(/^[^:]*(Landratsamt|Kreisverwaltung|Landkreis|Kreis|Service-\w+)[^:]*:\s+/i, "").split(/ — | – | \| |: /)[0].trim();
  return t.length > 64 ? t.slice(0, 61).replace(/\s+\S*$/, "") + "…" : t;
}
// A finding is one disclosure: the summary holds the result, the service and the claim; opening it shows the page link, the passage and the law.
function cityFinding(x) {
  const de = isGermanClaim(x.claim), svc = cityService(x);
  return `<article class="cp-row"><details class="cp-more"><summary><div class="cp-lab"><i class="cp-sq ${x.s}"></i><b${x.s === "bad" ? ' class="red"' : ""}>${SYS_LABEL[x.s]}</b>${svc ? `<span class="cp-svc" lang="de">${esc(svc)}</span>` : ""}${de ? `<span class="cp-tag">Claim in German</span>` : ""}</div>
    <h3 class="cp-claim"${de ? ' lang="de"' : ""}>${keep(widow(x.claim.replace(/^./, m => m.toUpperCase()).replace(/\.$/, "")))}</h3>
    ${x.s === "amb" && x.unc ? `<p class="cp-unc">${esc(x.unc)}</p>` : ""}</summary>
    <p class="cp-src"><a href="${esc(x.url)}" target="_blank" rel="noopener">Page checked ↗</a>${x.date ? `<span>${fmtDate(x.date)}</span>` : ""}</p>
    <div class="compare">${cityPassage(x)}${cityLaw(x)}</div></details></article>`;
}
// The header counts what was found, then says once how many pages were read and when.
function cityTally(c, f) {
  if (!c.F.length && !c.read) return "";
  const ok = c.pages.filter(p => p[0] === "ok").length;
  const items = [["bad", c.bad, c.bad === 1 ? "misrepresentation" : "misrepresentations"], ["amb", c.amb, "unclear"], ["ok", ok, ok === 1 ? "page with nothing found" : "pages with nothing found"]].filter(x => x[1]);
  return `<ul class="cp-sum">${items.map(([k, n, w]) => `<li><i class="cp-sq ${k}"></i><b>${n}</b>${w}</li>`).join("")}</ul>
    <p class="cp-ctx">${esc(plural(c.read, "service page", "service pages"))} read${f.done ? ` on ${fmtDate(f.done)}` : ""}. Results describe only those pages.</p>`;
}
function cityPages(c, open) {
  if (!c.pages.length) return "";
  return `<details class="cp-sec"${open ? " open" : ""}><summary><h2>Pages read</h2><span>${c.pages.length}</span></summary><ul class="cp-pages">${c.pages.map(([k, url, d]) =>
    `<li><i class="cp-sq ${k}"></i><a href="${esc(url)}" target="_blank" rel="noopener">${esc(pageLabel(url))} ↗</a><span class="o">${SYS_PAGE[k]}</span>${d ? `<span class="d">${fmtDate(d)}</span>` : ""}</li>`).join("")}</ul></details>`;
}
function cityPage(L, c) {
  const f = cityFacts(c), empty = !c.pages.length && !c.F.length, tally = cityTally(c, f);
  const noteText = `Each result describes only the pages we read${f.done ? ` up to ${fmtDate(f.done)}` : ""}. It does not show whether anyone was refused or misled in practice, and the pages may have changed since.${c.F.length || c.k === "na" ? "" : " No misrepresentation found does not mean the rest of the site is correct."}${c.dist ? " This district was chosen by hand, so it says nothing about other districts." : ""}`;
  // With the count header the note sits under it as a disclosure; a page without one keeps it at the end.
  const folded = !empty && tally ? `<details class="cp-nt"><summary>What this shows</summary><p>${esc(noteText)}</p></details>` : "";
  const note = !empty && !tally ? `<p class="res-note"><b>What this shows.</b> ${esc(noteText)}</p>` : "";
  // Two columns from 960px: the header stays in view beside the findings.
  return `<div class="cp-two"><aside class="cp-rail"><nav class="crumbs" aria-label="Breadcrumb"><a href="${href(L, "sys")}">← Systemic sweeps</a></nav>
    <header class="area-head"><p class="eyebrow">${esc(SYS_STATES[c.st])} · ${c.dist ? "District" : `${fmtN(c.pop)} inhabitants`}</p><h1>${esc(c.name)}</h1>
    ${tally || `<p class="lede">${esc(widow(cityLede(c, f)))}</p>`}${folded}
    ${c.web || c.auth ? `<p class="meta-line">${c.auth ? `<span>${esc(c.auth)}</span>` : ""}${c.web ? `<span><a href="${esc(c.web)}" target="_blank" rel="noopener">Official website ↗</a></span>` : ""}</p>` : ""}</header></aside>
    <div class="cp-main">${empty ? `<div class="cp-empty"><div class="cp-lab"><i class="cp-sq na"></i><b>Not yet inspected</b></div><p>Nothing is known about ${esc(c.name)}’s website yet. That is not a clean result.</p>${c.dist ? "" : `<small>Listed by population on ${fmtDate(SYS.popDate)}.</small>`}</div>`
      : `${c.F.length ? `<div class="cp-list">${c.F.map(cityFinding).join("")}</div>` : c.k === "ok" ? `<div class="cp-empty"><p>Nothing found on the pages we read. They are listed below.</p></div>` : ""}${cityPages(c, !c.F.length)}${note}`}</div></div>`;
}
function sysBody(s) {
  return s.kind === "sys" ? sysHome(s.L) : cityPage(s.L, s.kind === "district" ? SYSDIST[s.id] : SYSCITY[s.id]);
}

/* ---------- render ---------- */
let last = null;
function render() {
  const s = state();
  const prev = last && Object.assign({}, last, { listTop: document.getElementById("b-list")?.scrollTop });
  document.getElementById("root").innerHTML = protoBar(s) + (s.L === "A" ? renderA(s) : s.L[0] === "A" ? renderAS(s) : s.L === "B" ? renderB(s) : renderC(s));
  document.documentElement.classList.toggle("reader-mode", s.L === "B");
  document.body.style.overflow = "";
  if (s.L[0] === "A") afterA(s);
  if (s.L === "A1" && s.kind === "group") afterGroup(s);
  if (s.L === "A1" && s.kind === "sys") afterSys();
  if (s.L === "B") afterB(s, prev);
  if (s.L === "C") afterC(s, prev);
  last = s;
}
window.addEventListener("hashchange", render);
document.addEventListener("keydown", e => {
  const s = state();
  if (e.key === "Escape" && s.L === "C" && s.kind === "case") location.hash = href("C", "topic", topicOf(CASES[s.id]).key);
});
render();
</script>
