service/visaneu/1620092-1620092","site":"nikosia.diplo.de/cy-de"},{"lang":"English","quote":"Applications shall be made no more than three months before the start of the intended visit.","tr":"","url":"https://kuala-lumpur.diplo.de/my-en/service/05-visaeinreise/1677552-1677552","site":"kuala-lumpur.diplo.de/my-en"}]},"missions-working-days":{"id":"missions-working-days","area":"missions","topic":"visa-timing","pub":"Missions in Rabat, India and Luanda","src":"Tourist visa","claim":"count decision times in working days or allow up to 60 days.","quote":"15 jours ouvrables","lang":"French","tr":"15 working days","law":"","sourceUrl":"https://rabat.diplo.de/ma-fr/service/visa-einreise/2742480-2742480","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a tourist could read the detailed page as allowing the ordinary statutory period to exclude weekends. Article 23 counts calendar days.","context":"[1] German Embassy Rabat / Federal Foreign Office; French: The full surrounding sentence attributes the period to the Visa Code. The current parent, dated 6 November 2025, directly links the tourism detail and correctly uses calendar days. This internal correction is disclosed rather than treating all mission guidance as uniform.\n[2] German missions in India / Federal Foreign Office; English: The full answer permits extensions to thirty or sixty days. Earlier answers on the same FAQ correctly give fifteen calendar days and a forty-five-day maximum. The contradictory answers coexist in current application guidance; no observed processing practice is inferred.\n[3] German Embassy Luanda / Federal Foreign Office; German: The page correctly describes the ordinary fifteen-calendar-day rule but extends it to sixty. The Portuguese counterpart repeats the sixty-day maximum. The current visa hub directly links the German application page.","scope":"Start point is an admissible lodged application. Individual scrutiny, justified urgency and applicable Article 25a measures can alter timing; appointment waits and document transport are different issues. The comparison concerns the asserted statutory unit, not a guaranteed total turnaround.","date":"2026-10-17","langs":["French","English","German"],"countries":["MA","IN","AO"],"versions":[{"lang":"French","quote":"15 jours ouvrables","tr":"15 working days","url":"https://rabat.diplo.de/ma-fr/service/visa-einreise/2742480-2742480","site":"rabat.diplo.de/ma-fr"},{"lang":"English","quote":"15 working days","tr":"","url":"https://india.diplo.de/in-en/service/schengen-visa-faq-2610538","site":"india.diplo.de/in-en"},{"lang":"German","quote":"Die Bearbeitung kann sich in Einzelfällen auf bis zu 60 Kalendertage erhöhen","tr":"","url":"https://luanda.diplo.de/ao-de/service/visaeinreise/1011064-1011064","site":"luanda.diplo.de/ao-de"}]},"missions-visa-passport-age-at-expiry":{"id":"missions-visa-passport-age-at-expiry","area":"missions","topic":"visa-docs","pub":"Embassy in Nicosia","src":"Tourist visa","claim":"says your passport must still be under ten years old when the visa expires.","quote":"older than 10 years at the expiry of the visa","lang":"English","tr":"","law":"The ordinary issue-age test is issue within the previous ten years at application and separately at external entry. There is no general requirement to remain within that issue-age limit until visa expiry; the passport must still be recognised, valid and meet the separate validity margin.","sourceUrl":"https://nikosia.diplo.de/cy-en/service/1672100-1672100","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a tourist has a recognised passport issued on 1 November 2016 and valid through 1 August 2027, enters on 25 October 2026 and leaves on 5 November 2026, with a visa expiring on 20 November 2026. The issue-age test is met at application and entry, and the validity margin is met; the website’s visa-expiry age test would nevertheless reject that document condition.","context":"[1] Federal Foreign Office / German mission; English: The full passport bullet separately requires two blank pages, a three-month validity margin and an issue-age test at visa expiry. The German counterpart instead gives a general maximum ten-year document age. This comparison concerns the point at which issue age is tested, not passport recognition, continuing validity or the separate age condition at entry.","scope":"The passport must be recognised, valid and meet the ordinary post-departure validity margin and blank-page conditions. An ordinary external entry after the ten-year issue-age limit is not made lawful by this finding. Emergency validity waivers and qualifying free-movement family rules require separate analysis. This is not a claim that every extended passport is recognised.","date":"2026-10-17","langs":["English"],"countries":["CY"],"versions":[{"lang":"English","quote":"older than 10 years at the expiry of the visa","tr":"","url":"https://nikosia.diplo.de/cy-en/service/1672100-1672100","site":"nikosia.diplo.de/cy-en"}]},"missions-visa-insurance-extra-fifteen-days":{"id":"missions-visa-insurance-extra-fifteen-days","area":"missions","topic":"visa-docs","pub":"Tashkent mission and Nicosia North Office","src":"Tourist visa","claim":"require insurance beyond the intended stay: 15 extra days in Tashkent and one day after return in the North Office checklists.","quote":"für die geplante Zahl an Aufenthaltstagen einschließlich einer Zusatzfrist von 15 Tagen.","lang":"German","tr":"for the planned number of days of stay, including an additional period of 15 days.","law":"Insurance must cover the days of your intended stay. The 15 extra days of visa validity do not need cover.","sourceUrl":"https://taschkent.diplo.de/uz-de/service/05-visaeinreise/2433568-2433568","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Assume a seven-day Schengen stay, with return home on day seven and otherwise adequate insurance for every stay day. Tashkent’s wording calls for 22 insured days; the North Office’s separate wording calls for at least eight. Ordinary insurance must cover the actual intended stay, including arrival and departure days. These are hypothetical effects of the wording; no extra purchase or expense was observed.","context":"[1] German Embassy Tashkent / Federal Foreign Office; German: The insurance row appears in the mandatory document list and also specifies whole-Schengen coverage and at least €30,000. The next sentence allows insurance obtained in Germany or Uzbekistan. The full checklist and current TLScontact notice were read. The Russian language switch repeats the extra-period instruction; it is the same local drafting lineage, not a second mismatch theme.\n[2] Federal Foreign Office / German mission; German; PDF page 2: A mandatory checkbox row in the currently linked North-office PDF requires insurance beyond the stay, rather than describing optional protection.\n[3] Federal Foreign Office / German mission; English; PDF page 2: The English row explicitly requires a day after return. The current main page links this document with a 9 March 2025 date.\n[4] Federal Foreign Office / German mission; Turkish; PDF page 2: The Turkish translation repeats the day-after-return insurance condition. It belongs to the same North-office drafting lineage.","scope":"Insurance must cover the actual intended stay throughout the required territory and meet the other Article 15 conditions; changed travel dates can require changed coverage. A recommendation to buy a longer policy is permissible. For a multiple-entry application, proof concerns the first intended visit, with an obligation to insure later visits. Article 15’s professional-coverage and diplomatic-passport exemptions and qualifying free-movement family rules require separate assessment. Nationality or document exemptions may remove the visa requirement; Germany must be the competent destination and consular jurisdiction must be correct. Actual Schengen arrival and departure days must be covered. Voluntary extra coverage is lawful; this finding does not dispute insurance for a changed or longer intended stay.","date":"2026-10-17","langs":["German","English","Turkish"],"countries":["UZ","CY"],"versions":[{"lang":"German","quote":"für die geplante Zahl an Aufenthaltstagen einschließlich einer Zusatzfrist von 15 Tagen.","tr":"for the planned number of days of stay, including an additional period of 15 days.","url":"https://taschkent.diplo.de/uz-de/service/05-visaeinreise/2433568-2433568","site":"taschkent.diplo.de/uz-de"},{"lang":"German","quote":"den Aufenthaltszeitraum mindestens um einen Tag überschreiten","tr":"","url":"https://nikosia.diplo.de/resource/blob/2245592/54f42659374d245c34d6cf2fdb718d78/merkblatt-nordbuero-dt-data.pdf#page=2","site":"nikosia.diplo.de · PDF"},{"lang":"English","quote":"must exceed the return date for at least one day","tr":"","url":"https://nikosia.diplo.de/resource/blob/2245598/2fd7154c42424ed850daaa0decbd80ff/merkblatt-nordbuero-eng-data.pdf#page=2","site":"nikosia.diplo.de · PDF"},{"lang":"Turkish","quote":"geçerliliği dönüş tarihinden bir gün fazla olmalıdır","tr":"","url":"https://nikosia.diplo.de/resource/blob/2246064/44e6eddbe99bf2c35ff0a7f01a07b608/merkblatt-nordbuero-tuerkisch-data.pdf#page=2","site":"nikosia.diplo.de · PDF"}]},"missions-missing-support-documents":{"id":"missions-missing-support-documents","area":"missions","topic":"visa-docs","pub":"Embassy in Singapore","src":"Tourist visa","claim":"says any missing document means your application cannot be accepted.","quote":"Applications with missing documents cannot be accepted.","lang":"English","tr":"","law":"Article 19 sets formal admissibility conditions, including the form, passport, photograph, applicable biometrics and fee. Missing supporting evidence alone does not make an otherwise admissible application unreceivable; it can lead to a request or refusal on the merits.","sourceUrl":"https://singapur.diplo.de/resource/blob/2751522/77e19e4c004e7f71bd7ac19da66ae6a5/download-visa-tourist-new-data.pdf#page=1","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: an applicant with a valid form, passport, photo, applicable biometrics and fee, inside the filing window, lacks an employment letter. That may weaken the case or lead to a request/refusal, but is not by itself an Article 19 bar to lodging.","context":"[1] German Embassy Singapore / Federal Foreign Office (mission-authored, directing applicants to VFS); English; PDF page 1: The sentence follows an instruction to bring all listed papers. The list includes bank/employment and accommodation evidence, not just formal admissibility items. The parent HTML gives milder advice that incomplete applications may cause delay or refusal and permits further documentation. That context does not qualify the PDF’s categorical statement.","scope":"Missing Article 19 core elements can justify nonacceptance, subject to its humanitarian/national-interest/international-obligation exception. Applicable fee and biometric exemptions must be honoured. Necessary supporting evidence can still be requested and failure to establish a condition can justify merits refusal. Qualifying free-movement family applications have special rules.","date":"2026-10-17","langs":["English"],"countries":["SG"],"versions":[{"lang":"English","quote":"Applications with missing documents cannot be accepted.","tr":"","url":"https://singapur.diplo.de/resource/blob/2751522/77e19e4c004e7f71bd7ac19da66ae6a5/download-visa-tourist-new-data.pdf#page=1","site":"singapur.diplo.de · PDF"}]},"missions-visa-blank-pages":{"id":"missions-visa-blank-pages","area":"missions","topic":"visa-docs","pub":"Embassy in Muscat","src":"Tourist visa","claim":"says one free passport page is enough.","quote":"at least one free page","lang":"English","tr":"","law":"Your passport needs at least two blank pages.","sourceUrl":"https://maskat.diplo.de/resource/blob/1667406/74ed4f6a0abc3e9461665cd5fb24e44a/tourist-and-visit-visa-data.pdf#page=1","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: an ordinary tourist with only one blank passport page could think the current checklist’s travel-document condition is met, although Article 12(b) requires two.","context":"[1] German Embassy Muscat / Federal Foreign Office; English; PDF page 1: The complete one-page tourist/visit checklist gives the correct ten-year issue and three-month validity conditions beside the one-page statement. The current parent’s actual download resolves to this hash; other indexed PDF hashes were not substituted.","scope":"Qualifying free-movement family members have distinct entry-document rules. The Article 12(a) emergency waiver concerns the validity margin; it does not turn the ordinary two-page requirement into one page.","date":"2026-10-17","langs":["English"],"countries":["OM"],"versions":[{"lang":"English","quote":"at least one free page","tr":"","url":"https://maskat.diplo.de/resource/blob/1667406/74ed4f6a0abc3e9461665cd5fb24e44a/tourist-and-visit-visa-data.pdf#page=1","site":"maskat.diplo.de · PDF"}]},"missions-passport-validity-recommendation":{"id":"missions-passport-validity-recommendation","area":"missions","topic":"visa-docs","pub":"Embassy in Singapore","src":"Tourist visa","claim":"calls the required three months of passport validity a recommendation.","quote":"we recommend traveling with a passport which is valid for at least 3 months","lang":"English","tr":"","law":"An ordinary Schengen application normally requires passport validity for at least three months beyond intended final Schengen departure; Article 12 permits a justified-emergency waiver.","sourceUrl":"https://singapur.diplo.de/sg-en/service/05-visaeinreise/1225482-1225482","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a visa-required tourist with two months of passport validity after departure could treat the third month as optional. Ordinarily a new travel document or an applicable waiver is needed.","context":"[1] German Embassy Singapore / Federal Foreign Office; English: The preceding sentence requires validity only for the trip. The page also covers Schengen applications. The current, directly linked tourist PDF correctly imposes the three-month margin after Schengen departure; the finding is this general-page statement, not the whole mission's instructions.","scope":"Justified emergency waiver under Article 12(a); qualifying free-movement family-member rules require separate assessment. Visa-free travel and national visas have separate frameworks. Return to Singapore and departure from Schengen may be different dates.","date":"2026-10-17","langs":["English"],"countries":["SG"],"versions":[{"lang":"English","quote":"we recommend traveling with a passport which is valid for at least 3 months","tr":"","url":"https://singapur.diplo.de/sg-en/service/05-visaeinreise/1225482-1225482","site":"singapur.diplo.de/sg-en"}]},"missions-visa-residence-wait":{"id":"missions-visa-residence-wait","area":"missions","topic":"visa-who","pub":"Missions in Japan, Oman and Qatar","src":"Tourist visa","claim":"require six months of residence before you can apply.","quote":"have been here for less than six months","lang":"English","tr":"","law":"A genuine legal resident may apply to the competent destination state’s consulate for that district without a fixed six-month residence wait. Legally present nonresidents have a separate justified-application route.","sourceUrl":"https://japan.diplo.de/ja-ja/service/2777060-2777060","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a visa-required worker who has legally moved to Japan two months earlier and genuinely resides there plans a German holiday. The passage sends that resident back to a previous country even though Article 6(1) contains no six-month waiting period.","context":"[1] German missions in Japan / Federal Foreign Office; English in Japanese navigation: In a list joined by “or”, the paragraph requires recently arrived, temporary or under-six-month applicants to apply at the mission of their previous residence. Lack of an appropriate permit is a separate condition. The current English visa index repeats the instruction and links this page.\n[2] German Embassy Muscat / Federal Foreign Office; English: The answer first describes ordinary resident jurisdiction, then adds a completed six-month residence condition. A tourist visitor is not necessarily resident; the contradiction is confined to the separate newly legally resident scenario. The current English visa index directly links this FAQ. Its general legal-change disclaimer is preserved in the full source.\n[3] German Embassy Doha / Federal Foreign Office; English: The full sentence limits non-Qatari applicants to residents with this length of legal residence, then permits immigration confirmation in addition to a QID. This general page expressly covers Schengen holidays as well as national visas; only the short-stay application condition is assessed here.","scope":"A visit, entry stamp or short temporary presence does not automatically establish residence. Evidence of real legal residence and correct consular district is lawful. Germany must be the competent destination or representation must apply. Justified applications by legally present nonresidents are a separate Article 6(2) route; visa-free and free-movement cases require their own analysis.","date":"2026-10-17","langs":["English"],"countries":["JP","OM","QA"],"versions":[{"lang":"English","quote":"have been here for less than six months","tr":"","url":"https://japan.diplo.de/ja-ja/service/2777060-2777060","site":"japan.diplo.de/ja-ja"},{"lang":"English","quote":"at least 6 months","tr":"","url":"https://maskat.diplo.de/om-en/service/05-visaeinreise/1509644-1509644","site":"maskat.diplo.de/om-en"},{"lang":"English","quote":"at least the past six months","tr":"","url":"https://doha.diplo.de/qa-en/service/visa/2741002-2741002","site":"doha.diplo.de/qa-en"}]},"missions-automatic-overstay-next-refusal":{"id":"missions-automatic-overstay-next-refusal","area":"missions","topic":"visa-who","pub":"Embassy in Kampala","src":"Tourist visa","claim":"says a past overstay without contacting the aliens authority before visa expiry automatically means the next visa will be refused.","quote":"you will automatically be denied your next Schengen visa.","lang":"English","tr":"","law":"Past overstay alone is not a separate automatic-refusal rule. It may be decisive evidence in the individual assessment; an operative entry ban, refusal-of-entry alert or another statutory ground can require refusal.","sourceUrl":"https://kampala.diplo.de/ug-en/service/05-visaeinreise/2165192-2165192","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a former visa holder who overstayed years earlier without the specified contact, has no current entry ban and now satisfies the stay allowance could read the FAQ as making any new holiday application automatically futile. The actual outcome must depend on the current statutory grounds and individual evidence.","context":"[1] German Embassy Kampala / Federal Foreign Office; English: The complete answer conditions this consequence on overstaying and not contacting the aliens authority in Germany before the visa expires. It then explains that timely contact allows that authority to examine extenuating circumstances for a possible extension. Neither sentence supplies an exception to the categorical next-visa consequence. The current visa hub directly links this FAQ; the current Schengen application page also refers applicants to it.","scope":"An operative refusal-of-entry alert or entry ban, an exhausted 90-in-180-day allowance, reasonable doubts about departure, or another applicable statutory ground can still require refusal. Past overstay is relevant evidence and may be decisive after individual assessment. Nationality or document exemptions may remove the need for a visa. Qualifying free-movement family members have special rules. Correct destination competence and consular jurisdiction must also be established.","date":"2026-10-17","langs":["English"],"countries":["UG"],"versions":[{"lang":"English","quote":"you will automatically be denied your next Schengen visa.","tr":"","url":"https://kampala.diplo.de/ug-en/service/05-visaeinreise/2165192-2165192","site":"kampala.diplo.de/ug-en"}]},"missions-eu-family-insurance":{"id":"missions-eu-family-insurance","area":"missions","topic":"visa-who","pub":"Doha and Kuala Lumpur missions; VisaMetric referred by the Moscow mission","src":"Tourist visa","claim":"ask family of EU citizens to meet ordinary tourist conditions.","quote":"Applicants must prove that they are in possession of adequate and valid travel medical insurance","lang":"English","tr":"","law":"Qualifying family members accompanying or joining an EU citizen exercising free movement receive entry-visa facilitation free of charge and as soon as possible. Ordinary tourist insurance and accommodation proof are not additional conditions on that route. Independent family visits and most visits to Germans in Germany require separate analysis.","sourceUrl":"https://doha.diplo.de/qa-en/service/visa/schengenvisa/2582592-2582592","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=celex%3A32004L0038","example":"Hypothetical: a visa-required spouse accompanying a French citizen on a two-week German holiday could read the checklist as requiring purchased travel insurance even after proving the relationship and joint travel. This example assumes both qualify under the Directive.","context":"[1] German Embassy Doha / Federal Foreign Office; English: The complete EU/EEA-relative checklist imposes €30,000 insurance covering emergency treatment and repatriation throughout Schengen. Relationship and travel-document rows were read too. No accompanying/joining exception qualifies the insurance instruction.\n[2] VisaMetric (external provider referred by German Embassy Moscow; the PDF attributes decisions to the German mission); German; PDF page 2: The two-page leaflet is for visits up to ninety days by EU/EEA/Swiss citizens’ family members. The mandatory bullets require EU-issued insurance, whole-Schengen coverage and €30,000. The mission’s current Erforderliche Unterlagen referral reaches this provider list, whose EU-family download was followed. A separate older referral on the mission page returned 404; the working current referral was used.\n[3] German Embassy Kuala Lumpur / Federal Foreign Office; English: This dedicated German-or-EU-family checklist expressly exempts EU spouses from insurance, but requires accommodation and tells applicants to identify a family member living in Germany instead of their spouse in Malaysia.","scope":"The applicant must actually qualify under free-movement law. Independent visits to a relative, most visits to a German citizen in Germany, extended-family facilitation cases, and stays beyond three months can require different analysis. Relevant returnee cases can engage EU rights. Abuse, fraud and permitted public-policy/security restrictions remain possible. A qualifying residence card may remove the visa requirement entirely.","date":"2026-10-17","langs":["English","German"],"countries":["QA","RU","MY"],"versions":[{"lang":"English","quote":"Applicants must prove that they are in possession of adequate and valid travel medical insurance","tr":"","url":"https://doha.diplo.de/qa-en/service/visa/schengenvisa/2582592-2582592","site":"doha.diplo.de/qa-en"},{"lang":"German","quote":"Die Reisekrankenversicherung – mit dem Namen des Antragstellers – muss:","tr":"","url":"https://www.visametric.com/storage/images/pages/files2/646e23f30c860-3-DE-VISIT-visiting-family-members-EU---DEU.pdf#page=2","site":"visametric.com · PDF"},{"lang":"English","quote":"proof of accommodation (1 copy):","tr":"","url":"https://kuala-lumpur.diplo.de/my-en/service/05-visaeinreise/2450904-2450904","site":"kuala-lumpur.diplo.de/my-en"}]},"missions-superseded-fees":{"id":"missions-superseded-fees","area":"missions","topic":"fees","pub":"Guidance at 13 mission-country sites, including Japan, Morocco and Nigeria","src":"Passport + identity card","claim":"list passport and ID card fees that are no longer valid.","quote":"101 ユーロ","lang":"Japanese","tr":"101 euros / 78 euros","law":"","sourceUrl":"https://japan.diplo.de/ja-ja/service/gebuehren-2734456","lawUrl":"https://www.gesetze-im-internet.de/passv_2007/__27.html","example":"Hypothetical: a normally competent-mission applicant aged 30 could budget €78 for an ID card from Japan's Japanese schedule, whereas the ordinary current statutory total is €89.","context":"[1] German missions in Japan / Federal Foreign Office; Japanese: The Japanese fee table has distinct age columns (24+ and under 24), separate extra-fee rows and a general accuracy caveat. Current Japanese service navigation still offers this schedule.\n[2] German missions in Japan / Federal Foreign Office; German: Dated 8 February 2026, linked from the current German service index. The same row correctly lists €73.50 below 24 and the ID row correctly lists €89 / €70.60.\n[3] German Embassy Rabat / Federal Foreign Office; German; PDF page 2: The July 2024 ID leaflet remains linked from the current passport/ID hub. Its euro totals are superseded; the main HTML table dated 9 February 2026 correctly updates the amounts. A separate noncompetence column and accuracy caveat are present. The age-24 boundary is addressed in a separate case.\n[4] German Embassy Cotonou / Federal Foreign Office; German: The full ID article supplies old euro totals, including €63.80 for younger applicants. No hardship remission is specified. The article correctly allows independent applications from sixteen; the generic parental-document bullet is not separately counted as a contradiction.\n[5] German missions in the United Arab Emirates / Federal Foreign Office; German: Dated 13 July 2021, but the current document hub leads through Merkblätter directly to it. Its ordinary adult/under-twenty-four totals are €58.80/€52.80, with a separate German-registration column; neither column gives the current ordinary totals.\n[6] German Embassy Antananarivo / Federal Foreign Office; German; PDF page 3: The adult passport row adds a €21 foreign supplement, producing €81; the younger row totals €58.50. The ID rows give €67/€52.80 and contain a duplicated adult age label. The current passport HTML correctly gives €106/€73.50 and €89/€70.60, yet still links this PDF as preparation guidance.\n[7] German Embassy Gaborone / Federal Foreign Office; German: The dated 2018 leaflet still gives €81/€58.50 for ordinary 32-page passports and separately lists larger/express documents. The current Pässe page’s actual applicant-leaflet link was followed.\n[8] German Embassy Bishkek / Federal Foreign Office; German: The current passport/ID index’s actual passport-information link leads to this article. It quotes €101 for the ordinary ten-year passport, €68.50 below age 24, and €70 for a temporary passport. Current ordinary competent-mission totals are €106, €73.50 and €75 respectively. The article separately mentions an express supplement and payment in Kyrgyz som at the mission’s exchange rate; the mismatch concerns its stated euro amounts, not currency conversion.\n[9] German Embassy Bishkek / Federal Foreign Office; German: The current passport/ID index’s actual ID-information link leads to this page. The stated ordinary age-24-plus and under-24 totals are €78 and €63.80, rather than €89 and €70.60 from 7 February 2026. A separate €13 noncompetence supplement and payment in Kyrgyz som do not explain the lower ordinary euro totals. The fingerprint-choice passage on this same page is assessed in the biometrics case.\n[10] German mission / Federal Foreign Office; German: Nigeria’s ID article gives older base fees of €37 / €22.80 and a €41 foreign supplement, producing €78 / €63.80. The ordinary current components are €46 / €27.60 plus €43, producing €89 / €70.60. The actual current passport/ID hub links this article.\n[11] German mission / Federal Foreign Office; German: The linked Lilongwe ID article repeats the earlier €37 / €22.80 base fees and €41 foreign supplement. These total €78 / €63.80 instead of the ordinary current €89 / €70.60. The live passport hub’s related-content card was checked in fresh HTML.\n[12] German mission / Federal Foreign Office; German: The old child-application page remains linked by Pakistan’s 25 August 2026 parent. Its fee table gives older ordinary passport and ID totals, including €58.80 for an ID, although the parent supplies current 2026 fees. The older date and Afghanistan-specific introduction are retained as context, not hidden.\n[13] German mission / Federal Foreign Office; German: The passport article dated 5 August 2026 retains €101 / €68.50 and a footer referring to the 1 January 2024 change. It is currently linked from the assistance-for-Germans hub, and is not presented as an archive of historic prices.\n[14] German mission / Federal Foreign Office; German: The current Service-menu fee table retains ordinary 32-page passports at €101 / €68.50 and IDs at €78 / €63.80, with noncompetent-authority supplements separately shown. Another current application article gives correct passport totals, so the internal inconsistency is explicit.\n[15] German mission / Federal Foreign Office; German: The current hub links the child-passport article. Its fee section retains the earlier ordinary passport totals and temporary passport €70. The article correctly explains the abolition of new Kinderreisepässe, so that topic is not alleged here.\n[16] German mission / Federal Foreign Office; German: The current hub’s Gebühren link leads to a table with passports €101 / €68.50 and IDs €67 / €52.80. Those are older euro totals, without an archive or supersession qualifier.\n[17] German mission / Federal Foreign Office; German: The current hub links the adult-passport article. It repeats the earlier ordinary passport €101 / €68.50 and temporary passport €70 figures from the related minor article. These copies are one local fee-table lineage.","scope":"Express, 48-page, noncompetence, out-of-hours, photo, delivery and actual-expense supplements can change the total where legally applicable. Hardship remission and specific statutory exemptions remain possible. The comparison assumes the normally competent mission, ordinary service and no extras; it does not establish what any applicant was actually charged.","date":"2026-10-17","langs":["Japanese","German"],"countries":["JP","MA","BJ","AE","MG","BW","KG","NG","MW","PK","TT","ME","MN"],"versions":[{"lang":"Japanese","quote":"101 ユーロ","tr":"101 euros / 78 euros","url":"https://japan.diplo.de/ja-ja/service/gebuehren-2734456","site":"japan.diplo.de/ja-ja"},{"lang":"German","quote":"105,00 EUR","tr":"","url":"https://japan.diplo.de/ja-de/service/2734200-2734200","site":"japan.diplo.de/ja-de"},{"lang":"German","quote":"63,80 €","tr":"","url":"https://rabat.diplo.de/resource/blob/2277226/6b045bee58618ccad26dc9d83d82810c/merkblatt-personalausweis-data.pdf#page=2","site":"rabat.diplo.de · PDF"},{"lang":"German","quote":"81 €","tr":"","url":"https://cotonou.diplo.de/bj-de/service/2649512-2649512","site":"cotonou.diplo.de/bj-de"},{"lang":"German","quote":"58,80","tr":"","url":"https://uae.diplo.de/ae-de/service/2471034-2471034","site":"uae.diplo.de/ae-de"},{"lang":"German","quote":"60,00","tr":"","url":"https://antananarivo.diplo.de/resource/blob/2559420/bdc9150fc0a62992cd54172cd9dfbdc5/221019-merkblatt-deu-pass-data.pdf#page=3","site":"antananarivo.diplo.de · PDF"},{"lang":"German","quote":"81,00","tr":"","url":"https://gaborone.diplo.de/bw-de/service/2106174-2106174","site":"gaborone.diplo.de/bw-de"},{"lang":"German","quote":"101,- €","tr":"","url":"https://bischkek.diplo.de/kg-de/2480138-2480138","site":"bischkek.diplo.de/kg-de"},{"lang":"German","quote":"78,- €","tr":"","url":"https://bischkek.diplo.de/kg-de/2565754-2565754","site":"bischkek.diplo.de/kg-de"},{"lang":"German","quote":"22,80 EUR","tr":"","url":"https://nigeria.diplo.de/ng-de/service/2562674-2562674","site":"nigeria.diplo.de/ng-de"},{"lang":"German","quote":"22,80 EUR","tr":"","url":"https://lilongwe.diplo.de/mw-de/service/2583238-2583238","site":"lilongwe.diplo.de/mw-de"},{"lang":"German","quote":"58,80 €","tr":"","url":"https://pakistan.diplo.de/pk-de/service/passantrag-kind-seite-1683806","site":"pakistan.diplo.de/pk-de"},{"lang":"German","quote":"101,00€","tr":"","url":"https://port-of-spain.diplo.de/tt-de/service/1019256-1019256","site":"port-of-spain.diplo.de/tt-de"},{"lang":"German","quote":"101,00 EUR","tr":"","url":"https://podgorica.diplo.de/me-de/service/2485938-2485938","site":"podgorica.diplo.de/me-de"},{"lang":"German","quote":"€ 101,00","tr":"","url":"https://ulan-bator.diplo.de/mn-de/service/2242094-2242094","site":"ulan-bator.diplo.de/mn-de"},{"lang":"German","quote":"€ 67,00","tr":"","url":"https://ulan-bator.diplo.de/mn-de/service/2242064-2242064","site":"ulan-bator.diplo.de/mn-de"},{"lang":"German","quote":"€ 101,00","tr":"","url":"https://ulan-bator.diplo.de/mn-de/service/2242092-2242092","site":"ulan-bator.diplo.de/mn-de"}]},"missions-age-24-boundary":{"id":"missions-age-24-boundary","area":"missions","topic":"fees","pub":"Missions in Rabat, Pakistan and Podgorica","src":"Passport + identity card","claim":"use the wrong age bands for document validity and fees.","quote":"≤ 24 Jahre 73,50 € (6 Jahre gültig)","lang":"German","tr":"≤ 24 years: €73.50 (valid 6 years)","law":"For ordinary passports and ID cards, the age at application determines the band: below 24 normally gives six years; age 24 and above normally gives ten. The lower fee band ends on the 24th birthday; an already issued document does not expire merely because its holder turns 24.","sourceUrl":"https://rabat.diplo.de/ma-de/service/1693414-1693414","lawUrl":"https://www.gesetze-im-internet.de/pa_g_1986/__5.html","example":"Hypothetical: a 20-year-old choosing a 48-page passport in Montenegro could expect ten years instead of six, while a 40-year-old in Pakistan could expect an ordinary ID to last only six years instead of ten.","context":"[1] German Embassy Rabat / Federal Foreign Office; German: The paired row uses >24 for ten-year validity and the full fee. The same age split appears for 48-page passports and ID cards. Current amounts are updated here, while the older linked leaflets also retain the boundary wording.\n[2] German mission / Federal Foreign Office; German: The current table explicitly introduces the section for applicants aged 24 or older and lists the ordinary ID at €89 with six-year validity. The younger table also says six years. The potentially ambiguous passport six-to-ten wording is not used as another finding.\n[3] German mission / Federal Foreign Office; German: The 48-page ordinary-passport row promises ten years below age 24. The adjacent 32-page younger row correctly says six years, and another current passport/ID article gives the correct age bands. The current Service menu nevertheless links this fee table.","scope":"The comparison concerns ordinary documents issued in the stated age band. Individual statutory restrictions, temporary passports, provisional or replacement ID cards and exceptional limited-validity documents require their own rules. Extra passport pages affect the fee, not the ordinary age-based validity period.","date":"2026-10-17","langs":["German"],"countries":["MA","PK","ME"],"versions":[{"lang":"German","quote":"≤ 24 Jahre 73,50 € (6 Jahre gültig)","tr":"≤ 24 years: €73.50 (valid 6 years)","url":"https://rabat.diplo.de/ma-de/service/1693414-1693414","site":"rabat.diplo.de/ma-de"},{"lang":"German","quote":"Personalausweis (6 Jahre Gültigkeit)","tr":"","url":"https://pakistan.diplo.de/pk-de/service/paesse-uess-1683808","site":"pakistan.diplo.de/pk-de"},{"lang":"German","quote":"für Antragsteller unter 24 Jahren, Gültigkeit 10 Jahre","tr":"","url":"https://podgorica.diplo.de/me-de/service/2485938-2485938","site":"podgorica.diplo.de/me-de"}]},"missions-visa-fee-age-twelve":{"id":"missions-visa-fee-age-twelve","area":"missions","topic":"fees","pub":"Embassy in Buenos Aires","src":"Tourist visa","claim":"lists the reduced child visa fee for 12-year-olds.","quote":"Erwachsene und Kinder ab 13 Jahren: 90,00 EUR","lang":"German","tr":"Adults and children aged 13 and over: EUR 90.00","law":"The ordinary €45 band is age six to below twelve; the ordinary €90 band starts at twelve. Waivers and applicable agreement rates are separate.","sourceUrl":"https://buenos-aires.diplo.de/ar-de/service/05-visaeinreise/schengen-2008090","lawUrl":"https://eur-lex.europa.eu/legal-content/EN/ALL/?uri=CELEX%3A02009R0810-20240628","example":"Hypothetical: a visa-required twelve-year-old resident of Argentina travelling to Germany for tourism, without a waiver or treaty rate, could budget €45 from the German page instead of the ordinary €90.","context":"[1] German Embassy Buenos Aires / Federal Foreign Office; German: The paragraph expressly cites Visa Code Article 16 and gives €45 for six-to-twelve-year-olds. The actual Spanish language switch instead starts the €90 band at age twelve. The comparison is confined to the unambiguous German thirteen-year threshold.","scope":"Visa-free nationality/document exemptions may remove the need to apply. Mandatory and discretionary waivers, facilitation-agreement rates, and qualifying free-movement family members must be assessed separately. Provider service fees are a separate charge.","date":"2026-10-17","langs":["German"],"countries":["AR"],"versions":[{"lang":"German","quote":"Erwachsene und Kinder ab 13 Jahren: 90,00 EUR","tr":"Adults and children aged 13 and over: EUR 90.00","url":"https://buenos-aires.diplo.de/ar-de/service/05-visaeinreise/schengen-2008090","site":"buenos-aires.diplo.de/ar-de"}]},"missions-superseded-passport-fees-tashkent-followup":{"id":"missions-superseded-passport-fees-tashkent-followup","area":"missions","topic":"fees","pub":"Embassy in Tashkent","src":"German passport","claim":"lists a passport fee that is no longer valid.","quote":"Reisepass ab 24 Jahre | 81,00 €","lang":"German","tr":"Passport from age 24 | €81.00","law":"","sourceUrl":"https://taschkent.diplo.de/uz-de/service/2438094-2438094","lawUrl":"https://www.gesetze-im-internet.de/passv_2007/__27.html","example":"Hypothetical: a 30-year-old requesting a standard 32-page passport at the competent Tashkent mission, without extras or remission, could budget €81 from the page when the ordinary legal total is €106.","context":"The complete fee table separates competent and noncompetent mission columns and express/extra-page supplements. The local competent column retains €81/€58.50 for ordinary passports. The page explains local-currency conversion, which does not account for the obsolete euro base totals. Undated substantive HTML, fresh HTTP 200; the current German-citizens service index has an exact live Deutscher Reisepass link. The parsed web version of the index omitted this link but fresh original HTML contains it. An undated live page is not treated as newly revised.","scope":"Applicant aged at least 24, ordinary 32-page non-express passport, normally competent mission, no additional optional or exceptional fee and no remission. This record adjudicates the adult row only. Local-currency conversion does not explain the obsolete euro total; no actual amount charged was observed.","date":"2026-10-17","langs":["German"],"countries":["UZ"],"versions":[{"lang":"German","quote":"Reisepass ab 24 Jahre | 81,00 €","tr":"Passport from age 24 | €81.00","url":"https://taschkent.diplo.de/uz-de/service/2438094-2438094","site":"taschkent.diplo.de/uz-de"}]},"missions-ni-mun-02":{"id":"missions-ni-mun-02","area":"missions","topic":"fees","pub":"City of Salzgitter","src":"","claim":"lists the old adult passport fee of €60.","quote":"ab dem 24. Lebensjahr 60,00 Euro.","lang":"German","tr":"from age 24: €60.00","law":"Since 2024, an ordinary passport for adults aged 24 or over costs €70.","sourceUrl":"https://www.salzgitter.de/rathaus/fachdienste/ordnung/buergercenter/epass.php","lawUrl":"https://www.gesetze-im-internet.de/passv_2007/__27.html","example":"A 30-year-old without fee relief requests an ordinary 32-page passport from the competent domestic authority, with no extras. The base fee is €70; the old page lists €60.","context":"The e-pass page contains 2005/2007 history and a 2017 update alongside application instructions and a present-tense adult fee. The current sitemap links both this page and a separate passport service that correctly states €70. The current Ehrenamtskarte page also links a benefits list offering free passport issuance. This finding is the conflict between currently supplied pages for ordinary applicants without fee relief.","scope":"Ordinary 32-page adult passport requested from the competent domestic authority, without express service, authority photograph, delivery, noncompetence surcharge, statutory exemption or individualized/local fee relief. Salzgitter Ehrenamtskarte beneficiaries are expressly excluded. No actual charge or denial was observed.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"ab dem 24. Lebensjahr 60,00 Euro.","tr":"from age 24: €60.00","url":"https://www.salzgitter.de/rathaus/fachdienste/ordnung/buergercenter/epass.php","site":"salzgitter.de"}]},"missions-st-mun-01":{"id":"missions-st-mun-01","area":"missions","topic":"fees","pub":"Elbe-Heide municipality","src":"","claim":"lists the old adult passport fee of €60.","quote":"(ab vollendetem 24.Lebensjahr) 60,00 €","lang":"German","tr":"(from completed age 24) €60.00","law":"Since 2024, an ordinary passport for adults aged 24 or over costs €70.","sourceUrl":"https://www.elbe-heide.de/dienstleistung/anzeigen/id/476/reisepass.html","lawUrl":"https://www.gesetze-im-internet.de/passv_2007/__27.html","example":"A 30-year-old without fee relief requests an ordinary 32-page passport from the competent domestic authority, with no extras. The base fee is €70; the page lists €60.","context":"The current Ordnungsamt page links the exact passport guide, which gives required documents and a fee table without an archive label. No universally applicable local €60 rule was identified. Individualized or local fee remission remains outside the comparison; no real charged fee was observed.","scope":"Only the ordinary competent domestic 32-page adult application, without fee reduction/waiver, special passport or optional add-ons. No universally applicable local €60 rule was identified; this is not a claim that no individual remission exists. No actual charge or denial was observed.","date":"2026-10-18","langs":["German"],"countries":["DE"],"versions":[{"lang":"German","quote":"(ab vollendetem 24.Lebensjahr) 60,00 €","tr":"(from completed age 24) €60.00","url":"https://www.elbe-heide.de/dienstleistung/anzeigen/id/476/reisepass.html","site":"elbe-heide.de"}]},"missions-optional-fingerprints":{"id":"missions-optional-fingerprints","area":"missions","topic":"documents","pub":"Mission guidance including Rabat, Caracas and Seoul, plus the German Institute Taipei","src":"Identity card","claim":"say fingerprints in the ID card are optional.","quote":"Bei der Antragstellung entscheiden Sie, ob Ihre Fingerabdrücke","lang":"German","tr":"When you apply, you decide whether your fingerprints [are stored]","law":"Ordinary new ID cards contain two fingerprints from age six, subject to statutory physical-impossibility rules. Older valid cards and temporary documents require separate treatment.","sourceUrl":"https://rabat.diplo.de/resource/blob/2277226/6b045bee58618ccad26dc9d83d82810c/merkblatt-personalausweis-data.pdf#page=1","lawUrl":"https://www.gesetze-im-internet.de/pauswg/BJNR134610009.html","example":"Hypothetical: an adult could expect to refuse fingerprint storage when applying for a replacement card. The ordinary application requires those fingerprints.","context":"[1] German Embassy Rabat / Federal Foreign Office; German; PDF page 1: The sentence offers a decision about storage. The leaflet is dated July 2024, includes a general accuracy caveat, and remains linked as an application leaflet by the current passport/ID hub. Its adjacent online-function paragraph concerns a different feature.\n[2] German Embassy Caracas / Federal Foreign Office; German: Dated 24 June 2022; still linked from the current passport/ID hub. The passage offers choice without an age or impossibility qualification.\n[3] German Embassy Antananarivo / Federal Foreign Office; German: The current passport/ID navigation leads to the page. The surrounding explanation describes declining fingerprint storage without disadvantage rather than a medical or age exemption.\n[4] German Embassy Buenos Aires / Federal Foreign Office; Spanish: Current ID instructions dated 12 November 2025 offer storage on request and require a choice. The German counterpart dated 14 November 2025 repeats the choice. The page correctly permits 16+ applicants to apply without parental authorisation; that is not challenged.\n[5] German Institute Taipei / Federal Foreign Office (ancillary institute, not embassy or consulate); German: The current A–Z service index directly links this older ID article under Personalausweis. The separate main document hub provides more current instructions. Included as a related German Institute instance, outside the embassy/consulate count.\n[6] German Embassy Bishkek / Federal Foreign Office; German: The current passport/ID index’s actual ID-information link was independently followed. The full article presents storage as an applicant choice and contains no specific mandatory-fingerprint qualification elsewhere. The comparison concerns ordinary new ID applications from age six; statutory medical and age exceptions remain applicable. The separate fee bullets are documented in the fee case.\n[7] German mission / Federal Foreign Office; German: The current application article offers fingerprint storage on request. Its under-sixteen consent paragraph is a separate, correct distinction; it does not qualify the general fingerprint choice.\n[8] German mission / Federal Foreign Office; German: The article gives applicants a fingerprint-storage choice. The separate generic minor-attendance passage is qualified by its form for applicants sixteen and above, so no additional parental-consent finding is made.\n[9] German mission / Federal Foreign Office; German: Both the introductory optional-storage description and the declaration paragraph offer a choice. The latter expressly says declining storage causes no disadvantage. The under-sixteen application rule and necessary identity evidence are separate.\n[10] German mission / Federal Foreign Office; German: The complete article expressly says declining fingerprint storage causes no disadvantage. Its separate under-sixteen rule and requests for necessary citizenship/name evidence do not cure the opt-out statement.\n[11] German mission / Federal Foreign Office; German: The complete application article gives the applicant a choice and says refusal causes no disadvantage. Its correct current fees and under-sixteen rule were checked separately.\n[12] German mission / Federal Foreign Office; German: The current Service page links this ID article. The general description calls fingerprints an optional additional security feature without confining that choice to exempt applicants or historic cards.\n[13] German mission / Federal Foreign Office; German: The current passport/loss hub links this article. Its functions FAQ requires applicants to declare whether they want fingerprint storage. The article distinguishes under-sixteen applicants separately.\n[14] German mission / Federal Foreign Office; German: The current passport/ID hub leads to this article. Its functions FAQ describes fingerprint storage as voluntary; ordinary application and delivery arrangements are distinct procedures.\n[15] German mission / Federal Foreign Office; German: The current passport/ID hub links the article. Its biometrics description makes storage optional. The fee components are a separate confirmed comparison; no actual counter practice was observed.\n[16] German mission / Federal Foreign Office; German: The current passport hub has an actual related-content link to this article. It offers optional storage. Its older fee components are assessed separately.\n[17] German mission / Federal Foreign Office; German: The current adult-ID article links this additional electronic-ID article. Its general biometrics passage offers optional storage; the link was confirmed in fresh HTML, rather than inferred from a search result.","scope":"Children under six do not give fingerprints. Permanent medical impossibility is exempt; temporary inability follows the applicable temporary-impossibility rules. The finding concerns new applications, not whether a lawfully issued older card remains valid.","date":"2026-10-17","langs":["German","Spanish"],"countries":["MA","VE","MG","AR","TW","KG","XK","SK","PE","MY","PH","KZ","MN","KR","NG","MW","SN"],"versions":[{"lang":"German","quote":"Bei der Antragstellung entscheiden Sie, ob Ihre Fingerabdrücke","tr":"When you apply, you decide whether your fingerprints [are stored]","url":"https://rabat.diplo.de/resource/blob/2277226/6b045bee58618ccad26dc9d83d82810c/merkblatt-personalausweis-data.pdf#page=1","site":"rabat.diplo.de · PDF"},{"lang":"German","quote":"können Sie entscheiden, ob Sie Ihre Fingerabdrücke zur Speicherung abgeben möchten","tr":"","url":"https://caracas.diplo.de/ve-de/service/paesse-ausweise/personalausweises-ab-16-jahren-1253016","site":"caracas.diplo.de/ve-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://antananarivo.diplo.de/mg-de/service/02-paesseausweise/2557592-2557592","site":"antananarivo.diplo.de/mg-de"},{"lang":"Spanish","quote":"No incluir estas características en el chip no implica una desventaja","tr":"","url":"https://buenos-aires.diplo.de/ar-es/service/pasaportes/2039664-2039664","site":"buenos-aires.diplo.de/ar-es"},{"lang":"German","quote":"die Speicherung der Fingerabdrücke freiwillig sind","tr":"","url":"https://taipei.diplo.de/tw-de/service/seite-personalausweis-2012-1757654","site":"taipei.diplo.de/tw-de"},{"lang":"German","quote":"Auf Wunsch können als weiteres biometrisches Sicherheitsmerkmal – neben dem Lichtbild - Fingerabdrücke gespeichert werden.","tr":"","url":"https://bischkek.diplo.de/kg-de/2565754-2565754","site":"bischkek.diplo.de/kg-de"},{"lang":"German","quote":"Auf Wunsch des Antragstellers","tr":"","url":"https://pristina.diplo.de/xk-de/service/pass-ausweise/personalausweis-2291642","site":"pristina.diplo.de/xk-de"},{"lang":"German","quote":"Auf Wunsch des Antragstellers","tr":"","url":"https://pressburg.diplo.de/sk-de/service/reisepass-und-personalausweis/personalausweis-2705004","site":"pressburg.diplo.de/sk-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://lima.diplo.de/pe-de/konsularservice/personalausweis-2664190","site":"lima.diplo.de/pe-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://kuala-lumpur.diplo.de/my-de/service/1508846-1508846","site":"kuala-lumpur.diplo.de/my-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://manila.diplo.de/ph-de/service/paesse-ausweise/personalausweis-1894290","site":"manila.diplo.de/ph-de"},{"lang":"German","quote":"Auf Wunsch können als weiteres biometrisches Sicherheitsmerkmal – neben dem Lichtbild - Fingerabdrücke gespeichert werden.","tr":"","url":"https://kasachstan.diplo.de/kz-de/2201108-2201108","site":"kasachstan.diplo.de/kz-de"},{"lang":"German","quote":"Sie müssen bei Antragstellung erklären, ob Sie die Speicherung Ihrer Fingerabdrücke auf dem Chip des Personalausweises wünschen.","tr":"","url":"https://ulan-bator.diplo.de/mn-de/service/2559946-2559946","site":"ulan-bator.diplo.de/mn-de"},{"lang":"German","quote":"Sie müssen bei Antragstellung erklären, ob Sie die Speicherung Ihrer Fingerabdrücke auf dem Chip des Personalausweises wünschen.","tr":"","url":"https://seoul.diplo.de/kr-de/service/02-paesseausweise/1892934-1892934","site":"seoul.diplo.de/kr-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://nigeria.diplo.de/ng-de/service/2562674-2562674","site":"nigeria.diplo.de/ng-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://lilongwe.diplo.de/mw-de/service/2583238-2583238","site":"lilongwe.diplo.de/mw-de"},{"lang":"German","quote":"Es entstehen Ihnen keine Nachteile, wenn Sie keine Fingerabdrücke in den Personalausweis aufnehmen lassen.","tr":"","url":"https://dakar.diplo.de/sn-de/service/reisepassundpersonalausweis/2516514-2516514","site":"dakar.diplo.de/sn-de"}]},"missions-abolished-child-passport":{"id":"missions-abolished-child-passport","area":"missions","topic":"documents","pub":"Missions in Antananarivo, Gaborone and Pakistan","src":"Passport","claim":"still offer children’s passports.","quote":"Anträge auf Ausstellung oder Verlängerung von Kinderreisepässen werden innerhalb von zwei Werktagen bearbeitet.","lang":"German","tr":"Applications to issue or extend children’s passports are processed within two working days.","law":"The Kinderreisepass document type can no longer be newly issued or extended from 1 January 2024. Lawfully issued older documents can retain their validity; children can receive ordinary biometric passports.","sourceUrl":"https://antananarivo.diplo.de/resource/blob/2559420/bdc9150fc0a62992cd54172cd9dfbdc5/221019-merkblatt-deu-pass-data.pdf#page=3","lawUrl":"https://www.gesetze-im-internet.de/pa_g_1986/BJNR105370986.html","example":"Hypothetical: parents whose child’s old passport has expired could plan a two-day Kinderreisepass application from the leaflet, although that type can no longer be issued or extended.","context":"[1] German Embassy Antananarivo / Federal Foreign Office; German; PDF page 3: The complete three-page leaflet lists child-passport applications, fees and processing. It is still the actual preparation download on both passport and ID pages. The passport HTML has updated ordinary fees, but that does not remove the obsolete document offer in the linked leaflet.\n[2] German Embassy Gaborone / Federal Foreign Office; German: The current passport navigation page offers the document and links the older applicant leaflet. That leaflet separately advertises same-day issue/extension and a fee. Neither instruction is framed only as historical validity of already issued child passports.\n[3] German mission / Federal Foreign Office; German: Pakistan’s current 25 August 2026 application parent still links the child page dated 31 May 2021. Its application fee table offers the former Kinderreisepass for children below twelve at €26 without an abolition qualification. Existing valid documents and ordinary biometric passports for children are different.","scope":"Previously issued child passports can remain valid under the applicable transitional and identifiability rules. They cannot now be newly issued, extended or updated. Ordinary biometric passports, eligible ID cards and temporary passports in the statutory circumstances are separate options.","date":"2026-10-17","langs":["German"],"countries":["MG","BW","PK"],"versions":[{"lang":"German","quote":"Anträge auf Ausstellung oder Verlängerung von Kinderreisepässen werden innerhalb von zwei Werktagen bearbeitet.","tr":"Applications to issue or extend children’s passports are processed within two working days.","url":"https://antananarivo.diplo.de/resource/blob/2559420/bdc9150fc0a62992cd54172cd9dfbdc5/221019-merkblatt-deu-pass-data.pdf#page=3","site":"antananarivo.diplo.de · PDF"},{"lang":"German","quote":"Für Kinder bis zum 12. Lebensjahr kann auch ein Kinderreisepass ausgestellt werden.","tr":"","url":"https://gaborone.diplo.de/bw-de/service/pass-1438214","site":"gaborone.diplo.de/bw-de"},{"lang":"German","quote":"Kinder- Reisepass","tr":"","url":"https://pakistan.diplo.de/pk-de/service/passantrag-kind-seite-1683806","site":"pakistan.diplo.de/pk-de"}]},"missions-id-parental-consent":{"id":"missions-id-parental-consent","area":"missions","topic":"documents","pub":"Embassy in Rabat","src":"Identity card","claim":"says applicants under 18 must come with both parents.","quote":"unter 18 Jahre","lang":"German","tr":"under 18 / accompanied by both parents with custody","law":"A legally capable applicant aged sixteen or seventeen may apply for an ID card personally. Under-sixteens need the lawful representative to apply; identity and citizenship evidence remain necessary.","sourceUrl":"https://rabat.diplo.de/resource/blob/2277226/6b045bee58618ccad26dc9d83d82810c/merkblatt-personalausweis-data.pdf#page=2","lawUrl":"https://www.gesetze-im-internet.de/pauswg/__9.html","example":"Hypothetical: a legally capable 17-year-old could believe an absent parent's authenticated consent is essential to apply for a new ID card. The ordinary application may be made by that applicant.","context":"[1] German Embassy Rabat / Federal Foreign Office; German; PDF page 2: The heading applies to all under-18s. Item 10 permits authenticated consent if one parent is absent; item 13 addresses sole custody. Neither limits the parental requirement to under-16 ID applicants. The July 2024 PDF remains linked as current application guidance.","scope":"Below 16, custody/representation requirements and evidence are legitimate. Lack of legal capacity can require representation. Identity, name and citizenship evidence may still be requested at 16 or 17; that is distinct from parental permission.","date":"2026-10-17","langs":["German"],"countries":["MA"],"versions":[{"lang":"German","quote":"unter 18 Jahre","tr":"under 18 / accompanied by both parents with custody","url":"https://rabat.diplo.de/resource/blob/2277226/6b045bee58618ccad26dc9d83d82810c/merkblatt-personalausweis-data.pdf#page=2","site":"rabat.diplo.de · PDF"}]},"missions-optional-fingerprints-montevideo-followup":{"id":"missions-optional-fingerprints-montevideo-followup","area":"missions","topic":"documents","pub":"Embassy in Montevideo","src":"German identity card","claim":"says fingerprints in the ID card are optional.","quote":"ob Ihre Fingerabdrücke als zusätzliches Sicherheitsmerkmal gespeichert werden sollen.","lang":"German","tr":"whether your fingerprints should be stored as an additional security feature.","law":"Ordinary new ID cards contain two fingerprints from age six, subject to statutory physical-impossibility rules. Older valid cards and temporary documents require separate treatment.","sourceUrl":"https://montevideo.diplo.de/uy-de/service/2431924-2431924","lawUrl":"https://www.gesetze-im-internet.de/pauswg/__5.html","example":"Hypothetical: an adult applying for a new German identity card in Montevideo, with no physical-impossibility exception, could expect to decline fingerprint storage although the ordinary rule requires it.","context":"The complete additional-ID-information paragraph requires a declaration of choice and additionally says declining storage causes no disadvantage. The current parent tells applicants to read the 2021 leaflet; its correct child-passport abolition notice concerns a different issue. Leaflet dated 5 January 2021; fresh HTTP 200. Current passport/ID hub directly links this exact leaflet under Merkblätter and tells applicants to read it before booking. Hub contains 2026 appointment material and correct child-passport abolition notice. No historical-only label. The leaflet is dated 5 January 2021 but remains expressly linked for use from the current parent.","scope":"Ordinary new adult identity-card applications by people able to supply fingerprints. Children under six, physical or medical impossibility, temporary impossibility, temporary documents and validity of existing cards require their own rules. No actual noncompliant issuance was observed.","date":"2026-10-17","langs":["German"],"countries":["UY"],"versions":[{"lang":"German","quote":"ob Ihre Fingerabdrücke als zusätzliches Sicherheitsmerkmal gespeichert werden sollen.","tr":"whether your fingerprints should be stored as an additional security feature.","url":"https://montevideo.diplo.de/uy-de/service/2431924-2431924","site":"montevideo.diplo.de/uy-de"}]},"missions-abolished-child-passport-rangoon-followup":{"id":"missions-abolished-child-passport-rangoon-followup","area":"missions","topic":"documents","pub":"Embassy in Rangoon","src":"German passport","claim":"still offers extensions of children’s passports.","quote":"grundsätzlich nur noch um jeweils ein Jahr bis höchstens zum vollendeten 12. Lebensjahr verlängert werden.","lang":"German","tr":"can generally only be extended by one year at a time, up to the 12th birthday at most.","law":"The Kinderreisepass document type can no longer be newly issued or extended from 1 January 2024. Older valid documents and ordinary biometric passports for children are separate.","sourceUrl":"https://rangun.diplo.de/mm-de/service/1511666-1511666","lawUrl":"https://www.gesetze-im-internet.de/pa_g_1986/__1.html","example":"Hypothetical: parents in Myanmar seeking to extend an expiring old child passport could follow the hub’s extension instruction although that service ended on 1 January 2024.","context":"The complete under-twelve section explains validity of old child passports and then expressly describes annual extensions. Only the extension promise is challenged. Older documents may remain valid. This is the active passport hub, separately linked from the fresh mission homepage. Dated 5 September 2023, fresh HTTP 200; this is the Pässe und Ausweise hub directly reached through the site service navigation. No archive marker. Fresh homepage https://rangun.diplo.de/mm-de independently fetched HTTP 200 and contains the exact passport-hub link. The active hub is dated 5 September 2023. The 2023 promulgation endpoint failed in both reviews; current consolidated PassG was independently read and supports the present finding.","scope":"Extension after 31 December 2023 only. Previously issued child passports may retain their lawful validity under PassG §28. The historical one-year validity statement is not itself challenged; no actual attempted extension or refusal was observed.","date":"2026-10-17","langs":["German"],"countries":["MM"],"versions":[{"lang":"German","quote":"grundsätzlich nur noch um jeweils ein Jahr bis höchstens zum vollendeten 12. Lebensjahr verlängert werden.","tr":"can generally only be extended by one year at a time, up to the 12th birthday at most.","url":"https://rangun.diplo.de/mm-de/service/1511666-1511666","site":"rangun.diplo.de/mm-de"}]},"missions-abolished-child-passport-tashkent-followup":{"id":"missions-abolished-child-passport-tashkent-followup","area":"missions","topic":"documents","pub":"Embassy in Tashkent","src":"German passport","claim":"still lists fees for children’s passports.","quote":"Kinderreisepass | 26,00 €; Verlängerung Kinderreisepass | 18,00 €","lang":"German","tr":"Children’s passport | €26.00; extension of children’s passport | €18.00","law":"The Kinderreisepass document type can no longer be newly issued or extended from 1 January 2024. Older valid documents and ordinary biometric passports for children are separate.","sourceUrl":"https://taschkent.diplo.de/uz-de/service/2438094-2438094","lawUrl":"https://www.gesetze-im-internet.de/pa_g_1986/__1.html","example":"Hypothetical: parents preparing a new child travel-document application in Uzbekistan could plan to purchase or extend a Kinderreisepass from the fee table, although neither service remains available.","context":"The application page’s current HTML table lists both child-passport issue and extension with euro prices under fees due at application. This is not the orphan older fee PDF previously excluded. The earlier audit reviewed this same HTML for other topics; this is an additional proposition. Undated substantive HTML, fresh HTTP 200; the current German-citizens service index has an exact live Deutscher Reisepass link. The parsed web version of the index omitted this link but fresh original HTML contains it. An undated live page is not treated as newly revised.","scope":"New child-passport issue or extension after 31 December 2023, not continued use of valid older documents. The related issue/extension entries form one finding on one source. No actual service transaction or charge was observed.","date":"2026-10-17","langs":["German"],"countries":["UZ"],"versions":[{"lang":"German","quote":"Kinderreisepass | 26,00 €; Verlängerung Kinderreisepass | 18,00 €","tr":"Children’s passport | €26.00; extension of children’s passport | €18.00","url":"https://taschkent.diplo.de/uz-de/service/2438094-2438094","site":"taschkent.diplo.de/uz-de"}]},"missions-citizenship-loss":{"id":"missions-citizenship-loss","area":"missions","topic":"citizenship","pub":"Missions in Singapore, Canada and Dublin","src":"Passport","claim":"say taking another citizenship ends your German one.","quote":"voluntarily applies for and accepts a foreign nationality on principle loses the German nationality automatically.","lang":"English","tr":"","law":"","sourceUrl":"https://singapur.diplo.de/sg-en/service/1225472-1225472","lawUrl":"https://www.recht.bund.de/bgbl/1/2024/104/VO.html","example":"Hypothetical: a German citizen who becomes Canadian in July 2024 could read the English passage as a reason not to apply for a replacement German passport. The foreign naturalisation alone does not cause that loss.","context":"[1] German Embassy Singapore / Federal Foreign Office; English: Full paragraph gives EU/Swiss and automatic-acquisition exceptions but no 27 June 2024 cutoff. It sits directly above the passport-entitlement question. The German counterpart provides current application guidance and historically relevant evidence requests.\n[2] German missions in Canada / Federal Foreign Office; English: The surrounding passport-eligibility text has no reform-date qualification. Related material separately labels the older dual-citizenship rules as historical; that distinction is absent here.\n[3] German Embassy Dublin / Federal Foreign Office; English; PDF page 1: The four-page questionnaire remains offered as a citizenship questionnaire by the current overview, with a 15 August 2023 download date. It is not marked historical there. A separate newer FAQ correctly explains the reform.","scope":"Earlier acquisitions must be assessed under the law then in force, including the former EU/Swiss and retention-permission exceptions. Other acquisition/loss rules remain relevant. Foreign nationality law is a separate question.","date":"2026-10-17","langs":["English"],"countries":["SG","CA","IE"],"versions":[{"lang":"English","quote":"voluntarily applies for and accepts a foreign nationality on principle loses the German nationality automatically.","tr":"","url":"https://singapur.diplo.de/sg-en/service/1225472-1225472","site":"singapur.diplo.de/sg-en"},{"lang":"English","quote":"voluntarily applies for and accepts a foreign nationality on principle loses the German nationality automatically.","tr":"","url":"https://canada.diplo.de/ca-en/consular-services/03-staatsangehoerigkeit/determining-citizenship-1098088","site":"canada.diplo.de/ca-en"},{"lang":"English","quote":"voluntarily applies for and accepts a foreign nationality on principle loses the German nationality automatically.","tr":"","url":"https://dublin.diplo.de/resource/blob/2612442/39f27faa68b31b3dcdbd0ff8381d0fab/final-fragebogen-zur-staatsangehoerigkeit-dublin-data.pdf#page=1","site":"dublin.diplo.de · PDF"}]},"missions-former-option-duty-validity":{"id":"missions-former-option-duty-validity","area":"missions","topic":"citizenship","pub":"Embassy in Bogotá","src":"Passport","claim":"states a shorter validity cap for people covered by the former option duty.","quote":"bei optionspflichtigen Personen bis zur Vollendung des 23. Lebensjahrs","lang":"German","tr":"for persons subject to the option duty, until their 23rd birthday","law":"The former option-duty cap was removed in 2024. A new ordinary passport for a German applicant below 24 normally lasts six years, subject to individual statutory restrictions.","sourceUrl":"https://bogota.diplo.de/co-de/service/2504026-2504026","lawUrl":"https://www.gesetze-im-internet.de/pa_g_1986/BJNR105370986.html","example":"Hypothetical: a twenty-one-year-old who remains German and formerly fell within the option-duty category could expect a new passport only until age twenty-three, although the repealed cap no longer applies.","context":"[1] German Embassy Bogotá / Federal Foreign Office; German: The surrounding passage correctly says the Kinderreisepass was abolished and ordinarily describes six-year biometric passports for under-twenty-fours. The parenthetical retains the repealed exception. Other passages correctly distinguish 24+ validity and allow citizenship verification where citizenship is unclear.","scope":"The repeal does not retrospectively rewrite the printed validity of every existing passport or automatically restore citizenship lost before reform. Current citizenship evidence, individual statutory validity restrictions, and ordinary age bands remain relevant. This case concerns a new document under current law.","date":"2026-10-17","langs":["German"],"countries":["CO"],"versions":[{"lang":"German","quote":"bei optionspflichtigen Personen bis zur Vollendung des 23. Lebensjahrs","tr":"for persons subject to the option duty, until their 23rd birthday","url":"https://bogota.diplo.de/co-de/service/2504026-2504026","site":"bogota.diplo.de/co-de"}]},"airlines-lufthansa-timing":{"id":"airlines-lufthansa-timing","area":"airlines","topic":"cancellation","pub":"Lufthansa","src":"","claim":"says meeting either time limit is enough to avoid paying.","quote":"and/or you arrive no more than four hours after the scheduled arrival time","lang":"English","tr":"","law":"","sourceUrl":"https://www.lufthansa.com/be/en/passenger-rights","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"A Lufthansa-operated Frankfurt–Madrid flight is cancelled ten days ahead for an ordinary operational reason. The replacement leaves at the original time but arrives six hours late. Meeting the departure limit alone does not remove compensation.","context":"The full Cancellation passage, the separate extraordinary-circumstances exception, adjoining compensation amounts and reductions, linked disruption help and carriage terms were checked. None changes the positive “and/or” test into a cumulative one.","scope":"Passengers on covered flights actually operated by Lufthansa, offered rerouting meeting only one safeguard. Confirmed booking and ordinary eligibility rules apply. Notice at least 14 days in advance and a proven extraordinary-circumstances defence can independently remove fixed compensation. Refund, rerouting and care remain distinct.","date":"2026-10-17","langs":["English","German","French","Spanish"],"countries":[],"versions":[{"lang":"English","quote":"and/or you arrive no more than four hours after the scheduled arrival time","tr":"","url":"https://www.lufthansa.com/be/en/passenger-rights","site":"lufthansa.com/be/en"},{"lang":"German","quote":"und/oder Sie nicht mehr als vier Stunden nach der geplanten Ankunftszeit am Ziel eintreffen","tr":"and/or you arrive at the destination no more than four hours after the scheduled arrival time","url":"https://www.lufthansa.com/be/de/passenger-rights","site":"lufthansa.com/be/de"},{"lang":"French","quote":"et/ou si vous arrivez au plus tard quatre heures après l’heure d’arrivée prévue","tr":"and/or if you arrive no later than four hours after the scheduled arrival time","url":"https://www.lufthansa.com/be/fr/passenger-rights","site":"lufthansa.com/be/fr"},{"lang":"Spanish","quote":"o llega no más de cuatro horas después de la hora de llegada programada","tr":"or arrives no more than four hours after the scheduled arrival time","url":"https://www.lufthansa.com/es/es/passenger-rights","site":"lufthansa.com/es/es"}]},"airlines-thai-airways-timing":{"id":"airlines-thai-airways-timing","area":"airlines","topic":"cancellation","pub":"Thai Airways","src":"","claim":"says meeting either time limit is enough to avoid paying.","quote":"and/or you arrive no more than four hours","lang":"English","tr":"","law":"","sourceUrl":"https://www.thaiairways.com/static/Passenger-Rights_Sept2016_Webversion.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"A Thai-operated Frankfurt–Bangkok flight is cancelled ten days ahead for an ordinary operational reason. The replacement leaves at the original time and arrives six hours late. Meeting the departure safeguard alone does not remove compensation.","context":"Both full PDF pages, both Germany HTML language sections, the Turkey English and France French passages were read. Separate extraordinary-circumstances paragraphs and compensation reductions do not change the disjunctive exceptions. The correct relevant English/French formulations are material counter-evidence; the audit does not decide which text governed any real claim.","scope":"Eligible passengers on Thai-operated EU departures who are offered rerouting satisfying only one safeguard, absent another valid defence. An ordinary Bangkok–EU inbound is not covered merely by arrival in the EU. Fixed-compensation defences and separate care/refund rights remain as described above.","date":"2026-10-17","langs":["English","German","French"],"countries":[],"versions":[{"lang":"English","quote":"and/or you arrive no more than four hours","tr":"","url":"https://www.thaiairways.com/static/Passenger-Rights_Sept2016_Webversion.pdf","site":"thaiairways.com · PDF"},{"lang":"German","quote":"und/oder Sie nicht mehr als vier Stunden","tr":"and/or you [arrive] no more than four hours","url":"https://www.thaiairways.com/de-de/content/passagierrechte/","site":"thaiairways.com/de-de"},{"lang":"German","quote":"und/oder","tr":"and/or","url":"https://www.thaiairways.com/de-de/content/passagierrechte/","site":"thaiairways.com/de-de"},{"lang":"French","quote":"et d'arriver à votre destination finale moins de 4 h après l'heure d'arrivée prévue","tr":"and to arrive at your final destination less than four hours after the scheduled arrival time","url":"https://www.thaiairways.com/fr-fr/content/droit-des-passagers/","site":"thaiairways.com/fr-fr"},{"lang":"English","quote":"and/or you arrive","tr":"","url":"https://www.thaiairways.com/static/Passenger-Rights_Sept2016_Webversion.pdf","site":"thaiairways.com · PDF"}]},"airlines-emirates-timing":{"id":"airlines-emirates-timing","area":"airlines","topic":"cancellation","pub":"Emirates","src":"","claim":"reverses the arrival limit to at least four hours late.","quote":"no less than four hours after the scheduled time of arrival","lang":"English","tr":"","law":"","sourceUrl":"https://www.emirates.com/english/before-you-fly/travel/rules-and-notices/cancellation-notice/","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"Emirates cancels Paris–Dubai three days ahead for an ordinary operational reason. The replacement leaves at the original time and arrives five hours late. The notice’s two-hour-minimum wording excludes compensation; the statutory short-notice exception does not.","context":"Eligibility, rerouting/refund, assistance, the full compensation exceptions, later 50% reduction provision and overriding-law clause in the carriage conditions were reviewed. The separate reduction provision does not correct the earlier exclusion. French has an additional departure-window difference; the finding relies on the arrival reversal shared by all three versions.","scope":"Passengers on Emirates-operated departures from the EU. An ordinary separate Dubai–EU inbound flight is outside this finding. Confirmed booking and ordinary eligibility rules apply. Notice at least 14 days in advance and a proven extraordinary-circumstances defence can independently remove fixed compensation. Refund, rerouting and care remain distinct.","date":"2026-10-17","langs":["English","German","French"],"countries":[],"versions":[{"lang":"English","quote":"no less than four hours after the scheduled time of arrival","tr":"","url":"https://www.emirates.com/english/before-you-fly/travel/rules-and-notices/cancellation-notice/","site":"emirates.com/english"},{"lang":"German","quote":"Ihr Endziel nicht weniger als vier Stunden nach der planmäßigen Ankunftszeit","tr":"your final destination no less than four hours after the scheduled arrival time","url":"https://www.emirates.com/de/german/before-you-fly/travel/rules-and-notices/cancellation-notice/","site":"emirates.com/de/german"},{"lang":"French","quote":"d'atteindre votre destination finale au plus tôt quatre heures après l'heure prévue d'arrivée","tr":"to reach your final destination at the earliest four hours after the scheduled arrival time","url":"https://www.emirates.com/fr/french/before-you-fly/travel/rules-and-notices/cancellation-notice/","site":"emirates.com/fr/french"}]},"airlines-air-france-scope":{"id":"airlines-air-france-scope","area":"airlines","topic":"scope","pub":"Air France","src":"","claim":"says EU rights apply only if no local rules exist.","quote":"and if no local regulation applies to departures from that third country.","lang":"English","tr":"","law":"","sourceUrl":"https://img.static-af.com/m/23c6d1b81458f747/original/Passengers-Rights-EN.pdf","lawUrl":"https://eur-lex.europa.eu/eli/reg/2004/261/oj","example":"An Air France-operated non-EU–Paris flight is cancelled. Local law regulates some passenger rights, but equivalent protection has not been established. Those local rules alone do not switch off EU261.","context":"The complete opening conditions, all cancellation/delay/denied-boarding sections, later statements that local schemes may apply, customer-service referrals, linked PDFs and carriage conditions were reviewed. The later local-scheme references do not restore or qualify the opening blanket restriction.","scope":"Limited to third-country departures into the EU actually operated by an EU carrier, with the other eligibility conditions met. The statutory third-country benefits/compensation-and-assistance exception and the Court’s equivalence assessment still apply. This does not establish a right to duplicate recovery.","date":"2026-10-17","langs":["English","French","Spanish"],"countries":[],"versions":[{"lang":"English","quote":"and if no local regulation applies to departures from that third country.","tr":"","url":"https://img.static-af.com/m/23c6d1b81458f747/original/Passengers-Rights-EN.pdf","site":"img.static-af.com · PDF"},{"lang":"French","quote":"et si aucune réglementation locale n'a vocation à s'appliquer au départ de ce pays tiers.","tr":"and if no local regulation is inten
